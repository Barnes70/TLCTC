id: TLCTC-06-Flooding
version: -1
name: TLCTC-06 Flooding
description: |
  Master playbook for cluster #6 — Flooding Attack.

  Generic vulnerability: capacity. T1498 (Network DoS), T1499 (Endpoint DoS).
  Outcome is always [DRE: A] (availability loss).

  Direct Response:
    - Engage upstream scrubbing (DDoS provider) if volumetric
    - Apply rate-limits at edge / WAF
    - Scale out target service if architecture permits
    - Geo/ASN block sources at upstream
