description: |
  Master playbook for cluster #9 -- Social Engineering (bridge cluster).

  Bridge cluster: REQUIRES boundary annotation (typically
  ||[human][@External->@Org]||). Phishing, vishing, smishing, pretexting.

  R-EXEC reminder: if the lure delivers an attachment that executes (T1566.001),
  the FEC execution is a SEPARATE #7 step -- TLCTCClassify will fire that as
  a follow-on cluster automatically.

