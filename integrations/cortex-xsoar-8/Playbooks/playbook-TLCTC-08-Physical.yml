id: TLCTC-08-Physical
version: -1
name: TLCTC-08 Physical
description: |
  Master playbook for cluster #8 -- Physical Attack (bridge cluster).

  Bridge cluster: REQUIRES boundary annotation
  (||[physical][@External->@Org]|| or similar). Examples: device theft,
  evil maid, hardware implant.

  XSOAR's role here is largely orchestrational -- most response is human/physical.

  Direct Response:
    - Notify physical security / facilities
    - Wipe / disable affected device remotely if possible (MDM)
    - Revoke device certificates and tokens
    - Preserve CCTV / access logs for the incident window
