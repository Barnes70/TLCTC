    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef, useCallback } = React;

        // === THREAT CLUSTER DATA ===
const ORIGINAL_THREAT_CLUSTERS = [
    { id: 1, name: 'Abuse of Functions', shortName: 'Abuse of Function', description: 'Misuse of legitimate software logic or configuration without foreign code.' },
    { id: 2, name: 'Exploiting Server', shortName: 'Exploit Server', description: 'Targeting flaws in server-side source code implementation.' },
    { id: 3, name: 'Exploiting Client', shortName: 'Exploit Client', description: 'Targeting flaws in client-side source code implementation.' },
    { id: 4, name: 'Identity Theft', shortName: 'Identity Theft', description: 'Misuse of credentials or tokens to impersonate a legitimate identity.' },
    { id: 5, name: 'Man in the Middle', shortName: 'MitM', description: 'Interception or modification of communication between parties.' },
    { id: 6, name: 'Flooding Attack', shortName: 'Flooding (DDOS)', description: 'Overwhelming system resources or capacity limits.' },
    { id: 7, name: 'Malware', shortName: 'Malware', description: 'Execution of foreign malicious code, scripts, or binaries.' },
    { id: 8, name: 'Physical Attack', shortName: 'Physical', description: 'Unauthorized physical interaction with hardware or facilities.' },
    { id: 9, name: 'Social Engineering', shortName: 'Social Engineering', description: 'Psychological manipulation of humans into unsafe actions.' },
    { id: 10, name: 'Supply Chain Attack', shortName: 'Supply Chain', description: 'Compromise via trusted third-party components or updates.' },
];

const defaultZoneLimits = { latent: 0, low: 5, medium: 35, high: 100 };
const ZONE_NAMES_ORDERED = ['latent', 'low', 'medium', 'high']; // outer to inner

const ZONE_DESCRIPTIONS = {
    latent: 'No immediate risk. Dormant or theoretical.',
    low: 'Minor concern. Keep monitoring.',
    medium: 'Moderate risk requiring attention.',
    high: 'High volume of incidents.'
};

const DEFAULT_RADAR_BG_COLOR = '#FFFFFF';
const DEFAULT_RADAR_TEXT_COLOR = '#111827';
const DEFAULT_ZONE_LABEL_COLOR = '#374151';
const DEFAULT_ZONE_LINE_STYLE = 'dashed';
const DEFAULT_RADAR_SHAPE = 'full';
const DEFAULT_CLUSTER_DISPLAY_MODE = 'name';

// Default Flag Settings
const DEFAULT_REPORT_FLAG_BG_COLOR = '#facc15'; // Tailwind yellow-400
const DEFAULT_REPORT_FLAG_TEXT_COLOR = '#1f2937'; // Tailwind gray-800
const DEFAULT_TOLERANCE_FLAG_BG_COLOR = '#ef4444'; // Tailwind red-500
const DEFAULT_TOLERANCE_FLAG_TEXT_COLOR = '#FFFFFF'; // White
const DEFAULT_LABEL_TEXT_COLOR = '#FFFFFF'; // White - for "both" mode labels

const DEFAULT_BUBBLE_RADIUS = 15;
const DEFAULT_RECT_WIDTH = 50;
const DEFAULT_RECT_HEIGHT = 18;

// zone closer to center = bigger
const DEFAULT_ZONE_SIZE_MULTIPLIERS = {
    latent: 0.8,
    low: 0.9,
    medium: 1.05,
    high: 1.2,
};

const DEFAULT_OLD_BUBBLE_SIZE_MULTIPLIER = 0.8;

const DEFAULT_SECTOR_NAME_TEXT_SIZE_PX = 13;
const DEFAULT_ZONE_LABEL_TEXT_SIZE_PX = 10;
const DEFAULT_BUBBLE_TEXT_SIZE_PX = 7.5;
const DEFAULT_BASELINE_LABEL_MARGIN = 15;
const DEFAULT_REPORT_FLAG_SIZE_PX = 8;
const DEFAULT_TOLERANCE_FLAG_SIZE_PX = 10;

// === Helper: approximate rect size for name mode ===
const BUBBLE_TEXT_CHAR_WIDTH_FACTOR = 0.6;
const BUBBLE_TEXT_H_PADDING = 4;
const BUBBLE_TEXT_V_PADDING = 2;
const MIN_RECT_WIDTH_PX = 30;
const MIN_RECT_HEIGHT_PX = 16;

function computeRectSize(text, baseFontSizePx, sizeMultiplier) {
    const effectiveFontSize = baseFontSizePx * sizeMultiplier;
    const textWidth = text.length * effectiveFontSize * BUBBLE_TEXT_CHAR_WIDTH_FACTOR;
    const width = Math.max(
        MIN_RECT_WIDTH_PX * sizeMultiplier,
        textWidth + 2 * BUBBLE_TEXT_H_PADDING * sizeMultiplier
    );
    const height = Math.max(
        MIN_RECT_HEIGHT_PX * sizeMultiplier,
        effectiveFontSize + 2 * BUBBLE_TEXT_V_PADDING * sizeMultiplier
    );
    return { width, height };
}

        const generateRandomColor = () => `hsl(${Math.floor(Math.random() * 360)}, 70%, 60%)`;

        const createDefaultSector = (threatClustersDefinition) => ({
            id: Date.now() + Math.random(), name: "New Sector", color: generateRandomColor(),
            backgroundColor: `rgba(${Math.floor(Math.random()*50+20)},${Math.floor(Math.random()*50+20)},${Math.floor(Math.random()*50+40)},0.35)`,
            labelTextColor: DEFAULT_LABEL_TEXT_COLOR,
            activeThreats: Object.fromEntries(threatClustersDefinition.map(c => [c.id, true])),
            values: Object.fromEntries(threatClustersDefinition.map(c => [c.id, 0])),
            oldValues: Object.fromEntries(threatClustersDefinition.map(c => [c.id, 0])),
            zoneLimits: Object.fromEntries(threatClustersDefinition.map(c => [c.id, { ...defaultZoneLimits }])),
            toBeReported: Object.fromEntries(threatClustersDefinition.map(c => [c.id, false])),
            riskToleranceCrashed: Object.fromEntries(threatClustersDefinition.map(c => [c.id, false])),
            bubbleOffsets: Object.fromEntries(threatClustersDefinition.map(c => [c.id, { dx: 0, dy: 0 }])),
            collapsed: false
        });

        function ColorPicker({ color, onChange, label }) {
            const pickerRef = useRef(null);
            const pickrInstance = useRef(null);
            const [currentColor, setCurrentColor] = useState(color);
            useEffect(() => {
                if (!pickerRef.current) return;
                pickrInstance.current = Pickr.create({
                    el: pickerRef.current, theme: 'monolith', default: color,
                    components: { preview: true, opacity: true, hue: true, interaction: { hex: true, rgba: true, hsla: true, hsva: true, cmyk: false, input: true, clear: false, save: true } }
                });
                pickrInstance.current.on('save', (clr) => {
                    if (clr) { const newColor = clr.toHEXA().toString(); setCurrentColor(newColor); onChange(newColor); }
                    pickrInstance.current.hide();
                });
                return () => { if (pickrInstance.current) { pickrInstance.current.destroyAndRemove(); pickrInstance.current = null; } };
            }, []);
            useEffect(() => {
                setCurrentColor(color);
                if (pickrInstance.current && color && pickrInstance.current.getColor().toHEXA().toString() !== color) {
                    pickrInstance.current.setColor(color);
                }
            }, [color]);
            return (
                <div className="flex items-center gap-2">
                    {label && <label className="text-sm text-muted-foreground whitespace-nowrap">{label}:</label>}
                    <div className="color-picker-wrapper">
                        <div ref={pickerRef} className="color-picker-indicator" style={{ backgroundColor: currentColor }} />
                    </div>
                </div>
            );
        }

        function Tooltip({ children, text }) {
            if (!text) return children;
            return (<div className="tooltip">{children}<div className="tooltip-text">{text}</div></div>);
        }
        
function RadarBubble({
    x,
    y,
    size,
    color,
    labelTextColor,
    label,
    shortName,
    highlight,
    toBeReported,
    riskToleranceCrashed,
    displayMode,
    sizeMultiplier,
    bubbleTextSizePx,
    reportFlagSizePx,
    reportFlagColor,
    reportFlagTextColor,
    toleranceFlagSizePx,
    toleranceFlagColor,
    toleranceFlagTextColor,
    isDragging,
}) {
    // For "both" mode, we show the number in bubble and name above
    const bubbleText = displayMode === 'name' ? shortName : label;
    const effectiveFontSize = bubbleTextSizePx * sizeMultiplier;

    let rectWidth = DEFAULT_RECT_WIDTH * sizeMultiplier;
    let rectHeight = DEFAULT_RECT_HEIGHT * sizeMultiplier;

    if (displayMode === 'name') {
        const rect = computeRectSize(bubbleText, bubbleTextSizePx, sizeMultiplier);
        rectWidth = rect.width;
        rectHeight = rect.height;
    }

    const reportFlagTextSize = reportFlagSizePx * 0.8;
    const toleranceFlagTextSize = toleranceFlagSizePx * 1;

    const flagOffsetFactor = displayMode === 'name' ? 0.75 : 0.8;
    const fixedFlagOffset = 1 * sizeMultiplier;

    const halfW = rectWidth / 2;
    const halfH = rectHeight / 2;

    // Calculate label position for "both" mode (label above the circle)
    const labelOffsetY = displayMode === 'both' ? -(size + 8 * sizeMultiplier) : 0;

    return (
        <g transform={`translate(${x},${y})`} style={{ filter: isDragging ? 'drop-shadow(0 0 8px rgba(59, 130, 246, 0.8))' : 'none' }}>
            {/* Short name label above bubble for "both" mode - only for current bubbles, not old ones */}
            {displayMode === 'both' && highlight && (
                <text
                    x={0}
                    y={labelOffsetY}
                    textAnchor="middle"
                    dominantBaseline="middle"
                    fill={labelTextColor || '#FFFFFF'}
                    fontSize={`${effectiveFontSize * 0.95}px`}
                    fontWeight="500"
                    fontFamily="Inter, sans-serif"
                    style={{ pointerEvents: 'none', textShadow: '0 1px 2px rgba(0,0,0,0)' }}
                >
                    {shortName}
                </text>
            )}
            {displayMode === 'name' ? (
                <rect
                    x={-halfW}
                    y={-halfH}
                    width={rectWidth}
                    height={rectHeight}
                    fill={color}
                    opacity={highlight ? "1" : "0.85"}
                    stroke={isDragging ? "#3b82f6" : "#fff"}
                    strokeWidth={isDragging ? "2" : highlight ? "1.5" : "0.5"}
                    rx="3"
                />
            ) : (
                <circle
                    r={size}
                    fill={color}
                    opacity={highlight ? "1" : "0.85"}
                    stroke={isDragging ? "#3b82f6" : "#fff"}
                    strokeWidth={isDragging ? "2.5" : highlight ? "2" : "1"}
                />
            )}

            <text
                textAnchor="middle"
                dominantBaseline="middle"
                fill="#FFFFFF"
                fontSize={`${effectiveFontSize}px`}
                fontWeight={highlight ? "normal" : "latin"}
                fontFamily="Inter, sans-serif"
                style={{ pointerEvents: 'none' }}
            >
                {bubbleText}
            </text>

            {toBeReported && (
                <g
                    transform={
                        displayMode === 'name'
                            ? `translate(${halfW * flagOffsetFactor + fixedFlagOffset}, ${-halfH * flagOffsetFactor - fixedFlagOffset})`
                            : `translate(${size * flagOffsetFactor + fixedFlagOffset}, ${-size * flagOffsetFactor - fixedFlagOffset})`
                    }
                >
                    <circle
                        r={reportFlagSizePx}
                        fill={reportFlagColor}
                        stroke="#333"
                        strokeWidth="0.5"
                    />
                    <text
                        textAnchor="middle"
                        dy=".3em"
                        fill={reportFlagTextColor}
                        fontSize={`${reportFlagTextSize}px`}
                        fontWeight="normal"
                    >
                        !
                    </text>
                </g>
            )}

            {riskToleranceCrashed && (
                <g
                    transform={
                        displayMode === 'name'
                            ? `translate(${-halfW * flagOffsetFactor - fixedFlagOffset}, ${-halfH * flagOffsetFactor - fixedFlagOffset})`
                            : `translate(${-size * flagOffsetFactor - fixedFlagOffset}, ${-size * flagOffsetFactor - fixedFlagOffset})`
                    }
                >
                    <circle
                        r={toleranceFlagSizePx}
                        fill={toleranceFlagColor}
                        stroke="#333"
                        strokeWidth="0.5"
                    />
                    <text
                        textAnchor="middle"
                        dy=".35em"
                        fill={toleranceFlagTextColor}
                        fontSize={`${toleranceFlagTextSize}px`}
                        fontWeight="normal"
                    >
                        ⚡
                    </text>
                </g>
            )}
        </g>
    );
}

        function determineZone(value, limits) {
            const validLimits = typeof limits === 'object' && limits !== null ? limits : defaultZoneLimits;
            const { latent, low, medium, high } = validLimits;
            const numLatent = typeof latent === 'number' ? latent : 0;
            const numLow = typeof low === 'number' ? low : 5;
            const numMedium = typeof medium === 'number' ? medium : 35;
            if (value <= numLatent) return 'latent';
            if (value <= numLow) return 'low';
            if (value <= numMedium) return 'medium';
            return 'high';
        }

        // Zone radii define the OUTER boundary of each zone band
        // Using full 320px radius with equal bands of 80px each
        function getZoneBoundaries(scaleFactor = 1) {
            return {
                high:   { inner: 0, outer: 80 * scaleFactor },
                medium: { inner: 80 * scaleFactor, outer: 160 * scaleFactor },
                low:    { inner: 160 * scaleFactor, outer: 240 * scaleFactor },
                latent: { inner: 240 * scaleFactor, outer: 320 * scaleFactor }
            };
        }

        function RadarVisualization({ 
            sectors, radarBgColor, radarTextColor, radarShape, clusterDisplayMode, zoneSizeMultipliers, zoneLabelColor, zoneLineStyle, oldBubbleSizeMultiplier, threatClustersData, 
            sectorNameTextSizePx, zoneLabelTextSizePx, bubbleTextSizePx, baselineLabelMargin, 
            reportFlagSizePx, reportFlagColor, reportFlagTextColor,
            toleranceFlagSizePx, toleranceFlagColor, toleranceFlagTextColor,
            onBubbleMove 
        }) {
            const svgContainerRef = useRef(null);
            const [dragging, setDragging] = useState(null);
            const baseDimension = 800;
            const overallScaleFactor = 1;
            const currentDimension = baseDimension * overallScaleFactor;
            const centerX = currentDimension / 2;
            const centerY = currentDimension / 2;
            const outerRadius = 320 * overallScaleFactor;

            // Zone boundaries for constraining bubbles
            const zoneBounds = useMemo(() => getZoneBoundaries(overallScaleFactor), [overallScaleFactor]);

            // Zone outer radii for drawing circles
            const zoneRadii = useMemo(() => ({
                high:   zoneBounds.high.outer,
                medium: zoneBounds.medium.outer,
                low:    zoneBounds.low.outer,
                latent: zoneBounds.latent.outer
            }), [zoneBounds]);

            const getAngle = useCallback((index, total) => {
                if (radarShape === 'half') { return Math.PI + (index / total) * Math.PI; }
                return (index / total) * 2 * Math.PI - Math.PI / 2;
            }, [radarShape]);

const bubblePositions = useMemo(() => {
    let allBubbles = [];
    const numSectors = sectors.length;

    sectors.forEach((sector, sectorIndex) => {
        const baseAngle = getAngle(sectorIndex, sectors.length);
        const nextBaseAngle = getAngle(sectorIndex + 1, sectors.length);

        let sectorAngleSpan = nextBaseAngle - baseAngle;
        if (radarShape === 'full' && sectorAngleSpan < 0) {
            sectorAngleSpan += 2 * Math.PI;
        }

        const activeInSector = threatClustersData
            .filter(c_data => sector.activeThreats?.[c_data.id] && sector.zoneLimits?.[c_data.id]);

        activeInSector.forEach((cluster, threatIdx) => {
            const value = parseFloat(sector.values?.[cluster.id] ?? 0);
            const zone = determineZone(value, sector.zoneLimits[cluster.id]);
            const bounds = zoneBounds[zone];
            
            // Place bubble in center of its zone band
            const baseRadius = (bounds.inner + bounds.outer) / 2;

            const paddingFactor = 0.15;
            const usableAngleSpan = sectorAngleSpan * (1 - 2 * paddingFactor);
            const angleOffsetInSector =
                paddingFactor * sectorAngleSpan +
                ((threatIdx + 0.5) / activeInSector.length) * usableAngleSpan;

            const idealAngle = baseAngle + angleOffsetInSector;

            const sizeMultiplier = zoneSizeMultipliers[zone] || 1.0;
            const currentBubbleRadius = DEFAULT_BUBBLE_RADIUS * sizeMultiplier;

            let collisionWidth;
            let collisionHeight;

            if (clusterDisplayMode === 'name') {
                const text = cluster.shortName;
                const rect = computeRectSize(text, bubbleTextSizePx, sizeMultiplier);
                collisionWidth = rect.width;
                collisionHeight = rect.height;
            } else {
                collisionWidth = currentBubbleRadius * 2;
                collisionHeight = currentBubbleRadius * 2;
            }

            // Get custom offset if exists
            const offset = sector.bubbleOffsets?.[cluster.id] || { dx: 0, dy: 0 };
            const baseX = centerX + Math.cos(idealAngle) * baseRadius;
            const baseY = centerY + Math.sin(idealAngle) * baseRadius;

            // Calculate bubble half-size for zone boundary padding
            const bubbleHalfSize = clusterDisplayMode === 'name' 
                ? Math.max(collisionWidth, collisionHeight) / 2 
                : currentBubbleRadius;

            allBubbles.push({
                id: `${sector.id}-${cluster.id}`,
                sectorId: sector.id,
                clusterId: cluster.id,
                baseX: baseX,
                baseY: baseY,
                x: baseX + offset.dx,
                y: baseY + offset.dy,
                dx: offset.dx,
                dy: offset.dy,
                color: sector.color,
                labelTextColor: sector.labelTextColor || DEFAULT_LABEL_TEXT_COLOR,
                shortName: cluster.shortName,
                label: `#${cluster.id}`,
                toBeReported: sector.toBeReported?.[cluster.id] ?? false,
                riskToleranceCrashed: sector.riskToleranceCrashed?.[cluster.id] ?? false,
                currentValue: value,
                oldValue: parseFloat(sector.oldValues?.[cluster.id]),
                currentZone: zone,
                oldZone: !isNaN(parseFloat(sector.oldValues?.[cluster.id]))
                    ? determineZone(
                        parseFloat(sector.oldValues?.[cluster.id]),
                        sector.zoneLimits[cluster.id]
                      )
                    : zone,
                width: collisionWidth,
                height: collisionHeight,
                size: currentBubbleRadius,
                sizeMultiplier,
                // Zone boundary info for drag constraints
                zoneInnerRadius: bounds.inner,
                zoneOuterRadius: bounds.outer,
                bubbleHalfSize: bubbleHalfSize,
                sectorStartAngle: baseAngle,
                sectorEndAngle: nextBaseAngle,
            });
        });
    });

    return allBubbles;
}, [
    sectors,
    radarShape,
    clusterDisplayMode,
    getAngle,
    centerX,
    centerY,
    zoneBounds,
    zoneSizeMultipliers,
    threatClustersData,
    bubbleTextSizePx,
]);

            // Convert screen coordinates to SVG coordinates
            const getSvgPoint = useCallback((clientX, clientY) => {
                const svg = svgContainerRef.current?.querySelector('svg');
                if (!svg) return { x: 0, y: 0 };
                const pt = svg.createSVGPoint();
                pt.x = clientX;
                pt.y = clientY;
                const svgP = pt.matrixTransform(svg.getScreenCTM().inverse());
                return { x: svgP.x, y: svgP.y };
            }, []);

            // Handle mouse down on bubble
            const handleBubbleMouseDown = useCallback((e, bubble) => {
                e.preventDefault();
                e.stopPropagation();
                const svgPoint = getSvgPoint(e.clientX, e.clientY);
                setDragging({
                    sectorId: bubble.sectorId,
                    clusterId: bubble.clusterId,
                    startMouseX: svgPoint.x,
                    startMouseY: svgPoint.y,
                    startDx: bubble.dx,
                    startDy: bubble.dy,
                    baseX: bubble.baseX,
                    baseY: bubble.baseY,
                    zoneInnerRadius: bubble.zoneInnerRadius,
                    zoneOuterRadius: bubble.zoneOuterRadius,
                    bubbleHalfSize: bubble.bubbleHalfSize,
                    bubbleId: bubble.id,
                });
            }, [getSvgPoint]);

            // Handle mouse move - constrain to zone bandwidth
            const handleMouseMove = useCallback((e) => {
                if (!dragging) return;
                const svgPoint = getSvgPoint(e.clientX, e.clientY);
                
                // Calculate new offset
                let newDx = dragging.startDx + (svgPoint.x - dragging.startMouseX);
                let newDy = dragging.startDy + (svgPoint.y - dragging.startMouseY);
                
                // Calculate new absolute position
                let newX = dragging.baseX + newDx;
                let newY = dragging.baseY + newDy;
                
                // Constrain to zone boundaries (radial constraint within band)
                const distFromCenter = Math.sqrt(Math.pow(newX - centerX, 2) + Math.pow(newY - centerY, 2));
                const angle = Math.atan2(newY - centerY, newX - centerX);
                
                // Add padding for bubble size so center stays within band
                const padding = dragging.bubbleHalfSize + 5;
                const minRadius = dragging.zoneInnerRadius + padding;
                const maxRadius = dragging.zoneOuterRadius - padding;
                const clampedRadius = Math.max(minRadius, Math.min(maxRadius, distFromCenter));
                
                // Recalculate position if clamped
                if (distFromCenter !== clampedRadius) {
                    newX = centerX + Math.cos(angle) * clampedRadius;
                    newY = centerY + Math.sin(angle) * clampedRadius;
                    newDx = newX - dragging.baseX;
                    newDy = newY - dragging.baseY;
                }
                
                // For half radar, also constrain to upper half
                if (radarShape === 'half' && newY > centerY) {
                    newY = centerY;
                    newDy = newY - dragging.baseY;
                }
                
                // Update position via callback
                if (onBubbleMove) {
                    onBubbleMove(dragging.sectorId, dragging.clusterId, newDx, newDy);
                }
            }, [dragging, getSvgPoint, centerX, centerY, onBubbleMove, radarShape]);

            // Handle mouse up
            const handleMouseUp = useCallback(() => {
                setDragging(null);
            }, []);

            // Add/remove global mouse listeners when dragging
            useEffect(() => {
                if (dragging) {
                    window.addEventListener('mousemove', handleMouseMove);
                    window.addEventListener('mouseup', handleMouseUp);
                    return () => {
                        window.removeEventListener('mousemove', handleMouseMove);
                        window.removeEventListener('mouseup', handleMouseUp);
                    };
                }
            }, [dragging, handleMouseMove, handleMouseUp]);

            const renderRadarStructure = () => {
                let strokeDashValue;
                switch(zoneLineStyle) {
                    case 'solid': strokeDashValue = "none"; break;
                    case 'dotted': strokeDashValue = "2,4"; break;
                    case 'dashed': default: strokeDashValue = "6,6"; break;
                }
                
                // Draw zone circles at outer boundary of each zone (skip latent as outer boundary handles it)
                const zoneElements = Object.entries(zoneRadii)
                    .filter(([zoneName]) => zoneName !== 'latent') // Skip latent, outer boundary handles it
                    .map(([zoneName, radius]) => {
                    if (radarShape === 'half') { 
                        return <path key={`zone-${zoneName}`} d={`M ${centerX - radius},${centerY} A ${radius},${radius} 0 0 1 ${centerX + radius},${centerY}`} fill="none" stroke={radarTextColor} strokeWidth="1" opacity="0.3" strokeDasharray={strokeDashValue} />; 
                    }
                    return <circle key={`zone-${zoneName}`} cx={centerX} cy={centerY} r={radius} fill="none" stroke={radarTextColor} strokeWidth="1" opacity="0.3" strokeDasharray={strokeDashValue} />;
                });
                
                // Zone labels - positioned INSIDE the band, centered radially
                const zoneLabelElements = Object.entries(zoneBounds).flatMap(([name, bounds]) => {
                    const labelText = name.charAt(0).toUpperCase() + name.slice(1);
                    // Position label at center of band
                    const centerOfBand = (bounds.inner + bounds.outer) / 2;
                    const fontSize = zoneLabelTextSizePx;
                    
                    if (radarShape === 'half') {
                        // For 180° view: place labels below the horizontal baseline at each zone boundary
                        const labelY = centerY + baselineLabelMargin;
                        const positions = [
                            { x: centerX - centerOfBand, anchor: 'middle' },
                            { x: centerX + centerOfBand, anchor: 'middle' }
                        ];
                        return positions.map((pos, i) => (
                            <text 
                                key={`label-${name}-half-${i}`} 
                                x={pos.x} 
                                y={labelY} 
                                textAnchor={pos.anchor} 
                                dominantBaseline="hanging" 
                                fontSize={`${fontSize}px`} 
                                fontFamily="Inter, sans-serif"
                                fill={zoneLabelColor || radarTextColor} 
                                opacity="0.8"
                            >
                                {labelText}
                            </text>
                        ));
                    } else {
                        // For 360° view: place labels radially at 4 positions (top, right, bottom, left)
                        const anglesForLabels = [-Math.PI / 2, 0, Math.PI / 2, Math.PI];
                        return anglesForLabels.map((angle) => {
                            const lx = centerX + centerOfBand * Math.cos(angle);
                            const ly = centerY + centerOfBand * Math.sin(angle);
                            
                            // Calculate rotation to align text radially (pointing outward)
                            let rotationDeg = (angle * 180 / Math.PI) + 90;
                            // Flip text that would be upside down
                            if (rotationDeg > 90 && rotationDeg <= 270) {
                                rotationDeg -= 180;
                            }
                            if (rotationDeg < -90) {
                                rotationDeg += 180;
                            }
                            
                            return (
                                <text 
                                    key={`label-${name}-${angle.toFixed(2)}`} 
                                    x={lx} 
                                    y={ly} 
                                    textAnchor="middle" 
                                    dominantBaseline="middle" 
                                    fontSize={`${fontSize}px`} 
                                    fontFamily="Inter, sans-serif"
                                    fill={zoneLabelColor || radarTextColor} 
                                    opacity="0.8"
                                    transform={`rotate(${rotationDeg} ${lx} ${ly})`}
                                >
                                    {labelText}
                                </text>
                            );
                        });
                    }
                });

                const sectorBgPaths = sectors.map((sector, sectorIndex) => {
                    const startAngle = getAngle(sectorIndex, sectors.length);
                    const endAngle = getAngle(sectorIndex + 1, sectors.length);
                    const x1 = centerX + outerRadius * Math.cos(startAngle); const y1 = centerY + outerRadius * Math.sin(startAngle);
                    const x2 = centerX + outerRadius * Math.cos(endAngle); const y2 = centerY + outerRadius * Math.sin(endAngle);
                    let pathData;
                    if (radarShape === 'half') { pathData = `M ${centerX},${centerY} L ${x1},${y1} A ${outerRadius},${outerRadius} 0 0 1 ${x2},${y2} Z`; } else { const largeArcFlag = (endAngle - startAngle) > Math.PI ? 1 : 0; pathData = `M ${centerX},${centerY} L ${x1},${y1} A ${outerRadius},${outerRadius} 0 ${largeArcFlag} 1 ${x2},${y2} Z`; }
                    return <path key={`sector-bg-${sector.id}`} d={pathData} fill={sector.backgroundColor || 'transparent'} stroke="none" />;
                });

                const sectorLineElements = sectors.length > 1 ? sectors.map((_, sectorIndex) => {
                    if (radarShape === 'half' && sectorIndex === 0) return null;
                    const angle = getAngle(sectorIndex, sectors.length);
                    const x2 = centerX + outerRadius * Math.cos(angle); const y2 = centerY + outerRadius * Math.sin(angle);
                    return <line key={`s-line-${sectorIndex}`} x1={centerX} y1={centerY} x2={x2} y2={y2} stroke={radarTextColor} strokeWidth="1" opacity="0.3" />;
                }) : [];

                const sectorNameElements = sectors.map((sector, sectorIndex) => {
                    const startAngle = getAngle(sectorIndex, sectors.length);
                    const endAngle = getAngle(sectorIndex + 1, sectors.length);
                    let angleDiff = endAngle - startAngle;
                    if (radarShape === 'full' && angleDiff < 0) { angleDiff += 2 * Math.PI; }
                    const midAngle = startAngle + angleDiff / 2;
                    const labelRadiusOffset = 35 * overallScaleFactor;
                    const labelRad = outerRadius + labelRadiusOffset;
                    const x = centerX + labelRad * Math.cos(midAngle); const y = centerY + labelRad * Math.sin(midAngle);
                    let rotationForRadius = midAngle * (180 / Math.PI);
                    let tangentialRotation = rotationForRadius + 90;
                    while (tangentialRotation <= -180) tangentialRotation += 360;
                    while (tangentialRotation > 180) tangentialRotation -= 360;
                    if (tangentialRotation > 90) { tangentialRotation -= 180; } else if (tangentialRotation < -90) { tangentialRotation += 180; }
                    const fontSize = sectorNameTextSizePx;
                    return ( <text key={`s-name-${sector.id}`} x={x} y={y} transform={`rotate(${tangentialRotation} ${x} ${y})`} textAnchor="middle" dominantBaseline="central" fontSize={`${fontSize}px`} fontWeight="500" fontFamily="Inter, sans-serif" fill={radarTextColor} > {sector.name} </text> );
                });

                // Outer boundary is now part of the latent zone, so we make it more prominent
                const outerBoundary = radarShape === 'half' ? (
                    <g> 
                        <path d={`M ${centerX - outerRadius},${centerY} A ${outerRadius},${outerRadius} 0 0 1 ${centerX + outerRadius},${centerY}`} fill="none" stroke={radarTextColor} strokeWidth="2" opacity="0.6" /> 
                        <line x1={centerX - outerRadius} y1={centerY} x2={centerX + outerRadius} y2={centerY} stroke={radarTextColor} strokeWidth="2" opacity="0.6" /> 
                    </g>
                ) : <circle cx={centerX} cy={centerY} r={outerRadius} fill="none" stroke={radarTextColor} strokeWidth="2" opacity="0.6" />;

                return (<g>{outerBoundary}{sectorBgPaths}{zoneElements}{sectorLineElements}{zoneLabelElements}{sectorNameElements}</g>);
            };

            return (
                <div className="radar-container" style={{ backgroundColor: radarBgColor, cursor: dragging ? 'grabbing' : 'default' }} ref={svgContainerRef}>
                    <svg viewBox={`0 0 ${currentDimension} ${currentDimension}`} preserveAspectRatio="xMidYMid meet" style={{ width: '100%', height: '100%' }} id="radar-svg-element">
                        <rect x="0" y="0" width={currentDimension} height={currentDimension} fill="transparent" />
                        {renderRadarStructure()}
                        {/* Trend lines and old bubbles */}
                        {bubblePositions.filter(b => {
                            if (isNaN(b.oldValue)) return false;
                            const valueChanged = Math.abs(b.oldValue - b.currentValue) >= 1;
                            const zoneChanged = b.oldZone !== b.currentZone;
                            return zoneChanged || valueChanged;
                        }).map(bubble => {
                             const oldBounds = zoneBounds[bubble.oldZone];
                             const oldBubbleRadiusInZone = (oldBounds.inner + oldBounds.outer) / 2;
                             const angleToNewBubble = Math.atan2(bubble.baseY - centerY, bubble.baseX - centerX);
                             const oldX = centerX + Math.cos(angleToNewBubble) * oldBubbleRadiusInZone;
                             const oldY = centerY + Math.sin(angleToNewBubble) * oldBubbleRadiusInZone;
                             const oldBubbleDisplaySize = DEFAULT_BUBBLE_RADIUS * oldBubbleSizeMultiplier;
                             const trendUp = bubble.currentValue > bubble.oldValue;
                             const trendColor = trendUp ? '#ef4444' : '#22c55e';
                            return (
                                <React.Fragment key={`old-${bubble.id}`}>
                                    <line x1={oldX} y1={oldY} x2={bubble.x} y2={bubble.y} stroke={trendColor} strokeWidth="2" strokeDasharray="4,2" opacity="0.7"/>
                                    <RadarBubble 
                                        x={oldX} y={oldY} size={oldBubbleDisplaySize} color="#a0aec0" 
                                        labelTextColor={bubble.labelTextColor}
                                        label={bubble.label} shortName={bubble.shortName} highlight={false} 
                                        toBeReported={false} riskToleranceCrashed={false} displayMode={clusterDisplayMode} 
                                        sizeMultiplier={oldBubbleSizeMultiplier} bubbleTextSizePx={bubbleTextSizePx} 
                                        reportFlagSizePx={reportFlagSizePx} reportFlagColor={reportFlagColor} reportFlagTextColor={reportFlagTextColor}
                                        toleranceFlagSizePx={toleranceFlagSizePx} toleranceFlagColor={toleranceFlagColor} toleranceFlagTextColor={toleranceFlagTextColor}
                                        isDragging={false} 
                                    />
                                </React.Fragment>
                            );
                        })}
                        {/* Current bubbles - draggable within zone band */}
                        {bubblePositions.map(bubble => (
                            <g key={bubble.id} style={{ cursor: dragging?.bubbleId === bubble.id ? 'grabbing' : 'grab' }} onMouseDown={(e) => handleBubbleMouseDown(e, bubble)}>
                                <RadarBubble 
                                    x={bubble.x} 
                                    y={bubble.y} 
                                    size={bubble.size} 
                                    color={bubble.color} 
                                    labelTextColor={bubble.labelTextColor}
                                    label={bubble.label} 
                                    shortName={bubble.shortName} 
                                    highlight={true} 
                                    toBeReported={bubble.toBeReported} 
                                    riskToleranceCrashed={bubble.riskToleranceCrashed} 
                                    displayMode={clusterDisplayMode} 
                                    sizeMultiplier={bubble.sizeMultiplier} 
                                    bubbleTextSizePx={bubbleTextSizePx} 
                                    reportFlagSizePx={reportFlagSizePx} reportFlagColor={reportFlagColor} reportFlagTextColor={reportFlagTextColor}
                                    toleranceFlagSizePx={toleranceFlagSizePx} toleranceFlagColor={toleranceFlagColor} toleranceFlagTextColor={toleranceFlagTextColor}
                                    isDragging={dragging?.bubbleId === bubble.id}
                                />
                            </g>
                        ))}
                    </svg>
                </div>
            );
        }

        function RadarLegend({ threatClustersData, reportFlagColor, reportFlagTextColor, toleranceFlagColor, toleranceFlagTextColor, radarTextColor }) {
            const textColor = radarTextColor || '#111827';
            const mutedColor = radarTextColor ? `${radarTextColor}99` : '#6b7280';
            return (
                <div className="p-4 md:p-6 mt-2 mx-auto max-w-5xl" style={{color: textColor}}>
                    <h3 className="text-base font-semibold mb-3" style={{color: textColor}}>Threat Cluster Reference</h3>
                    <div className="grid grid-cols-2 lg:grid-cols-3 gap-x-6 gap-y-2">
                        {threatClustersData.map(c => ( <div key={c.id} className="flex items-start gap-2"> <div className="flex-shrink-0 mt-0.5 flex items-center justify-center w-6 h-6 rounded-full bg-blue-500 text-white text-[10px] font-bold">#{c.id}</div> <div> <div className="font-medium text-xs" style={{color: textColor}}>{c.name}</div> <div className="text-[10px]" style={{color: mutedColor}}>{c.description}</div> </div> </div> ))}
                    </div>

                    <div className="grid grid-cols-2 gap-x-6 gap-y-2">
                        <div className="flex items-center gap-2"> <div className="w-5 h-5 rounded-full flex items-center justify-center font-bold text-[10px]" style={{backgroundColor: reportFlagColor, color: reportFlagTextColor}}>!</div> <div> <div className="font-medium text-xs" style={{color: textColor}}>To Be Reported</div> </div> </div>
                        <div className="flex items-center gap-2"> <div className="w-5 h-5 rounded-full flex items-center justify-center font-bold text-[10px]" style={{backgroundColor: toleranceFlagColor, color: toleranceFlagTextColor}}>⚡</div> <div> <div className="font-medium text-xs" style={{color: textColor}}>Tolerance Exceeded</div> </div> </div>

        function ZoneLegend({ radarTextColor }) {
            const textColor = radarTextColor || '#111827';
            const mutedColor = radarTextColor ? `${radarTextColor}99` : '#6b7280';
             return (
                <div className="p-4 md:p-6 mt-0 mx-auto max-w-5xl" style={{color: textColor}}>
