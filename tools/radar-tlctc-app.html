                    </div>
                </div>
            );
        }

        function JsonImportModal({ isOpen, onClose, onImport }) {
            const [jsonText, setJsonText] = useState('');
            const [isDragging, setIsDragging] = useState(false);
            const textareaRef = useRef(null);
            useEffect(() => { if (isOpen) { setJsonText(''); } }, [isOpen]);
            if (!isOpen) return null;
            const handleImportClick = () => { onImport(jsonText); };
            const handleDragOver = (e) => { e.preventDefault(); e.stopPropagation(); setIsDragging(true); };
            const handleDragLeave = (e) => { e.preventDefault(); e.stopPropagation(); setIsDragging(false); };
            const handleDrop = (e) => {
                e.preventDefault(); e.stopPropagation(); setIsDragging(false);
                const files = e.dataTransfer.files;
                if (files && files.length > 0) {
                    const file = files[0];
                    if (file.type === "application/json") { const reader = new FileReader(); reader.onload = (loadEvent) => { setJsonText(loadEvent.target.result); }; reader.readAsText(file); } else { alert("Please drop a valid JSON file (.json)."); }
                }
            };
            return (
                <div className="modal-overlay no-print" onClick={onClose}>
                    <div className="modal-content" onClick={e => e.stopPropagation()}>
                        <h3 className="text-xl font-semibold mb-4 text-foreground">Import Configuration from Text</h3>
                        <p className="text-sm text-muted-foreground mb-3">Paste your JSON configuration below or drag and drop a .json file onto the text area.</p>
                        <textarea ref={textareaRef} className={`modal-textarea ${isDragging ? 'drag-over' : ''}`} value={jsonText} onChange={e => setJsonText(e.target.value)} placeholder='{ "sectors": [ ... ], "radarBgColor": "#FFFFFF", ... }' onDragOver={handleDragOver} onDragLeave={handleDragLeave} onDrop={handleDrop} />
                        <div className="flex justify-end gap-3 mt-4"> <button onClick={onClose} className="app-btn app-btn-outline">Cancel</button> <button onClick={handleImportClick} className="app-btn app-btn-primary">Import JSON</button> </div>
                    </div>
                </div>
            );
        }

        function SectorEditModal({ 
            isOpen, 
            onClose, 
            sector, 
            threatClustersData, 
            updateSectorProperty, 
            toggleThreatActive, 
            updateThreatValue, 
            toggleThreatFlag, 
            updateZoneLimit, 
            takeSnapshot, 
            deleteSector,
            defaultZoneLimits 
        }) {
            if (!isOpen || !sector) return null;
            
            return (
                <div className="modal-overlay no-print" onClick={onClose}>
                    <div className="modal-content-lg" onClick={e => e.stopPropagation()}>
                        {/* Header */}
                        <div className="flex items-center justify-between pb-4 border-b border-border flex-shrink-0">
                            <div className="flex items-center gap-3">
                                <div className="w-6 h-6 rounded-full" style={{backgroundColor: sector.color}}></div>
                                <input 
                                    type="text" 
                                    value={sector.name} 
                                    onChange={e => updateSectorProperty(sector.id, 'name', e.target.value)} 
                                    className="input-control bg-transparent border-0 p-1 text-lg font-semibold text-foreground focus:ring-0 focus:border-border" 
                                />
                            </div>
                            <div className="flex items-center gap-2">
                                <Tooltip text="Bubble Color"><ColorPicker color={sector.color} onChange={c => updateSectorProperty(sector.id, 'color', c)}/></Tooltip>
                                <Tooltip text="Slice BG Color"><ColorPicker color={sector.backgroundColor} onChange={c => updateSectorProperty(sector.id, 'backgroundColor', c)}/></Tooltip>
                                <Tooltip text="Label Text Color"><ColorPicker color={sector.labelTextColor || DEFAULT_LABEL_TEXT_COLOR} onChange={c => updateSectorProperty(sector.id, 'labelTextColor', c)}/></Tooltip>
                                <Tooltip text="Take Snapshot"><button onClick={() => takeSnapshot(sector.id)} className="app-btn app-btn-outline app-btn-sm px-2 py-1"><i className="fas fa-camera"></i></button></Tooltip>
                                <Tooltip text="Delete Sector"><button onClick={() => { deleteSector(sector.id); onClose(); }} className="app-btn app-btn-danger app-btn-sm px-2 py-1"><i className="fas fa-trash"></i></button></Tooltip>
                                <button onClick={onClose} className="app-btn app-btn-outline app-btn-sm px-2 py-1 ml-2"><i className="fas fa-times"></i></button>
                            </div>
                        </div>
                        
                        {/* Scrollable Content */}
                        <div className="flex-1 overflow-y-auto py-4">
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                {threatClustersData.map(cluster => (
                                    <div key={cluster.id} className="threat-card p-3 space-y-2">
                                        <div className="flex items-center justify-between">
                                            <div className="flex items-center gap-2 min-w-0">
                                                <div className="flex-shrink-0 w-6 h-6 rounded-full bg-blue-600 flex items-center justify-center text-xs font-bold">#{cluster.id}</div>
                                                <span className="font-medium text-sm text-foreground truncate" title={cluster.name}>{cluster.name}</span>
                                            </div>
                                            <label className="toggle-switch">
                                                <input type="checkbox" checked={sector.activeThreats[cluster.id]} onChange={() => toggleThreatActive(sector.id, cluster.id)} />
                                                <span className="toggle-slider"></span>
                                            </label>
                                        </div>
                                        {sector.activeThreats[cluster.id] && (
                                            <div className="space-y-3 pl-1">
                                                <div>
                                                    <label className="text-xs text-muted-foreground mb-1 block">Level (0-100)</label>
                                                    <div className="flex items-center gap-2">
                                                        <input type="range" min="0" max="100" value={sector.values[cluster.id]} onChange={e => updateThreatValue(sector.id, cluster.id, e.target.value)} className="w-full h-2 bg-muted rounded-lg appearance-none cursor-pointer" />
                                                        <input type="number" min="0" max="100" value={sector.values[cluster.id]} onChange={e => updateThreatValue(sector.id, cluster.id, e.target.value)} className="input-control w-16 text-center text-sm p-1"/>
                                                    </div>
                                                    {!isNaN(parseFloat(sector.oldValues[cluster.id])) && sector.oldValues[cluster.id] !== sector.values[cluster.id] && (
                                                        <div className="text-xs mt-1 text-muted-foreground">Prev: <span className={sector.values[cluster.id] > sector.oldValues[cluster.id] ? 'text-red-400' : 'text-green-400'}>{sector.oldValues[cluster.id]}</span></div>
                                                    )}
                                                </div>
                                                <div className="flex gap-2 justify-around text-xs">
                                                    <label className="flex items-center gap-1 cursor-pointer text-muted-foreground">
                                                        <input type="checkbox" checked={sector.toBeReported[cluster.id]} onChange={() => toggleThreatFlag(sector.id, cluster.id, 'toBeReported')} className="form-checkbox h-3.5 w-3.5 text-yellow-400 bg-muted border-border rounded focus:ring-yellow-300"/>Report
                                                    </label>
                                                    <label className="flex items-center gap-1 cursor-pointer text-muted-foreground">
                                                        <input type="checkbox" checked={sector.riskToleranceCrashed[cluster.id]} onChange={() => toggleThreatFlag(sector.id, cluster.id, 'riskToleranceCrashed')} className="form-checkbox h-3.5 w-3.5 text-red-500 bg-muted border-border rounded focus:ring-red-400"/>Tolerance
                                                    </label>
                                                </div>
                                                <div>
                                                    <label className="text-xs text-muted-foreground mb-1 block">Zone Thresholds</label>
                                                    <div className="grid grid-cols-4 gap-1">
                                                        {Object.entries(sector.zoneLimits[cluster.id] || defaultZoneLimits).map(([limitName, limitValue]) => (
                                                            <div key={limitName} className="flex flex-col items-center">
                                                                <label className="capitalize text-xs text-muted-foreground truncate">{limitName}</label>
                                                                <input type="number" min="0" max="100" value={limitValue} onChange={e => updateZoneLimit(sector.id, cluster.id, limitName, e.target.value)} disabled={limitName === 'latent'} className="input-control p-1 text-xs text-center w-full disabled:bg-muted disabled:cursor-not-allowed"/>
                                                            </div>
                                                        ))}
                                                    </div>
                                                </div>
                                            </div>
                                        )}
                                    </div>
                                ))}
                            </div>
                        </div>
                        
                        {/* Footer */}
                        <div className="flex justify-end pt-4 border-t border-border flex-shrink-0">
                            <button onClick={onClose} className="app-btn app-btn-primary">Done</button>
                        </div>
                    </div>
                </div>
            );
        }

        function App() {
            const [sectors, setSectors] = useState([]);
            const [newSectorName, setNewSectorName] = useState('');
            const [error, setError] = useState('');
            const [radarBgColor, setRadarBgColor] = useState(DEFAULT_RADAR_BG_COLOR);
            const [radarTextColor, setRadarTextColor] = useState(DEFAULT_RADAR_TEXT_COLOR);
            const [zoneLabelColor, setZoneLabelColor] = useState(DEFAULT_ZONE_LABEL_COLOR);
            const [zoneLineStyle, setZoneLineStyle] = useState(DEFAULT_ZONE_LINE_STYLE);
            const [radarShape, setRadarShape] = useState(DEFAULT_RADAR_SHAPE);
            const [clusterDisplayMode, setClusterDisplayMode] = useState(DEFAULT_CLUSTER_DISPLAY_MODE);
            const [zoneSizeMultipliers, setZoneSizeMultipliers] = useState({...DEFAULT_ZONE_SIZE_MULTIPLIERS});
            const [oldBubbleSizeMultiplier, setOldBubbleSizeMultiplier] = useState(DEFAULT_OLD_BUBBLE_SIZE_MULTIPLIER);
            const [threatClustersData, setThreatClustersData] = useState(() => JSON.parse(JSON.stringify(ORIGINAL_THREAT_CLUSTERS)));
            const [sectorNameTextSizePx, setSectorNameTextSizePx] = useState(DEFAULT_SECTOR_NAME_TEXT_SIZE_PX);
            const [zoneLabelTextSizePx, setZoneLabelTextSizePx] = useState(DEFAULT_ZONE_LABEL_TEXT_SIZE_PX);
            const [bubbleTextSizePx, setBubbleTextSizePx] = useState(DEFAULT_BUBBLE_TEXT_SIZE_PX);
            const [baselineLabelMargin, setBaselineLabelMargin] = useState(DEFAULT_BASELINE_LABEL_MARGIN);
            
            // Flag Settings State
            const [reportFlagSizePx, setReportFlagSizePx] = useState(DEFAULT_REPORT_FLAG_SIZE_PX);
            const [reportFlagColor, setReportFlagColor] = useState(DEFAULT_REPORT_FLAG_BG_COLOR);
            const [reportFlagTextColor, setReportFlagTextColor] = useState(DEFAULT_REPORT_FLAG_TEXT_COLOR);
            
            const [toleranceFlagSizePx, setToleranceFlagSizePx] = useState(DEFAULT_TOLERANCE_FLAG_SIZE_PX);
            const [toleranceFlagColor, setToleranceFlagColor] = useState(DEFAULT_TOLERANCE_FLAG_BG_COLOR);
            const [toleranceFlagTextColor, setToleranceFlagTextColor] = useState(DEFAULT_TOLERANCE_FLAG_TEXT_COLOR);

            const [showLegend, setShowLegend] = useState(false);
            const [showGlobalSettings, setShowGlobalSettings] = useState(true);
            const [showClusterEditor, setShowClusterEditor] = useState(false);
            const [notification, setNotification] = useState(null);
            const radarWrapperRef = useRef(null);
            const [draggedSectorId, setDraggedSectorId] = useState(null);
            const [dropTargetInfo, setDropTargetInfo] = useState({ sectorId: null, position: null });
            const [isJsonImportModalOpen, setIsJsonImportModalOpen] = useState(false);
            const [editingSectorId, setEditingSectorId] = useState(null);
            const LOCAL_STORAGE_KEY = 'threatRadarData_V4_7_1'; 

            const applyImportedData = (imported) => {
                const currentClusterDefs = imported.threatClustersData || ORIGINAL_THREAT_CLUSTERS;
                const hydratedSectors = (imported.sectors || []).map(s => ({
                    ...createDefaultSector(currentClusterDefs), ...s,
                    zoneLimits: Object.fromEntries(currentClusterDefs.map(c => [c.id, s.zoneLimits?.[c.id] || { ...defaultZoneLimits }]))
                }));
                setSectors(hydratedSectors);
                setRadarBgColor(imported.radarBgColor || DEFAULT_RADAR_BG_COLOR); setRadarTextColor(imported.radarTextColor || DEFAULT_RADAR_TEXT_COLOR); setZoneLabelColor(imported.zoneLabelColor || DEFAULT_ZONE_LABEL_COLOR); setZoneLineStyle(imported.zoneLineStyle || DEFAULT_ZONE_LINE_STYLE);
                setRadarShape(imported.radarShape || DEFAULT_RADAR_SHAPE); setClusterDisplayMode(imported.clusterDisplayMode || DEFAULT_CLUSTER_DISPLAY_MODE); setZoneSizeMultipliers(imported.zoneSizeMultipliers || {...DEFAULT_ZONE_SIZE_MULTIPLIERS}); setOldBubbleSizeMultiplier(imported.oldBubbleSizeMultiplier || DEFAULT_OLD_BUBBLE_SIZE_MULTIPLIER);
                setSectorNameTextSizePx(imported.sectorNameTextSizePx || DEFAULT_SECTOR_NAME_TEXT_SIZE_PX); setZoneLabelTextSizePx(imported.zoneLabelTextSizePx || DEFAULT_ZONE_LABEL_TEXT_SIZE_PX); setBubbleTextSizePx(imported.bubbleTextSizePx || DEFAULT_BUBBLE_TEXT_SIZE_PX); setBaselineLabelMargin(imported.baselineLabelMargin || DEFAULT_BASELINE_LABEL_MARGIN); 
                
                // Import Flag Settings
                setReportFlagSizePx(imported.reportFlagSizePx || DEFAULT_REPORT_FLAG_SIZE_PX);
                setReportFlagColor(imported.reportFlagColor || DEFAULT_REPORT_FLAG_BG_COLOR);
                setReportFlagTextColor(imported.reportFlagTextColor || DEFAULT_REPORT_FLAG_TEXT_COLOR);
                
                setToleranceFlagSizePx(imported.toleranceFlagSizePx || DEFAULT_TOLERANCE_FLAG_SIZE_PX);
                setToleranceFlagColor(imported.toleranceFlagColor || DEFAULT_TOLERANCE_FLAG_BG_COLOR);
                setToleranceFlagTextColor(imported.toleranceFlagTextColor || DEFAULT_TOLERANCE_FLAG_TEXT_COLOR);
                
                if (imported.threatClustersData) { const mergedClusters = ORIGINAL_THREAT_CLUSTERS.map(origCluster => { const savedCluster = imported.threatClustersData.find(sc => sc.id === origCluster.id); return savedCluster ? { ...origCluster, shortName: savedCluster.shortName } : origCluster; }); setThreatClustersData(mergedClusters); } else { setThreatClustersData(JSON.parse(JSON.stringify(ORIGINAL_THREAT_CLUSTERS))); }
                setShowGlobalSettings(imported.showGlobalSettings !== undefined ? imported.showGlobalSettings : true); setShowClusterEditor(imported.showClusterEditor !== undefined ? imported.showClusterEditor : false);
                showNotificationMessage('Configuration imported successfully.'); setError('');
            };

            useEffect(() => {
                try {
                    const saved = localStorage.getItem(LOCAL_STORAGE_KEY);
                    if (saved) { applyImportedData(JSON.parse(saved)); } else {
                        setSectors([createDefaultSector(ORIGINAL_THREAT_CLUSTERS)]); setThreatClustersData(JSON.parse(JSON.stringify(ORIGINAL_THREAT_CLUSTERS))); setZoneSizeMultipliers({...DEFAULT_ZONE_SIZE_MULTIPLIERS}); setOldBubbleSizeMultiplier(DEFAULT_OLD_BUBBLE_SIZE_MULTIPLIER);
                        setSectorNameTextSizePx(DEFAULT_SECTOR_NAME_TEXT_SIZE_PX); setZoneLabelTextSizePx(DEFAULT_ZONE_LABEL_TEXT_SIZE_PX); setBubbleTextSizePx(DEFAULT_BUBBLE_TEXT_SIZE_PX); setBaselineLabelMargin(DEFAULT_BASELINE_LABEL_MARGIN); 
                        setReportFlagSizePx(DEFAULT_REPORT_FLAG_SIZE_PX); setReportFlagColor(DEFAULT_REPORT_FLAG_BG_COLOR); setReportFlagTextColor(DEFAULT_REPORT_FLAG_TEXT_COLOR);
                        setToleranceFlagSizePx(DEFAULT_TOLERANCE_FLAG_SIZE_PX); setToleranceFlagColor(DEFAULT_TOLERANCE_FLAG_BG_COLOR); setToleranceFlagTextColor(DEFAULT_TOLERANCE_FLAG_TEXT_COLOR);
                        setZoneLabelColor(DEFAULT_ZONE_LABEL_COLOR); setZoneLineStyle(DEFAULT_ZONE_LINE_STYLE);
                        setShowGlobalSettings(true); setShowClusterEditor(false);
                    }
                } catch (e) { console.error("Failed to load data from localStorage", e); setError("Error loading saved data. Resetting to defaults."); setSectors([createDefaultSector(ORIGINAL_THREAT_CLUSTERS)]); setThreatClustersData(JSON.parse(JSON.stringify(ORIGINAL_THREAT_CLUSTERS))); }
            }, []);

            useEffect(() => {
                try {
                    const dataToSave = { 
                        sectors, radarBgColor, radarTextColor, zoneLabelColor, zoneLineStyle, radarShape, clusterDisplayMode, zoneSizeMultipliers, oldBubbleSizeMultiplier, threatClustersData, 
                        sectorNameTextSizePx, zoneLabelTextSizePx, bubbleTextSizePx, baselineLabelMargin, 
                        reportFlagSizePx, reportFlagColor, reportFlagTextColor,
                        toleranceFlagSizePx, toleranceFlagColor, toleranceFlagTextColor,
                        showGlobalSettings, showClusterEditor 
                    };
                    localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify(dataToSave));
                } catch (e) { console.error("Failed to save data to localStorage", e); }
            }, [
                sectors, radarBgColor, radarTextColor, zoneLabelColor, zoneLineStyle, radarShape, clusterDisplayMode, zoneSizeMultipliers, oldBubbleSizeMultiplier, threatClustersData, 
                sectorNameTextSizePx, zoneLabelTextSizePx, bubbleTextSizePx, baselineLabelMargin, 
                reportFlagSizePx, reportFlagColor, reportFlagTextColor,
                toleranceFlagSizePx, toleranceFlagColor, toleranceFlagTextColor,
                showGlobalSettings, showClusterEditor
            ]);

            const handleClusterDataChange = (clusterId, field, value) => { setThreatClustersData(prevClusters => prevClusters.map(c => c.id === clusterId ? { ...c, [field]: value } : c)); };
            const handleZoneSizeChange = (zoneName, value) => { setZoneSizeMultipliers(prev => ({ ...prev, [zoneName]: parseFloat(value) })); };
            const showNotificationMessage = (message, type = 'success', duration = 3000) => { setNotification({ message, type }); setTimeout(() => setNotification(null), duration); };

            const addSector = () => { const name = newSectorName.trim() || `Sector ${sectors.length + 1}`; setSectors([...sectors, { ...createDefaultSector(threatClustersData), name }]); setNewSectorName(''); showNotificationMessage(`Sector "${name}" added.`); };
            const deleteSector = (id) => { setSectors(sectors.filter(s => s.id !== id)); showNotificationMessage('Sector deleted.', 'info'); };
            const updateSectorProperty = (sectorId, property, value) => { setSectors(prev => prev.map(s => s.id === sectorId ? { ...s, [property]: value } : s)); };
            const toggleThreatActive = (sectorId, clusterId) => { setSectors(prev => prev.map(s => s.id === sectorId ? { ...s, activeThreats: { ...s.activeThreats, [clusterId]: !s.activeThreats[clusterId] } } : s)); };
            const updateThreatValue = (sectorId, clusterId, value) => { const numVal = Math.min(100, Math.max(0, parseInt(value, 10) || 0)); setSectors(prev => prev.map(s => s.id === sectorId ? { ...s, values: { ...s.values, [clusterId]: numVal } } : s)); };
            const updateZoneLimit = (sectorId, clusterId, limitName, value) => { const numVal = Math.min(100, Math.max(0, parseInt(value, 10) || 0)); setSectors(prev => prev.map(s => s.id === sectorId ? { ...s, zoneLimits: { ...s.zoneLimits, [clusterId]: { ...s.zoneLimits[clusterId], [limitName]: numVal } } } : s)); };
            const toggleThreatFlag = (sectorId, clusterId, flagName) => { setSectors(prev => prev.map(s => s.id === sectorId ? { ...s, [flagName]: { ...s[flagName], [clusterId]: !s[flagName][clusterId] } } : s)); };
            const toggleSectorCollapse = (sectorId) => { setSectors(prev => prev.map(s => s.id === sectorId ? { ...s, collapsed: !s.collapsed } : s)); };

            const handleBubbleMove = (sectorId, clusterId, dx, dy) => {
                setSectors(prev => prev.map(s => 
                    s.id === sectorId 
                        ? { ...s, bubbleOffsets: { ...s.bubbleOffsets, [clusterId]: { dx, dy } } } 
                        : s
                ));
            };

            const handleJsonImport = (jsonText) => {
                try { const imported = JSON.parse(jsonText); applyImportedData(imported); setIsJsonImportModalOpen(false); } 
                catch (e) { alert("Invalid JSON format. Please check your input."); console.error("JSON Import Error:", e); }
            };

            const handleFileImport = (event) => {
                const file = event.target.files[0];
                if (!file) return;
                if (file.type !== "application/json" && !file.name.endsWith('.json')) {
                    alert("Please select a valid JSON file (.json).");
                    return;
                }
                const reader = new FileReader();
                reader.onload = (e) => {
                    try {
                        const imported = JSON.parse(e.target.result);
                        applyImportedData(imported);
                        showNotificationMessage('Configuration imported from file.');
                    } catch (err) {
                        alert("Invalid JSON format in file.");
                        console.error("File Import Error:", err);
                    }
                };
                reader.readAsText(file);
                event.target.value = ''; // Reset input
            };

            const exportConfig = () => {
                const dataToExport = { 
                    sectors, radarBgColor, radarTextColor, zoneLabelColor, zoneLineStyle, radarShape, clusterDisplayMode, zoneSizeMultipliers, oldBubbleSizeMultiplier, threatClustersData, 
                    sectorNameTextSizePx, zoneLabelTextSizePx, bubbleTextSizePx, baselineLabelMargin, 
                    reportFlagSizePx, reportFlagColor, reportFlagTextColor,
                    toleranceFlagSizePx, toleranceFlagColor, toleranceFlagTextColor 
                };
                const blob = new Blob([JSON.stringify(dataToExport, null, 2)], { type: 'application/json' });
                const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.href = url; a.download = 'threat-radar-config.json'; document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
                showNotificationMessage('Configuration exported.'); 
            };

            const exportRadarAsPNG = async () => {
                const radarElement = document.getElementById('radar-svg-element');
                if (!radarElement) { alert('Radar not found.'); return; }
                try {
                    const canvas = await html2canvas(radarWrapperRef.current, { backgroundColor: radarBgColor, scale: 2, useCORS: true });
                    const link = document.createElement('a'); link.download = 'threat-radar.png'; link.href = canvas.toDataURL('image/png'); link.click();
                    showNotificationMessage('Radar exported as PNG.');
                } catch(e) { alert('Error exporting radar.'); console.error(e); }
            };

            const takeSnapshot = (sectorId) => { setSectors(prev => prev.map(s => s.id === sectorId ? { ...s, oldValues: { ...s.values } } : s)); showNotificationMessage('Snapshot taken. Trends will now appear.'); };

            const handleDragStart = (e, sectorId) => { e.dataTransfer.effectAllowed = 'move'; setDraggedSectorId(sectorId); };
            const handleDragOver = (e, targetSectorId) => { e.preventDefault(); if (draggedSectorId && draggedSectorId !== targetSectorId) { const rect = e.currentTarget.getBoundingClientRect(); const y = e.clientY - rect.top; const position = y < rect.height / 2 ? 'before' : 'after'; setDropTargetInfo({ sectorId: targetSectorId, position }); } };
            const handleDragLeave = () => { setDropTargetInfo({ sectorId: null, position: null }); };
            const handleDrop = (e, targetSectorId) => { e.preventDefault(); if (!draggedSectorId || draggedSectorId === targetSectorId) { setDropTargetInfo({ sectorId: null, position: null }); return; } setSectors(prev => { const draggedIndex = prev.findIndex(s => s.id === draggedSectorId); const targetIndex = prev.findIndex(s => s.id === targetSectorId); if (draggedIndex === -1 || targetIndex === -1) return prev; const newSectors = [...prev]; const [draggedItem] = newSectors.splice(draggedIndex, 1); let insertIndex = targetIndex; if (dropTargetInfo.position === 'after') { insertIndex = draggedIndex < targetIndex ? targetIndex : targetIndex + 1; } else { insertIndex = draggedIndex < targetIndex ? targetIndex - 1 : targetIndex; } newSectors.splice(insertIndex, 0, draggedItem); return newSectors; }); setDropTargetInfo({ sectorId: null, position: null }); };
            const handleDragEnd = () => { setDraggedSectorId(null); setDropTargetInfo({ sectorId: null, position: null }); };

            return (
                <div className="container mx-auto px-4 py-8">
                    {notification && ( <div className={`fixed top-20 right-4 z-50 p-4 rounded-lg shadow-lg ${ notification.type === 'success' ? 'bg-green-600 text-white' : notification.type === 'error' ? 'bg-red-600 text-white' : 'bg-blue-600 text-white' }`}> {notification.message} </div> )}
                    <JsonImportModal isOpen={isJsonImportModalOpen} onClose={() => setIsJsonImportModalOpen(false)} onImport={handleJsonImport} />
                    <SectorEditModal
                        isOpen={editingSectorId !== null}
                        onClose={() => setEditingSectorId(null)}
                        sector={sectors.find(s => s.id === editingSectorId)}
                        threatClustersData={threatClustersData}
                        updateSectorProperty={updateSectorProperty}
                        toggleThreatActive={toggleThreatActive}
                        updateThreatValue={updateThreatValue}
                        toggleThreatFlag={toggleThreatFlag}
                        updateZoneLimit={updateZoneLimit}
                        takeSnapshot={takeSnapshot}
                        deleteSector={deleteSector}
                        defaultZoneLimits={defaultZoneLimits}
                    />

                    {/* Data Actions Toolbar */}
                    <div className="card p-3 mb-6 no-print">
                        <div className="flex flex-wrap items-center gap-3">
                            <span className="text-sm font-bold text-foreground flex items-center gap-2"><i className="fas fa-database"></i> Data:</span>
                            <button onClick={exportConfig} className="app-btn app-btn-secondary app-btn-sm"><i className="fas fa-download"></i>Export JSON</button>
                            <input type="file" id="json-file-input" accept=".json,application/json" onChange={handleFileImport} className="hidden" />
                            <button onClick={() => document.getElementById('json-file-input').click()} className="app-btn app-btn-secondary app-btn-sm"><i className="fas fa-file-import"></i>Import File</button>
                            <button onClick={() => setIsJsonImportModalOpen(true)} className="app-btn app-btn-outline app-btn-sm"><i className="fas fa-paste"></i>Paste JSON</button>
                            <div className="h-6 w-px bg-border hidden sm:block"></div>
                            <span className="text-sm font-bold text-foreground flex items-center gap-2"><i className="fas fa-book-open"></i> Examples:</span>
                            <select
                                className="input-control text-xs h-8"
                                defaultValue=""
                                onChange={(e) => {
                                    if (!e.target.value) return;
                                    fetch(e.target.value)
                                        .then(r => r.json())
                                        .then(data => { applyImportedData(data); showNotificationMessage('Example loaded.'); })
                                        .catch(err => { alert('Failed to load example.'); console.error(err); });
                                    e.target.value = '';
                                }}
                            >
                                <option value="">Load example...</option>
                                <optgroup label="NCSC/BACS Switzerland 2024">
                                    <option value="examples/ncsc-google-2024-JB-bericht.json">National Overview (CH vs Global)</option>
                                    <option value="examples/ncsc-google-2024-JB-bericht-sectors.json">By Industry Sector</option>
                                    <option value="examples/ncsc-google-2024-JB-bericht-actors.json">By Threat Actor Type</option>
                                    <option value="examples/ncsc-google-2024-JB-bericht-cia.json">By CIA Impact</option>
                                    <option value="examples/ncsc-google-2024-JB-bericht-it-types.json">By IT Asset Type</option>
                                </optgroup>
                            </select>
                        </div>
                    </div>

                    <div className="flex flex-col md:flex-row gap-6 lg:gap-10">
                        <div className="w-full md:w-2/5 lg:w-1/3 space-y-6 no-print" id="editor">
                            <section className="card">
                                <header className="flex items-center justify-between p-4 border-b border-border cursor-pointer" onClick={() => setShowGlobalSettings(!showGlobalSettings)}> <h2 className="text-lg font-semibold text-foreground"><i className="fas fa-globe mr-2 text-blue-400"></i>Global Radar Settings</h2> <i className={`fas fa-chevron-down transition-transform duration-300 ${showGlobalSettings ? 'rotate-180' : ''}`}></i> </header>
                                <div className={`collapse-transition ${showGlobalSettings ? 'p-4 md:p-6 max-h-[2000px] opacity-100' : 'collapsed-content'}`}>
                                    <div className="space-y-4">
                                        <div className="grid grid-cols-2 gap-4">
                                            <div><label className="block text-sm font-medium text-muted-foreground mb-1">Shape</label><select value={radarShape} onChange={e => setRadarShape(e.target.value)} className="input-control w-full"><option value="full">360° (Full)</option><option value="half">180° (Half)</option></select></div>
                                            <div><label className="block text-sm font-medium text-muted-foreground mb-1">Bubble Display</label><select value={clusterDisplayMode} onChange={e => setClusterDisplayMode(e.target.value)} className="input-control w-full"><option value="name">Short Name</option><option value="number">Cluster #</option><option value="both">Cluster # with Short Name</option></select></div>
                                        </div>
                                        <div className="grid grid-cols-2 gap-4 items-end">
                                            <ColorPicker color={radarBgColor} onChange={setRadarBgColor} label="BG Color" />
                                            <ColorPicker color={radarTextColor} onChange={setRadarTextColor} label="Text Color" />
                                        </div>
                                        <div className="grid grid-cols-2 gap-4 items-end">
                                            <ColorPicker color={zoneLabelColor} onChange={setZoneLabelColor} label="Zone Labels" />
                                            <div><label className="block text-sm font-medium text-muted-foreground mb-1">Zone Lines</label><select value={zoneLineStyle} onChange={e => setZoneLineStyle(e.target.value)} className="input-control w-full"><option value="dashed">Dashed</option><option value="solid">Solid</option><option value="dotted">Dotted</option></select></div>
                                        </div>
                                        <div className="pt-2"><h4 className="text-sm font-semibold text-foreground mb-2">Zone Bubble Sizes</h4><div className="grid grid-cols-2 gap-x-4 gap-y-2">{Object.entries(zoneSizeMultipliers).map(([zone, val]) => (<div key={zone} className="flex items-center gap-2"><label className="capitalize text-xs text-muted-foreground w-16">{zone}:</label><input type="number" step="0.05" min="0.5" max="2" value={val} onChange={e => handleZoneSizeChange(zone, e.target.value)} className="input-control p-1 text-xs text-center flex-grow"/></div>))}</div></div>
                                        <div><label className="block text-xs text-muted-foreground mb-1">Trend (Old) Bubble Size ({oldBubbleSizeMultiplier}x)</label><input type="range" min="0.3" max="1.5" step="0.05" value={oldBubbleSizeMultiplier} onChange={e => setOldBubbleSizeMultiplier(parseFloat(e.target.value))} className="w-full h-2 bg-muted rounded-lg appearance-none cursor-pointer" /></div>
                                        <div className="pt-2 grid grid-cols-2 gap-4">
                                            <div><label className="block text-xs text-muted-foreground mb-1">Sector Name Size ({sectorNameTextSizePx}px)</label><input type="range" min="8" max="24" step="1" value={sectorNameTextSizePx} onChange={e => setSectorNameTextSizePx(parseInt(e.target.value))} className="w-full h-2 bg-muted rounded-lg appearance-none cursor-pointer" /></div>
                                            <div><label className="block text-xs text-muted-foreground mb-1">Zone Label Size ({zoneLabelTextSizePx}px)</label><input type="range" min="6" max="18" step="1" value={zoneLabelTextSizePx} onChange={e => setZoneLabelTextSizePx(parseInt(e.target.value))} className="w-full h-2 bg-muted rounded-lg appearance-none cursor-pointer" /></div>
                                            <div><label className="block text-xs text-muted-foreground mb-1">Bubble Text Size ({bubbleTextSizePx}px)</label><input type="range" min="5" max="14" step="0.5" value={bubbleTextSizePx} onChange={e => setBubbleTextSizePx(parseFloat(e.target.value))} className="w-full h-2 bg-muted rounded-lg appearance-none cursor-pointer" /></div>
                                            <div><label className="block text-xs text-muted-foreground mb-1">Baseline Margin ({baselineLabelMargin}px)</label><input type="range" min="5" max="40" step="1" value={baselineLabelMargin} onChange={e => setBaselineLabelMargin(parseInt(e.target.value))} className="w-full h-2 bg-muted rounded-lg appearance-none cursor-pointer" /></div>
                                        </div>
                                        
                                        {/* New Flag Settings Section */}
                                        <div className="pt-3 border-t border-border">
                                            <h4 className="text-sm font-semibold text-foreground mb-3">Flag Settings</h4>
                                            
                                            {/* Report Flag Settings */}
                                            <div className="mb-4">
                                                <div className="text-xs font-semibold text-yellow-400 mb-2 flex items-center gap-2"><i className="fas fa-exclamation-circle"></i> Report Flag (!)</div>
                                                <div className="grid grid-cols-2 gap-2 mb-2">
                                                    <ColorPicker color={reportFlagColor} onChange={setReportFlagColor} label="BG" />
                                                    <ColorPicker color={reportFlagTextColor} onChange={setReportFlagTextColor} label="Text" />
                                                </div>
                                                <div>
                                                    <label className="block text-xs text-muted-foreground mb-1">Size ({reportFlagSizePx}px)</label>
                                                    <input type="range" min="3" max="12" step="0.5" value={reportFlagSizePx} onChange={e => setReportFlagSizePx(parseFloat(e.target.value))} className="w-full h-2 bg-muted rounded-lg appearance-none cursor-pointer" />
                                                </div>
                                            </div>

                                            {/* Tolerance Flag Settings */}
                                            <div>
                                                <div className="text-xs font-semibold text-red-400 mb-2 flex items-center gap-2"><i className="fas fa-bolt"></i> Tolerance Flag (⚡)</div>
                                                <div className="grid grid-cols-2 gap-2 mb-2">
                                                    <ColorPicker color={toleranceFlagColor} onChange={setToleranceFlagColor} label="BG" />
                                                    <ColorPicker color={toleranceFlagTextColor} onChange={setToleranceFlagTextColor} label="Text" />
                                                </div>
                                                <div>
                                                    <label className="block text-xs text-muted-foreground mb-1">Size ({toleranceFlagSizePx}px)</label>
                                                    <input type="range" min="3" max="12" step="0.5" value={toleranceFlagSizePx} onChange={e => setToleranceFlagSizePx(parseFloat(e.target.value))} className="w-full h-2 bg-muted rounded-lg appearance-none cursor-pointer" />
                                                </div>
                                            </div>
                                        </div>

                                        <div className="pt-4 flex flex-wrap gap-2">
                                            <input type="text" value={newSectorName} onChange={e => setNewSectorName(e.target.value)} placeholder="New Sector Name" className="input-control flex-grow"/>
                                            <button onClick={addSector} className="app-btn app-btn-primary"><i className="fas fa-plus"></i>Add Sector</button>
                                        </div>
                                        <div className="flex flex-wrap gap-2 pt-2">
                                            <button onClick={() => setShowLegend(!showLegend)} className="app-btn app-btn-outline app-btn-sm"><i className="fas fa-info-circle"></i>{showLegend ? 'Hide' : 'Show'} Legend</button>
                                        </div>
                                    </div>
                                </div>
                            </section>
                            <section className="card">
                                <header className="flex items-center justify-between p-4 border-b border-border cursor-pointer" onClick={() => setShowClusterEditor(!showClusterEditor)}> <h2 className="text-lg font-semibold text-foreground"><i className="fas fa-edit mr-2 text-purple-400"></i>Cluster Short Names</h2> <i className={`fas fa-chevron-down transition-transform duration-300 ${showClusterEditor ? 'rotate-180' : ''}`}></i> </header>
                                <div className={`collapse-transition ${showClusterEditor ? 'p-4 md:p-6 max-h-[1000px] opacity-100' : 'collapsed-content'}`}>
                                    <div className="space-y-2">
                                        {threatClustersData.map(c => (<div key={c.id} className="flex items-center gap-2"><span className="w-5 text-xs text-muted-foreground text-right">#{c.id}</span><input type="text" value={c.shortName} onChange={e => handleClusterDataChange(c.id, 'shortName', e.target.value)} className="input-control flex-grow p-1 text-sm" title={c.name}/></div>))}
                                    </div>
                                </div>
                            </section>
                            {sectors.length === 0 ? ( <div className="text-center py-10 card"> <i className="fas fa-folder-open text-4xl text-muted-foreground mb-3"></i> <h3 className="text-sm text-muted-foreground">No sectors defined.</h3> <p className="text-muted-foreground">Load an example from the toolbar above, import a JSON file, or add a sector in Global Radar Settings.</p> </div> ) : (
                                <div className="space-y-2">
                                    {sectors.map((sector, index) => {
                                        const activeCount = Object.values(sector.activeThreats).filter(Boolean).length;
                                        return (
                                            <div 
                                                key={sector.id} 
                                                className={`card p-3 cursor-pointer hover:bg-muted/80 transition-colors ${draggedSectorId === sector.id ? 'sector-dragging' : ''} ${dropTargetInfo.sectorId === sector.id && dropTargetInfo.position === 'before' ? 'sector-drop-indicator-top' : ''} ${dropTargetInfo.sectorId === sector.id && dropTargetInfo.position === 'after' ? 'sector-drop-indicator-bottom' : ''}`} 
                                                draggable={true} 
                                                onDragStart={(e) => handleDragStart(e, sector.id)} 
                                                onDragOver={(e) => handleDragOver(e, sector.id)} 
                                                onDragLeave={handleDragLeave} 
                                                onDrop={(e) => handleDrop(e, sector.id)} 
                                                onDragEnd={handleDragEnd}
                                                onClick={() => setEditingSectorId(sector.id)}
                                            >
                                                <div className="flex items-center justify-between">
                                                    <div className="flex items-center gap-3">
                                                        <div className="w-5 h-5 rounded-full flex-shrink-0" style={{backgroundColor: sector.color}}></div>
                                                        <div>
                                                            <div className="font-semibold text-sm text-foreground">{sector.name}</div>
                                                            <div className="text-xs text-muted-foreground">{activeCount} active threat{activeCount !== 1 ? 's' : ''}</div>
                                                        </div>
                                                    </div>
                                                    <div className="flex items-center gap-2">
                                                        <Tooltip text="Edit Sector"><i className="fas fa-pen text-muted-foreground text-sm"></i></Tooltip>
                                                    </div>
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>
                            )}
                        </div>
                        <div className="w-full md:w-3/5 lg:w-2/3 flex flex-col items-center space-y-4 radar-container-wrapper">
                            <div className="card p-4 w-full max-w-md self-center no-print flex gap-2"> 
                                <button onClick={exportRadarAsPNG} className="app-btn app-btn-primary flex-grow"><i className="fas fa-camera-retro"></i>Export PNG</button>
                                <button onClick={() => { setSectors(prev => prev.map(s => ({ ...s, bubbleOffsets: Object.fromEntries(threatClustersData.map(c => [c.id, { dx: 0, dy: 0 }])) }))); showNotificationMessage('Bubble positions reset.'); }} className="app-btn app-btn-outline" title="Reset all bubbles to default positions"><i className="fas fa-undo"></i>Reset Positions</button>
                            </div>
                            {sectors.length > 0 ? (
                                <div ref={radarWrapperRef} className="w-full" style={{backgroundColor: radarBgColor}}>
                                    <RadarVisualization
                                        sectors={sectors} radarBgColor={radarBgColor} radarTextColor={radarTextColor} zoneLabelColor={zoneLabelColor} zoneLineStyle={zoneLineStyle} radarShape={radarShape} clusterDisplayMode={clusterDisplayMode} zoneSizeMultipliers={zoneSizeMultipliers} oldBubbleSizeMultiplier={oldBubbleSizeMultiplier} threatClustersData={threatClustersData}
                                        sectorNameTextSizePx={sectorNameTextSizePx} zoneLabelTextSizePx={zoneLabelTextSizePx} bubbleTextSizePx={bubbleTextSizePx} baselineLabelMargin={baselineLabelMargin}
                                        reportFlagSizePx={reportFlagSizePx} reportFlagColor={reportFlagColor} reportFlagTextColor={reportFlagTextColor}
                                        toleranceFlagSizePx={toleranceFlagSizePx} toleranceFlagColor={toleranceFlagColor} toleranceFlagTextColor={toleranceFlagTextColor}
                                        onBubbleMove={handleBubbleMove}
                                    />
                                    {showLegend && (<><RadarLegend threatClustersData={threatClustersData} reportFlagColor={reportFlagColor} reportFlagTextColor={reportFlagTextColor} toleranceFlagColor={toleranceFlagColor} toleranceFlagTextColor={toleranceFlagTextColor} radarTextColor={radarTextColor} /><ZoneLegend radarTextColor={radarTextColor} /></>)}
                                </div>
                            ) : ( <div className="text-center py-10 card w-full max-w-lg flex-grow flex flex-col justify-center items-center no-print"> <i className="fas fa-exclamation-triangle text-4xl text-yellow-400 mb-3"></i> <h3 className="text-xl text-muted-foreground">No Data to Visualize</h3> <p className="text-muted-foreground">Add and configure sectors in the Editor panel.</p> </div> )}
                        </div>
                    </div>
                </div>
            );
        }

        const container = document.getElementById('root');
        const root = ReactDOM.createRoot(container);
        root.render(<App />);
    </script>

    <script>
        // --- UI & Theme Logic ---
        lucide.createIcons();

        const htmlEl = document.documentElement;

        // Theme Toggle Logic
        function updateThemeIcons() {
            const darkIcon = document.getElementById('theme-toggle-dark-icon');
            const lightIcon = document.getElementById('theme-toggle-light-icon');
            if (htmlEl.classList.contains('dark')) {
                darkIcon.classList.remove('hidden');
                lightIcon.classList.add('hidden');
            } else {
                darkIcon.classList.add('hidden');
                lightIcon.classList.remove('hidden');
            }
        }

        function toggleDarkMode() {
            htmlEl.classList.toggle('dark');
            localStorage.theme = htmlEl.classList.contains('dark') ? 'dark' : 'light';
            updateThemeIcons();
        }

        // Init Theme
        if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            htmlEl.classList.add('dark');
        } else {
            htmlEl.classList.remove('dark');
        }
        updateThemeIcons();

        // Mobile Menu
        function toggleMenu() {
            const menu = document.getElementById('mobile-menu');
            if (menu.classList.contains('hidden')) {
                menu.classList.remove('hidden');
                requestAnimationFrame(() => { menu.classList.add('opacity-100'); menu.classList.remove('opacity-0'); });
            } else {
                menu.classList.add('opacity-0');
                menu.classList.remove('opacity-100');
                setTimeout(() => menu.classList.add('hidden'), 300);
            }
        }
    </script>
</body>
</html>
