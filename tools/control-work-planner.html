// PROGRAMME STRIP + FILTER BAR
// ═══════════════════════════════════════════════════════════════════

function ProgrammeStrip({ state, stats, now, onRename, onGoPlan }) {
    const rag = state.programme.ragOverride || stats.rag;
    const next = state.milestones.filter(m => m.date && m.date >= now).sort((a, b) => a.date < b.date ? -1 : 1)[0];
    return (
        <section className="px-4 sm:px-6 pt-4 pb-3 border-b border-border bg-card/60 no-print">
            <div className="flex flex-wrap items-center gap-x-6 gap-y-3">
                <div className="min-w-0 flex-1 basis-64">
                    <input value={state.programme.name} onChange={e => onRename(e.target.value)} aria-label="Programme name"
                           className="font-display font-bold text-xl bg-transparent border-b border-transparent hover:border-border focus:border-primary focus:outline-none w-full truncate" />
                    <p className="text-xs text-muted-foreground mt-0.5 truncate" title={state.programme.statusNote}>
                        {state.programme.statusNote || <button onClick={onGoPlan} className="underline decoration-dotted hover:text-foreground">Add a status note for the reports</button>}
                    </p>
                </div>
                <button onClick={onGoPlan} className="flex items-center gap-2 rounded-full px-3 py-1.5 text-sm font-bold text-white focus-visible:ring-2 focus-visible:ring-ring outline-none" style={{ background: RAG[rag].color }}
                        title={state.programme.ragOverride ? `Set manually (derived: ${RAG[stats.rag].label})` : 'Derived from the work items — see Plan for the rules'}>
                    {RAG[rag].label}{state.programme.ragOverride && <Icon name="pencil" size={12} />}
                </button>
                <div className="w-40">
                    <div className="flex justify-between text-[11px] text-muted-foreground mb-1"><span>Progress</span><span className="font-semibold text-foreground tabular-nums">{pct(stats.progress)}</span></div>
                    <ProgressBar value={stats.progress} className="h-2" />
                </div>
                <dl className="flex flex-wrap items-center gap-x-5 gap-y-1 text-sm">
                    <div className="flex items-baseline gap-1.5"><dt className="sr-only">Work items</dt><dd className="font-bold tabular-nums">{stats.total}</dd><span className="text-xs text-muted-foreground" title="Cancelled items are not counted">items</span>
                        <span className="ml-1 inline-flex items-center gap-2 text-xs"><TypeGlyph type="local" size={12} /><span className="-ml-1.5 tabular-nums">{stats.local}</span><TypeGlyph type="umbrella" size={12} /><span className="-ml-1.5 tabular-nums">{stats.umbrella}</span></span></div>
                    <div className="flex items-baseline gap-1.5"><dd className={`font-bold tabular-nums ${stats.overdue.length ? 'text-red-600 dark:text-red-400' : ''}`}>{stats.overdue.length}</dd><dt className="text-xs text-muted-foreground">overdue</dt></div>
                    <div className="flex items-baseline gap-1.5"><dd className={`font-bold tabular-nums ${stats.blocked.length ? 'text-red-600 dark:text-red-400' : ''}`}>{stats.blocked.length}</dd><dt className="text-xs text-muted-foreground">blocked</dt></div>
                    <div className="flex items-baseline gap-1.5"><dd className="font-bold tabular-nums">{fmtNum(stats.effortRemaining)}</dd><dt className="text-xs text-muted-foreground">person-days left</dt></div>
                    {next && <div className="flex items-center gap-1.5 text-xs text-muted-foreground"><Icon name="flag" size={13} /><span>Next: <span className="text-foreground font-medium">{next.name}</span>, {fmtShort(next.date)} ({daysBetween(now, next.date)} d)</span></div>}
                </dl>
            </div>
        </section>
    );
}

function TypeSwitch({ value, onChange }) {
    const opts = [{ id: 'all', label: 'All work' }, { id: 'local', label: 'Local' }, { id: 'umbrella', label: 'Umbrella' }];
    return (
        <div className="inline-flex rounded-lg border border-border p-0.5 bg-background" role="radiogroup" aria-label="Work type">
            {opts.map(o => (
                <button key={o.id} role="radio" aria-checked={value === o.id} onClick={() => onChange(o.id)}
                        className={`inline-flex items-center gap-1.5 px-2.5 py-1 rounded-md text-xs font-semibold focus:outline-none focus-visible:ring-2 focus-visible:ring-ring ${value === o.id ? 'bg-secondary text-foreground shadow-sm' : 'text-muted-foreground hover:text-foreground'}`}>
                    {o.id !== 'all' && <TypeGlyph type={o.id} size={13} />}{o.label}
                </button>
            ))}
        </div>
    );
}

function FilterBar({ filters, setFilters, state, owners, shown, total }) {
    const [more, setMore] = useState(false);
    const set = (k, v) => setFilters(f => ({ ...f, [k]: v }));
    const n = activeFilterCount(filters);
    return (
        <div className="px-4 sm:px-6 py-2.5 border-b border-border flex flex-wrap items-center gap-2 no-print">
            <TypeSwitch value={filters.type} onChange={v => set('type', v)} />
            <div className="relative">
                <span className="absolute left-2.5 top-1/2 -translate-y-1/2 text-muted-foreground"><Icon name="search" size={13} /></span>
                <input type="search" value={filters.q} onChange={e => set('q', e.target.value)} placeholder="Search key, title, control, owner…" aria-label="Search work items"
                       className="input-ctrl py-1.5 text-xs pl-8 w-56" />
            </div>
            <Select label="Cluster" value={filters.cluster} onChange={v => set('cluster', v)}>
                <option value="">All clusters</option>
                {CLUSTERS.map(c => <option key={c.id} value={c.id}>#{c.id} {c.name}</option>)}
            </Select>
            <Select label="CSF function" value={filters.func} onChange={v => set('func', v)}>
                <option value="">All functions</option>
                {CSF_FUNCTIONS.map(f => <option key={f.id} value={f.id}>{f.label}</option>)}
            </Select>
            <Select label="Status" value={filters.status} onChange={v => set('status', v)}>
                <option value="">Any status</option>
                <option value="open">Open (not done or cancelled)</option>
                {STATUSES.map(s => <option key={s.id} value={s.id}>{s.label}</option>)}
            </Select>
            <button onClick={() => setMore(m => !m)} className="app-btn app-btn-ghost app-btn-sm gap-1" aria-expanded={more}>
                <Icon name="sliders-horizontal" size={13} /> More filters
            </button>
            {more && <>
                <Select label="Owner" value={filters.owner} onChange={v => set('owner', v)}>
                    <option value="">All owners</option>
                    {owners.map(o => <option key={o} value={o}>{o}</option>)}
                </Select>
                <Select label="Environment" value={filters.envId} onChange={v => set('envId', v)}>
                    <option value="">All environments</option>
                    {state.environments.map(e => <option key={e.id} value={e.id}>{e.name}</option>)}
                </Select>
                <Select label="Priority" value={filters.priority} onChange={v => set('priority', v)}>
                    <option value="">Any priority</option>
                    {PRIORITIES.map(p => <option key={p.id} value={p.id}>{p.label}</option>)}
                </Select>
                <Select label="Milestone" value={filters.milestoneId} onChange={v => set('milestoneId', v)}>
                    <option value="">Any milestone</option>
                    {state.milestones.map(m => <option key={m.id} value={m.id}>{m.name}</option>)}
                </Select>
                <Select label="Attention" value={filters.flag} onChange={v => set('flag', v)}>
                    <option value="">No attention filter</option>
                    <option value="overdue">Overdue</option>
                    <option value="blocked">Blocked</option>
                    <option value="atrisk">At risk or off track</option>
                    <option value="due14">Due in 14 days</option>
                    <option value="unscheduled">No due date</option>
                </Select>
            </>}
            <span className="ml-auto text-xs text-muted-foreground tabular-nums">{shown === total ? `${total} items` : `${shown} of ${total} items`}</span>
            {n > 0 && <button onClick={() => setFilters(EMPTY_FILTERS)} className="app-btn app-btn-ghost app-btn-sm gap-1"><Icon name="x" size={12} /> Clear filters ({n})</button>}
            {filters.envId && <span className="basis-full text-[11px] text-muted-foreground">Environment filter narrows Local work only: Umbrella work covers every environment.</span>}
        </div>
    );
}

// ═══════════════════════════════════════════════════════════════════
// MATRIX VIEW
// ═══════════════════════════════════════════════════════════════════

const HEAT_MODES = [
    { id: 'progress', label: 'Progress' },
    { id: 'workload', label: 'Remaining effort' },
    { id: 'risk', label: 'Overdue and blocked' },
];

function MatrixView({ items, now, selectedCell, onSelectCell, heat, setHeat, onEmptyAction, hasAnyItems }) {
    const stats = useMemo(() => {
        const m = {};
        CLUSTERS.forEach(c => CSF_FUNCTIONS.forEach(f => { const ck = cellKey(c.id, f.id); m[ck] = cellStats(items, ck, now); }));
        return m;
    }, [items, now]);
    const vals = Object.values(stats);
    const maxRem = Math.max(1, ...vals.map(s => s.remaining));
    const maxRisk = Math.max(1, ...vals.map(s => s.overdue + s.blocked));
    const tint = (s) => {
        if (!s.total) return undefined;
        if (heat === 'progress') return `hsla(142, 71%, 40%, ${(0.05 + 0.33 * s.progress / 100).toFixed(3)})`;
        if (heat === 'workload') return `hsla(221, 83%, 53%, ${(0.04 + 0.36 * s.remaining / maxRem).toFixed(3)})`;
        const r = s.overdue + s.blocked;
        return r ? `hsla(0, 84%, 55%, ${(0.12 + 0.36 * r / maxRisk).toFixed(3)})` : 'hsla(215, 20%, 60%, 0.06)';
    };
    const live = items.filter(isLive);
    const colCount = (fid) => live.filter(i => (i.cells || []).some(ck => parseCell(ck).funcId === fid)).length;
    const rowCount = (cid) => live.filter(i => (i.cells || []).some(ck => parseCell(ck).clusterId === cid)).length;
    const gaps = vals.filter(s => !s.total).length;

    return (
        <div className="px-4 sm:px-6 py-4">
            <div className="flex flex-wrap items-center gap-3 mb-3">
                <div className="inline-flex items-center gap-2 text-xs text-muted-foreground">
                    <span>Shade cells by</span>
                    <div className="inline-flex rounded-lg border border-border p-0.5" role="radiogroup" aria-label="Shade cells by">
                        {HEAT_MODES.map(h => (
                            <button key={h.id} role="radio" aria-checked={heat === h.id} onClick={() => setHeat(h.id)}
                                    className={`px-2 py-1 rounded-md font-medium focus:outline-none focus-visible:ring-2 focus-visible:ring-ring ${heat === h.id ? 'bg-secondary text-foreground' : 'hover:text-foreground'}`}>{h.label}</button>
                        ))}
                    </div>
                </div>
                <div className="flex flex-wrap items-center gap-x-4 gap-y-1 text-[11px] text-muted-foreground ml-auto">
                    <span className="inline-flex items-center gap-1"><TypeGlyph type="local" size={12} /> Local work in this cell</span>
                    <span className="inline-flex items-center gap-1"><TypeGlyph type="umbrella" size={12} /> Umbrella work reaching this cell</span>
                    <span className="inline-flex items-center gap-1"><span className="inline-block w-5 h-3 rounded-sm border border-border work-cell empty" style={{ cursor: 'default' }} /> No work planned ({gaps})</span>
                </div>
            </div>

            <div className="overflow-x-auto rounded-xl border border-border bg-card">
                <table className="w-full border-separate" style={{ borderSpacing: 0, minWidth: 760 }}>
                    <thead>
                        <tr>
                            <th className="sticky left-0 z-10 bg-card text-left text-[11px] font-semibold text-muted-foreground px-3 py-2 border-b border-border w-48">Cluster</th>
                            {CSF_FUNCTIONS.map(f => (
                                <th key={f.id} className="text-left text-xs font-semibold px-2 py-2 border-b border-border">
                                    <span className="inline-flex items-center gap-1.5"><span className="w-2 h-2 rounded-full" style={{ background: f.color }} />{f.label}</span>
                                    <span className="block text-[10px] font-normal text-muted-foreground tabular-nums">{plural(colCount(f.id), 'item')}</span>
                                </th>
                            ))}
                        </tr>
                    </thead>
                    <tbody>
                        {CLUSTERS.map(c => (
                            <tr key={c.id}>
                                <th scope="row" className={`sticky left-0 z-10 bg-card text-left px-3 py-1 border-b border-border font-normal ${c.id === 8 ? 'border-t-2 border-t-border' : ''}`}>
                                    <div className="text-sm font-semibold leading-tight"><span className="text-muted-foreground font-mono text-xs mr-1">#{c.id}</span>{c.name}</div>
                                    <div className="text-[10px] text-muted-foreground tabular-nums">{plural(rowCount(c.id), 'item')}{c.topology === 'bridge' ? ', bridge cluster' : ''}</div>
                                </th>
                                {CSF_FUNCTIONS.map(f => {
                                    const ck = cellKey(c.id, f.id);
                                    const s = stats[ck];
                                    const flags = s.overdue + s.blocked;
                                    return (
                                        <td key={f.id} className={`p-1 border-b border-border ${c.id === 8 ? 'border-t-2 border-t-border' : ''}`}>
                                            <button onClick={() => onSelectCell(ck)}
                                                    className={`work-cell w-full min-w-[96px] h-[66px] rounded-lg border border-border/70 text-left px-2 py-1.5 flex flex-col justify-between ${s.total ? '' : 'empty'} ${selectedCell === ck ? 'selected' : ''}`}
                                                    style={{ background: tint(s) }}
                                                    aria-label={`#${c.id} ${c.name}, ${f.label}: ${s.local} local, ${s.umbrella} umbrella, ${Math.round(s.progress)} percent${flags ? `, ${flags} overdue or blocked` : ''}`}>
                                                {s.total ? <>
                                                    <div className="flex items-center gap-2 text-xs font-semibold tabular-nums">
                                                        {s.local > 0 && <span className="inline-flex items-center gap-0.5" style={{ color: 'hsl(var(--local))' }}><Icon name="map-pin" size={12} />{s.local}</span>}
                                                        {s.umbrella > 0 && <span className="inline-flex items-center gap-0.5" style={{ color: 'hsl(var(--umbrella))' }}><Icon name="umbrella" size={12} />{s.umbrella}</span>}
                                                        {flags > 0 && <span className="ml-auto inline-flex items-center gap-0.5 text-red-600 dark:text-red-400" title={`${s.overdue} overdue, ${s.blocked} blocked`}><Icon name="alarm-clock" size={11} />{flags}</span>}
                                                    </div>
                                                    <div className="flex h-1.5 rounded-full overflow-hidden bg-border/70">
                                                        {s.byStatus.filter(x => x.n && x.id !== 'cancelled').map(x => <span key={x.id} title={`${x.n} ${x.label}`} style={{ width: `${x.n / s.total * 100}%`, background: x.color }} />)}
                                                    </div>
                                                    <div className="text-[11px] text-muted-foreground font-medium tabular-nums">{Math.round(s.progress)}% done</div>
                                                </> : <span className="text-[10px] text-muted-foreground m-auto">no work</span>}
                                            </button>
                                        </td>
                                    );
                                })}
                            </tr>
                        ))}
                    </tbody>
                </table>
            </div>
            <div className="flex flex-wrap gap-x-4 gap-y-1 mt-2 text-[11px] text-muted-foreground">
                {STATUSES.filter(s => s.id !== 'cancelled').map(s => <span key={s.id} className="inline-flex items-center gap-1"><span className="w-2.5 h-1.5 rounded-full" style={{ background: s.color }} />{s.label}</span>)}
                <span>— the bar shows the status mix of the work in each cell. An item counts in every cell it covers and turns Done in a cell only when that cell is closed for it.</span>
            </div>

            {!hasAnyItems && (
                <div className="card mt-4 p-5 max-w-2xl">
                    <h3 className="font-display font-bold text-base">No work planned yet</h3>
                    <p className="text-sm text-muted-foreground mt-1">Click a cell to add work there, import a Control Matrix export to turn its controls below target maturity into work items, or load the example plan to see the reports filled in.</p>
                    <div className="flex flex-wrap gap-2 mt-3">
                        <button onClick={() => onEmptyAction('new')} className="app-btn app-btn-primary app-btn-sm"><Icon name="plus" size={13} /> Add work item</button>
                        <button onClick={() => onEmptyAction('import')} className="app-btn app-btn-outline app-btn-sm"><Icon name="upload" size={13} /> Import Control Matrix export</button>
                        <button onClick={() => onEmptyAction('example')} className="app-btn app-btn-outline app-btn-sm"><Icon name="sparkles" size={13} /> Load example plan</button>
                    </div>
                </div>
            )}
        </div>
    );
}

// ═══════════════════════════════════════════════════════════════════
// ITEM ROW + CELL DRAWER
// ═══════════════════════════════════════════════════════════════════

// "2/4 cells done" for items with more than one cell
function CellTally({ item }) {
    const n = (item.cells || []).length;
    if (n < 2) return null;
    const done = cellsDoneCount(item);
    return <span className={`inline-flex items-center gap-1 ${done === n ? 'text-green-700 dark:text-green-400' : ''}`} title="Cells done for this item"><Icon name="grid-2x2-check" size={10} />{done}/{n} cells done</span>;
}

function ItemRow({ item, state, now, onOpen, showCells = false, contextCell, onToggleCell }) {
    const rag = itemRag(item, now);
    const here = contextCell ? linkStatus(item, contextCell) === 'done' : false;
    const overdue = !isClosed(item) && item.dueDate && item.dueDate < now && !here;
    const others = contextCell ? (item.cells || []).filter(c => c !== contextCell).length : 0;
    const canToggle = contextCell && onToggleCell && item.status !== 'cancelled' && item.status !== 'done';
    return (
        <div className={`rounded-lg border bg-background flex items-stretch ${item.status === 'cancelled' ? 'opacity-60' : ''} ${overdue ? 'border-red-400/60' : 'border-border'}`}>
            <button onClick={() => onOpen(item.id)} className="flex-1 min-w-0 text-left hover:bg-accent rounded-lg px-3 py-2 flex gap-2.5 items-start focus:outline-none focus-visible:ring-2 focus-visible:ring-ring">
                <span className="mt-0.5"><TypeGlyph type={item.type} size={15} /></span>
                <div className="flex-1 min-w-0">
                    <div className="flex items-center gap-1.5 flex-wrap">
                        <span className="font-mono text-[10px] text-muted-foreground">{item.key}</span>
                        <StatusBadge status={item.status} />
                        <PriorityBadge priority={item.priority} />
                        <RagDot rag={rag} />
                    </div>
                    <div className={`text-sm font-medium leading-snug mt-0.5 ${item.status === 'cancelled' ? 'line-through' : ''}`}>{item.title}</div>
                    <div className="text-[11px] text-muted-foreground flex flex-wrap gap-x-3 mt-0.5">
                        <span className="inline-flex items-center gap-1"><Icon name="user" size={10} />{itemOwner(item)}</span>
                        <span className={`inline-flex items-center gap-1 ${overdue ? 'text-red-600 dark:text-red-400 font-semibold' : ''}`}><Icon name="calendar" size={10} />{item.dueDate ? fmtShort(item.dueDate) : 'no due date'}</span>
                        <span>{whereLabel(state, item)}</span>
                        <CellTally item={item} />
                        {contextCell && others > 0 && <span style={{ color: `hsl(var(--${item.type}))` }}>also covers {others} other cell{others === 1 ? '' : 's'}</span>}
                        {showCells && <span>{(item.cells || []).length > 3 ? summariseCells(item.cells) : (item.cells || []).map(cellLabel).join(', ')}</span>}
                    </div>
                    {!isClosed(item) && <ProgressBar value={contextCell ? cellProgress(item, contextCell) : itemProgress(item)} className="mt-1.5" />}
                </div>
            </button>
            {contextCell && (
                <button onClick={() => canToggle && onToggleCell(item.id, contextCell)} disabled={!canToggle} aria-pressed={here}
                        title={item.status === 'done' ? 'The item is Done in every cell' : here ? 'Done in this cell — click to reopen' : 'Set this item done in this cell'}
                        className={`flex flex-col items-center justify-center gap-0.5 w-16 flex-shrink-0 border-l border-border rounded-r-lg text-[10px] font-semibold focus:outline-none focus-visible:ring-2 focus-visible:ring-ring ${here ? 'text-green-700 dark:text-green-400 bg-green-500/10' : 'text-muted-foreground hover:bg-accent hover:text-foreground'} disabled:cursor-default`}>
                    <Icon name={here ? 'circle-check' : 'circle'} size={18} />
                    {here ? 'Done here' : 'Mark done'}
                </button>
            )}
        </div>
    );
}

function CellDrawer({ ck, items, allItems, state, now, onClose, onOpenItem, onNew, onToggleCell }) {
    const { clusterId, funcId } = parseCell(ck);
    const c = clusterOf(clusterId), f = funcOf(funcId);
    const inCell = itemsInCell(items, ck);
    const hiddenByFilter = itemsInCell(allItems, ck).length - inCell.length;
    const s = cellStats(items, ck, now);
    const local = inCell.filter(i => i.type === 'local');
    const umb = inCell.filter(i => i.type === 'umbrella');
    const byEnv = state.environments.map(e => ({ e, its: local.filter(i => i.envId === e.id) })).filter(g => g.its.length);
    return (
        <aside className="drawer fixed top-0 right-0 bottom-0 z-40 w-full sm:w-[460px] bg-card border-l border-border shadow-2xl flex flex-col no-print" aria-label={`Work in #${clusterId} ${c.name}, ${f.label}`}>
            <div className="px-5 pt-4 pb-3 border-b border-border">
                <div className="flex items-start justify-between gap-3">
                    <div>
                        <div className="text-xs text-muted-foreground font-mono">{c.opId} × {f.name}</div>
                        <h2 className="font-display font-bold text-lg leading-tight">#{c.id} {c.name} <span className="text-muted-foreground font-normal">×</span> <span style={{ color: f.color }}>{f.label}</span></h2>
                    </div>
                    <button onClick={onClose} className="app-btn app-btn-ghost app-btn-sm" aria-label="Close panel"><Icon name="x" size={18} /></button>
                </div>
                <p className="text-sm mt-2">{f.objective.replace('#X', '#' + c.id)}.</p>
                <p className="text-xs text-muted-foreground mt-1"><span className="font-semibold">Generic vulnerability:</span> {c.genericVuln}</p>
                <div className="flex items-center gap-4 mt-3 text-xs">
                    <span className="inline-flex items-center gap-1"><TypeGlyph type="local" size={13} /> {s.local} Local</span>
                    <span className="inline-flex items-center gap-1"><TypeGlyph type="umbrella" size={13} /> {s.umbrella} Umbrella</span>
                    <span className="text-muted-foreground">{s.done} of {s.total} done here, {Math.round(s.progress)}% progress</span>
                    {s.overdue > 0 && <span className="text-red-600 dark:text-red-400 font-semibold">{s.overdue} overdue</span>}
                </div>
                <div className="flex flex-wrap gap-2 mt-3">
                    <button onClick={() => onNew({ type: 'local', cells: [ck] })} className="app-btn app-btn-outline app-btn-sm"><TypeGlyph type="local" size={13} /> Add Local work</button>
                    <button onClick={() => onNew({ type: 'umbrella', cells: [ck] })} className="app-btn app-btn-outline app-btn-sm"><TypeGlyph type="umbrella" size={13} /> Add Umbrella work</button>
                </div>
            </div>
            <div className="flex-1 overflow-y-auto px-5 py-4 space-y-5">
                <section>
                    <h3 className="text-sm font-semibold flex items-center gap-1.5 mb-1"><TypeGlyph type="umbrella" size={14} /> Umbrella work ({umb.length})</h3>
                    <p className="text-[11px] text-muted-foreground mb-2">{WORK_TYPES.umbrella.blurb}</p>
                    <div className="space-y-2">
                        {umb.length ? umb.map(i => <ItemRow key={i.id} item={i} state={state} now={now} onOpen={onOpenItem} contextCell={ck} onToggleCell={onToggleCell} />) : <p className="text-xs text-muted-foreground italic">None in this cell.</p>}
                    </div>
                </section>
                <section>
                    <h3 className="text-sm font-semibold flex items-center gap-1.5 mb-1"><TypeGlyph type="local" size={14} /> Local work ({local.length})</h3>
                    <p className="text-[11px] text-muted-foreground mb-2">{WORK_TYPES.local.blurb}</p>
                    {byEnv.length ? byEnv.map(g => (
                        <div key={g.e.id} className="mb-3">
                            <div className="text-[11px] font-semibold text-muted-foreground mb-1">{g.e.name}</div>
                            <div className="space-y-2">{g.its.map(i => <ItemRow key={i.id} item={i} state={state} now={now} onOpen={onOpenItem} contextCell={ck} onToggleCell={onToggleCell} />)}</div>
                        </div>
                    )) : <p className="text-xs text-muted-foreground italic">None in this cell.</p>}
                </section>
                {hiddenByFilter > 0 && <p className="text-[11px] text-muted-foreground">{hiddenByFilter} more item{hiddenByFilter === 1 ? '' : 's'} in this cell hidden by the current filters.</p>}
            </div>
        </aside>
    );
}

function CellGridPicker({ cells, cellDone, type = 'umbrella', onChange }) {
    const set = new Set(cells);
    const apply = (keys) => {
        const allOn = keys.every(k => set.has(k));
        const n = new Set(set);
        keys.forEach(k => allOn ? n.delete(k) : n.add(k));
        onChange([...n]);
    };
    return (
        <div className="overflow-x-auto">
            <table className="text-[11px]" style={{ borderSpacing: 2, borderCollapse: 'separate' }}>
                <thead>
                    <tr>
                        <th />
                        {CSF_FUNCTIONS.map(f => (
                            <th key={f.id} className="px-0.5">
                                <button type="button" onClick={() => apply(CLUSTERS.map(c => cellKey(c.id, f.id)))} className="w-9 font-semibold rounded hover:bg-accent py-0.5" title={`Toggle the whole ${f.label} column`} style={{ color: f.color }}>{f.id}</button>
                            </th>
                        ))}
                    </tr>
                </thead>
                <tbody>
                    {CLUSTERS.map(c => (
                        <tr key={c.id}>
                            <th className="text-left pr-1 font-normal whitespace-nowrap">
                                <button type="button" onClick={() => apply(CSF_FUNCTIONS.map(f => cellKey(c.id, f.id)))} className="rounded hover:bg-accent px-1 py-0.5 text-left" title={`Toggle the whole #${c.id} row`}>#{c.id} {c.name}</button>
                            </th>
                            {CSF_FUNCTIONS.map(f => {
                                const ck = cellKey(c.id, f.id);
                                const on = set.has(ck);
                                const done = on && cellDone && cellDone[ck];
                                return (
                                    <td key={f.id}>
                                        <button type="button" onClick={() => apply([ck])} aria-pressed={on} aria-label={`#${c.id} ${f.label}${done ? ', done' : ''}`}
                                                title={done ? 'Covered, done in this cell' : on ? 'Covered' : 'Not covered'}
                                                className={`w-9 h-6 rounded border flex items-center justify-center focus:outline-none focus-visible:ring-2 focus-visible:ring-ring ${on ? 'border-transparent text-white' : 'border-border hover:bg-accent'}`}
                                                style={on ? { background: done ? '#16a34a' : `hsl(var(--${type}))` } : undefined}>
                                            {on && <Icon name={done ? 'check-check' : 'check'} size={12} />}
                                        </button>
                                    </td>
                                );
                            })}
                        </tr>
                    ))}
                </tbody>
            </table>
        </div>
    );
}

function Field({ label, children, className = '' }) {
    return <label className={`block ${className}`}><span className="field-label">{label}</span>{children}</label>;
}

function ItemEditor({ item, isNew, state, onSave, onDelete, onDuplicate, onClose }) {
    const [d, setD] = useState(() => JSON.parse(JSON.stringify(item)));
    const [newCheck, setNewCheck] = useState('');
    const [newUpdate, setNewUpdate] = useState({ date: todayISO(), text: '' });
    const dirty = JSON.stringify(d) !== JSON.stringify(item);
    const set = (k, v) => setD(x => ({ ...x, [k]: v }));
    const close = () => { if (!dirty || window.confirm('Discard the changes to this work item?')) onClose(); };
    useEffect(() => {
        const h = (e) => { if (e.key === 'Escape') { e.stopPropagation(); close(); } };
        document.addEventListener('keydown', h);
        return () => document.removeEventListener('keydown', h);
    });
    const setType = (t) => setD(x => ({ ...x, type: t, envId: t === 'local' ? (x.envId || state.environments[0]?.id || '') : '', scope: t === 'umbrella' ? (x.scope || 'all') : '' }));
    const setCells = (cells) => setD(x => {
        const cd = Object.fromEntries(Object.entries(x.cellDone || {}).filter(([ck]) => cells.includes(ck)));
        // a Done item stays Done only while every covered cell is done
        const status = x.status === 'done' && cells.length > 1 && cells.some(ck => !cd[ck]) ? 'in-progress' : x.status;
        return { ...x, cells, cellDone: cd, status };
    });
    const toggleDone = (ck) => setD(x => {
        const cd = { ...(x.cellDone || {}) };
        if (cd[ck]) delete cd[ck]; else cd[ck] = todayISO();
        const status = x.status === 'done' && !cd[ck] ? 'in-progress' : x.status;
        return { ...x, cellDone: cd, status };
    });
    const setAllDone = (on) => setD(x => ({ ...x, cellDone: on ? Object.fromEntries(x.cells.map(ck => [ck, (x.cellDone || {})[ck] || todayISO()])) : {}, status: !on && x.status === 'done' ? 'in-progress' : x.status }));
    const openCells = d.cells.filter(ck => !(d.cellDone || {})[ck]);
    // a single cell closes together with the item; several cells must each be set done first
    const doneBlocked = d.cells.length > 1 && openCells.length > 0;
    const candidates = state.items.filter(i => i.id !== d.id && !(d.dependsOn || []).includes(i.id));
    const byId = Object.fromEntries(state.items.map(i => [i.id, i]));
    const canSave = d.title.trim() && d.cells.length > 0;
    const prog = baseProgress(d);

    return (
        <div className="modal-overlay" onMouseDown={e => { if (e.target === e.currentTarget) close(); }}>
            <div className="modal-content max-w-3xl" role="dialog" aria-modal="true" aria-label={isNew ? 'New work item' : `Edit ${item.key}`}>
                <div className="flex items-center justify-between gap-3 mb-4">
                    <h2 className="font-display font-bold text-lg flex items-center gap-2"><span className="font-mono text-sm text-muted-foreground">{d.key}</span>{isNew ? 'New work item' : 'Edit work item'}</h2>
                    <button onClick={close} className="app-btn app-btn-ghost app-btn-sm" aria-label="Close"><Icon name="x" size={18} /></button>
                </div>

                <div className="grid grid-cols-2 gap-2 mb-4" role="radiogroup" aria-label="Work type">
                    {['local', 'umbrella'].map(t => (
                        <button key={t} type="button" role="radio" aria-checked={d.type === t} onClick={() => setType(t)}
                                className={`text-left rounded-lg border-2 px-3 py-2 focus:outline-none focus-visible:ring-2 focus-visible:ring-ring ${d.type === t ? '' : 'border-border opacity-70 hover:opacity-100'}`}
                                style={d.type === t ? { borderColor: `hsl(var(--${t}))` } : undefined}>
                            <TypeGlyph type={t} size={15} withLabel />
                            <span className="block text-[11px] text-muted-foreground mt-0.5">{WORK_TYPES[t].blurb}</span>
                        </button>
                    ))}
                </div>

                <div className="space-y-3">
                    <Field label="Title"><input autoFocus className="input-ctrl" value={d.title} onChange={e => set('title', e.target.value)} placeholder="What will be delivered" /></Field>

                    <div>
                        <div className="flex flex-wrap items-end justify-between gap-3 mb-1">
                            <span className="field-label mb-0">Cells covered ({d.cells.length}) — click a cell, or a cluster or function to toggle its row or column</span>
                            {d.type === 'local' ? (
                                <Field label="Environment" className="w-48">
                                    <select className="input-ctrl py-1" value={d.envId} onChange={e => set('envId', e.target.value)}>
                                        {state.environments.map(e => <option key={e.id} value={e.id}>{e.name}</option>)}
                                    </select>
                                </Field>
                            ) : (
                                <Field label="Scope" className="w-48">
                                    <select className="input-ctrl py-1" value={d.scope} onChange={e => set('scope', e.target.value)}>
                                        {SHARED_SCOPES.map(s => <option key={s.id} value={s.id}>{s.label}</option>)}
                                    </select>
                                </Field>
                            )}
                        </div>
                        <CellGridPicker cells={d.cells} cellDone={d.cellDone} type={d.type} onChange={setCells} />
                    </div>
                    {!d.cells.length && <p className="text-xs text-red-600 dark:text-red-400">Choose at least one matrix cell.</p>}
                    {d.cells.length > 1 && (
                        <div className="rounded-lg border border-border p-3">
                            <div className="flex flex-wrap items-center gap-2 mb-2">
                                <span className="text-xs font-semibold">Done per cell</span>
                                <span className="text-[11px] text-muted-foreground">{d.cells.length - openCells.length} of {d.cells.length} done. A cell shows this item as done only once it is ticked here; the item can be set to Done only when every cell is.</span>
                                <span className="ml-auto flex gap-1">
                                    <button type="button" onClick={() => setAllDone(true)} className="app-btn app-btn-ghost app-btn-xs">All done</button>
                                    <button type="button" onClick={() => setAllDone(false)} className="app-btn app-btn-ghost app-btn-xs">None</button>
                                </span>
                            </div>
                            <div className="flex flex-wrap gap-1.5">
                                {d.cells.slice().sort((a, b) => { const x = parseCell(a), y = parseCell(b); return x.clusterId - y.clusterId || CSF_FUNCTIONS.findIndex(f => f.id === x.funcId) - CSF_FUNCTIONS.findIndex(f => f.id === y.funcId); }).map(ck => {
                                    const done = !!(d.cellDone || {})[ck];
                                    return (
                                        <label key={ck} className={`chip cursor-pointer border ${done ? 'bg-green-500/10 text-green-700 dark:text-green-400 border-green-500/40' : 'border-border text-foreground'}`} title={done ? `Done on ${fmtDate(d.cellDone[ck])}` : 'Open'}>
                                            <input type="checkbox" checked={done} onChange={() => toggleDone(ck)} className="accent-green-600 w-3 h-3" />
                                            <span className="font-mono">{cellLabel(ck)}</span>
                                        </label>
                                    );
                                })}
                            </div>
                        </div>
                    )}

                    <div className="grid sm:grid-cols-3 gap-3">
                        <Field label="Control delivered"><input className="input-ctrl" value={d.control} onChange={e => set('control', e.target.value)} placeholder="e.g. EDR, patch SLA" /></Field>
                        <Field label="Owner"><input className="input-ctrl" value={d.owner} onChange={e => set('owner', e.target.value)} list="cwp-owners" placeholder="Accountable person or role" /></Field>
                        <Field label="Team"><input className="input-ctrl" value={d.team} onChange={e => set('team', e.target.value)} /></Field>
                    </div>
                    <datalist id="cwp-owners">{[...new Set(state.items.map(i => i.owner).filter(Boolean))].map(o => <option key={o} value={o} />)}</datalist>

                    <div className="grid grid-cols-2 sm:grid-cols-4 gap-3">
                        <Field label="Status">
                            <select className="input-ctrl" value={d.status} onChange={e => set('status', e.target.value)}>
                                {STATUSES.map(s => <option key={s.id} value={s.id} disabled={s.id === 'done' && doneBlocked}>{s.id === 'done' && doneBlocked ? `Done (${openCells.length} cell${openCells.length === 1 ? '' : 's'} still open)` : s.label}</option>)}
                            </select>
                        </Field>
                        <Field label="Priority">
                            <select className="input-ctrl" value={d.priority} onChange={e => set('priority', e.target.value)}>
                                {PRIORITIES.map(p => <option key={p.id} value={p.id}>{p.label}</option>)}
                            </select>
                        </Field>
                        <Field label="Start"><input type="date" className="input-ctrl" value={d.startDate} onChange={e => set('startDate', e.target.value)} /></Field>
                        <Field label="Due"><input type="date" className="input-ctrl" value={d.dueDate} onChange={e => set('dueDate', e.target.value)} /></Field>
                    </div>
                    {d.startDate && d.dueDate && d.dueDate < d.startDate && <p className="text-xs text-red-600 dark:text-red-400">The due date is before the start date.</p>}

                    <div className="grid grid-cols-2 sm:grid-cols-4 gap-3">
                        <Field label="Milestone">
                            <select className="input-ctrl" value={d.milestoneId} onChange={e => set('milestoneId', e.target.value)}>
                                <option value="">None</option>
                                {state.milestones.map(m => <option key={m.id} value={m.id}>{m.name}{m.date ? ` (${fmtShort(m.date)})` : ''}</option>)}
                            </select>
                        </Field>
                        <Field label="Effort estimate (person-days)"><input type="number" min="0" step="0.5" className="input-ctrl" value={d.effortEst} onChange={e => set('effortEst', e.target.value === '' ? '' : Number(e.target.value))} /></Field>
                        <Field label="Effort spent (person-days)"><input type="number" min="0" step="0.5" className="input-ctrl" value={d.effortActual} onChange={e => set('effortActual', e.target.value === '' ? '' : Number(e.target.value))} /></Field>
                        <Field label="Cost (budget)"><input type="number" min="0" step="100" className="input-ctrl" value={d.cost} onChange={e => set('cost', e.target.value === '' ? '' : Number(e.target.value))} /></Field>
                    </div>

                    <div className="grid sm:grid-cols-3 gap-3 items-end">
                        <Field label={`Progress ${(d.checklist || []).length ? '(from the checklist)' : ''}: ${d.status === 'done' ? 100 : prog}%${d.cells.length > 1 && d.status !== 'done' ? ` — item ${itemProgress(d)}% with done cells` : ''}`}>
                            <input type="range" min="0" max="100" step="5" className="w-full accent-green-600" disabled={(d.checklist || []).length > 0 || d.status === 'done'}
                                   value={d.status === 'done' ? 100 : prog} onChange={e => set('progress', Number(e.target.value))} />
                        </Field>
                        <Field label="Control maturity now">
                            <select className="input-ctrl" value={d.maturityFrom} onChange={e => set('maturityFrom', e.target.value === '' ? '' : Number(e.target.value))}>
                                <option value="">Not stated</option>
                                {MATURITY_LEVELS.map((l, k) => <option key={k} value={k}>{k} {l}</option>)}
                            </select>
                        </Field>
                        <Field label="Maturity when delivered">
                            <select className="input-ctrl" value={d.maturityTo} onChange={e => set('maturityTo', e.target.value === '' ? '' : Number(e.target.value))}>
                                <option value="">Not stated</option>
                                {MATURITY_LEVELS.map((l, k) => <option key={k} value={k}>{k} {l}</option>)}
                            </select>
                        </Field>
                    </div>

                    <Field label="Description"><textarea rows="3" className="input-ctrl" value={d.description} onChange={e => set('description', e.target.value)} placeholder="Scope, acceptance criteria, evidence expected" /></Field>

                    <div>
                        <span className="field-label">Checklist</span>
                        <div className="space-y-1">
                            {(d.checklist || []).map(ci => (
                                <div key={ci.id} className="flex items-center gap-2">
                                    <input type="checkbox" checked={ci.done} onChange={e => set('checklist', d.checklist.map(x => x.id === ci.id ? { ...x, done: e.target.checked } : x))} className="accent-green-600 w-4 h-4" aria-label="Done" />
                                    <input className="input-ctrl py-1" value={ci.text} onChange={e => set('checklist', d.checklist.map(x => x.id === ci.id ? { ...x, text: e.target.value } : x))} />
                                    <button type="button" onClick={() => set('checklist', d.checklist.filter(x => x.id !== ci.id))} className="app-btn app-btn-ghost app-btn-xs" aria-label="Remove step"><Icon name="x" size={13} /></button>
                                </div>
                            ))}
                            <form className="flex items-center gap-2" onSubmit={e => { e.preventDefault(); if (!newCheck.trim()) return; set('checklist', [...(d.checklist || []), { id: genId('k'), text: newCheck.trim(), done: false }]); setNewCheck(''); }}>
                                <input className="input-ctrl py-1" value={newCheck} onChange={e => setNewCheck(e.target.value)} placeholder="Add a step and press Enter" />
                                <button type="submit" className="app-btn app-btn-outline app-btn-xs"><Icon name="plus" size={12} /> Add</button>
                            </form>
                        </div>
                    </div>

                    <div>
                        <span className="field-label">Depends on (must finish first)</span>
                        <div className="flex flex-wrap gap-1.5 mb-1.5">
                            {(d.dependsOn || []).map(id => byId[id] && (
                                <span key={id} className="chip bg-secondary text-foreground border border-border">
                                    <span className="font-mono">{byId[id].key}</span> {byId[id].title.length > 40 ? byId[id].title.slice(0, 40) + '…' : byId[id].title}
                                    <button type="button" onClick={() => set('dependsOn', d.dependsOn.filter(x => x !== id))} aria-label={`Remove dependency ${byId[id].key}`}><Icon name="x" size={11} /></button>
                                </span>
                            ))}
                        </div>
                        {candidates.length > 0 && (
                            <select className="input-ctrl py-1 text-xs" value="" onChange={e => e.target.value && set('dependsOn', [...(d.dependsOn || []), e.target.value])}>
                                <option value="">Add a prerequisite…</option>
                                {candidates.map(i => <option key={i.id} value={i.id}>{i.key} {i.title}</option>)}
                            </select>
                        )}
                    </div>

                    <div className="grid sm:grid-cols-2 gap-3">
                        <Field label="Tags (comma-separated)"><input className="input-ctrl" value={(d.tags || []).join(', ')} onChange={e => set('tags', e.target.value.split(',').map(s => s.trim()).filter(Boolean))} /></Field>
                        <Field label="Link (ticket, epic, document)"><input type="url" className="input-ctrl" value={d.link} onChange={e => set('link', e.target.value)} placeholder="https://" /></Field>
                    </div>

                    <div>
                        <span className="field-label">Status updates</span>
                        <form className="flex flex-wrap items-center gap-2 mb-2" onSubmit={e => { e.preventDefault(); if (!newUpdate.text.trim()) return; set('updates', [{ id: genId('u'), date: newUpdate.date || todayISO(), text: newUpdate.text.trim() }, ...(d.updates || [])]); setNewUpdate({ date: todayISO(), text: '' }); }}>
                            <input type="date" className="input-ctrl py-1 w-36" value={newUpdate.date} onChange={e => setNewUpdate(u => ({ ...u, date: e.target.value }))} aria-label="Update date" />
                            <input className="input-ctrl py-1 flex-1 min-w-[12rem]" value={newUpdate.text} onChange={e => setNewUpdate(u => ({ ...u, text: e.target.value }))} placeholder="What changed since the last update" />
                            <button type="submit" className="app-btn app-btn-outline app-btn-xs"><Icon name="plus" size={12} /> Add update</button>
                        </form>
                        <ul className="space-y-1">
                            {(d.updates || []).slice().sort((a, b) => a.date < b.date ? 1 : -1).map(u => (
                                <li key={u.id} className="text-xs flex gap-2 items-start">
                                    <span className="text-muted-foreground tabular-nums whitespace-nowrap">{fmtShort(u.date)}</span>
                                    <span className="flex-1">{u.text}</span>
                                    <button type="button" onClick={() => set('updates', d.updates.filter(x => x.id !== u.id))} className="text-muted-foreground hover:text-foreground" aria-label="Remove update"><Icon name="x" size={11} /></button>
                                </li>
                            ))}
                        </ul>
                    </div>
                    {d.source && d.source.tool === 'control-matrix' && <p className="text-[11px] text-muted-foreground">Imported from a Control Matrix export.</p>}
                </div>

                <div className="flex flex-wrap items-center gap-2 mt-5 pt-4 border-t border-border">
                    {!isNew && <button onClick={() => { if (window.confirm(`Delete ${item.key}? This cannot be undone.`)) onDelete(item.id); }} className="app-btn app-btn-ghost app-btn-sm text-red-600 dark:text-red-400"><Icon name="trash-2" size={13} /> Delete</button>}
                    {!isNew && <button onClick={() => onDuplicate(d)} className="app-btn app-btn-ghost app-btn-sm"><Icon name="copy" size={13} /> Duplicate</button>}
                    <span className="ml-auto" />
                    <button onClick={close} className="app-btn app-btn-outline app-btn-sm">Cancel</button>
                    <button onClick={() => canSave && onSave(d)} disabled={!canSave} className="app-btn app-btn-primary app-btn-sm disabled:opacity-40">{isNew ? 'Add work item' : 'Save changes'}</button>
                </div>
            </div>
        </div>
    );
}

// BOARD VIEW
// ═══════════════════════════════════════════════════════════════════

function BoardCard({ item, state, now, onOpen, onDragStart }) {
    const overdue = !isClosed(item) && item.dueDate && item.dueDate < now;
    return (
        <div draggable onDragStart={e => { e.dataTransfer.setData('text/plain', item.id); e.dataTransfer.effectAllowed = 'move'; onDragStart(item.id); }}
             onClick={() => onOpen(item.id)} onKeyDown={e => { if (e.key === 'Enter') onOpen(item.id); }} tabIndex={0} role="button" aria-label={`${item.key} ${item.title}`}
             className={`rounded-lg border bg-card px-2.5 py-2 cursor-grab active:cursor-grabbing hover:shadow-md focus:outline-none focus-visible:ring-2 focus-visible:ring-ring ${overdue ? 'border-red-400/70' : 'border-border'}`}>
            <div className="flex items-center gap-1.5">
                <TypeGlyph type={item.type} size={13} />
                <span className="font-mono text-[10px] text-muted-foreground">{item.key}</span>
                <span className="ml-auto flex items-center gap-1.5"><RagDot rag={itemRag(item, now)} /><PriorityBadge priority={item.priority} /></span>
            </div>
            <div className="text-[13px] font-medium leading-snug mt-1">{item.title}</div>
            <div className="text-[10px] text-muted-foreground mt-1 flex flex-wrap gap-x-2"><span>{(item.cells || []).length > 3 ? summariseCells(item.cells) : (item.cells || []).map(cellLabel).join(', ')}</span><CellTally item={item} /></div>
            <div className="flex items-center justify-between text-[10px] text-muted-foreground mt-1.5 gap-2">
                <span className="truncate">{itemOwner(item)}</span>
                <span className={`whitespace-nowrap ${overdue ? 'text-red-600 dark:text-red-400 font-semibold' : ''}`}>{item.dueDate ? fmtShort(item.dueDate) : 'no date'}</span>
            </div>
            {!isClosed(item) && <ProgressBar value={itemProgress(item)} className="mt-1.5" />}
        </div>
    );
}

function BoardView({ items, state, now, onOpen, onMove }) {
    const [split, setSplit] = useState(true);
    const [showCancelled, setShowCancelled] = useState(false);
    const [dragId, setDragId] = useState(null);
    const [over, setOver] = useState(null);
    const cols = STATUSES.filter(s => showCancelled || s.id !== 'cancelled');
    const lanes = split ? ['umbrella', 'local'] : ['all'];
    return (
        <div className="px-4 sm:px-6 py-4">
            <div className="flex flex-wrap items-center gap-4 mb-3 text-xs">
                <label className="inline-flex items-center gap-1.5"><input type="checkbox" checked={split} onChange={e => setSplit(e.target.checked)} className="accent-blue-600" /> Separate Umbrella and Local lanes</label>
                <label className="inline-flex items-center gap-1.5"><input type="checkbox" checked={showCancelled} onChange={e => setShowCancelled(e.target.checked)} className="accent-blue-600" /> Show cancelled</label>
                <span className="text-muted-foreground">Drag a card to another column to change its status.</span>
            </div>
            {lanes.map(lane => {
                const laneItems = lane === 'all' ? items : items.filter(i => i.type === lane);
                return (
                    <section key={lane} className="mb-5">
                        {lane !== 'all' && <h3 className="text-sm font-semibold mb-2 flex items-center gap-1.5"><TypeGlyph type={lane} size={15} withLabel /><span className="text-muted-foreground font-normal">work ({laneItems.length})</span></h3>}
                        <div className="flex gap-3 overflow-x-auto pb-2">
                            {cols.map(col => {
                                const its = laneItems.filter(i => i.status === col.id).sort((a, b) => a.priority.localeCompare(b.priority) || sortByDue(a, b));
                                const zone = `${lane}|${col.id}`;
                                return (
                                    <div key={col.id}
                                         onDragOver={e => { e.preventDefault(); if (over !== zone) setOver(zone); }}
                                         onDragLeave={() => setOver(o => o === zone ? null : o)}
                                         onDrop={e => { e.preventDefault(); const id = e.dataTransfer.getData('text/plain') || dragId; setOver(null); setDragId(null); if (id) onMove(id, col.id); }}
                                         className={`board-col flex-shrink-0 w-64 rounded-xl bg-muted/60 border border-border p-2 ${over === zone ? 'drag-over' : ''}`}>
                                        <div className="flex items-center gap-1.5 px-1 pb-2 text-xs font-semibold">
                                            <span className="w-2 h-2 rounded-full" style={{ background: col.color }} />{col.label}
                                            <span className="ml-auto text-muted-foreground tabular-nums">{its.length}</span>
                                        </div>
                                        <div className="space-y-2 min-h-[48px]">
                                            {its.map(i => <BoardCard key={i.id} item={i} state={state} now={now} onOpen={onOpen} onDragStart={setDragId} />)}
                                        </div>
                                    </div>
                                );
                            })}
                        </div>
                    </section>
                );
            })}
        </div>
    );
}

// LIST VIEW
// ═══════════════════════════════════════════════════════════════════

function ListView({ items, state, now, onOpen, onPatch }) {
    const [sort, setSort] = useState({ key: 'key', dir: 1 });
    const accessor = {
        key: i => Number(String(i.key).replace(/\D/g, '')) || 0,
        type: i => i.type, title: i => i.title.toLowerCase(), owner: i => itemOwner(i).toLowerCase(),
        status: i => STATUSES.findIndex(s => s.id === i.status), priority: i => i.priority,
        rag: i => ({ red: 0, amber: 1, green: 2, done: 3 })[itemRag(i, now)] ?? 4,
        due: i => i.dueDate || '9999', progress: i => itemProgress(i), effort: i => num(i.effortEst), cells: i => (i.cells || []).length,
    };
    const sorted = items.slice().sort((a, b) => { const x = accessor[sort.key](a), y = accessor[sort.key](b); return (x < y ? -1 : x > y ? 1 : 0) * sort.dir; });
    const H = ({ k, children, className = '' }) => (
        <th className={`th ${className}`} aria-sort={sort.key === k ? (sort.dir > 0 ? 'ascending' : 'descending') : 'none'}>
            <button onClick={() => setSort(s => ({ key: k, dir: s.key === k ? -s.dir : 1 }))} className="inline-flex items-center gap-1 hover:text-foreground">
                {children}{sort.key === k && <Icon name={sort.dir > 0 ? 'arrow-up' : 'arrow-down'} size={11} />}
            </button>
        </th>
    );
    return (
        <div className="px-4 sm:px-6 py-4">
            <div className="overflow-x-auto rounded-xl border border-border bg-card">
                <table className="w-full text-sm" style={{ minWidth: 980 }}>
                    <thead><tr>
                        <H k="key">Key</H><H k="type">Type</H><H k="title">Work item</H><H k="cells">Cells</H><H k="owner">Owner</H>
                        <H k="status">Status</H><H k="priority">Prio</H><H k="rag">RAG</H><H k="due">Due</H><H k="progress">Progress</H><H k="effort" className="text-right">Effort</H>
                    </tr></thead>
                    <tbody>
                        {sorted.map(i => {
                            const overdue = !isClosed(i) && i.dueDate && i.dueDate < now;
                            return (
                                <tr key={i.id} className={`hover:bg-accent/50 ${i.status === 'cancelled' ? 'opacity-60' : ''}`}>
                                    <td className="td font-mono text-xs whitespace-nowrap"><button onClick={() => onOpen(i.id)} className="hover:underline">{i.key}</button></td>
                                    <td className="td"><TypeGlyph type={i.type} size={14} /></td>
                                    <td className="td max-w-[22rem]"><button onClick={() => onOpen(i.id)} className="text-left font-medium hover:underline">{i.title}</button><div className="text-[11px] text-muted-foreground">{whereLabel(state, i)}{i.control ? ` — ${i.control}` : ''}</div></td>
                                    <td className="td text-[11px] text-muted-foreground max-w-[12rem]">{(i.cells || []).length > 3 ? summariseCells(i.cells) : (i.cells || []).map(cellLabel).join(', ')}<div><CellTally item={i} /></div></td>
                                    <td className="td text-xs whitespace-nowrap">{itemOwner(i)}</td>
                                    <td className="td">
                                        <select aria-label={`Status of ${i.key}`} value={i.status} onChange={e => onPatch(i.id, { status: e.target.value })}
                                                className="bg-transparent text-xs font-semibold rounded border border-border px-1 py-0.5" style={{ color: STATUS[i.status].color }}>
                                            {STATUSES.map(s => <option key={s.id} value={s.id}>{s.label}</option>)}
                                        </select>
                                    </td>
                                    <td className="td"><PriorityBadge priority={i.priority} /></td>
                                    <td className="td"><RagDot rag={itemRag(i, now)} withLabel /></td>
                                    <td className={`td text-xs whitespace-nowrap tabular-nums ${overdue ? 'text-red-600 dark:text-red-400 font-semibold' : ''}`}>{fmtDate(i.dueDate)}</td>
                                    <td className="td w-28"><ProgressBar value={itemProgress(i)} /><span className="text-[10px] text-muted-foreground tabular-nums">{itemProgress(i)}%</span></td>
                                    <td className="td text-xs text-right tabular-nums">{i.effortEst === '' ? '—' : i.effortEst}</td>
                                </tr>
                            );
                        })}
                        {!sorted.length && <tr><td colSpan="11" className="td text-center text-muted-foreground py-8">No work items match the filters.</td></tr>}
                    </tbody>
                </table>
            </div>
        </div>
    );
}

// TIMELINE VIEW
// ═══════════════════════════════════════════════════════════════════

const TIMELINE_GROUPS = [
    { id: 'function', label: 'CSF function' }, { id: 'cluster', label: 'Cluster' }, { id: 'type', label: 'Local / Umbrella' },
    { id: 'owner', label: 'Owner' }, { id: 'milestone', label: 'Milestone' }, { id: 'none', label: 'No grouping' },
];

function groupOf(it, by, state) {
    const cells = it.cells || [];
    if (by === 'function') { const fs = [...new Set(cells.map(ck => parseCell(ck).funcId))]; return fs.length === 1 ? { k: 'a' + CSF_FUNCTIONS.findIndex(f => f.id === fs[0]), label: funcOf(fs[0]).label } : { k: 'z', label: 'Several functions' }; }
    if (by === 'cluster') { const cs = [...new Set(cells.map(ck => parseCell(ck).clusterId))]; return cs.length === 1 ? { k: 'a' + String(cs[0]).padStart(2, '0'), label: `#${cs[0]} ${clusterOf(cs[0]).name}` } : { k: 'z', label: 'Several clusters' }; }
    if (by === 'type') return it.type === 'umbrella' ? { k: 'a', label: 'Umbrella work' } : { k: 'b', label: 'Local work' };
    if (by === 'owner') { const o = itemOwner(it); return { k: o === 'Unassigned' ? '~' : o.toLowerCase(), label: o }; }
    if (by === 'milestone') { const m = state.milestones.find(x => x.id === it.milestoneId); return m ? { k: (m.date || '9999') + m.id, label: m.name } : { k: '~', label: 'No milestone' }; }
    return { k: 'a', label: '' };
}

function TimelineView({ items, state, now, onOpen }) {
    const [zoom, setZoom] = useState('month');
    const [by, setBy] = useState('function');
    const PX = { week: 22, month: 7, quarter: 2.6 }[zoom];
    const live = items.filter(isLive);
    const dated = live.filter(i => i.startDate || i.dueDate);
    const undated = live.filter(i => !i.startDate && !i.dueDate);
    const dates = [now, state.programme.startDate, state.programme.endDate, ...dated.flatMap(i => [i.startDate, i.dueDate]), ...state.milestones.map(m => m.date)].filter(Boolean);
    const lo = dates.reduce((a, b) => a < b ? a : b);
    const hi = dates.reduce((a, b) => a > b ? a : b);
    const start = addDays(lo, -7).slice(0, 8) + '01';
    const end = addDays(hi, 21);
    const width = (daysBetween(start, end) + 1) * PX;
    const x = (iso) => daysBetween(start, iso) * PX;
    const months = [];
    for (let m = start; m <= end;) { months.push(m); const d = new Date(m + 'T00:00:00Z'); d.setUTCMonth(d.getUTCMonth() + 1); m = d.toISOString().slice(0, 10); }
    const groups = {};
    dated.forEach(i => { const g = groupOf(i, by, state); (groups[g.k] = groups[g.k] || { label: g.label, items: [] }).items.push(i); });
    const order = Object.keys(groups).sort();
    order.forEach(k => groups[k].items.sort((a, b) => (a.startDate || a.dueDate) < (b.startDate || b.dueDate) ? -1 : 1));
    const LABEL_W = 260;
    const Grid = () => <>
        {months.map(m => <span key={m} className="absolute top-0 bottom-0 border-l border-border/70" style={{ left: x(m) }} />)}
        <span className="absolute top-0 bottom-0 border-l-2 border-red-500/70" style={{ left: x(now) }} />
    </>;
    return (
        <div className="px-4 sm:px-6 py-4">
            <div className="flex flex-wrap items-center gap-3 mb-3 text-xs">
                <span className="text-muted-foreground">Group by</span>
                <Select label="Group by" value={by} onChange={setBy}>{TIMELINE_GROUPS.map(g => <option key={g.id} value={g.id}>{g.label}</option>)}</Select>
                <span className="text-muted-foreground ml-2">Scale</span>
                <div className="inline-flex rounded-lg border border-border p-0.5" role="radiogroup" aria-label="Scale">
                    {['week', 'month', 'quarter'].map(z => <button key={z} role="radio" aria-checked={zoom === z} onClick={() => setZoom(z)} className={`px-2 py-1 rounded-md font-medium capitalize ${zoom === z ? 'bg-secondary text-foreground' : 'text-muted-foreground hover:text-foreground'}`}>{z}s</button>)}
                </div>
                <span className="inline-flex items-center gap-1 text-muted-foreground ml-auto"><span className="w-3 border-t-2 border-red-500" /> today</span>
                <span className="inline-flex items-center gap-1 text-muted-foreground"><Icon name="diamond" size={11} /> milestone or due date without start</span>
            </div>
            <div className="overflow-x-auto rounded-xl border border-border bg-card">
                <div style={{ width: LABEL_W + width, minWidth: '100%' }}>
                    <div className="flex border-b border-border sticky top-0 bg-card z-10">
                        <div className="sticky left-0 bg-card z-10 border-r border-border px-3 py-2 text-[11px] font-semibold text-muted-foreground flex-shrink-0" style={{ width: LABEL_W }}>Work item</div>
                        <div className="relative h-8 flex-shrink-0" style={{ width }}>
                            {months.map(m => <span key={m} className="absolute top-0 h-full border-l border-border/70 pl-1 text-[10px] text-muted-foreground pt-2 whitespace-nowrap" style={{ left: x(m) }}>{new Date(m + 'T00:00:00Z').toLocaleDateString(undefined, { month: 'short', year: zoom === 'quarter' || m.slice(5, 7) === '01' ? '2-digit' : undefined, timeZone: 'UTC' })}</span>)}
                        </div>
                    </div>
                    {state.milestones.some(m => m.date) && (
                        <div className="flex border-b border-border bg-muted/40">
                            <div className="sticky left-0 bg-muted z-10 border-r border-border px-3 py-1.5 text-[11px] font-semibold flex-shrink-0 flex items-center gap-1" style={{ width: LABEL_W }}><Icon name="flag" size={12} /> Milestones</div>
                            <div className="relative h-9 flex-shrink-0" style={{ width }}>
                                <Grid />
                                {state.milestones.filter(m => m.date).map(m => {
                                    const st = milestoneStatus(m, state.items, now);
                                    return <span key={m.id} className="absolute top-1.5 -translate-x-1/2 flex flex-col items-center" style={{ left: x(m.date) + PX / 2 }} title={`${m.name}: ${fmtDate(m.date)}, ${st.label}`}>
                                        <span className="w-3 h-3 rotate-45" style={{ background: st.color }} />
                                        <span className="text-[9px] font-semibold whitespace-nowrap mt-0.5 max-w-[140px] truncate">{m.name}</span>
                                    </span>;
                                })}
                            </div>
                        </div>
                    )}
                    {order.map(k => (
                        <React.Fragment key={k}>
                            {by !== 'none' && (
                                <div className="flex border-b border-border bg-secondary/60">
                                    <div className="sticky left-0 bg-secondary z-10 border-r border-border px-3 py-1 text-xs font-semibold flex-shrink-0" style={{ width: LABEL_W }}>{groups[k].label} <span className="text-muted-foreground font-normal">({groups[k].items.length})</span></div>
                                    <div className="relative flex-shrink-0" style={{ width }}><Grid /></div>
                                </div>
                            )}
                            {groups[k].items.map(i => {
                                const s = i.startDate || i.dueDate, e = i.dueDate || i.startDate;
                                const left = x(s), w = Math.max(PX, x(e) - left + PX);
                                const color = STATUS[i.status].color;
                                const overdue = !isClosed(i) && i.dueDate && i.dueDate < now;
                                const point = !i.startDate || !i.dueDate;
                                return (
                                    <div key={i.id} className="flex border-b border-border/60 hover:bg-accent/40">
                                        <button onClick={() => onOpen(i.id)} className="sticky left-0 bg-card z-10 border-r border-border px-3 py-1.5 text-left flex items-center gap-1.5 flex-shrink-0 hover:bg-accent" style={{ width: LABEL_W }} title={i.title}>
                                            <TypeGlyph type={i.type} size={12} />
                                            <span className="font-mono text-[10px] text-muted-foreground whitespace-nowrap">{i.key}</span>
                                            <span className="text-xs truncate">{i.title}</span>
                                        </button>
                                        <div className="relative h-8 flex-shrink-0" style={{ width }}>
                                            <Grid />
                                            {point ? (
                                                <button onClick={() => onOpen(i.id)} className="absolute top-2.5 w-3 h-3 rotate-45 -translate-x-1/2" style={{ left: x(e) + PX / 2, background: color }} title={`${i.key}: ${i.startDate ? 'starts' : 'due'} ${fmtDate(e)}`} aria-label={`${i.key} ${fmtDate(e)}`} />
                                            ) : (
                                                <button onClick={() => onOpen(i.id)} className={`absolute top-2 h-4 rounded overflow-hidden ${overdue ? 'ring-2 ring-red-500' : ''}`}
                                                        style={{ left, width: w, background: color + '40' }} title={`${i.key} ${i.title}: ${fmtDate(i.startDate)} – ${fmtDate(i.dueDate)}, ${itemProgress(i)}%`} aria-label={`${i.key} from ${fmtDate(i.startDate)} to ${fmtDate(i.dueDate)}`}>
                                                    <span className="block h-full" style={{ width: `${itemProgress(i)}%`, background: color }} />
                                                </button>
                                            )}
                                        </div>
                                    </div>
                                );
                            })}
                        </React.Fragment>
                    ))}
                    {!dated.length && <p className="text-sm text-muted-foreground p-6">No work item has a start or due date yet.</p>}
                </div>
            </div>
            {undated.length > 0 && (
                <div className="mt-4">
                    <h3 className="text-sm font-semibold mb-2">Not scheduled ({undated.length})</h3>
                    <div className="grid sm:grid-cols-2 lg:grid-cols-3 gap-2">{undated.map(i => <ItemRow key={i.id} item={i} state={state} now={now} onOpen={onOpen} showCells />)}</div>
                </div>
            )}
        </div>
    );
}

// PLAN VIEW — programme, environments, milestones, RAID
