    <script type="text/babel">
const { useState, useEffect, useRef, useMemo, useCallback } = React;

// ═══════════════════════════════════════════════════════════════════
// CONSTANTS — cluster canon verbatim from the v2.7 dictionary
// ═══════════════════════════════════════════════════════════════════

const CLUSTERS = [
    { id: 1,  opId: 'TLCTC-01.00', name: 'Abuse of Functions',  abbr: 'AoF', topology: 'internal', genericVuln: "The inherent trust, scope, and complexity designed into software functionality and configuration." },
    { id: 2,  opId: 'TLCTC-02.00', name: 'Exploiting Server',   abbr: 'ExS', topology: 'internal', genericVuln: "Server-side implementation flaws enable unintended behavior." },
    { id: 3,  opId: 'TLCTC-03.00', name: 'Exploiting Client',   abbr: 'ExC', topology: 'internal', genericVuln: "Client-side implementation flaws enable unintended behavior." },
    { id: 4,  opId: 'TLCTC-04.00', name: 'Identity Theft',      abbr: 'IdT', topology: 'internal', genericVuln: "Insufficient binding, at the point of authentication, between a presented credential and the authentic holder of the identity it claims." },
    { id: 5,  opId: 'TLCTC-05.00', name: 'Man in the Middle',   abbr: 'MitM', topology: 'internal', genericVuln: "The lack of sufficient control over the communication path." },
    { id: 6,  opId: 'TLCTC-06.00', name: 'Flooding Attack',     abbr: 'Fld', topology: 'internal', genericVuln: "Finite capacity limitations inherent in any system component." },
    { id: 7,  opId: 'TLCTC-07.00', name: 'Malware',             abbr: 'Mlw', topology: 'internal', genericVuln: "The software environment's designed capability to execute potentially untrusted foreign code." },
    { id: 8,  opId: 'TLCTC-08.00', name: 'Physical Attack',     abbr: 'Phy', topology: 'bridge',   genericVuln: "Physical accessibility of infrastructure and the exploitability of physical-layer properties." },
    { id: 9,  opId: 'TLCTC-09.00', name: 'Social Engineering',  abbr: 'SE',  topology: 'bridge',   genericVuln: "Humans can be influenced into unsafe actions or decisions." },
    { id: 10, opId: 'TLCTC-10.00', name: 'Supply Chain Attack', abbr: 'SCA', topology: 'bridge',   genericVuln: "Trust in third-party components and update channels can be subverted." },
];

const CSF_FUNCTIONS = [
    // objective = application paper §8.1 template ('#X' is replaced by the cluster id)
    { id: 'GV', name: 'GOVERN',   label: 'Govern',   color: '#8b5cf6', objective: 'Govern the strategy, ownership, and risk appetite for the #X cluster' },
    { id: 'ID', name: 'IDENTIFY', label: 'Identify', color: '#3b82f6', objective: 'Identify weaknesses enabling a #X event' },
    { id: 'PR', name: 'PROTECT',  label: 'Protect',  color: '#22c55e', objective: 'Protect from a #X event' },
    { id: 'DE', name: 'DETECT',   label: 'Detect',   color: '#eab308', objective: 'Detect a #X event' },
    { id: 'RS', name: 'RESPOND',  label: 'Respond',  color: '#f97316', objective: 'Respond to a #X event' },
    { id: 'RC', name: 'RECOVER',  label: 'Recover',  color: '#06b6d4', objective: 'Recover from a #X event' },
];

const WORK_TYPES = {
    local:    { id: 'local',    label: 'Local',    icon: 'map-pin',  color: '#2563eb', blurb: 'Work for one environment or system, in one or several cells.' },
    umbrella: { id: 'umbrella', label: 'Umbrella', icon: 'umbrella', color: '#9333ea', blurb: 'One enterprise-wide capability, delivered once for every environment, in one or several cells.' },
};

const STATUSES = [
    { id: 'backlog',     label: 'Backlog',     color: '#94a3b8' },
    { id: 'planned',     label: 'Planned',     color: '#6366f1' },
    { id: 'in-progress', label: 'In progress', color: '#3b82f6' },
    { id: 'blocked',     label: 'Blocked',     color: '#ef4444' },
    { id: 'review',      label: 'In review',   color: '#f59e0b' },
    { id: 'done',        label: 'Done',        color: '#22c55e' },
    { id: 'cancelled',   label: 'Cancelled',   color: '#64748b' },
];
const STATUS = Object.fromEntries(STATUSES.map(s => [s.id, s]));

const PRIORITIES = [
    { id: 'P1', label: 'P1 Critical', color: '#dc2626' },
    { id: 'P2', label: 'P2 High',     color: '#ea580c' },
    { id: 'P3', label: 'P3 Medium',   color: '#ca8a04' },
    { id: 'P4', label: 'P4 Low',      color: '#64748b' },
];
const PRIORITY = Object.fromEntries(PRIORITIES.map(p => [p.id, p]));

const MATURITY_LEVELS = ['Not implemented', 'Initial', 'Developing', 'Defined', 'Managed', 'Optimizing'];

const SHARED_SCOPES = [
    { id: 'all',          label: 'All' },
    { id: 'applications', label: 'Applications' },
    { id: 'platform',     label: 'Platform' },
    { id: 'infra-sw',     label: 'Infrastructure (SW)' },
    { id: 'infra-hw',     label: 'Infrastructure (HW)' },
];

const RAID_KINDS = [
    { id: 'risk',       label: 'Risk',       icon: 'triangle-alert' },
    { id: 'assumption', label: 'Assumption', icon: 'lightbulb' },
    { id: 'issue',      label: 'Issue',      icon: 'circle-alert' },
    { id: 'dependency', label: 'Dependency', icon: 'link-2' },
    { id: 'decision',   label: 'Decision',   icon: 'gavel' },
];
const RAID_KIND = Object.fromEntries(RAID_KINDS.map(k => [k.id, k]));
const SEVERITIES = [
    { id: 'critical', label: 'Critical', color: '#dc2626', rank: 4 },
    { id: 'high',     label: 'High',     color: '#ea580c', rank: 3 },
    { id: 'medium',   label: 'Medium',   color: '#ca8a04', rank: 2 },
    { id: 'low',      label: 'Low',      color: '#64748b', rank: 1 },
];
const SEVERITY = Object.fromEntries(SEVERITIES.map(s => [s.id, s]));

const RAG = {
    green: { label: 'On track',  color: '#16a34a' },
    amber: { label: 'At risk',   color: '#d97706' },
    red:   { label: 'Off track', color: '#dc2626' },
    done:  { label: 'Complete',  color: '#64748b' },
};

const STORAGE_KEY = 'tlctc-control-work-planner-v1';
const TOOL_ID = 'tlctc-control-work-planner';
const SCHEMA_VERSION = 1;

// ═══════════════════════════════════════════════════════════════════
// UTILITIES
// ═══════════════════════════════════════════════════════════════════

const genId = (p = 'w') => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const cellKey = (clusterId, funcId) => `${clusterId}-${funcId}`;
const parseCell = (ck) => { const [c, f] = String(ck).split('-'); return { clusterId: Number(c), funcId: f }; };
const isValidCell = (ck) => { const { clusterId, funcId } = parseCell(ck); return clusterId >= 1 && clusterId <= 10 && CSF_FUNCTIONS.some(f => f.id === funcId); };
const cellLabel = (ck) => { const { clusterId, funcId } = parseCell(ck); return `#${clusterId} ${funcId}`; };
const clusterOf = (id) => CLUSTERS[Number(id) - 1];
const funcOf = (id) => CSF_FUNCTIONS.find(f => f.id === id);
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
const num = (v) => { const n = Number(v); return Number.isFinite(n) ? n : 0; };
const sum = (arr) => arr.reduce((a, b) => a + b, 0);
const plural = (n, w) => `${n} ${w}${n === 1 ? '' : 's'}`;
const pct = (v) => `${Math.round(v)}%`;
const fmtNum = (v, d = 1) => (Math.round(v * 10 ** d) / 10 ** d).toLocaleString();

function isoLocal(d) { const z = new Date(d.getTime() - d.getTimezoneOffset() * 60000); return z.toISOString().slice(0, 10); }
const todayISO = () => isoLocal(new Date());
const daysBetween = (a, b) => Math.round((Date.parse(b + 'T00:00:00Z') - Date.parse(a + 'T00:00:00Z')) / 86400000);
const addDays = (iso, n) => { const d = new Date(iso + 'T00:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); };
const fmtDate = (iso) => iso ? new Date(iso + 'T00:00:00Z').toLocaleDateString(undefined, { day: '2-digit', month: 'short', year: 'numeric', timeZone: 'UTC' }) : '—';
const fmtShort = (iso) => iso ? new Date(iso + 'T00:00:00Z').toLocaleDateString(undefined, { day: 'numeric', month: 'short', timeZone: 'UTC' }) : '—';
const isISODate = (s) => typeof s === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(s) && !isNaN(Date.parse(s));

const isClosed = (it) => it.status === 'done' || it.status === 'cancelled';
const isLive = (it) => it.status !== 'cancelled';

// ── Cell links ─────────────────────────────────────────────────────
// An item covers one or more cells. Each item ↔ cell link is closed on its own
// (cellDone[ck] = date). A cell shows the work as done only when its link is closed,
// and an item can be set Done only when every link is closed.
const cellLinkDone = (it, ck) => !!(it.cellDone && it.cellDone[ck]);
const cellsDoneCount = (it) => (it.cells || []).filter(ck => cellLinkDone(it, ck)).length;
const allCellsDone = (it) => (it.cells || []).length > 0 && cellsDoneCount(it) === it.cells.length;
const openCellCount = (it) => (it.cells || []).length - cellsDoneCount(it);

function baseProgress(it) {
    const cl = it.checklist || [];
    if (cl.length) return Math.round(100 * cl.filter(c => c.done).length / cl.length);
    return clamp(num(it.progress), 0, 100);
}

// Item progress: checklist or manual value, raised by the share of closed cell links;
// never 100 % before the item is Done.
function itemProgress(it) {
    if (it.status === 'done') return 100;
    const n = (it.cells || []).length;
    const share = n > 1 ? Math.round(100 * cellsDoneCount(it) / n) : 0;
    return Math.min(99, Math.max(baseProgress(it), share));
}

// Progress of the item's work in one cell
function cellProgress(it, ck) {
    if (cellLinkDone(it, ck) || it.status === 'done') return 100;
    return Math.min(99, baseProgress(it));
}

// Item RAG — derived, never typed. See RAG_RULES for the wording shown to users.
function itemRag(it, now) {
    if (it.status === 'cancelled') return null;
    if (it.status === 'done') return 'done';
    if (it.status === 'blocked') return 'red';
    if (it.dueDate && it.dueDate < now) return 'red';
    const p = itemProgress(it);
    if (it.dueDate) {
        if (it.startDate && it.startDate < it.dueDate) {
            const span = daysBetween(it.startDate, it.dueDate);
            const elapsed = clamp(daysBetween(it.startDate, now) / span, 0, 1);
            if (elapsed - p / 100 > 0.25) return 'amber';
        } else if (daysBetween(now, it.dueDate) <= 7 && p < 50) return 'amber';
    }
    if (it.startDate && it.startDate <= now && (it.status === 'backlog' || it.status === 'planned')) return 'amber';
    return 'green';
}

const RAG_RULES = [
    ['Off track', 'Blocked, or past its due date and not done.'],
    ['At risk', 'Progress trails elapsed time by more than 25 points; or no start date, due within 7 days and under 50 % done; or the start date has passed and work has not started.'],
    ['On track', 'Everything else that is open.'],
    ['Programme', 'Off track when a P1 item is off track or more than 15 % of open items are; at risk when any item is off track or more than 15 % are at risk. A manual override in Plan replaces the derived value in every report.'],
];

function programmeRag(items, now) {
    const active = items.filter(i => !isClosed(i));
    if (!active.length) return items.some(i => i.status === 'done') ? 'done' : 'green';
    const rags = active.map(i => itemRag(i, now));
    const red = rags.filter(r => r === 'red').length;
    const amber = rags.filter(r => r === 'amber').length;
    if (active.some((i, k) => i.priority === 'P1' && rags[k] === 'red') || red / active.length > 0.15) return 'red';
    if (red > 0 || amber / active.length > 0.15) return 'amber';
    return 'green';
}

// Progress weighted by effort estimate; items without an estimate weigh the mean estimate.
function weightedProgress(items, prog = itemProgress) {
    const live = items.filter(isLive);
    if (!live.length) return 0;
    const known = live.map(i => num(i.effortEst)).filter(v => v > 0);
    const fallback = known.length ? sum(known) / known.length : 1;
    const w = live.map(i => num(i.effortEst) > 0 ? num(i.effortEst) : fallback);
    return sum(live.map((i, k) => w[k] * prog(i))) / sum(w);
}

function computeStats(items, now) {
    const live = items.filter(isLive);
    const open = live.filter(i => !isClosed(i));
    const effortEst = sum(live.map(i => num(i.effortEst)));
    const effortEarned = sum(live.map(i => num(i.effortEst) * itemProgress(i) / 100));
    return {
        total: live.length,
        local: live.filter(i => i.type === 'local').length,
        umbrella: live.filter(i => i.type === 'umbrella').length,
        open: open.length,
        done: live.filter(i => i.status === 'done').length,
        byStatus: Object.fromEntries(STATUSES.map(s => [s.id, items.filter(i => i.status === s.id).length])),
        overdue: open.filter(i => i.dueDate && i.dueDate < now),
        blocked: open.filter(i => i.status === 'blocked'),
        dueSoon: open.filter(i => i.dueDate && i.dueDate >= now && i.dueDate <= addDays(now, 14)),
        unscheduled: open.filter(i => !i.dueDate),
        unowned: open.filter(i => !String(i.owner || '').trim()),
        links: sum(live.map(i => (i.cells || []).length)),
        linksDone: sum(live.map(i => i.status === 'done' ? (i.cells || []).length : cellsDoneCount(i))),
        effortEst, effortEarned,
        effortRemaining: effortEst - effortEarned,
        effortActual: sum(live.map(i => num(i.effortActual))),
        cost: sum(live.map(i => num(i.cost))),
        progress: weightedProgress(items),
        rag: programmeRag(items, now),
    };
}

// The items whose cells include ck
function itemsInCell(items, ck) { return items.filter(i => (i.cells || []).includes(ck)); }

// Status of an item as seen from one cell: done once the link is closed
const linkStatus = (it, ck) => cellLinkDone(it, ck) ? 'done' : it.status;

function cellStats(items, ck, now) {
    const inCell = itemsInCell(items, ck);
    const live = inCell.filter(isLive);
    const open = live.filter(i => linkStatus(i, ck) !== 'done');
    return {
        items: inCell,
        local: live.filter(i => i.type === 'local').length,
        umbrella: live.filter(i => i.type === 'umbrella').length,
        total: live.length,
        done: live.length - open.length,
        progress: weightedProgress(inCell, i => cellProgress(i, ck)),
        overdue: open.filter(i => i.dueDate && i.dueDate < now).length,
        blocked: open.filter(i => i.status === 'blocked').length,
        open: open.length,
        // an item's effort is spread evenly over the cells it covers
        remaining: sum(live.map(i => num(i.effortEst) / Math.max(1, (i.cells || []).length) * (100 - cellProgress(i, ck)) / 100)),
        byStatus: STATUSES.map(s => ({ ...s, n: live.filter(i => linkStatus(i, ck) === s.id).length })),
    };
}

// Item depends on something that is not done and is due later than (or at) this item
function dependencyConflicts(item, byId) {
    return (item.dependsOn || []).map(id => byId[id]).filter(d => d && d.status !== 'done' && (
        d.status === 'cancelled' || (d.dueDate && item.dueDate && d.dueDate >= item.dueDate) || (!d.dueDate)
    ));
}

const itemOwner = (it) => String(it.owner || '').trim() || 'Unassigned';

// ═══════════════════════════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════════════════════════

function createDefaultState() {
    return {
        tool: TOOL_ID,
        schemaVersion: SCHEMA_VERSION,
        programme: { name: 'Control uplift programme', sponsor: '', manager: '', startDate: '', endDate: '', statusNote: '', ragOverride: '', targetMaturity: 3 },
        environments: [{ id: 'env-default', name: 'Default' }],
        items: [],
        milestones: [],
        raid: [],
        snapshots: [],
        nextKey: 1,
        updatedAt: new Date().toISOString(),
    };
}

function normaliseItem(it, envIds) {
    const type = it.type === 'umbrella' ? 'umbrella' : 'local';
    let cells = Array.isArray(it.cells) ? it.cells.filter(isValidCell) : [];
    cells = [...new Set(cells)];
    // Closed cell links; a Done item must have every link closed
    const given = it.cellDone && typeof it.cellDone === 'object' ? it.cellDone : null;
    const cellDone = {};
    cells.forEach(ck => { if (given && given[ck]) cellDone[ck] = isISODate(given[ck]) ? given[ck] : todayISO(); });
    let status = STATUS[it.status] ? it.status : 'backlog';
    if (status === 'done' && cells.some(ck => !cellDone[ck])) {
        // a record without link data (older file, other tool) or a single-cell item: closing the item closes its links
        if (!given || cells.length === 1) cells.forEach(ck => { if (!cellDone[ck]) cellDone[ck] = isISODate(it.doneAt) ? it.doneAt : todayISO(); });
        else status = 'review';
    }
    return {
        id: it.id || genId(),
        key: it.key || '',
        title: String(it.title || 'Untitled work item'),
        description: String(it.description || ''),
        type,
        cells,
        cellDone,
        envId: type === 'local' ? (envIds.includes(it.envId) ? it.envId : (envIds[0] || '')) : '',
        scope: type === 'umbrella' ? (it.scope || 'all') : '',
        control: String(it.control || ''),
        owner: String(it.owner || ''),
        team: String(it.team || ''),
        status,
        priority: PRIORITY[it.priority] ? it.priority : 'P3',
        startDate: isISODate(it.startDate) ? it.startDate : '',
        dueDate: isISODate(it.dueDate) ? it.dueDate : '',
        effortEst: it.effortEst === '' || it.effortEst == null ? '' : num(it.effortEst),
        effortActual: it.effortActual === '' || it.effortActual == null ? '' : num(it.effortActual),
        cost: it.cost === '' || it.cost == null ? '' : num(it.cost),
        progress: clamp(num(it.progress), 0, 100),
        checklist: Array.isArray(it.checklist) ? it.checklist.map(c => ({ id: c.id || genId('k'), text: String(c.text || ''), done: !!c.done })) : [],
        dependsOn: Array.isArray(it.dependsOn) ? it.dependsOn.filter(Boolean) : [],
        milestoneId: it.milestoneId || '',
        maturityFrom: it.maturityFrom === '' || it.maturityFrom == null ? '' : clamp(num(it.maturityFrom), 0, 5),
        maturityTo: it.maturityTo === '' || it.maturityTo == null ? '' : clamp(num(it.maturityTo), 0, 5),
        tags: Array.isArray(it.tags) ? it.tags.map(String).filter(Boolean) : [],
        link: String(it.link || ''),
        updates: Array.isArray(it.updates) ? it.updates.map(u => ({ id: u.id || genId('u'), date: isISODate(u.date) ? u.date : todayISO(), text: String(u.text || '') })) : [],
        source: it.source || null,
        createdAt: it.createdAt || todayISO(),
        doneAt: status === 'done' ? (isISODate(it.doneAt) ? it.doneAt : todayISO()) : '',
    };
}

function normaliseState(raw) {
    const base = createDefaultState();
    if (!raw || typeof raw !== 'object') return base;
    const environments = Array.isArray(raw.environments) && raw.environments.length
        ? raw.environments.map(e => ({ id: e.id || genId('env'), name: String(e.name || 'Environment') }))
        : base.environments;
    const envIds = environments.map(e => e.id);
    let nextKey = Math.max(1, num(raw.nextKey));
    const items = (Array.isArray(raw.items) ? raw.items : []).map(it => normaliseItem(it, envIds));
    items.forEach(it => {
        const m = /^WI-(\d+)$/.exec(it.key);
        if (m) nextKey = Math.max(nextKey, Number(m[1]) + 1);
    });
    items.forEach(it => { if (!it.key) it.key = `WI-${String(nextKey++).padStart(3, '0')}`; });
    const ids = new Set(items.map(i => i.id));
    items.forEach(it => { it.dependsOn = it.dependsOn.filter(d => ids.has(d) && d !== it.id); });
    const milestones = (Array.isArray(raw.milestones) ? raw.milestones : []).map(m => ({
        id: m.id || genId('m'), name: String(m.name || 'Milestone'), date: isISODate(m.date) ? m.date : '', description: String(m.description || ''),
    }));
    const msIds = new Set(milestones.map(m => m.id));
    items.forEach(it => { if (!msIds.has(it.milestoneId)) it.milestoneId = ''; });
    const raid = (Array.isArray(raw.raid) ? raw.raid : []).map(r => ({
        id: r.id || genId('r'), kind: RAID_KIND[r.kind] ? r.kind : 'risk', title: String(r.title || ''), description: String(r.description || ''),
        owner: String(r.owner || ''), severity: SEVERITY[r.severity] ? r.severity : 'medium', status: r.status === 'closed' ? 'closed' : 'open',
        dueDate: isISODate(r.dueDate) ? r.dueDate : '', itemIds: Array.isArray(r.itemIds) ? r.itemIds.filter(x => ids.has(x)) : [],
        mitigation: String(r.mitigation || ''), createdAt: isISODate(r.createdAt) ? r.createdAt : todayISO(),
    }));
    const p = raw.programme || {};
    return {
        ...base,
        programme: {
            ...base.programme,
            name: String(p.name || base.programme.name), sponsor: String(p.sponsor || ''), manager: String(p.manager || ''),
            startDate: isISODate(p.startDate) ? p.startDate : '', endDate: isISODate(p.endDate) ? p.endDate : '',
            statusNote: String(p.statusNote || ''), ragOverride: RAG[p.ragOverride] && p.ragOverride !== 'done' ? p.ragOverride : '',
            targetMaturity: p.targetMaturity === undefined ? 3 : clamp(num(p.targetMaturity), 0, 5),
        },
        environments, items, milestones, raid, nextKey,
        snapshots: (Array.isArray(raw.snapshots) ? raw.snapshots : []).filter(s => s && isISODate(s.date)).slice(-400),
        updatedAt: raw.updatedAt || base.updatedAt,
    };
}

function loadState() {
    try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) return normaliseState(JSON.parse(raw));
    } catch (e) { console.warn('Could not read saved plan', e); }
    return createDefaultState();
}

function saveState(state) {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) { console.warn('Could not save plan', e); }
}

// One snapshot per calendar day, replaced while the day lasts — feeds the burn-up chart.
function withSnapshot(state) {
    const now = todayISO();
    const s = computeStats(state.items, now);
    const snap = { date: now, total: s.total, done: s.done, effortEst: Math.round(s.effortEst * 10) / 10, effortEarned: Math.round(s.effortEarned * 10) / 10, progress: Math.round(s.progress) };
    const prev = state.snapshots || [];
    const last = prev[prev.length - 1];
    if (last && last.date === now && last.total === snap.total && last.done === snap.done && last.effortEarned === snap.effortEarned && last.effortEst === snap.effortEst) return state;
    const snapshots = (last && last.date === now ? prev.slice(0, -1) : prev).concat([snap]).slice(-400);
    return { ...state, snapshots };
}

function nextItemKey(state) { return `WI-${String(state.nextKey).padStart(3, '0')}`; }

function blankItem(state, patch = {}) {
    return normaliseItem({
        type: 'local', cells: [], status: 'backlog', priority: 'P3', envId: state.environments[0]?.id,
        ...patch, key: nextItemKey(state), id: genId(), createdAt: todayISO(),
    }, state.environments.map(e => e.id));
}

// FILTERS
// ═══════════════════════════════════════════════════════════════════

const EMPTY_FILTERS = { q: '', type: 'all', cluster: '', func: '', status: '', owner: '', envId: '', priority: '', milestoneId: '', flag: '' };

function matchesFilters(it, f, now) {
    if (f.type !== 'all' && it.type !== f.type) return false;
    if (f.cluster && !(it.cells || []).some(ck => String(parseCell(ck).clusterId) === String(f.cluster))) return false;
    if (f.func && !(it.cells || []).some(ck => parseCell(ck).funcId === f.func)) return false;
    if (f.status === 'open' && isClosed(it)) return false;
    if (f.status && f.status !== 'open' && it.status !== f.status) return false;
    if (f.owner && itemOwner(it) !== f.owner) return false;
    // Umbrella work covers every environment, so an environment filter only narrows Local work
    if (f.envId && it.type === 'local' && it.envId !== f.envId) return false;
    if (f.priority && it.priority !== f.priority) return false;
    if (f.milestoneId && it.milestoneId !== f.milestoneId) return false;
    if (f.flag === 'overdue' && !(!isClosed(it) && it.dueDate && it.dueDate < now)) return false;
    if (f.flag === 'blocked' && it.status !== 'blocked') return false;
    if (f.flag === 'due14' && !(!isClosed(it) && it.dueDate && it.dueDate >= now && it.dueDate <= addDays(now, 14))) return false;
    if (f.flag === 'unscheduled' && !(!isClosed(it) && !it.dueDate)) return false;
    if (f.flag === 'atrisk' && !['amber', 'red'].includes(itemRag(it, now))) return false;
    if (f.q) {
        const q = f.q.toLowerCase();
        const hay = [it.key, it.title, it.description, it.control, it.owner, it.team, ...(it.tags || []), ...(it.cells || []).map(cellLabel)].join(' ').toLowerCase();
        if (!hay.includes(q)) return false;
    }
    return true;
}

const activeFilterCount = (f) => Object.entries(f).filter(([k, v]) => v && !(k === 'type' && v === 'all')).length;

// ═══════════════════════════════════════════════════════════════════
// MILESTONES
// ═══════════════════════════════════════════════════════════════════

function milestoneStatus(ms, items, now) {
    const linked = items.filter(i => i.milestoneId === ms.id && isLive(i));
    const progress = weightedProgress(linked);
    if (linked.length && linked.every(i => i.status === 'done')) return { id: 'achieved', label: 'Achieved', color: '#16a34a', linked, progress };
    if (ms.date && ms.date < now) return { id: 'missed', label: 'Missed', color: '#dc2626', linked, progress };
    if (!linked.length) return { id: 'empty', label: 'No work linked', color: '#94a3b8', linked, progress };
    const rags = linked.map(i => itemRag(i, now));
    if (rags.includes('red') || rags.includes('amber') || linked.some(i => i.dueDate && ms.date && i.dueDate > ms.date && !isClosed(i)))
        return { id: 'atrisk', label: 'At risk', color: '#d97706', linked, progress };
    return { id: 'ontrack', label: 'On track', color: '#16a34a', linked, progress };
}

// ═══════════════════════════════════════════════════════════════════

const isControlMatrixExport = (j) => j && Array.isArray(j.environments) && j.environments.some(e => e && e.cells && typeof e.cells === 'object') && !Array.isArray(j.items);
const isPlannerExport = (j) => j && Array.isArray(j.items);

function convertControlMatrix(cm, state, opts) {
    const target = clamp(num(opts.target), 0, 5);
    const envs = state.environments.map(e => ({ ...e }));
    const envMap = {};
    (cm.environments || []).forEach(e => {
        const name = String(e.name || 'Environment');
        let ex = envs.find(x => x.name.toLowerCase() === name.toLowerCase());
        if (!ex) { ex = { id: genId('env'), name }; envs.push(ex); }
        envMap[e.id] = ex.id;
    });
    const known = new Set(state.items.map(i => i.source && i.source.ref).filter(Boolean));
    const shared = Object.fromEntries((cm.sharedControls || []).map(s => [s.id, s]));
    const sharedAgg = {};
    const out = [];
    let skipped = 0;
    const below = (m) => m === null || m === undefined || m === '' || num(m) < target;
    const raiseTitle = (name) => `Raise ${name} to ${target} (${MATURITY_LEVELS[target]})`;
    const add = (it) => { if (known.has(it.source.ref)) { skipped++; return; } known.add(it.source.ref); out.push(it); };
    const TASK_MAP = { open: 'planned', 'in-progress': 'in-progress', blocked: 'blocked', done: 'done' };

    (cm.environments || []).forEach(env => {
        Object.entries(env.cells || {}).forEach(([ck, cell]) => {
            if (!isValidCell(ck) || !cell) return;
            (cell.local || []).forEach(c => {
                if (!c || c.sharedControlId) return;
                if (opts.belowOnly && !below(c.maturity)) return;
                add({ type: 'local', cells: [ck], envId: envMap[env.id], title: raiseTitle(c.name || 'control'), description: c.description || '', control: c.name || '', owner: c.ownerName || '', link: c.linkJira || c.linkMore || '',
                      maturityFrom: c.maturity ?? '', maturityTo: target, status: 'backlog', priority: 'P3', source: { tool: 'control-matrix', ref: `cm:${env.id}:${ck}:local:${c.id}` } });
            });
            (cell.umbrella || []).forEach(c => {
                if (!c) return;
                if (c.sharedControlId) {
                    const a = sharedAgg[c.sharedControlId] = sharedAgg[c.sharedControlId] || { cells: new Set(), mats: [] };
                    a.cells.add(ck);
                    if (c.maturity !== null && c.maturity !== undefined && c.maturity !== '') a.mats.push(num(c.maturity));
                    return;
                }
                if (opts.belowOnly && !below(c.maturity)) return;
                add({ type: 'umbrella', cells: [ck], scope: 'all', title: raiseTitle(c.name || 'control'), description: c.description || '', control: c.name || '', owner: c.ownerName || '', link: c.linkJira || c.linkMore || '',
                      maturityFrom: c.maturity ?? '', maturityTo: target, status: 'backlog', priority: 'P3', source: { tool: 'control-matrix', ref: `cm:${env.id}:${ck}:umbrella:${c.id}` } });
            });
            if (opts.tasks) (cell.tasks || []).forEach(tk => {
                if (!tk || !String(tk.description || '').trim()) return;
                add({ type: 'local', cells: [ck], envId: envMap[env.id], title: tk.description, owner: tk.owner || '', dueDate: tk.dueDate || '', status: TASK_MAP[tk.status] || 'planned', priority: 'P3',
                      source: { tool: 'control-matrix', ref: `cm:${env.id}:${ck}:task:${tk.id}` } });
            });
        });
    });
    Object.entries(sharedAgg).forEach(([scId, a]) => {
        const sc = shared[scId] || { name: 'Shared control' };
        const m = a.mats.length ? Math.min(...a.mats) : null;
        if (opts.belowOnly && !below(m)) return;
        add({ type: 'umbrella', cells: [...a.cells], scope: sc.scope || 'all', title: raiseTitle(sc.name || 'shared control'), description: sc.description || '', control: sc.name || '', owner: sc.ownerName || '', link: sc.linkJira || sc.linkMore || '',
              maturityFrom: m ?? '', maturityTo: target, status: 'backlog', priority: 'P2', source: { tool: 'control-matrix', ref: `cm:shared:${scId}` } });
    });
    return { items: out, environments: envs, skipped };
}

// Append items to state with fresh keys and ids, keeping links between them
function mergeItems(state, items, environments) {
    let nextKey = state.nextKey;
    const envIds = (environments || state.environments).map(e => e.id);
    const idMap = {};
    const fresh = items.map(it => { const id = genId(); idMap[it.id || id] = id; return { ...it, id }; });
    const merged = fresh.map(it => normaliseItem({ ...it, key: `WI-${String(nextKey++).padStart(3, '0')}`, dependsOn: (it.dependsOn || []).map(d => idMap[d] || d) }, envIds));
    return { next: { ...state, environments: environments || state.environments, items: state.items.concat(merged), nextKey }, idMap };
}

// Merge another planner export into this plan: environments matched by name, everything else appended
function mergePlanner(state, raw) {
    const inc = normaliseState(raw);
    const envs = state.environments.map(e => ({ ...e }));
    const envMap = {};
    inc.environments.forEach(e => {
        let ex = envs.find(x => x.name.toLowerCase() === e.name.toLowerCase());
        if (!ex) { ex = { id: genId('env'), name: e.name }; envs.push(ex); }
        envMap[e.id] = ex.id;
    });
    const msMap = {};
    const milestones = inc.milestones.map(m => { const id = genId('m'); msMap[m.id] = id; return { ...m, id }; });
    const { next, idMap } = mergeItems(state, inc.items.map(it => ({ ...it, envId: envMap[it.envId] || it.envId, milestoneId: msMap[it.milestoneId] || '' })), envs);
    const raid = inc.raid.map(r => ({ ...r, id: genId('r'), itemIds: r.itemIds.map(x => idMap[x]).filter(Boolean) }));
    return { next: { ...next, milestones: state.milestones.concat(milestones), raid: state.raid.concat(raid) }, counts: { items: inc.items.length, milestones: milestones.length, raid: raid.length } };
}

function download(filename, content, mime) {
    const blob = new Blob([content], { type: mime });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1500);
}

function envName(state, id) { return state.environments.find(e => e.id === id)?.name || ''; }
function scopeLabel(id) { return SHARED_SCOPES.find(s => s.id === id)?.label || id || ''; }
function whereLabel(state, it) { return it.type === 'local' ? envName(state, it.envId) : `Scope: ${scopeLabel(it.scope)}`; }

function itemsToCSV(state, items) {
    const now = todayISO();
    const byId = Object.fromEntries(state.items.map(i => [i.id, i]));
    const cols = ['Key', 'Title', 'Type', 'Cells', 'Cells done', 'Clusters', 'Functions', 'Environment / scope', 'Control', 'Owner', 'Team', 'Status', 'Priority', 'RAG', 'Start', 'Due', 'Progress %', 'Effort est. (pd)', 'Effort actual (pd)', 'Cost', 'Milestone', 'Depends on', 'Maturity from', 'Maturity to', 'Tags', 'Link', 'Latest update', 'Description'];
    const q = (v) => { const s = v === null || v === undefined ? '' : String(v); return /[",\n\r;]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
    const rows = items.map(it => {
        const cells = it.cells || [];
        const last = (it.updates || []).slice().sort((a, b) => a.date < b.date ? 1 : -1)[0];
        const rag = itemRag(it, now);
        return [it.key, it.title, WORK_TYPES[it.type].label, cells.map(cellLabel).join(' | '), cells.filter(ck => cellLinkDone(it, ck)).map(cellLabel).join(' | '),
            [...new Set(cells.map(ck => '#' + parseCell(ck).clusterId))].join(' '), [...new Set(cells.map(ck => parseCell(ck).funcId))].join(' '),
            whereLabel(state, it), it.control, it.owner, it.team, STATUS[it.status].label, it.priority, rag ? RAG[rag].label : '',
            it.startDate, it.dueDate, itemProgress(it), it.effortEst, it.effortActual, it.cost,
            state.milestones.find(m => m.id === it.milestoneId)?.name || '', (it.dependsOn || []).map(d => byId[d]?.key).filter(Boolean).join(' '),
            it.maturityFrom, it.maturityTo, (it.tags || []).join(' '), it.link, last ? `${last.date}: ${last.text}` : '', it.description].map(q).join(',');
    });
    return '﻿' + cols.join(',') + '\r\n' + rows.join('\r\n') + '\r\n';
}

const ragPill = (rag, big) => rag ? `<span class="${big ? 'rag' : 'pill'}" style="background:${RAG[rag].color}">${esc(RAG[rag].label)}</span>` : '';
const statusPill = (s) => `<span class="pill" style="background:${STATUS[s].color}">${esc(STATUS[s].label)}</span>`;
const barHTML = (p) => `<div class="bar"><i style="width:${clamp(p, 0, 100)}%"></i></div>`;
const cellsHTML = (it) => {
    const cells = it.cells || [];
    if (!cells.length) return '<span class="cells">no cell</span>';
    const done = cells.filter(ck => cellLinkDone(it, ck)).length;
    const tally = cells.length > 1 ? ` <b>${done}/${cells.length} done</b>` : '';
    if (cells.length > 4) return `<span class="cells">${esc(cells.length + ' cells: ' + summariseCells(cells))}${tally}</span>`;
    return `<span class="cells">${cells.map(ck => esc(cellLabel(ck)) + (cells.length > 1 && cellLinkDone(it, ck) ? ' ✓' : '')).join(', ')}${tally}</span>`;
};

function summariseCells(cells) {
    const byF = {};
    cells.forEach(ck => { const { clusterId, funcId } = parseCell(ck); (byF[funcId] = byF[funcId] || []).push(clusterId); });
    return Object.entries(byF).map(([f, cs]) => cs.length === 10 ? `${f} all clusters` : `${f} ${cs.sort((a, b) => a - b).map(c => '#' + c).join(' ')}`).join('; ');
}

function itemTable(state, items, cols) {
    if (!items.length) return '<p class="empty">None.</p>';
    const now = todayISO();
    const C = {
        key: ['Key', it => `<span class="key">${esc(it.key)}</span>`],
        title: ['Work item', it => `${typeSym(it.type)}${esc(it.title)}<br>${cellsHTML(it)}`],
        owner: ['Owner', it => esc(itemOwner(it))],
        status: ['Status', it => statusPill(it.status)],
        rag: ['RAG', it => ragPill(itemRag(it, now))],
        due: ['Due', it => `<span class="num">${esc(fmtDate(it.dueDate))}</span>`],
        late: ['Days late', it => `<span class="num">${it.dueDate && it.dueDate < now ? daysBetween(it.dueDate, now) : ''}</span>`],
        progress: ['Progress', it => `${barHTML(itemProgress(it))}<span class="meta">${itemProgress(it)}%</span>`],
        priority: ['Prio', it => esc(it.priority)],
        where: ['Environment / scope', it => esc(whereLabel(state, it))],
        effort: ['Effort (pd)', it => `<span class="num">${it.effortEst === '' ? '—' : esc(it.effortEst)}</span>`],
        update: ['Latest update', it => { const u = (it.updates || []).slice().sort((a, b) => a.date < b.date ? 1 : -1)[0]; return u ? `<span class="meta">${esc(fmtShort(u.date))}</span> ${esc(u.text)}` : ''; }],
        done: ['Completed', it => `<span class="num">${esc(fmtDate(it.doneAt))}</span>`],
        maturity: ['Maturity', it => it.maturityFrom !== '' || it.maturityTo !== '' ? `<span class="num">${esc(it.maturityFrom === '' ? '?' : it.maturityFrom)} → ${esc(it.maturityTo === '' ? '?' : it.maturityTo)}</span>` : ''],
    };
    return `<table><thead><tr>${cols.map(c => `<th>${C[c][0]}</th>`).join('')}</tr></thead><tbody>${items.map(it => `<tr>${cols.map(c => `<td>${C[c][1](it)}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
}

function burnupSVG(snapshots) {
    const s = (snapshots || []).slice(-60);
    if (s.length < 2) return '<p class="empty">The trend appears after the plan has been used on two different days (one snapshot is kept per day).</p>';
    const W = 640, H = 180, P = 30;
    const maxY = Math.max(...s.map(x => x.total), 1);
    const t0 = Date.parse(s[0].date), t1 = Date.parse(s[s.length - 1].date);
    const X = (d) => P + (W - 2 * P) * (t1 === t0 ? 1 : (Date.parse(d) - t0) / (t1 - t0));
    const Y = (v) => H - P + 6 - (H - 2 * P) * v / maxY;
    const line = (k) => s.map((x, i) => `${i ? 'L' : 'M'}${X(x.date).toFixed(1)},${Y(x[k]).toFixed(1)}`).join(' ');
    const prog = s.map((x, i) => `${i ? 'L' : 'M'}${X(x.date).toFixed(1)},${Y(maxY * x.progress / 100).toFixed(1)}`).join(' ');
    return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:${W}px" role="img" aria-label="Burn-up: scope, done and progress over time">
<line x1="${P}" y1="${Y(0)}" x2="${W - P}" y2="${Y(0)}" stroke="#cbd5e1"/><line x1="${P}" y1="${Y(maxY)}" x2="${W - P}" y2="${Y(maxY)}" stroke="#eef2f7"/>
<text x="${P - 6}" y="${Y(0) + 4}" font-size="10" text-anchor="end" fill="#64748b">0</text><text x="${P - 6}" y="${Y(maxY) + 4}" font-size="10" text-anchor="end" fill="#64748b">${maxY}</text>
<path d="${line('total')}" fill="none" stroke="#0f172a" stroke-width="2"/><path d="${line('done')}" fill="none" stroke="#16a34a" stroke-width="2"/><path d="${prog}" fill="none" stroke="#2563eb" stroke-width="2" stroke-dasharray="4 3"/>
<text x="${P}" y="${H - 6}" font-size="10" fill="#64748b">${esc(fmtShort(s[0].date))}</text><text x="${W - P}" y="${H - 6}" font-size="10" text-anchor="end" fill="#64748b">${esc(fmtShort(s[s.length - 1].date))}</text></svg>
<div class="legend"><span><span class="dot" style="background:#0f172a"></span>Scope (items)</span><span><span class="dot" style="background:#16a34a"></span>Items done</span><span><span class="dot" style="background:#2563eb"></span>Weighted progress (scaled to scope)</span></div>`;
}

function functionBreakdown(items, now) {
    return `<table><thead><tr><th>CSF function</th><th class="num">Items</th><th class="num">${SVG_PIN()}</th><th class="num">${SVG_UMB()}</th><th class="num">Done</th><th class="num">Overdue</th><th class="num">Blocked</th><th>Progress</th></tr></thead><tbody>${
        CSF_FUNCTIONS.map(f => {
            const inF = (i) => (i.cells || []).filter(ck => parseCell(ck).funcId === f.id);
            const its = items.filter(i => isLive(i) && inF(i).length);
            const doneHere = (i) => inF(i).every(ck => linkStatus(i, ck) === 'done');
            const open = its.filter(i => !doneHere(i));
            const p = weightedProgress(its, i => sum(inF(i).map(ck => cellProgress(i, ck))) / inF(i).length);
            return `<tr><td><span class="dot" style="background:${f.color}"></span>${esc(f.label)}</td><td class="num">${its.length}</td><td class="num">${its.filter(i => i.type === 'local').length}</td><td class="num">${its.filter(i => i.type === 'umbrella').length}</td><td class="num">${its.length - open.length}</td><td class="num">${open.filter(i => i.dueDate && i.dueDate < now).length}</td><td class="num">${open.filter(i => i.status === 'blocked').length}</td><td>${its.length ? barHTML(p) + `<span class="meta">${Math.round(p)}%</span>` : '<span class="empty">no work</span>'}</td></tr>`;
        }).join('')}</tbody></table><p class="meta">An item counts once in each function it covers, and counts as done there once all its cells in that function are done.</p>`;
}

function milestoneTable(state, now) {
    if (!state.milestones.length) return '<p class="empty">No milestones defined.</p>';
    const ms = state.milestones.slice().sort((a, b) => (a.date || '9999') < (b.date || '9999') ? -1 : 1);
    return `<table><thead><tr><th>Milestone</th><th>Date</th><th>Status</th><th class="num">Items</th><th>Progress</th></tr></thead><tbody>${ms.map(m => {
        const st = milestoneStatus(m, state.items, now);
        return `<tr><td><b>${esc(m.name)}</b>${m.description ? `<br><span class="meta">${esc(m.description)}</span>` : ''}</td><td class="num">${esc(fmtDate(m.date))}</td><td><span class="pill" style="background:${st.color}">${esc(st.label)}</span></td><td class="num">${st.linked.length}</td><td>${st.linked.length ? barHTML(st.progress) + `<span class="meta">${Math.round(st.progress)}%</span>` : ''}</td></tr>`;
    }).join('')}</tbody></table>`;
}

function raidTable(state, rows) {
    if (!rows.length) return '<p class="empty">None.</p>';
    const byId = Object.fromEntries(state.items.map(i => [i.id, i]));
    return `<table><thead><tr><th>Type</th><th>Entry</th><th>Severity</th><th>Owner</th><th>Due</th><th>Status</th><th>Work items</th></tr></thead><tbody>${rows.map(r =>
        `<tr><td>${esc(RAID_KIND[r.kind].label)}</td><td><b>${esc(r.title)}</b>${r.description ? `<br>${esc(r.description)}` : ''}${r.mitigation ? `<br><span class="meta">Response: ${esc(r.mitigation)}</span>` : ''}</td><td><span class="pill" style="background:${SEVERITY[r.severity].color}">${esc(SEVERITY[r.severity].label)}</span></td><td>${esc(r.owner || '—')}</td><td class="num">${esc(fmtDate(r.dueDate))}</td><td>${r.status === 'open' ? 'Open' : 'Closed'}</td><td class="key">${(r.itemIds || []).map(id => esc(byId[id]?.key || '')).join(' ')}</td></tr>`).join('')}</tbody></table>`;
}

const sortByDue = (a, b) => (a.dueDate || '9999') < (b.dueDate || '9999') ? -1 : (a.dueDate || '9999') > (b.dueDate || '9999') ? 1 : 0;
const sevSort = (a, b) => SEVERITY[b.severity].rank - SEVERITY[a.severity].rank || sortByDue(a, b);

const REPORTS = [
    { id: 'status',     label: 'Status report',       icon: 'file-text',      blurb: 'One-pager for the steering committee: RAG, progress, milestones, risks, exceptions, next two weeks.' },
    { id: 'coverage',   label: 'Coverage report',     icon: 'grid-3x3',       blurb: 'The 60-cell matrix: where work is planned, where there is none, and how far Umbrella work reaches.' },
    { id: 'workload',   label: 'Workload report',     icon: 'users',          blurb: 'Open items, overdue items and remaining effort per owner, and when the work falls due.' },
    { id: 'exceptions', label: 'Exceptions report',   icon: 'siren',          blurb: 'Overdue, blocked, at risk, unscheduled, unowned work and broken dependencies.' },
    { id: 'raid',       label: 'RAID log',            icon: 'clipboard-list', blurb: 'Risks, assumptions, issues, dependencies and decisions with their linked work.' },
    { id: 'register',   label: 'Work-item register',  icon: 'table',          blurb: 'Every work item with its cells, owner, dates, effort, maturity target and latest update.' },
];

function buildReport(kind, state) {
    const now = todayISO();
    const items = state.items;
    const live = items.filter(isLive);
    const s = computeStats(items, now);
    const rag = state.programme.ragOverride || s.rag;
    const byId = Object.fromEntries(items.map(i => [i.id, i]));

    if (kind === 'status') {
        const openRI = state.raid.filter(r => r.status === 'open' && (r.kind === 'risk' || r.kind === 'issue')).sort(sevSort);
        const decisions = state.raid.filter(r => r.status === 'open' && r.kind === 'decision');
        const doneRecent = live.filter(i => i.status === 'done' && i.doneAt && i.doneAt >= addDays(now, -14)).sort((a, b) => a.doneAt < b.doneAt ? 1 : -1);
        const exceptions = live.filter(i => !isClosed(i) && (i.status === 'blocked' || (i.dueDate && i.dueDate < now))).sort(sortByDue);
        const body = `
<div style="margin-top:16px">${ragPill(rag, true)} <span class="meta">${state.programme.ragOverride ? 'Set by the programme manager (derived: ' + esc(RAG[s.rag].label) + ')' : 'Derived from the work items'}</span></div>
${state.programme.statusNote ? `<div class="note">${esc(state.programme.statusNote)}</div>` : ''}
<div class="kpis">
<div class="kpi"><b>${s.total}</b><span>work items (${SVG_PIN()}${s.local} ${SVG_UMB()}${s.umbrella})</span></div>
<div class="kpi"><b>${pct(s.progress)}</b><span>progress, effort-weighted</span></div>
<div class="kpi"><b>${s.done}</b><span>items done</span></div>
<div class="kpi"><b>${s.linksDone}/${s.links}</b><span>cells done (item × cell)</span></div>
<div class="kpi"><b style="color:${s.overdue.length ? '#dc2626' : 'inherit'}">${s.overdue.length}</b><span>overdue</span></div>
<div class="kpi"><b style="color:${s.blocked.length ? '#dc2626' : 'inherit'}">${s.blocked.length}</b><span>blocked</span></div>
<div class="kpi"><b>${fmtNum(s.effortRemaining)}</b><span>person-days remaining of ${fmtNum(s.effortEst)}</span></div>
${s.cost ? `<div class="kpi"><b>${esc(s.cost.toLocaleString())}</b><span>planned cost</span></div>` : ''}
</div>
<h2>Milestones</h2>${milestoneTable(state, now)}
<h2>Key risks and issues</h2>${raidTable(state, openRI.slice(0, 8))}
${decisions.length ? `<h2>Decisions needed</h2>${raidTable(state, decisions)}` : ''}
<h2>Exceptions: overdue and blocked</h2>${itemTable(state, exceptions, ['key', 'title', 'owner', 'status', 'due', 'late', 'update'])}
<h2>Due in the next 14 days</h2>${itemTable(state, s.dueSoon.slice().sort(sortByDue), ['key', 'title', 'owner', 'rag', 'due', 'progress'])}
<h2>Completed in the last 14 days</h2>${itemTable(state, doneRecent, ['key', 'title', 'owner', 'done'])}
<h2>Progress by CSF function</h2>${functionBreakdown(items, now)}
<h2>Trend</h2>${burnupSVG(state.snapshots)}
<h2>Local and Umbrella work</h2>
<table><thead><tr><th>Type</th><th class="num">Items</th><th class="num">Open</th><th class="num">Done</th><th class="num">Cells reached</th><th class="num">Effort (pd)</th><th>Progress</th></tr></thead><tbody>${['local', 'umbrella'].map(t => {
            const its = live.filter(i => i.type === t);
            const reach = new Set(its.flatMap(i => i.cells || [])).size;
            const p = weightedProgress(its);
            return `<tr><td>${typeSym(t)}${WORK_TYPES[t].label}<br><span class="meta">${esc(WORK_TYPES[t].blurb)}</span></td><td class="num">${its.length}</td><td class="num">${its.filter(i => !isClosed(i)).length}</td><td class="num">${its.filter(i => i.status === 'done').length}</td><td class="num">${reach} / 60</td><td class="num">${fmtNum(sum(its.map(i => num(i.effortEst))))}</td><td>${its.length ? barHTML(p) + `<span class="meta">${Math.round(p)}%</span>` : ''}</td></tr>`;
        }).join('')}</tbody></table>`;
        return reportShell('Programme status report', state, body);
    }

    if (kind === 'coverage') {
        const grid = `<table class="grid"><thead><tr><th style="text-align:left">Cluster</th>${CSF_FUNCTIONS.map(f => `<th><span class="dot" style="background:${f.color}"></span>${f.id}</th>`).join('')}</tr></thead><tbody>${CLUSTERS.map(c =>
            `<tr><th style="text-align:left;white-space:nowrap">#${c.id} ${esc(c.name)}</th>${CSF_FUNCTIONS.map(f => {
                const cs = cellStats(items, cellKey(c.id, f.id), now);
                if (!cs.total) return '<td class="gap">—</td>';
                return `<td>${cs.local ? SVG_PIN() + cs.local + ' ' : ''}${cs.umbrella ? SVG_UMB() + cs.umbrella : ''}<br><b>${Math.round(cs.progress)}%</b>${cs.overdue ? ` <span style="color:#dc2626">${cs.overdue} late</span>` : ''}</td>`;
            }).join('')}</tr>`).join('')}</tbody></table>
<div class="legend"><span>${SVG_PIN()}Local items</span><span>${SVG_UMB()}Umbrella items</span><span>Percentage = effort-weighted progress of the work in the cell</span><span>Hatched = no work planned</span></div>`;
        const gaps = [];
        CLUSTERS.forEach(c => CSF_FUNCTIONS.forEach(f => { if (!cellStats(items, cellKey(c.id, f.id), now).total) gaps.push({ c, f }); }));
        const umb = live.filter(i => i.type === 'umbrella').sort((a, b) => (b.cells || []).length - (a.cells || []).length);
        const uplift = live.filter(i => i.maturityTo !== '' && i.maturityTo !== null).sort((a, b) => num(b.maturityTo) - num(b.maturityFrom) - (num(a.maturityTo) - num(a.maturityFrom)));
        const body = `
<h2>Work across the matrix</h2>${grid}
<h2>Cells without planned work (${gaps.length} of 60)</h2>
${gaps.length ? `<table><thead><tr><th>Cell</th><th>Objective</th></tr></thead><tbody>${gaps.map(g => `<tr><td class="key">#${g.c.id} ${g.f.id}</td><td>${esc(g.f.objective.replace('#X', '#' + g.c.id + ' ' + g.c.name))}</td></tr>`).join('')}</tbody></table><p class="meta">A cell without work is not a gap by itself: the Control Matrix records whether its controls already meet the target maturity.</p>` : '<p class="empty">Every cell has planned work.</p>'}
<h2>Umbrella reach</h2>
${umb.length ? `<table><thead><tr><th>Key</th><th>Umbrella work item</th><th class="num">Cells</th><th class="num">Done</th><th>Coverage</th><th>Status</th></tr></thead><tbody>${umb.map(i => `<tr><td class="key">${esc(i.key)}</td><td>${SVG_UMB()}${esc(i.title)}<br><span class="meta">${esc(i.control)} — scope ${esc(scopeLabel(i.scope))}</span></td><td class="num">${(i.cells || []).length}</td><td class="num">${cellsDoneCount(i)}</td><td class="cells">${esc(summariseCells(i.cells || []))}</td><td>${statusPill(i.status)}</td></tr>`).join('')}</tbody></table>` : '<p class="empty">No Umbrella work.</p>'}
<h2>Planned maturity uplift</h2>${itemTable(state, uplift, ['key', 'title', 'maturity', 'status', 'due'])}`;
        return reportShell('Matrix coverage report', state, body);
    }

    if (kind === 'workload') {
        const owners = [...new Set(live.map(itemOwner))].sort((a, b) => a === 'Unassigned' ? 1 : b === 'Unassigned' ? -1 : a.localeCompare(b));
        const months = [...new Set(live.filter(i => !isClosed(i) && i.dueDate).map(i => i.dueDate.slice(0, 7)))].sort();
        const rows = owners.map(o => {
            const its = live.filter(i => itemOwner(i) === o);
            const open = its.filter(i => !isClosed(i));
            const next = open.filter(i => i.dueDate).sort(sortByDue)[0];
            return { o, its, open, next, overdue: open.filter(i => i.dueDate && i.dueDate < now).length, blocked: open.filter(i => i.status === 'blocked').length, hi: open.filter(i => i.priority === 'P1' || i.priority === 'P2').length, rem: sum(open.map(i => num(i.effortEst) * (100 - itemProgress(i)) / 100)) };
        });
        const body = `
<h2>Per owner</h2>
<table><thead><tr><th>Owner</th><th class="num">Open</th><th class="num">P1/P2</th><th class="num">Overdue</th><th class="num">Blocked</th><th class="num">Remaining (pd)</th><th>Next due</th></tr></thead><tbody>${rows.map(r =>
            `<tr><td><b>${esc(r.o)}</b></td><td class="num">${r.open.length}</td><td class="num">${r.hi}</td><td class="num" style="color:${r.overdue ? '#dc2626' : 'inherit'}">${r.overdue}</td><td class="num">${r.blocked}</td><td class="num">${fmtNum(r.rem)}</td><td>${r.next ? `<span class="key">${esc(r.next.key)}</span> ${esc(fmtDate(r.next.dueDate))}` : '—'}</td></tr>`).join('')}</tbody></table>
<p class="meta">Remaining effort = estimate × (1 − progress). Items without an estimate add nothing.</p>
<h2>Open items by due month</h2>
${months.length ? `<table><thead><tr><th>Owner</th>${months.map(m => `<th class="num">${esc(new Date(m + '-01T00:00:00Z').toLocaleDateString(undefined, { month: 'short', year: '2-digit', timeZone: 'UTC' }))}</th>`).join('')}<th class="num">No date</th></tr></thead><tbody>${rows.map(r =>
            `<tr><td>${esc(r.o)}</td>${months.map(m => { const n = r.open.filter(i => i.dueDate && i.dueDate.slice(0, 7) === m).length; return `<td class="num">${n || ''}</td>`; }).join('')}<td class="num">${r.open.filter(i => !i.dueDate).length || ''}</td></tr>`).join('')}</tbody></table>` : '<p class="empty">No open item has a due date.</p>'}
${rows.map(r => r.open.length ? `<h3>${esc(r.o)}</h3>${itemTable(state, r.open.slice().sort(sortByDue), ['key', 'title', 'priority', 'status', 'rag', 'due', 'effort'])}` : '').join('')}`;
        return reportShell('Workload report', state, body);
    }

    if (kind === 'exceptions') {
        const open = live.filter(i => !isClosed(i));
        const atRisk = open.filter(i => itemRag(i, now) === 'amber').sort(sortByDue);
        const notStarted = open.filter(i => i.startDate && i.startDate <= now && (i.status === 'backlog' || i.status === 'planned')).sort(sortByDue);
        const depRows = open.map(i => ({ i, bad: dependencyConflicts(i, byId) })).filter(x => x.bad.length);
        const body = `
<h2>Overdue (${s.overdue.length})</h2>${itemTable(state, s.overdue.slice().sort(sortByDue), ['key', 'title', 'owner', 'status', 'due', 'late', 'progress'])}
<h2>Blocked (${s.blocked.length})</h2>${itemTable(state, s.blocked, ['key', 'title', 'owner', 'due', 'update'])}
<h2>At risk (${atRisk.length})</h2>${itemTable(state, atRisk, ['key', 'title', 'owner', 'status', 'due', 'progress'])}
<h2>Start date passed, not started (${notStarted.length})</h2>${itemTable(state, notStarted, ['key', 'title', 'owner', 'status', 'due'])}
<h2>Dependency conflicts (${depRows.length})</h2>
${depRows.length ? `<table><thead><tr><th>Item</th><th>Waits for</th><th>Problem</th></tr></thead><tbody>${depRows.map(({ i, bad }) => bad.map(d => `<tr><td><span class="key">${esc(i.key)}</span> ${esc(i.title)}<br><span class="meta">due ${esc(fmtDate(i.dueDate))}</span></td><td><span class="key">${esc(d.key)}</span> ${esc(d.title)}<br><span class="meta">due ${esc(fmtDate(d.dueDate))}, ${esc(STATUS[d.status].label)}</span></td><td>${d.status === 'cancelled' ? 'The prerequisite was cancelled' : !d.dueDate ? 'The prerequisite has no due date' : 'The prerequisite is due on or after this item'}</td></tr>`).join('')).join('')}</tbody></table>` : '<p class="empty">None.</p>'}
<h2>No due date (${s.unscheduled.length})</h2>${itemTable(state, s.unscheduled, ['key', 'title', 'owner', 'status', 'priority'])}
<h2>No owner (${s.unowned.length})</h2>${itemTable(state, s.unowned, ['key', 'title', 'status', 'due'])}`;
        return reportShell('Exceptions report', state, body);
    }

    if (kind === 'raid') {
        const body = RAID_KINDS.map(k => {
            const rows = state.raid.filter(r => r.kind === k.id).sort((a, b) => (a.status === b.status ? 0 : a.status === 'open' ? -1 : 1) || sevSort(a, b));
            return `<h2>${esc(k.label)}s (${rows.filter(r => r.status === 'open').length} open)</h2>${raidTable(state, rows)}`;
        }).join('');
        return reportShell('RAID log', state, body);
    }

    // register
    const sorted = items.slice().sort((a, b) => a.key.localeCompare(b.key, undefined, { numeric: true }));
    const body = `<h2>All work items (${items.length})</h2>${itemTable(state, sorted, ['key', 'title', 'where', 'owner', 'priority', 'status', 'rag', 'due', 'progress', 'effort', 'maturity'])}
<p class="meta">Cancelled items are listed but left out of every total.</p>`;
    return reportShell('Work-item register', state, body);
}

function openReport(kind, state) {
    const html = buildReport(kind, state);
    const url = URL.createObjectURL(new Blob([html], { type: 'text/html' }));
    const w = window.open(url, '_blank');
    if (!w) download(`tlctc-${kind}-report-${todayISO()}.html`, html, 'text/html');
    setTimeout(() => URL.revokeObjectURL(url), 60000);
}

function Icon({ name, size = 16, className = '', style }) {
    const ref = useRef(null);
    useEffect(() => {
        // lucide 0.469 keys icons PascalCase ("MapPin"); accept kebab-case names
        const node = lucide?.icons?.[name] || lucide?.icons?.[name.replace(/(^|-)([a-z0-9])/g, (m, d, c) => c.toUpperCase())];
        if (ref.current && node) {
            const [tag, attrs, children] = node;
            const svg = document.createElementNS('http://www.w3.org/2000/svg', tag);
            Object.entries({ ...attrs, width: size, height: size, class: className, 'aria-hidden': 'true' }).forEach(([k, v]) => svg.setAttribute(k, v));
            children.forEach(([cTag, cAttrs]) => {
                const el = document.createElementNS('http://www.w3.org/2000/svg', cTag);
                Object.entries(cAttrs).forEach(([k, v]) => el.setAttribute(k, v));
                svg.appendChild(el);
            });
            ref.current.innerHTML = '';
            ref.current.appendChild(svg);
        }
    }, [name, size, className]);
    return <span ref={ref} className="inline-flex items-center justify-center flex-shrink-0" style={style} />;
}

function TypeGlyph({ type, size = 14, withLabel = false, className = '' }) {
    const t = WORK_TYPES[type] || WORK_TYPES.local;
    return (
        <span className={`inline-flex items-center gap-1 font-semibold ${className}`} style={{ color: `hsl(var(--${t.id}))` }} title={`${t.label} work`}>
            <Icon name={t.icon} size={size} />{withLabel && <span className="text-xs">{t.label}</span>}
        </span>
    );
}

function StatusBadge({ status }) {
    const s = STATUS[status] || STATUS.backlog;
    return <span className="chip" style={{ backgroundColor: s.color + '22', color: s.color, border: `1px solid ${s.color}44` }}>{s.label}</span>;
}

function PriorityBadge({ priority }) {
    const p = PRIORITY[priority] || PRIORITY.P3;
    return <span className="chip font-mono" style={{ color: p.color, border: `1px solid ${p.color}55` }} title={p.label}>{p.id}</span>;
}

function RagDot({ rag, withLabel = false }) {
    if (!rag) return null;
    return (
        <span className="inline-flex items-center gap-1 text-[11px] font-medium" title={RAG[rag].label}>
            <span className="inline-block w-2.5 h-2.5 rounded-full" style={{ background: RAG[rag].color }} />
            {withLabel && <span style={{ color: RAG[rag].color }}>{RAG[rag].label}</span>}
        </span>
    );
}

function ProgressBar({ value, className = '', color }) {
    return (
        <div className={`h-1.5 rounded-full bg-border overflow-hidden ${className}`} role="progressbar" aria-valuenow={Math.round(value)} aria-valuemin="0" aria-valuemax="100">
            <div className="h-full rounded-full" style={{ width: `${clamp(value, 0, 100)}%`, background: color || '#16a34a' }} />
        </div>
    );
}

function Select({ value, onChange, children, className = '', label }) {
    return <select aria-label={label} value={value} onChange={e => onChange(e.target.value)} className={`input-ctrl py-1.5 text-xs w-auto ${className}`}>{children}</select>;
}

function useOutsideClose(open, setOpen) {
    const ref = useRef(null);
    useEffect(() => {
        if (!open) return;
        const handler = (e) => { if (ref.current && !ref.current.contains(e.target)) setOpen(false); };
        const key = (e) => { if (e.key === 'Escape') setOpen(false); };
        document.addEventListener('mousedown', handler);
        document.addEventListener('keydown', key);
        return () => { document.removeEventListener('mousedown', handler); document.removeEventListener('keydown', key); };
    }, [open]);
    return ref;
}

}

function HeaderDropdown({ label, icon, items, align = 'right' }) {

            <button onClick={() => setOpen(o => !o)} className="app-btn app-btn-outline app-btn-sm gap-1" title={label} aria-expanded={open}>
                <Icon name={icon} size={14} /> <span className="hidden md:inline">{label}</span>
                <Icon name="chevron-down" size={12} />

            {open && (
                <div className={`absolute ${align === 'right' ? 'right-0' : 'left-0'} top-full mt-1 bg-card border border-border rounded-lg shadow-xl z-50 py-1 min-w-[210px]`}>

                        <div key={i} className="border-t border-border my-1" />

                        <button key={i} onClick={() => { item.action(); setOpen(false); }}
