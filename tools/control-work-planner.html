function RaidEditor({ entry, isNew, state, onSave, onDelete, onClose }) {
    const [d, setD] = useState(() => ({ ...entry }));
    const set = (k, v) => setD(x => ({ ...x, [k]: v }));
    useEffect(() => {
        const h = (e) => { if (e.key === 'Escape') onClose(); };
        document.addEventListener('keydown', h);
        return () => document.removeEventListener('keydown', h);
    }, []);
    return (
        <div className="modal-overlay" onMouseDown={e => { if (e.target === e.currentTarget) onClose(); }}>
            <div className="modal-content max-w-xl" role="dialog" aria-modal="true" aria-label={isNew ? 'New RAID entry' : 'Edit RAID entry'}>
                <div className="flex items-center justify-between mb-4">
                    <h2 className="font-display font-bold text-lg">{isNew ? 'New RAID entry' : 'Edit RAID entry'}</h2>
                    <button onClick={onClose} className="app-btn app-btn-ghost app-btn-sm" aria-label="Close"><Icon name="x" size={18} /></button>
                </div>
                <div className="space-y-3">
                    <div className="grid grid-cols-3 gap-3">
                        <Field label="Type"><select className="input-ctrl" value={d.kind} onChange={e => set('kind', e.target.value)}>{RAID_KINDS.map(k => <option key={k.id} value={k.id}>{k.label}</option>)}</select></Field>
                        <Field label="Severity"><select className="input-ctrl" value={d.severity} onChange={e => set('severity', e.target.value)}>{SEVERITIES.map(s => <option key={s.id} value={s.id}>{s.label}</option>)}</select></Field>
                        <Field label="Status"><select className="input-ctrl" value={d.status} onChange={e => set('status', e.target.value)}><option value="open">Open</option><option value="closed">Closed</option></select></Field>
                    </div>
                    <Field label="Title"><input autoFocus className="input-ctrl" value={d.title} onChange={e => set('title', e.target.value)} /></Field>
                    <Field label="Description"><textarea rows="2" className="input-ctrl" value={d.description} onChange={e => set('description', e.target.value)} /></Field>
                    <Field label="Response (mitigation, action, or the decision taken)"><textarea rows="2" className="input-ctrl" value={d.mitigation} onChange={e => set('mitigation', e.target.value)} /></Field>
                    <div className="grid grid-cols-2 gap-3">
                        <Field label="Owner"><input className="input-ctrl" value={d.owner} onChange={e => set('owner', e.target.value)} /></Field>
                        <Field label="Review or due date"><input type="date" className="input-ctrl" value={d.dueDate} onChange={e => set('dueDate', e.target.value)} /></Field>
                    </div>
                    <div>
                        <span className="field-label">Linked work items</span>
                        <div className="max-h-40 overflow-y-auto border border-border rounded-lg p-2 space-y-1">
                            {state.items.map(i => (
                                <label key={i.id} className="flex items-center gap-2 text-xs">
                                    <input type="checkbox" checked={d.itemIds.includes(i.id)} onChange={e => set('itemIds', e.target.checked ? [...d.itemIds, i.id] : d.itemIds.filter(x => x !== i.id))} />
                                    <TypeGlyph type={i.type} size={11} /><span className="font-mono text-muted-foreground">{i.key}</span><span className="truncate">{i.title}</span>
                                </label>
                            ))}
                            {!state.items.length && <p className="text-xs text-muted-foreground">No work items yet.</p>}
                        </div>
                    </div>
                </div>
                <div className="flex items-center gap-2 mt-5 pt-4 border-t border-border">
                    {!isNew && <button onClick={() => { if (window.confirm('Delete this RAID entry?')) onDelete(d.id); }} className="app-btn app-btn-ghost app-btn-sm text-red-600 dark:text-red-400"><Icon name="trash-2" size={13} /> Delete</button>}
                    <span className="ml-auto" />
                    <button onClick={onClose} className="app-btn app-btn-outline app-btn-sm">Cancel</button>
                    <button onClick={() => d.title.trim() && onSave(d)} disabled={!d.title.trim()} className="app-btn app-btn-primary app-btn-sm disabled:opacity-40">{isNew ? 'Add entry' : 'Save changes'}</button>
                </div>
            </div>
        </div>
    );
}

function PlanView({ state, stats, now, update, onOpenItem, onEditRaid }) {
    const p = state.programme;
    const setP = (k, v) => update(s => ({ ...s, programme: { ...s.programme, [k]: v } }));
    const [raidKind, setRaidKind] = useState('');
    const byId = Object.fromEntries(state.items.map(i => [i.id, i]));
    const addEnv = () => update(s => ({ ...s, environments: [...s.environments, { id: genId('env'), name: `Environment ${s.environments.length + 1}` }] }));
    const removeEnv = (id) => {
        const used = state.items.filter(i => i.envId === id).length;
        if (state.environments.length < 2) return;
        if (used && !window.confirm(`${used} Local work item(s) use this environment. They move to the first remaining environment. Continue?`)) return;
        update(s => { const rest = s.environments.filter(e => e.id !== id); return { ...s, environments: rest, items: s.items.map(i => i.envId === id ? { ...i, envId: rest[0].id } : i) }; });
    };
    const addMs = () => update(s => ({ ...s, milestones: [...s.milestones, { id: genId('m'), name: 'New milestone', date: addDays(now, 30), description: '' }] }));
    const setMs = (id, k, v) => update(s => ({ ...s, milestones: s.milestones.map(m => m.id === id ? { ...m, [k]: v } : m) }));
    const removeMs = (id) => { if (!window.confirm('Delete this milestone? Linked work items stay, without a milestone.')) return; update(s => ({ ...s, milestones: s.milestones.filter(m => m.id !== id), items: s.items.map(i => i.milestoneId === id ? { ...i, milestoneId: '' } : i) })); };
    const raid = state.raid.filter(r => !raidKind || r.kind === raidKind).sort((a, b) => (a.status === b.status ? 0 : a.status === 'open' ? -1 : 1) || sevSort(a, b));
    const ms = state.milestones.slice().sort((a, b) => (a.date || '9999') < (b.date || '9999') ? -1 : 1);

    return (
        <div className="px-4 sm:px-6 py-4 grid lg:grid-cols-2 gap-5 items-start">
            <section className="card p-4">
                <h2 className="font-display font-bold text-base mb-3">Programme</h2>
                <div className="space-y-3">
                    <Field label="Name"><input className="input-ctrl" value={p.name} onChange={e => setP('name', e.target.value)} /></Field>
                    <div className="grid grid-cols-2 gap-3">
                        <Field label="Sponsor"><input className="input-ctrl" value={p.sponsor} onChange={e => setP('sponsor', e.target.value)} /></Field>
                        <Field label="Programme manager"><input className="input-ctrl" value={p.manager} onChange={e => setP('manager', e.target.value)} /></Field>
                        <Field label="Start"><input type="date" className="input-ctrl" value={p.startDate} onChange={e => setP('startDate', e.target.value)} /></Field>
                        <Field label="End"><input type="date" className="input-ctrl" value={p.endDate} onChange={e => setP('endDate', e.target.value)} /></Field>
                        <Field label="Target maturity (used for Control Matrix imports)">
                            <select className="input-ctrl" value={p.targetMaturity} onChange={e => setP('targetMaturity', Number(e.target.value))}>{MATURITY_LEVELS.map((l, k) => <option key={k} value={k}>{k} {l}</option>)}</select>
                        </Field>
                        <Field label="Overall status (RAG)">
                            <select className="input-ctrl" value={p.ragOverride} onChange={e => setP('ragOverride', e.target.value)}>
                                <option value="">Derived: {RAG[stats.rag].label}</option>
                                <option value="green">Set: On track</option>
                                <option value="amber">Set: At risk</option>
                                <option value="red">Set: Off track</option>
                            </select>
                        </Field>
                    </div>
                    <Field label="Status note (opens the status report)"><textarea rows="3" className="input-ctrl" value={p.statusNote} onChange={e => setP('statusNote', e.target.value)} placeholder="Two or three sentences: where the programme stands and what the steering committee needs to know" /></Field>
                </div>
                <h3 className="text-sm font-semibold mt-5 mb-2">How the status is derived</h3>
                <dl className="text-xs space-y-1.5">
                    {RAG_RULES.map(([k, v]) => <div key={k} className="grid grid-cols-[5.5rem_1fr] gap-2"><dt className="font-semibold">{k}</dt><dd className="text-muted-foreground">{v}</dd></div>)}
                </dl>
            </section>

            <section className="card p-4">
                <div className="flex items-center justify-between mb-1">
                    <h2 className="font-display font-bold text-base">Environments</h2>
                    <button onClick={addEnv} className="app-btn app-btn-outline app-btn-sm"><Icon name="plus" size={13} /> Add</button>
                </div>
                <p className="text-xs text-muted-foreground mb-3">Local work belongs to one environment. Umbrella work covers all of them.</p>
                <ul className="space-y-1.5">
                    {state.environments.map(e => (
                        <li key={e.id} className="flex items-center gap-2">
                            <TypeGlyph type="local" size={13} />
                            <input className="input-ctrl py-1" value={e.name} aria-label="Environment name" onChange={ev => update(s => ({ ...s, environments: s.environments.map(x => x.id === e.id ? { ...x, name: ev.target.value } : x) }))} />
                            <span className="text-[11px] text-muted-foreground whitespace-nowrap tabular-nums">{plural(state.items.filter(i => i.envId === e.id && i.type === 'local').length, 'item')}</span>
                            <button onClick={() => removeEnv(e.id)} disabled={state.environments.length < 2} className="app-btn app-btn-ghost app-btn-xs disabled:opacity-30" aria-label={`Delete ${e.name}`}><Icon name="trash-2" size={13} /></button>
                        </li>
                    ))}
                </ul>

                <div className="flex items-center justify-between mt-6 mb-2">
                    <h2 className="font-display font-bold text-base">Milestones</h2>
                    <button onClick={addMs} className="app-btn app-btn-outline app-btn-sm"><Icon name="plus" size={13} /> Add</button>
                </div>
                {!ms.length && <p className="text-xs text-muted-foreground">No milestones. Add one, then link work items to it in the work-item editor.</p>}
                <ul className="space-y-3">
                    {ms.map(m => {
                        const st = milestoneStatus(m, state.items, now);
                        return (
                            <li key={m.id} className="border border-border rounded-lg p-2.5">
                                <div className="flex flex-wrap items-center gap-2">
                                    <span className="w-2.5 h-2.5 rotate-45 flex-shrink-0" style={{ background: st.color }} />
                                    <input className="input-ctrl py-1 flex-1 min-w-[10rem] font-medium" value={m.name} aria-label="Milestone name" onChange={e => setMs(m.id, 'name', e.target.value)} />
                                    <input type="date" className="input-ctrl py-1 w-36" value={m.date} aria-label="Milestone date" onChange={e => setMs(m.id, 'date', e.target.value)} />
                                    <button onClick={() => removeMs(m.id)} className="app-btn app-btn-ghost app-btn-xs" aria-label={`Delete ${m.name}`}><Icon name="trash-2" size={13} /></button>
                                </div>
                                <input className="input-ctrl py-1 mt-1.5 text-xs" value={m.description} placeholder="What is true when this milestone is reached" aria-label="Milestone description" onChange={e => setMs(m.id, 'description', e.target.value)} />
                                <div className="flex items-center gap-3 mt-1.5 text-[11px]">
                                    <span className="font-semibold" style={{ color: st.color }}>{st.label}</span>
                                    <span className="text-muted-foreground">{st.linked.length} linked item{st.linked.length === 1 ? '' : 's'}</span>
                                    {st.linked.length > 0 && <ProgressBar value={st.progress} className="w-24" />}
                                    {st.linked.length > 0 && <span className="text-muted-foreground tabular-nums">{Math.round(st.progress)}%</span>}
                                </div>
                            </li>
                        );
                    })}
                </ul>
            </section>

            <section className="card p-4 lg:col-span-2">
                <div className="flex flex-wrap items-center gap-3 mb-3">
                    <h2 className="font-display font-bold text-base">RAID log</h2>
                    <span className="text-xs text-muted-foreground">Risks, assumptions, issues, dependencies and decisions of the programme.</span>
                    <Select label="RAID type" value={raidKind} onChange={setRaidKind} className="ml-auto">
                        <option value="">All types</option>
                        {RAID_KINDS.map(k => <option key={k.id} value={k.id}>{k.label}s</option>)}
                    </Select>
                    <button onClick={() => onEditRaid(null, raidKind || 'risk')} className="app-btn app-btn-outline app-btn-sm"><Icon name="plus" size={13} /> Add entry</button>
                </div>
                <div className="overflow-x-auto">
                    <table className="w-full text-sm" style={{ minWidth: 760 }}>
                        <thead><tr><th className="th">Type</th><th className="th">Entry</th><th className="th">Severity</th><th className="th">Owner</th><th className="th">Due</th><th className="th">Status</th><th className="th">Work items</th></tr></thead>
                        <tbody>
                            {raid.map(r => (
                                <tr key={r.id} className={`hover:bg-accent/50 cursor-pointer ${r.status === 'closed' ? 'opacity-60' : ''}`} onClick={() => onEditRaid(r)}>
                                    <td className="td whitespace-nowrap text-xs"><span className="inline-flex items-center gap-1"><Icon name={RAID_KIND[r.kind].icon} size={13} />{RAID_KIND[r.kind].label}</span></td>
                                    <td className="td"><button className="text-left font-medium hover:underline" onClick={e => { e.stopPropagation(); onEditRaid(r); }}>{r.title}</button>{r.mitigation && <div className="text-[11px] text-muted-foreground">Response: {r.mitigation}</div>}</td>
                                    <td className="td"><span className="chip" style={{ color: SEVERITY[r.severity].color, border: `1px solid ${SEVERITY[r.severity].color}55` }}>{SEVERITY[r.severity].label}</span></td>
                                    <td className="td text-xs">{r.owner || '—'}</td>
                                    <td className={`td text-xs whitespace-nowrap ${r.status === 'open' && r.dueDate && r.dueDate < now ? 'text-red-600 dark:text-red-400 font-semibold' : ''}`}>{fmtDate(r.dueDate)}</td>
                                    <td className="td text-xs">{r.status === 'open' ? 'Open' : 'Closed'}</td>
                                    <td className="td text-xs font-mono">{r.itemIds.map(id => byId[id] && <button key={id} onClick={e => { e.stopPropagation(); onOpenItem(id); }} className="mr-1.5 hover:underline">{byId[id].key}</button>)}</td>
                                </tr>
                            ))}
                            {!raid.length && <tr><td colSpan="7" className="td text-center text-muted-foreground py-6">No entries yet.</td></tr>}
                        </tbody>
                    </table>
                </div>
            </section>
        </div>
    );
}

function ImportModal({ state, onClose, onApply }) {
    const [json, setJson] = useState(null);
    const [error, setError] = useState('');
    const [fileName, setFileName] = useState('');
    const [mode, setMode] = useState('replace');
    const [cmOpts, setCmOpts] = useState({ target: state.programme.targetMaturity, belowOnly: true, tasks: true });
    const [dragging, setDragging] = useState(false);
    const fileRef = useRef(null);
    useEffect(() => {
        const h = (e) => { if (e.key === 'Escape') onClose(); };
        document.addEventListener('keydown', h);
        return () => document.removeEventListener('keydown', h);
    }, []);
    const read = (file) => {
        if (!file) return;
        setFileName(file.name); setError(''); setJson(null);
        const r = new FileReader();
        r.onload = () => {
            try {
                const j = JSON.parse(r.result);
                if (!isPlannerExport(j) && !isControlMatrixExport(j)) { setError('This file is neither a Control Work Planner export (it needs an "items" array) nor a Control Matrix export (it needs "environments" with "cells").'); return; }
                setJson(j);
                if (isControlMatrixExport(j) && j.targetMaturity !== undefined) setCmOpts(o => ({ ...o, target: clamp(num(j.targetMaturity), 0, 5) }));
            } catch (e) { setError(`The file is not valid JSON: ${e.message}`); }
        };
        r.readAsText(file);
    };
    const kind = json ? (isPlannerExport(json) ? 'planner' : 'cm') : null;
    const preview = useMemo(() => kind === 'cm' ? convertControlMatrix(json, state, cmOpts) : null, [json, kind, cmOpts, state]);
    return (
        <div className="modal-overlay" onMouseDown={e => { if (e.target === e.currentTarget) onClose(); }}>
            <div className="modal-content max-w-xl" role="dialog" aria-modal="true" aria-label="Import">
                <div className="flex items-center justify-between mb-3">
                    <h2 className="font-display font-bold text-lg">Import</h2>
                    <button onClick={onClose} className="app-btn app-btn-ghost app-btn-sm" aria-label="Close"><Icon name="x" size={18} /></button>
                </div>
                <p className="text-sm text-muted-foreground mb-3">Choose a plan exported from this tool, or an export from the <a href="control-matrix.html" className="underline">Control Matrix</a>: its controls become work items, shared controls become one Umbrella item across every cell that links them.</p>
                <div onDragOver={e => { e.preventDefault(); setDragging(true); }} onDragLeave={() => setDragging(false)} onDrop={e => { e.preventDefault(); setDragging(false); read(e.dataTransfer.files[0]); }}
                     className={`rounded-xl border-2 border-dashed p-6 text-center ${dragging ? 'border-primary bg-primary/5' : 'border-border'}`}>
                    <Icon name="file-up" size={26} className="text-muted-foreground" />
                    <p className="text-sm mt-2">Drop a JSON file here, or</p>
                    <button onClick={() => fileRef.current?.click()} className="app-btn app-btn-outline app-btn-sm mt-2">Choose file</button>
                    <input ref={fileRef} type="file" accept=".json,application/json" className="hidden" onChange={e => read(e.target.files[0])} />
                    {fileName && <p className="text-xs text-muted-foreground mt-2">{fileName}</p>}
                </div>
                {error && <p className="text-sm text-red-600 dark:text-red-400 mt-3">{error}</p>}

                {kind === 'planner' && (
                    <div className="mt-4 space-y-2 text-sm">
                        <p><span className="font-semibold">Control Work Planner plan:</span> {plural(json.items.length, 'work item')}, {plural((json.milestones || []).length, 'milestone')}, {plural((json.raid || []).length, 'RAID entry').replace('entrys', 'entries')}{json.programme?.name ? ` — “${json.programme.name}”` : ''}.</p>
                        <label className="flex items-start gap-2"><input type="radio" name="mode" checked={mode === 'replace'} onChange={() => setMode('replace')} className="mt-1" /><span><span className="font-medium">Replace the current plan</span><span className="block text-xs text-muted-foreground">Everything in this browser is overwritten. Export first if you want to keep it.</span></span></label>
                        <label className="flex items-start gap-2"><input type="radio" name="mode" checked={mode === 'merge'} onChange={() => setMode('merge')} className="mt-1" /><span><span className="font-medium">Add to the current plan</span><span className="block text-xs text-muted-foreground">Work items get new keys; environments with the same name are joined.</span></span></label>
                    </div>
                )}
                {kind === 'cm' && preview && (
                    <div className="mt-4 space-y-3 text-sm">
                        <p><span className="font-semibold">Control Matrix export:</span> {(json.environments || []).length} environment(s){json.orgName ? ` — ${json.orgName}` : ''}.</p>
                        <div className="grid grid-cols-2 gap-3">
                            <Field label="Target maturity">
                                <select className="input-ctrl" value={cmOpts.target} onChange={e => setCmOpts(o => ({ ...o, target: Number(e.target.value) }))}>{MATURITY_LEVELS.map((l, k) => <option key={k} value={k}>{k} {l}</option>)}</select>
                            </Field>
                        </div>
                        <label className="flex items-center gap-2"><input type="checkbox" checked={cmOpts.belowOnly} onChange={e => setCmOpts(o => ({ ...o, belowOnly: e.target.checked }))} /> Only controls below the target (or not yet assessed)</label>
                        <label className="flex items-center gap-2"><input type="checkbox" checked={cmOpts.tasks} onChange={e => setCmOpts(o => ({ ...o, tasks: e.target.checked }))} /> Also import the cell tasks</label>
                        <div className="rounded-lg bg-muted p-3 text-xs space-y-1">
                            <p className="flex items-center gap-3"><span className="font-semibold">{preview.items.length} new work items</span>
                                <span className="inline-flex items-center gap-1"><TypeGlyph type="local" size={12} />{preview.items.filter(i => i.type === 'local').length}</span>
                                <span className="inline-flex items-center gap-1"><TypeGlyph type="umbrella" size={12} />{preview.items.filter(i => i.type === 'umbrella').length}</span></p>
                            {preview.skipped > 0 && <p className="text-muted-foreground">{preview.skipped} already imported earlier — skipped.</p>}
                            <p className="text-muted-foreground">They are added to the current plan in Backlog; environments are matched by name.</p>
                        </div>
                    </div>
                )}

                <div className="flex justify-end gap-2 mt-5 pt-4 border-t border-border">
                    <button onClick={onClose} className="app-btn app-btn-outline app-btn-sm">Cancel</button>
                    <button disabled={!kind || (kind === 'cm' && !preview?.items.length)} onClick={() => onApply(kind, json, kind === 'cm' ? cmOpts : mode)} className="app-btn app-btn-primary app-btn-sm disabled:opacity-40">
                        {kind === 'cm' ? `Add ${preview?.items.length || 0} work items` : mode === 'merge' ? 'Add to plan' : 'Replace plan'}
                    </button>
                </div>
            </div>
        </div>
    );
}

const VIEWS = [
    { id: 'matrix',   label: 'Matrix',   icon: 'grid-3x3' },
    { id: 'board',    label: 'Board',    icon: 'kanban' },
    { id: 'list',     label: 'List',     icon: 'list' },
    { id: 'timeline', label: 'Timeline', icon: 'calendar-range' },
    { id: 'plan',     label: 'Plan and RAID', icon: 'clipboard-list' },
    { id: 'reports',  label: 'Reports',  icon: 'file-text' },
];

const lsGet = (k, d) => { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch (e) { return d; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };

function App() {
    const [state, setState] = useState(() => loadState());
    const [view, setView] = useState(() => { const v = lsGet('tlctc-cwp-view', 'matrix'); return VIEWS.some(x => x.id === v) ? v : 'matrix'; });
    const [filters, setFilters] = useState(EMPTY_FILTERS);
    const [heat, setHeat] = useState('progress');
    const [selectedCell, setSelectedCell] = useState(null);
    const [editor, setEditor] = useState(null);      // { item, isNew }
    const [raidEditor, setRaidEditor] = useState(null);
    const [showImport, setShowImport] = useState(false);
    const [mobileMenu, setMobileMenu] = useState(false);
    const [toast, setToast] = useState('');
    const [noticeDismissed, setNoticeDismissed] = useState(() => lsGet('tlctc-cwp-dismiss-intro', '') === '1');
    const [darkMode, setDarkMode] = useState(() => {
        const saved = lsGet('tlctc-cwp-dark', null);
        if (saved !== null) return saved === 'true';
        return window.matchMedia?.('(prefers-color-scheme: dark)').matches || false;
    });
    const now = todayISO();

    const stateRef = useRef(state);
    stateRef.current = state;
    useEffect(() => { saveState(state); }, [state]);
    useEffect(() => { document.documentElement.classList.toggle('dark', darkMode); lsSet('tlctc-cwp-dark', String(darkMode)); }, [darkMode]);
    useEffect(() => { lsSet('tlctc-cwp-view', view); }, [view]);
    useEffect(() => { if (!toast) return; const t = setTimeout(() => setToast(''), toast.action ? 7000 : 3200); return () => clearTimeout(t); }, [toast]);
    useEffect(() => {
        const h = (e) => { if (e.key === 'Escape' && !editor && !raidEditor && !showImport) setSelectedCell(null); };
        document.addEventListener('keydown', h);
        return () => document.removeEventListener('keydown', h);
    }, [editor, raidEditor, showImport]);

    const update = useCallback((fn) => setState(s => withSnapshot({ ...fn(s), updatedAt: new Date().toISOString() })), []);

    const filtered = useMemo(() => state.items.filter(i => matchesFilters(i, filters, now)), [state.items, filters, now]);
    const stats = useMemo(() => computeStats(state.items, now), [state.items, now]);
    const owners = useMemo(() => [...new Set(state.items.map(itemOwner))].sort(), [state.items]);

    // Status transitions keep doneAt honest
    const applyStatus = (old, next) => {
        if (next.status === 'done' && (!old || old.status !== 'done')) return { ...next, doneAt: todayISO() };
        if (next.status !== 'done') return { ...next, doneAt: '' };
        return next;
    };
    const saveItem = (draft) => {
        const envIds = state.environments.map(e => e.id);
        update(s => {
            const old = s.items.find(i => i.id === draft.id);
            const it = applyStatus(old, normaliseItem(draft, envIds));
            if (old) return { ...s, items: s.items.map(i => i.id === it.id ? it : i) };
            return { ...s, items: [...s.items, it], nextKey: s.nextKey + 1 };
        });
        setToast(editor?.isNew ? `Added ${draft.key}` : `Saved ${draft.key}`);
        setEditor(null);
    };
    // An item with several cells may become Done only after each of its cells is set done
    const doneBlockedMsg = (it) => ({ text: `${it.key} covers ${it.cells.length} cells and ${openCellCount(it)} of them are not done yet. Set each cell done first.`, action: { label: 'Open item', fn: () => openItem(it.id) } });
    const patchItem = (id, patch) => {
        const it = stateRef.current.items.find(i => i.id === id);
        if (!it) return false;
        if (patch.status === 'done' && it.cells.length > 1 && openCellCount(it) > 0) { setToast(doneBlockedMsg(it)); return false; }
        update(s => ({ ...s, items: s.items.map(i => i.id === id ? normaliseItem(applyStatus(i, { ...i, ...patch }), s.environments.map(e => e.id)) : i) }));
        return true;
    };
    const toggleCell = (id, ck) => {
        const it = stateRef.current.items.find(i => i.id === id);
        if (!it) return;
        const cd = { ...(it.cellDone || {}) };
        const wasDone = !!cd[ck];
        if (wasDone) delete cd[ck]; else cd[ck] = todayISO();
        const reopen = wasDone && it.status === 'done';
        update(s => ({ ...s, items: s.items.map(i => i.id === id ? { ...i, cellDone: cd, ...(reopen ? { status: 'in-progress', doneAt: '' } : {}) } : i) }));
        const n = it.cells.length, done = it.cells.filter(k => cd[k]).length;
        if (!wasDone && done === n) setToast({ text: n > 1 ? `${it.key}: all ${n} cells done` : `${it.key} done in ${cellLabel(ck)}`, action: { label: 'Set item to Done', fn: () => { if (patchItem(id, { status: 'done' })) setToast(`${it.key} set to Done`); } } });
        else setToast(wasDone ? `${it.key} reopened in ${cellLabel(ck)}${reopen ? ' — item back to In progress' : ''}` : `${it.key} done in ${cellLabel(ck)} (${done} of ${n} cells)`);
    };
    const deleteItem = (id) => {
        const key = state.items.find(i => i.id === id)?.key;
        update(s => ({ ...s, items: s.items.filter(i => i.id !== id).map(i => ({ ...i, dependsOn: (i.dependsOn || []).filter(d => d !== id) })), raid: s.raid.map(r => ({ ...r, itemIds: r.itemIds.filter(x => x !== id) })) }));
        setEditor(null); setToast(`Deleted ${key}`);
    };
    const newItem = (patch = {}) => setEditor({ item: blankItem(state, { owner: '', ...patch, cells: patch.cells || (selectedCell ? [selectedCell] : []) }), isNew: true });
    const duplicateItem = (d) => setEditor({ item: { ...d, id: genId(), key: nextItemKey(state), title: d.title + ' (copy)', status: 'backlog', doneAt: '', cellDone: {}, updates: [], source: null, checklist: (d.checklist || []).map(c => ({ ...c, id: genId('k'), done: false })) }, isNew: true });
    const openItem = (id) => { const it = state.items.find(i => i.id === id); if (it) setEditor({ item: it, isNew: false }); };
    const moveItem = (id, status) => { const it = state.items.find(i => i.id === id); if (it && it.status !== status && patchItem(id, { status })) setToast(`${it.key} moved to ${STATUS[status].label}`); };

    const saveRaid = (d) => { update(s => s.raid.some(r => r.id === d.id) ? { ...s, raid: s.raid.map(r => r.id === d.id ? d : r) } : { ...s, raid: [...s.raid, d] }); setRaidEditor(null); };
    const deleteRaid = (id) => { update(s => ({ ...s, raid: s.raid.filter(r => r.id !== id) })); setRaidEditor(null); };
    const editRaid = (entry, kind) => setRaidEditor(entry ? { entry, isNew: false } : { entry: { id: genId('r'), kind: kind || 'risk', title: '', description: '', owner: '', severity: 'medium', status: 'open', dueDate: '', itemIds: [], mitigation: '', createdAt: todayISO() }, isNew: true });

    const exportJSON = () => {
        const out = { ...state, tool: TOOL_ID, schemaVersion: SCHEMA_VERSION, exportedAt: new Date().toISOString() };
        download(`tlctc-control-work-plan-${now}.json`, JSON.stringify(out, null, 2), 'application/json');
        setToast('Plan exported');
    };
    const exportCSV = (which) => {
        const its = which === 'filtered' ? filtered : state.items;
        download(`tlctc-work-items-${which}-${now}.csv`, itemsToCSV(state, its), 'text/csv;charset=utf-8');
        setToast(`${its.length} work items exported`);
    };
    const applyImport = (kind, json, opt) => {
        if (kind === 'planner') {
            if (opt === 'replace') { setState(withSnapshot(normaliseState(json))); setToast(`Plan replaced: ${json.items.length} work items`); }
            else { const { next, counts } = mergePlanner(state, json); setState(withSnapshot(next)); setToast(`Added ${counts.items} work items, ${counts.milestones} milestones, ${counts.raid} RAID entries`); }
        } else {
            const conv = convertControlMatrix(json, state, opt);
            const { next } = mergeItems(state, conv.items, conv.environments);
            setState(withSnapshot({ ...next, programme: { ...next.programme, targetMaturity: opt.target } }));
            setToast(`Added ${conv.items.length} work items from the Control Matrix`);
        }
        setShowImport(false); setSelectedCell(null);
    };
    const loadExample = () => {
        if (state.items.length && !window.confirm('Replace the current plan with the example plan? Export first if you want to keep your data.')) return;
        setState(withSnapshot(buildExampleState())); setSelectedCell(null); setFilters(EMPTY_FILTERS); setToast('Example plan loaded');
    };
    const resetAll = () => {
        if (!window.confirm('Delete every work item, milestone and RAID entry stored by this tool in this browser? Export first if you want to keep them. This cannot be undone.')) return;
        setState(createDefaultState()); setSelectedCell(null); setFilters(EMPTY_FILTERS); setToast('All data deleted');
    };
    const emptyAction = (a) => { if (a === 'new') newItem({ cells: [] }); if (a === 'import') setShowImport(true); if (a === 'example') loadExample(); };

    return (
        <div className="flex flex-col min-h-screen">
            <Header darkMode={darkMode} onToggleDark={() => setDarkMode(d => !d)} onReport={(k) => openReport(k, state)}
                    onExportJSON={exportJSON} onExportCSV={exportCSV} onImport={() => setShowImport(true)}
                    onLoadExample={loadExample} onReset={resetAll} onToggleMobileMenu={() => setMobileMenu(true)} />
            <MobileNavMenu open={mobileMenu} onClose={() => setMobileMenu(false)} />
            {!noticeDismissed && (
                <div className="ai-disclaimer no-print">
                    Plan the work behind the Control Matrix: a work item covers one or more cluster × function cells. <strong>Local</strong> work serves one environment; <strong>Umbrella</strong> work is one enterprise-wide capability, counted once. Set an item done in each cell it covers; it can be set to Done when every cell is. The example plan is illustrative. Everything stays in this browser — export to keep a copy.
                    <button onClick={() => { setNoticeDismissed(true); lsSet('tlctc-cwp-dismiss-intro', '1'); }} title="Dismiss" aria-label="Dismiss">&times;</button>
                </div>
            )}

            <ProgrammeStrip state={state} stats={stats} now={now} onRename={v => update(s => ({ ...s, programme: { ...s.programme, name: v } }))} onGoPlan={() => setView('plan')} />

            <div className="px-4 sm:px-6 border-b border-border flex items-end gap-1 overflow-x-auto no-print">
                <nav className="flex gap-1" aria-label="Views">
                    {VIEWS.map(v => (
                        <button key={v.id} onClick={() => setView(v.id)} className={`tab-btn ${view === v.id ? 'active' : ''}`} aria-current={view === v.id ? 'page' : undefined}>
                            <Icon name={v.icon} size={14} /> {v.label}
                        </button>
                    ))}
                </nav>
                <button onClick={() => newItem()} className="app-btn app-btn-primary app-btn-sm ml-auto mb-1.5 whitespace-nowrap"><Icon name="plus" size={13} /> New work item</button>
            </div>

            {['matrix', 'board', 'list', 'timeline'].includes(view) && (
                <FilterBar filters={filters} setFilters={setFilters} state={state} owners={owners} shown={filtered.length} total={state.items.length} />
            )}

            <main className="flex-1">
                {view === 'matrix' && <MatrixView items={filtered} now={now} selectedCell={selectedCell} onSelectCell={ck => setSelectedCell(c => c === ck ? null : ck)} heat={heat} setHeat={setHeat} onEmptyAction={emptyAction} hasAnyItems={state.items.length > 0} />}
                {view === 'board' && <BoardView items={filtered} state={state} now={now} onOpen={openItem} onMove={moveItem} />}
                {view === 'list' && <ListView items={filtered} state={state} now={now} onOpen={openItem} onPatch={patchItem} />}
                {view === 'timeline' && <TimelineView items={filtered} state={state} now={now} onOpen={openItem} />}
                {view === 'plan' && <PlanView state={state} stats={stats} now={now} update={update} onOpenItem={openItem} onEditRaid={editRaid} />}
                {view === 'reports' && <ReportsView state={state} onReport={(k) => openReport(k, state)} onExportJSON={exportJSON} onExportCSV={exportCSV} filteredCount={filtered.length} />}
            </main>

            {view === 'matrix' && selectedCell && (
                <CellDrawer ck={selectedCell} items={filtered} allItems={state.items} state={state} now={now} onClose={() => setSelectedCell(null)} onOpenItem={openItem} onNew={newItem} onToggleCell={toggleCell} />
            )}

            <footer className="px-4 sm:px-6 py-3 border-t border-border text-center text-xs text-muted-foreground no-print">
                TLCTC Control Work Planner — 10 clusters × 6 CSF functions, Local and Umbrella work — data stored in this browser only
            </footer>

            {editor && <ItemEditor key={editor.item.id} item={editor.item} isNew={editor.isNew} state={state} onSave={saveItem} onDelete={deleteItem} onDuplicate={duplicateItem} onClose={() => setEditor(null)} />}
            {raidEditor && <RaidEditor key={raidEditor.entry.id} entry={raidEditor.entry} isNew={raidEditor.isNew} state={state} onSave={saveRaid} onDelete={deleteRaid} onClose={() => setRaidEditor(null)} />}
            {showImport && <ImportModal state={state} onClose={() => setShowImport(false)} onApply={applyImport} />}
            {toast && (
                <div role="status" className="fixed bottom-4 left-1/2 -translate-x-1/2 z-[70] bg-foreground text-background text-sm font-medium px-4 py-2 rounded-lg shadow-xl no-print flex items-center gap-3 max-w-[calc(100vw-2rem)]">
                    <span>{typeof toast === 'string' ? toast : toast.text}</span>
                    {toast.action && <button onClick={() => { const fn = toast.action.fn; setToast(''); fn(); }} className="font-semibold underline underline-offset-2 whitespace-nowrap">{toast.action.label}</button>}
                </div>
            )}
        </div>
    );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
