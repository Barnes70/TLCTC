  <script>
    function toggleNavMenu() {
      var menu = document.getElementById('tlctc-mobile-menu');
      if (menu.classList.contains('hidden')) {
        menu.classList.remove('hidden');
        requestAnimationFrame(function() { menu.classList.add('opacity-100'); menu.classList.remove('opacity-0'); });
      } else {
        menu.classList.add('opacity-0');
        menu.classList.remove('opacity-100');
        setTimeout(function() { menu.classList.add('hidden'); }, 300);
      }
    }

    function toggleNavTheme() {
      if (window.__tlctcToggleTheme) {
        window.__tlctcToggleTheme();
      } else {
        document.documentElement.classList.toggle('dark');
        localStorage.setItem('theme', document.documentElement.classList.contains('dark') ? 'dark' : 'light');
      }
    }

    function updateNavThemeIcons() {
      var isDark = document.documentElement.classList.contains('dark');
      var sun = document.getElementById('nav-sun-icon');
      var moon = document.getElementById('nav-moon-icon');
      if (sun && moon) {
        sun.style.display = isDark ? 'block' : 'none';
        moon.style.display = isDark ? 'none' : 'block';
      }
    }

    // Watch for theme class changes on <html> (syncs with React state)
    new MutationObserver(updateNavThemeIcons).observe(document.documentElement, { attributes: true, attributeFilter: ['class'] });

    // Initialize icons after DOM ready
    document.addEventListener('DOMContentLoaded', function() {
      if (window.lucide) { lucide.createIcons(); }
      updateNavThemeIcons();
    });

    // ============== CLIENT-SERVER ROLE RESOLUTION ==============
    const resolveClientServerRoles = (fromComp, toComp) => {
      const fromRole = COMPONENT_ROLE_HINTS[fromComp.type] || 'neutral';
      const toRole = COMPONENT_ROLE_HINTS[toComp.type] || 'neutral';
      // Clear case: from=client, to=server
      if (fromRole === 'client' && toRole === 'server') return { client: fromComp, server: toComp, confidence: 'high' };
      // Reversed: from=server, to=client (push/callback)
      if (fromRole === 'server' && toRole === 'client') return { client: toComp, server: fromComp, confidence: 'medium' };
      // Both servers: arrow direction = caller is client
      if (fromRole === 'server' && toRole === 'server') return { client: fromComp, server: toComp, confidence: 'medium' };
      // Both clients: unusual, use arrow direction
      if (fromRole === 'client' && toRole === 'client') return { client: fromComp, server: toComp, confidence: 'low' };
      // One neutral: use arrow direction (from = caller = client)
      return { client: fromComp, server: toComp, confidence: 'low' };

        const toComp = comps.find(c => c.id === iface.toId);
        if (!fromComp || !toComp) continue;
        for (const chain of COMMON_ATTACK_CHAINS) {
          const fwd = (chain.pattern.clientTypes.includes('*') || chain.pattern.clientTypes.includes(fromComp.type)) &&
                      (chain.pattern.serverTypes.includes('*') || chain.pattern.serverTypes.includes(toComp.type));
          const rev = (chain.pattern.clientTypes.includes('*') || chain.pattern.clientTypes.includes(toComp.type)) &&
                      (chain.pattern.serverTypes.includes('*') || chain.pattern.serverTypes.includes(fromComp.type));
          if (fwd) detected.push({ ...chain, interfaceId: iface.id, fromName: fromComp.name, toName: toComp.name });

    // ============== MAIN COMPONENT ==============
    function TLCTCThreatIdentificationTool() {
      const [groups, setGroups] = useState([]);
      const [components, setComponents] = useState([]);
      const [interfaces, setInterfaces] = useState([]);
      const [selectedElement, setSelectedElement] = useState(null);
      const [draggedItem, setDraggedItem] = useState(null);
      const [connectionMode, setConnectionMode] = useState(null);
      const [projectMeta, setProjectMeta] = useState({
        name: 'New Threat Model',
        version: '1.0.0',
        author: '',
        created: new Date().toISOString(),
        sdlcPhase: 'Design',
        description: ''
      });
      const [showSettings, setShowSettings] = useState(false);
      const [showExport, setShowExport] = useState(false);
      const [showThreatRegister, setShowThreatRegister] = useState(false);
      const [filterCluster, setFilterCluster] = useState(null);
      const [activeTab, setActiveTab] = useState('all');
      const [pendingSuggestions, setPendingSuggestions] = useState([]);
      const [expandedThreats, setExpandedThreats] = useState(new Set());
      const [registerTab, setRegisterTab] = useState('threats');
      const [darkMode, setDarkMode] = useState(() => {
        const saved = localStorage.getItem('theme');
        return saved ? saved === 'dark' : true; // default dark
      });
      const canvasRef = useRef(null);

      // Sync dark mode class and expose toggle bridge for nav bar
      useEffect(() => {
        if (darkMode) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
        localStorage.setItem('theme', darkMode ? 'dark' : 'light');
        window.__tlctcToggleTheme = () => setDarkMode(prev => !prev);
        return () => { delete window.__tlctcToggleTheme; };
      }, [darkMode]);

      // Load from localStorage
      useEffect(() => {
        const saved = localStorage.getItem('tlctc-threat-id-v2');
        if (saved) {
          try {
            const data = JSON.parse(saved);
            setGroups(data.groups || []);
            setComponents(data.components || []);
            setInterfaces((data.interfaces || []).map(i => ({
              ...i,
              clientComponentId: i.clientComponentId ?? null,
              serverComponentId: i.serverComponentId ?? null,
              roleConfidence: i.roleConfidence ?? null,
              crossesTrustBoundary: i.crossesTrustBoundary ?? false
            })));
            if (data.projectMeta) setProjectMeta(data.projectMeta);
          } catch (e) { console.error('Load failed:', e); }
        }
      }, []);

      // Save to localStorage
      useEffect(() => {
        const data = { groups, components, interfaces, projectMeta: { ...projectMeta, modified: new Date().toISOString() } };
        localStorage.setItem('tlctc-threat-id-v2', JSON.stringify(data));
      }, [groups, components, interfaces, projectMeta]);

      // Get absolute position
      const getAbsolutePosition = (comp) => {
        if (!comp.groupId) return { x: comp.x, y: comp.y };
        const group = groups.find(g => g.id === comp.groupId);
        if (!group) return { x: comp.x, y: comp.y };
        return { x: group.x + comp.x, y: group.y + comp.y };
      };

      // Drag handlers
      const handleDragStart = (e, item, dragType) => {
        setDraggedItem({ ...item, dragType });
        e.dataTransfer.effectAllowed = 'copy';
      };

      const handleCanvasDrop = (e) => {
        e.preventDefault();
        if (!draggedItem || !canvasRef.current) return;

        const rect = canvasRef.current.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;

        let targetGroup = null;
        for (const group of groups) {
          if (x >= group.x && x <= group.x + group.width && y >= group.y && y <= group.y + group.height) {
            targetGroup = group;
            break;
          }
        }

        if (draggedItem.dragType === 'group') {
          const newGroup = {
            id: generateId(),
            name: draggedItem.name || 'New Group',
            type: draggedItem.id,
            icon: draggedItem.icon,
            x: x - 100,
            y: y - 75,
            width: 280,
            height: 220,
            metadata: { version: '', owner: '@Org', isThirdParty: false, description: '', environment: 'Production' }
          };
          setGroups([...groups, newGroup]);
        } else {
          const typeInfo = COMPONENT_TYPES.find(t => t.id === draggedItem.id);
          // Create threats based on component type's defaultThreats
          const defaultThreats = typeInfo?.defaultThreats || [];
          const newComponent = {
            id: generateId(),
            type: draggedItem.id,
            name: draggedItem.name,
            icon: draggedItem.icon,
            groupId: targetGroup?.id || null,
            x: targetGroup ? x - targetGroup.x - 40 : x - 40,
            y: targetGroup ? y - targetGroup.y - 25 : y - 25,
            layer: typeInfo?.layer || 'application',
            metadata: {
              version: '',
              owner: targetGroup?.metadata.owner || (typeInfo?.isThirdParty ? '@Vendor' : '@Org'),
              isThirdParty: typeInfo?.isThirdParty || false,
              criticality: 'Medium',
              description: '',
              sbom: ''
            },
            threats: defaultThreats.map(clusterId => ({
              clusterId,
              applicable: true,
              status: 'Identified',
              velocityClass: 'VC-2',
              controls: [],
              notes: '',
              residualRisk: 'Medium',
              controlRef: ''
            }))
          };
          setComponents([...components, newComponent]);
        }
        setDraggedItem(null);
      };

      // Create interface — Smart Client-Server mapping (TLCTC Axiom II)
      const createInterface = (fromId, toId) => {
        const fromComp = components.find(c => c.id === fromId);
        const toComp = components.find(c => c.id === toId);
        if (!fromComp || !toComp) return;

        const fromGroup = groups.find(g => g.id === fromComp.groupId);
        const toGroup = groups.find(g => g.id === toComp.groupId);
        const isNetworkInterface = fromComp.groupId !== toComp.groupId;

        // Axiom II: Resolve client-server roles
        const roles = resolveClientServerRoles(fromComp, toComp);

        // Detect trust boundary crossing (#10 Supply Chain)
        const crossesTrustBoundary = (
          fromComp.metadata.owner !== toComp.metadata.owner ||
          fromComp.metadata.isThirdParty !== toComp.metadata.isThirdParty
        );

        // Detect auth involvement (#4 Identity Theft)
        const authTypes = ['auth-module', 'auth-library', 'idp'];
        const involvesAuth = authTypes.includes(fromComp.type) || authTypes.includes(toComp.type);

        // Build interface threats intelligently
        const interfaceThreats = [];

        if (isNetworkInterface) {
          interfaceThreats.push({ clusterId: '#5', applicable: true, status: 'Identified', velocityClass: 'VC-4', controls: [], notes: `Network path: ${fromComp.name} ↔ ${toComp.name}`, residualRisk: 'Medium', controlRef: '' });
        }

        if (involvesAuth || isNetworkInterface) {
          interfaceThreats.push({ clusterId: '#4', applicable: true, status: 'Identified', velocityClass: 'VC-3', controls: [], notes: `Auth flow: ${roles.client.name} (client) → ${roles.server.name} (server)`, residualRisk: 'Medium', controlRef: '' });
        }

        if (crossesTrustBoundary) {
          interfaceThreats.push({ clusterId: '#10', applicable: true, status: 'Identified', velocityClass: 'VC-1', controls: [], notes: `Trust boundary: ${fromComp.metadata.owner} → ${toComp.metadata.owner}`, residualRisk: 'Medium', controlRef: '' });
        }

        const newInterface = {
          id: generateId(), fromId, toId,
          name: `${fromComp.name} → ${toComp.name}`,
          interfaceType: isNetworkInterface ? 'network' : 'internal',
          protocol: isNetworkInterface ? 'HTTPS' : 'Internal Call',
          port: isNetworkInterface ? '443' : '-',
          dataClassification: 'Internal',
          authMethod: involvesAuth ? 'OAuth/Token' : 'None',
          clientComponentId: roles.client.id,
          serverComponentId: roles.server.id,
          roleConfidence: roles.confidence,
          crossesTrustBoundary,
          threats: interfaceThreats,
          sourceSphere: fromComp.metadata.owner,
          targetSphere: toComp.metadata.owner,
          sourceGroup: fromGroup?.name || null,
          targetGroup: toGroup?.name || null
        };

        setInterfaces([...interfaces, newInterface]);

        // Suggest adding #2 to server component and #3 to client component
        const suggestions = [];
        if (!(roles.server.threats || []).find(t => t.clusterId === '#2')) {
          suggestions.push({ id: generateId(), componentId: roles.server.id, componentName: roles.server.name, clusterId: '#2', reason: `Server-side of interface (receives requests from ${roles.client.name})` });
        }
        if (!(roles.client.threats || []).find(t => t.clusterId === '#3')) {
          suggestions.push({ id: generateId(), componentId: roles.client.id, componentName: roles.client.name, clusterId: '#3', reason: `Client-side of interface (processes responses from ${roles.server.name})` });
        }
        if (suggestions.length > 0) setPendingSuggestions(prev => [...prev, ...suggestions]);

        setSelectedElement({ type: 'interface', data: newInterface });
        setConnectionMode(null);
      };

      // Element handlers
      const handleElementClick = (element, type) => {
        if (connectionMode) {
          if (type === 'component') {
            if (connectionMode.from && connectionMode.from !== element.id) {
              createInterface(connectionMode.from, element.id);
            } else {
              setConnectionMode({ from: element.id });
            }
          }
        } else {
          setSelectedElement({ type, data: element });
        }
      };

      const handleElementDrag = (e, elementId, elementType) => {
        if (!canvasRef.current) return;
        const rect = canvasRef.current.getBoundingClientRect();
        
        if (elementType === 'group') {
          const x = Math.max(0, e.clientX - rect.left - 140);
          const y = Math.max(0, e.clientY - rect.top - 15);
          setGroups(groups.map(g => g.id === elementId ? { ...g, x, y } : g));
        } else {
          const comp = components.find(c => c.id === elementId);
          if (!comp) return;
          
          if (comp.groupId) {
            const group = groups.find(g => g.id === comp.groupId);
            if (group) {
              const x = Math.max(10, Math.min(e.clientX - rect.left - group.x - 40, group.width - 90));
              const y = Math.max(30, Math.min(e.clientY - rect.top - group.y - 25, group.height - 60));
              setComponents(components.map(c => c.id === elementId ? { ...c, x, y } : c));
            }
          } else {
            const x = Math.max(0, e.clientX - rect.left - 40);
            const y = Math.max(0, e.clientY - rect.top - 25);
            setComponents(components.map(c => c.id === elementId ? { ...c, x, y } : c));
          }
        }
      };

      const handleGroupResize = (e, groupId) => {
        if (!canvasRef.current) return;
        const rect = canvasRef.current.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;
        
        setGroups(groups.map(g => {
          if (g.id !== groupId) return g;
          return { ...g, width: Math.max(200, x - g.x), height: Math.max(150, y - g.y) };
        }));
      };

      const deleteElement = (id, type) => {
        if (type === 'group') {
          setComponents(components.map(c => c.groupId === id ? { ...c, groupId: null } : c));
          setGroups(groups.filter(g => g.id !== id));
        } else if (type === 'component') {
          setComponents(components.filter(c => c.id !== id));
          setInterfaces(interfaces.filter(i => i.fromId !== id && i.toId !== id));
        } else if (type === 'interface') {
          setInterfaces(interfaces.filter(i => i.id !== id));
        }
        setSelectedElement(null);
      };

      // Threat management for interfaces
      const updateInterfaceThreat = (interfaceId, clusterId, updates) => {
        setInterfaces(interfaces.map(iface => {
          if (iface.id !== interfaceId) return iface;
          const updatedThreats = iface.threats.map(t => t.clusterId === clusterId ? { ...t, ...updates } : t);
          return { ...iface, threats: updatedThreats };
        }));
        if (selectedElement?.type === 'interface' && selectedElement.data.id === interfaceId) {
          setSelectedElement(prev => ({
            ...prev,
            data: {
              ...prev.data,
              threats: prev.data.threats.map(t => t.clusterId === clusterId ? { ...t, ...updates } : t)
            }
          }));
        }
      };

      const addThreatToInterface = (interfaceId, clusterId) => {
        setInterfaces(interfaces.map(iface => {
          if (iface.id !== interfaceId || iface.threats.find(t => t.clusterId === clusterId)) return iface;
          return {
            ...iface,
            threats: [...iface.threats, { clusterId, applicable: true, status: 'Identified', velocityClass: 'VC-2', controls: [], notes: '', residualRisk: 'Medium', controlRef: '' }]
          };
        }));
      };

      const removeThreatFromInterface = (interfaceId, clusterId) => {
        setInterfaces(interfaces.map(iface => {
          if (iface.id !== interfaceId) return iface;
          return { ...iface, threats: iface.threats.filter(t => t.clusterId !== clusterId) };
        }));
      };

      // Threat management for components
      const updateComponentThreat = (componentId, clusterId, updates) => {
        setComponents(components.map(comp => {
          if (comp.id !== componentId) return comp;
          const updatedThreats = (comp.threats || []).map(t => t.clusterId === clusterId ? { ...t, ...updates } : t);
          return { ...comp, threats: updatedThreats };
        }));
        if (selectedElement?.type === 'component' && selectedElement.data.id === componentId) {
          setSelectedElement(prev => ({
            ...prev,
            data: {
              ...prev.data,
              threats: (prev.data.threats || []).map(t => t.clusterId === clusterId ? { ...t, ...updates } : t)
            }
          }));
        }
      };

      const addThreatToComponent = (componentId, clusterId) => {
        setComponents(components.map(comp => {
          if (comp.id !== componentId || (comp.threats || []).find(t => t.clusterId === clusterId)) return comp;
          return {
            ...comp,
            threats: [...(comp.threats || []), { clusterId, applicable: true, status: 'Identified', velocityClass: 'VC-2', controls: [], notes: '', residualRisk: 'Medium', controlRef: '' }]
          };
        }));
      };

      const removeThreatFromComponent = (componentId, clusterId) => {
        setComponents(components.map(comp => {
          if (comp.id !== componentId) return comp;
          return { ...comp, threats: (comp.threats || []).filter(t => t.clusterId !== clusterId) };
        }));
      };

      // Generate threat register (includes both component and interface threats)
      const generateThreatRegister = () => {
        const register = [];
        
        // Component threats
        components.forEach(comp => {
          const group = groups.find(g => g.id === comp.groupId);
          (comp.threats || []).filter(t => t.applicable).forEach(threat => {
            register.push({
              elementType: 'component',
              componentId: comp.id,
              componentName: comp.name,
              componentType: comp.type,
              group: group?.name || null,
              cluster: threat.clusterId,
              clusterName: TLCTC_CLUSTERS[threat.clusterId]?.name,
              status: threat.status,
              velocityClass: threat.velocityClass,
              residualRisk: threat.residualRisk,
              notes: threat.notes,
              controlRef: threat.controlRef || '',
              isNetworkInterface: false
            });
          });
        });
        
        // Interface threats
        interfaces.forEach(iface => {
          const fromComp = components.find(c => c.id === iface.fromId);
          const toComp = components.find(c => c.id === iface.toId);
          
          iface.threats.filter(t => t.applicable).forEach(threat => {
            register.push({
              elementType: 'interface',
              interfaceId: iface.id,
              interfaceName: iface.name,
              interfaceType: iface.interfaceType,
              fromComponent: fromComp?.name,
              toComponent: toComp?.name,
              fromGroup: iface.sourceGroup,
              toGroup: iface.targetGroup,
              protocol: iface.protocol,
              cluster: threat.clusterId,
              clusterName: TLCTC_CLUSTERS[threat.clusterId]?.name,
              status: threat.status,
              velocityClass: threat.velocityClass,
              residualRisk: threat.residualRisk,
              notes: threat.notes,
              controlRef: threat.controlRef || '',
              isNetworkInterface: iface.interfaceType === 'network'
            });
          });
        });
        return register;
      };

      // Export functions
      const exportJSON = () => {
        const data = {
          $schema: 'tlctc-threat-identification-v2',
          tlctc_version: '2.0',
          metadata: { ...projectMeta, exported: new Date().toISOString() },
          system_model: {
            groups: groups.map(g => ({ id: g.id, name: g.name, type: g.type, position: { x: g.x, y: g.y }, size: { width: g.width, height: g.height }, metadata: g.metadata })),
            components: components.map(c => ({ 
              id: c.id, type: c.type, name: c.name, layer: c.layer, groupId: c.groupId, position: { x: c.x, y: c.y }, metadata: c.metadata,
              threats: (c.threats || []).map(t => ({ 
                cluster: { strategic: t.clusterId, operational: `TLCTC-${t.clusterId.replace('#','').padStart(2,'0')}.00` }, 
                applicable: t.applicable, status: t.status, velocity_class: t.velocityClass, residual_risk: t.residualRisk, notes: t.notes,
                control_ref: t.controlRef || ''
              }))
            })),
            interfaces: interfaces.map(i => ({
              id: i.id, name: i.name, type: i.interfaceType, from: i.fromId, to: i.toId, protocol: i.protocol, port: i.port,
              threats: i.threats.map(t => ({ 
                cluster: { strategic: t.clusterId, operational: `TLCTC-${t.clusterId.replace('#','').padStart(2,'0')}.00` }, 
                applicable: t.applicable, status: t.status, velocity_class: t.velocityClass, residual_risk: t.residualRisk, notes: t.notes,
                control_ref: t.controlRef || ''
              }))
            }))
          },
          threat_register: generateThreatRegister()
        };

        const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `${projectMeta.name.replace(/\s+/g, '-').toLowerCase()}-threat-model.json`;
        a.click();
        URL.revokeObjectURL(url);
        setShowExport(false);
      };

      const exportPNG = useCallback(() => {
        if (!canvasRef.current) return;
        
        const svg = canvasRef.current;
        const clonedSvg = svg.cloneNode(true);
        
        const width = 1600;
        const height = 1000;
        clonedSvg.setAttribute('width', width);
        clonedSvg.setAttribute('height', height);
        clonedSvg.setAttribute('viewBox', `0 0 ${width} ${height}`);
        
        // Add title
        const titleGroup = document.createElementNS('http://www.w3.org/2000/svg', 'g');
        const titleBg = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
        titleBg.setAttribute('x', '0'); titleBg.setAttribute('y', '0');
        titleBg.setAttribute('width', width); titleBg.setAttribute('height', '60');
        titleBg.setAttribute('fill', '#1e293b');
        titleGroup.appendChild(titleBg);
        
        const titleText = document.createElementNS('http://www.w3.org/2000/svg', 'text');
        titleText.setAttribute('x', '20'); titleText.setAttribute('y', '30');
        titleText.setAttribute('fill', '#f8fafc'); titleText.setAttribute('font-size', '20');
        titleText.setAttribute('font-weight', 'bold'); titleText.setAttribute('font-family', 'system-ui');
        titleText.textContent = projectMeta.name;
        titleGroup.appendChild(titleText);
        
        const subtitleText = document.createElementNS('http://www.w3.org/2000/svg', 'text');
        subtitleText.setAttribute('x', '20'); subtitleText.setAttribute('y', '48');
        subtitleText.setAttribute('fill', '#94a3b8'); subtitleText.setAttribute('font-size', '12');
        subtitleText.textContent = `v${projectMeta.version} | ${projectMeta.sdlcPhase} | TLCTC v2.0/v2.1 | ${new Date().toLocaleDateString()}`;
        titleGroup.appendChild(subtitleText);
        
        clonedSvg.insertBefore(titleGroup, clonedSvg.firstChild);
        
        // Add legend
        const legendGroup = document.createElementNS('http://www.w3.org/2000/svg', 'g');
        legendGroup.setAttribute('transform', `translate(10, ${height - 50})`);
        
        const legendBg = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
        legendBg.setAttribute('width', '650'); legendBg.setAttribute('height', '40');
        legendBg.setAttribute('fill', '#1e293b'); legendBg.setAttribute('rx', '4');
        legendGroup.appendChild(legendBg);
        
        let lx = 10;
        Object.values(TLCTC_CLUSTERS).forEach((c) => {
          const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
          circle.setAttribute('cx', lx + 6); circle.setAttribute('cy', '20');
          circle.setAttribute('r', '5'); circle.setAttribute('fill', c.color);
          legendGroup.appendChild(circle);
          
          const label = document.createElementNS('http://www.w3.org/2000/svg', 'text');
          label.setAttribute('x', lx + 14); label.setAttribute('y', '24');
          label.setAttribute('fill', '#e2e8f0'); label.setAttribute('font-size', '9');
          label.textContent = `${c.id}`;
          legendGroup.appendChild(label);
          lx += 60;
        });
        
        clonedSvg.appendChild(legendGroup);
        
        const svgData = new XMLSerializer().serializeToString(clonedSvg);
        const canvas = document.createElement('canvas');
        const scale = 2;
        canvas.width = width * scale;
        canvas.height = height * scale;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#0f172a';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.scale(scale, scale);
        
        const img = new Image();
        const svgBlob = new Blob([svgData], { type: 'image/svg+xml;charset=utf-8' });
        const url = URL.createObjectURL(svgBlob);
        
        img.onload = () => {
          ctx.drawImage(img, 0, 0, width, height);
          URL.revokeObjectURL(url);
          const pngUrl = canvas.toDataURL('image/png');
          const a = document.createElement('a');
          a.href = pngUrl;
          a.download = `${projectMeta.name.replace(/\s+/g, '-').toLowerCase()}-threat-model.png`;
          a.click();
        };
        
        img.onerror = () => { URL.revokeObjectURL(url); alert('PNG export failed, try SVG instead.'); };
        img.src = url;
        setShowExport(false);
      }, [groups, components, interfaces, projectMeta]);

      const exportSVG = useCallback(() => {
        if (!canvasRef.current) return;
        const svg = canvasRef.current;
        const clonedSvg = svg.cloneNode(true);
        clonedSvg.setAttribute('width', '1600');
        clonedSvg.setAttribute('height', '1000');
        clonedSvg.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
        
        const bg = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
        bg.setAttribute('width', '100%'); bg.setAttribute('height', '100%'); bg.setAttribute('fill', '#0f172a');
        clonedSvg.insertBefore(bg, clonedSvg.firstChild);
        
        const svgData = new XMLSerializer().serializeToString(clonedSvg);
        const blob = new Blob([svgData], { type: 'image/svg+xml' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `${projectMeta.name.replace(/\s+/g, '-').toLowerCase()}-threat-model.svg`;
        a.click();
        URL.revokeObjectURL(url);
        setShowExport(false);
      }, [projectMeta]);

      // Import
      const importProject = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
          try {
            const data = JSON.parse(event.target.result);
            if (data.system_model) {
              setGroups(
                (data.system_model.groups || []).map(g => ({
                  ...g,
                  x: g.position?.x ?? g.x ?? 0,
                  y: g.position?.y ?? g.y ?? 0,
                  width: g.size?.width ?? g.width ?? 500,
                  height: g.size?.height ?? g.height ?? 300
                }))
              );
              setComponents(
                (data.system_model.components || []).map(c => {
                  const typeInfo = COMPONENT_TYPES.find(ct => ct.id === c.type);
                  return {
                    ...c,
                    x: c.position?.x ?? c.x ?? 0,
                    y: c.position?.y ?? c.y ?? 0,
                    icon: c.icon ?? typeInfo?.icon ?? '⬛',
                    threats: (c.threats || []).map(t => ({
                      clusterId: t.cluster?.strategic ?? t.clusterId ?? null,
                      applicable: t.applicable ?? true,
                      status: t.status ?? 'Identified',
                      velocityClass: t.velocity_class ?? t.velocityClass ?? 'VC-2',
                      residualRisk: t.residual_risk ?? t.residualRisk ?? 'Medium',
                      notes: t.notes ?? '',
                      controlRef: t.control_ref ?? t.controlRef ?? '',
                      controls: t.controls ?? []
                    })).filter(t => t.clusterId)
                  };
                })
              );
              setInterfaces(
                (data.system_model.interfaces || []).map(i => ({
                  ...i,
                  fromId: i.fromId ?? i.from,
                  toId: i.toId ?? i.to,
                  interfaceType: i.interfaceType ?? i.type,
                  clientComponentId: i.clientComponentId ?? null,
                  serverComponentId: i.serverComponentId ?? null,
                  roleConfidence: i.roleConfidence ?? null,
                  crossesTrustBoundary: i.crossesTrustBoundary ?? false,
                  threats: (i.threats || []).map(t => ({
                    clusterId: t.cluster?.strategic ?? t.clusterId ?? null,
                    applicable: t.applicable ?? true,
                    status: t.status ?? 'Identified',
                    velocityClass: t.velocity_class ?? t.velocityClass ?? 'VC-2',
                    residualRisk: t.residual_risk ?? t.residualRisk ?? 'Medium',
                    notes: t.notes ?? '',
                    controlRef: t.control_ref ?? t.controlRef ?? '',
                    controls: t.controls ?? []
                  })).filter(t => t.clusterId)
                }))
              );
            }
            if (data.metadata) setProjectMeta(prev => ({ ...prev, ...data.metadata }));
          } catch (err) { alert('Import failed'); }
        };
        reader.readAsText(file);
        e.target.value = '';
      };

      const clearAll = () => {
        if (confirm('Clear entire model?')) {
          setGroups([]); setComponents([]); setInterfaces([]); setSelectedElement(null);
          setPendingSuggestions([]);
        }
      };

      const loadTemplate = (templateId) => {
        const tmpl = EXAMPLE_TEMPLATES.find(t => t.id === templateId);
        if (!tmpl) return;
        if (components.length > 0 && !confirm(`Load "${tmpl.name}"? This will replace your current model.`)) return;

        // Build groups
        const refToGroupId = {};
        const newGroups = tmpl.groups.map(g => {
          const id = generateId();
          refToGroupId[g.ref] = id;
          return { id, name: g.name, type: g.type, icon: g.type === 'group-container' ? '📦' : g.type === 'group-pod' ? '☸️' : '🖥️',
            x: g.x, y: g.y, width: g.w, height: g.h,
            metadata: { version: '', owner: g.owner || '@Org', isThirdParty: g.thirdParty || false, description: '', environment: 'Production' }
          };
        });

        // Build components with default threats from COMPONENT_TYPES
        const refToCompId = {};
        const newComponents = tmpl.components.map(c => {
          const id = generateId();
          refToCompId[c.ref] = id;
          const typeInfo = COMPONENT_TYPES.find(ct => ct.id === c.type);
          const defaultThreats = (typeInfo?.defaultThreats || []).map(clusterId => ({
            clusterId, applicable: true, status: 'Identified', velocityClass: 'VC-2', controls: [], notes: '', residualRisk: 'Medium', controlRef: ''
          }));
          return { id, type: c.type, name: c.name, icon: typeInfo?.icon || '⬛',
            groupId: c.group ? refToGroupId[c.group] : null,
            x: c.x, y: c.y, layer: typeInfo?.layer || 'application',
            metadata: { version: '', owner: c.owner || '@Org', isThirdParty: c.thirdParty || typeInfo?.isThirdParty || false, criticality: 'Medium', description: '', sbom: '' },
            threats: defaultThreats
          };
        });

        // Build interfaces with smart client-server mapping
        const suggestions = [];
        const newInterfaces = tmpl.interfaces.map(iface => {
          const fromId = refToCompId[iface.from];
          const toId = refToCompId[iface.to];
          const fromComp = newComponents.find(c => c.id === fromId);
          const toComp = newComponents.find(c => c.id === toId);
          if (!fromComp || !toComp) return null;

          const isNetworkInterface = fromComp.groupId !== toComp.groupId;
          const roles = resolveClientServerRoles(fromComp, toComp);
          const crossesTrustBoundary = fromComp.metadata.owner !== toComp.metadata.owner || fromComp.metadata.isThirdParty !== toComp.metadata.isThirdParty;
          const authTypes = ['auth-module', 'auth-library', 'idp'];
          const involvesAuth = authTypes.includes(fromComp.type) || authTypes.includes(toComp.type);

          const interfaceThreats = [];
          if (isNetworkInterface) interfaceThreats.push({ clusterId: '#5', applicable: true, status: 'Identified', velocityClass: 'VC-4', controls: [], notes: `Network: ${fromComp.name} \u2194 ${toComp.name}`, residualRisk: 'Medium', controlRef: '' });
          if (involvesAuth || isNetworkInterface) interfaceThreats.push({ clusterId: '#4', applicable: true, status: 'Identified', velocityClass: 'VC-3', controls: [], notes: `Auth flow: ${roles.client.name} \u2192 ${roles.server.name}`, residualRisk: 'Medium', controlRef: '' });
          if (crossesTrustBoundary) interfaceThreats.push({ clusterId: '#10', applicable: true, status: 'Identified', velocityClass: 'VC-1', controls: [], notes: `Trust boundary: ${fromComp.metadata.owner} \u2192 ${toComp.metadata.owner}`, residualRisk: 'Medium', controlRef: '' });

          // Suggest #2 for server, #3 for client
          if (!roles.server.threats.find(t => t.clusterId === '#2')) suggestions.push({ id: generateId(), componentId: roles.server.id, componentName: roles.server.name, clusterId: '#2', reason: `Server-side of interface (receives from ${roles.client.name})` });
          if (!roles.client.threats.find(t => t.clusterId === '#3')) suggestions.push({ id: generateId(), componentId: roles.client.id, componentName: roles.client.name, clusterId: '#3', reason: `Client-side of interface (processes from ${roles.server.name})` });

          const fromGroup = newGroups.find(g => g.id === fromComp.groupId);
          const toGroup = newGroups.find(g => g.id === toComp.groupId);
          return {
            id: generateId(), fromId, toId, name: `${fromComp.name} \u2192 ${toComp.name}`,
            interfaceType: isNetworkInterface ? 'network' : 'internal',
            protocol: iface.protocol || (isNetworkInterface ? 'HTTPS' : 'Internal Call'),
            port: iface.port || (isNetworkInterface ? '443' : '-'),
            dataClassification: 'Internal', authMethod: involvesAuth ? 'OAuth/Token' : 'None',
            clientComponentId: roles.client.id, serverComponentId: roles.server.id,
            roleConfidence: roles.confidence, crossesTrustBoundary,
            threats: interfaceThreats,
            sourceSphere: fromComp.metadata.owner, targetSphere: toComp.metadata.owner,
            sourceGroup: fromGroup?.name || null, targetGroup: toGroup?.name || null
          };
        }).filter(Boolean);

        // Deduplicate suggestions
        const seenSugs = new Set();
        const uniqueSugs = suggestions.filter(s => { const key = `${s.componentId}-${s.clusterId}`; if (seenSugs.has(key)) return false; seenSugs.add(key); return true; });

        setGroups(newGroups);
        setComponents(newComponents);
        setInterfaces(newInterfaces);
        setSelectedElement(null);
        setPendingSuggestions(uniqueSugs);
        setProjectMeta(prev => ({ ...prev, ...tmpl.meta, modified: new Date().toISOString() }));
      };

      // Cluster counts (includes both component and interface threats)
      const clusterCounts = Object.keys(TLCTC_CLUSTERS).reduce((acc, id) => {
        const componentThreats = components.reduce((sum, c) => sum + (c.threats || []).filter(t => t.clusterId === id && t.applicable).length, 0);
        const interfaceThreats = interfaces.reduce((sum, i) => sum + i.threats.filter(t => t.clusterId === id && t.applicable).length, 0);
        acc[id] = componentThreats + interfaceThreats;
        return acc;
      }, {});

      const getFilteredComponents = () => activeTab === 'all' ? COMPONENT_TYPES : COMPONENT_TYPES.filter(c => c.layer === activeTab);

      return (
        <div className={`flex flex-col h-full ${darkMode ? 'bg-slate-900 text-slate-100' : 'bg-slate-50 text-slate-900'}`}>
          {/* Toolbar */}
          <div className={`${darkMode ? 'bg-slate-800 border-slate-700' : 'bg-white border-slate-200'} border-b px-4 py-2 flex items-center justify-between flex-shrink-0`}>
            <div className="flex items-center gap-3">
              <span className="text-amber-500"><Icons.Target /></span>
              <span className={`text-xs font-semibold ${darkMode ? 'text-slate-400' : 'text-slate-500'}`}>Threat Modeling · v2.0</span>
              <select onChange={(e) => { if (e.target.value) { loadTemplate(e.target.value); e.target.value = ''; } }}

            <div className="flex items-center gap-2">

              </button>

            </div>

            {/* Left Panel */}
            <aside className={`w-56 ${darkMode ? 'bg-slate-800 border-slate-700' : 'bg-white border-slate-200'} border-r flex flex-col overflow-hidden flex-shrink-0`}>
              <div className={`p-2 border-b ${darkMode ? 'border-slate-700' : 'border-slate-200'}`}>

                    <span>{item.icon}</span>
                    <span className="text-sm truncate flex-1">{item.name}</span>

                  </div>
                ))}
              </div>
            </aside>

            {/* Canvas */}
            <main className="flex-1 flex flex-col overflow-hidden">
              <div className={`${darkMode ? 'bg-slate-800/50 border-slate-700' : 'bg-slate-100/50 border-slate-200'} border-b px-4 py-2 flex items-center gap-4 flex-shrink-0`}>
                <button onClick={() => setConnectionMode(connectionMode ? null : { from: null })}
                  className={`flex items-center gap-2 px-3 py-1.5 rounded text-sm ${connectionMode ? 'bg-green-600 text-white' : (darkMode ? 'bg-slate-700 hover:bg-slate-600' : 'bg-slate-200 hover:bg-slate-300')}`}>
                  <Icons.Link />

                </button>
                {connectionMode && <button onClick={() => setConnectionMode(null)} className={`text-sm ${darkMode ? 'text-slate-400 hover:text-white' : 'text-slate-500 hover:text-slate-900'}`}>Cancel</button>}
                <div className="flex-1" />
                <div className="text-xs text-slate-500">{groups.length} groups · {components.length} components · {interfaces.length} interfaces</div>
              </div>

              <div className={`flex-1 relative overflow-auto ${darkMode ? 'bg-slate-900/50' : 'bg-slate-50'}`}>
                <svg ref={canvasRef} className="w-full h-full" style={{minWidth: '1400px', minHeight: '900px'}}
                  onDragOver={(e) => e.preventDefault()} onDrop={handleCanvasDrop}
                  onClick={() => !connectionMode && setSelectedElement(null)}>
                  <defs>
                    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
                      <path d="M 20 0 L 0 0 0 20" fill="none" stroke={darkMode ? '#1e293b' : '#e2e8f0'} strokeWidth="0.5" />
                    </pattern>
                    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
                      <polygon points="0 0, 8 3, 0 6" fill="#64748b" />
                    </marker>
                    <marker id="arrow-sel" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
                      <polygon points="0 0, 8 3, 0 6" fill="#3b82f6" />
                    </marker>
                    <marker id="arrow-warn" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
                      <polygon points="0 0, 8 3, 0 6" fill="#f59e0b" />
                    </marker>
                    <filter id="glow-blue" x="-30%" y="-30%" width="160%" height="160%">
                      <feGaussianBlur stdDeviation="3" result="blur" />
                      <feFlood floodColor="#3b82f6" floodOpacity="0.4" result="color" />
                      <feComposite in="color" in2="blur" operator="in" result="glow" />
                      <feMerge><feMergeNode in="glow" /><feMergeNode in="SourceGraphic" /></feMerge>
                    </filter>
                  </defs>
                  <rect width="100%" height="100%" fill="url(#grid)" />

                        <rect x={group.x} y={group.y} width={group.width} height={group.height} rx="8"

                          strokeWidth={isSelected ? 2 : 1} strokeDasharray="4,2" className="cursor-move"
                          onClick={(e) => { e.stopPropagation(); handleElementClick(group, 'group'); }}
                          onMouseDown={(e) => {
                            if (e.button !== 0) return;
                            const move = (ev) => handleElementDrag(ev, group.id, 'group');
                            const up = () => { document.removeEventListener('mousemove', move); document.removeEventListener('mouseup', up); };
                            document.addEventListener('mousemove', move); document.addEventListener('mouseup', up);
                          }}
                        />
                        <rect x={group.x} y={group.y} width={group.width} height="24" rx="8" fill={darkMode ? '#1e293b' : '#e2e8f0'} className="pointer-events-none" />

                        <text x={group.x + group.width - 10} y={group.y + 16} fill="#64748b" fontSize="10" textAnchor="end" className="pointer-events-none">

                        <rect x={group.x + group.width - 12} y={group.y + group.height - 12} width="10" height="10"

                          onMouseDown={(e) => {
                            e.stopPropagation();
                            const move = (ev) => handleGroupResize(ev, group.id);
                            const up = () => { document.removeEventListener('mousemove', move); document.removeEventListener('mouseup', up); };
                            document.addEventListener('mousemove', move); document.addEventListener('mouseup', up);
                          }}
                        />
                      </g>
                    );
                  })}

                  {/* Interfaces */}
                  {interfaces.map(iface => {
                    const fromComp = components.find(c => c.id === iface.fromId);
                    const toComp = components.find(c => c.id === iface.toId);
                    if (!fromComp || !toComp) return null;

                    const fromPos = getAbsolutePosition(fromComp);
                    const toPos = getAbsolutePosition(toComp);
                    const x1 = fromPos.x + 40, y1 = fromPos.y + 25;
                    const x2 = toPos.x + 40, y2 = toPos.y + 25;
                    
                    const isSelected = selectedElement?.type === 'interface' && selectedElement.data.id === iface.id;
                    const threatCount = iface.threats.filter(t => t.applicable && t.status === 'Identified').length;
                    const isInternal = iface.interfaceType === 'internal';
                    const matchesFilter = !filterCluster || iface.threats.some(t => t.clusterId === filterCluster && t.applicable);
                    const midX = (x1 + x2) / 2, midY = (y1 + y2) / 2;

                    return (
                      <g key={iface.id} style={{ opacity: filterCluster && !matchesFilter ? 0.15 : 1 }}
                        onClick={(e) => { e.stopPropagation(); handleElementClick(iface, 'interface'); }}>
                        <line x1={x1} y1={y1} x2={x2} y2={y2}
                          stroke={isSelected ? '#3b82f6' : threatCount > 0 ? '#f59e0b' : (darkMode ? '#475569' : '#94a3b8')}
                          strokeWidth={isSelected ? 2.5 : 1.5}
                          strokeDasharray={isInternal ? '4,4' : 'none'}
                          markerEnd={isSelected ? 'url(#arrow-sel)' : threatCount > 0 ? 'url(#arrow-warn)' : 'url(#arrow)'}
                          className="cursor-pointer"
                        />
                        {threatCount > 0 && (
                          <g transform={`translate(${midX}, ${midY})`}>
                            <circle r="10" fill="#f59e0b" />
                            <text y="4" fill="white" fontSize="10" fontWeight="bold" textAnchor="middle">{threatCount}</text>
                          </g>
                        )}
                        <text x={midX} y={midY - 14} fill="#64748b" fontSize="8" textAnchor="middle">{iface.protocol}</text>
                        {/* Client→Server direction label */}
                        {iface.clientComponentId && iface.serverComponentId && (() => {
                          const clientComp = components.find(c => c.id === iface.clientComponentId);
                          const serverComp = components.find(c => c.id === iface.serverComponentId);
                          if (!clientComp || !serverComp) return null;
                          const cPos = getAbsolutePosition(clientComp);
                          const sPos = getAbsolutePosition(serverComp);
                          const cx = cPos.x + 40, cy = cPos.y + 25;
                          const sx = sPos.x + 40, sy = sPos.y + 25;
                          const dx = sx - cx, dy = sy - cy;
                          const len = Math.sqrt(dx * dx + dy * dy) || 1;
                          const nx = -dy / len, ny = dx / len;
                          const offsetDist = 14;
                          const labelX = midX + nx * offsetDist;
                          const labelY = midY + ny * offsetDist;
                          const conf = iface.roleConfidence || 'low';
                          const confColor = conf === 'high' ? '#22c55e' : conf === 'medium' ? '#eab308' : '#94a3b8';
                          return (
                            <g transform={`translate(${labelX}, ${labelY})`}>
                              <rect x="-14" y="-6" width="28" height="12" rx="3" fill={darkMode ? '#1e293b' : '#f1f5f9'} stroke={confColor} strokeWidth="0.5" opacity="0.9" />
                              <text y="3" fill={confColor} fontSize="7" fontWeight="600" textAnchor="middle">C→S</text>
                            </g>
                          );
                        })()}
                        {/* Trust Boundary badge */}
                        {iface.crossesTrustBoundary && (() => {
                          const dx2 = x2 - x1, dy2 = y2 - y1;
                          const len2 = Math.sqrt(dx2 * dx2 + dy2 * dy2) || 1;
                          const nx2 = -dy2 / len2, ny2 = dx2 / len2;
                          const tbX = midX - nx2 * 14;
                          const tbY = midY - ny2 * 14;
                          return (
                            <g transform={`translate(${tbX}, ${tbY})`}>
                              <rect x="-10" y="-6" width="20" height="12" rx="3" fill={darkMode ? '#7c2d12' : '#fff7ed'} stroke="#f97316" strokeWidth="0.5" opacity="0.9" />
                              <text y="3" fill={darkMode ? '#fb923c' : '#c2410c'} fontSize="7" fontWeight="600" textAnchor="middle">TB</text>
                            </g>
                          );
                        })()}
                      </g>
                    );
                  })}

                  {/* Components */}
                  {components.map(comp => {
                    const pos = getAbsolutePosition(comp);
                    const isSelected = selectedElement?.type === 'component' && selectedElement.data.id === comp.id;
                    const isConnecting = connectionMode?.from === comp.id;
                    const layer = COMPONENT_LAYERS[comp.layer];
                    const compThreatCount = (comp.threats || []).filter(t => t.applicable && t.status === 'Identified').length;
                    const matchesFilter = !filterCluster || (comp.threats || []).some(t => t.clusterId === filterCluster && t.applicable) || interfaces.some(i => (i.fromId === comp.id || i.toId === comp.id) && i.threats.some(t => t.clusterId === filterCluster && t.applicable));

                    return (
                      <g key={comp.id} transform={`translate(${pos.x}, ${pos.y})`}
                        style={{ opacity: filterCluster && !matchesFilter ? 0.2 : 1 }}
                        filter={isSelected ? 'url(#glow-blue)' : undefined}
                        onClick={(e) => { e.stopPropagation(); handleElementClick(comp, 'component'); }}
                        onMouseDown={(e) => {
                          if (e.button !== 0 || connectionMode) return;
                          const move = (ev) => handleElementDrag(ev, comp.id, 'component');
                          const up = () => { document.removeEventListener('mousemove', move); document.removeEventListener('mouseup', up); };
                          document.addEventListener('mousemove', move); document.addEventListener('mouseup', up);
                        }}
                        className="cursor-move">
                        {isSelected && (

                          fill={comp.metadata.isThirdParty ? (darkMode ? '#1c1917' : '#fffbeb') : (darkMode ? '#0f172a' : '#ffffff')}

                          strokeWidth={isSelected ? 2.5 : isConnecting ? 2 : 1}

                        <text x="40" y="20" fill={darkMode ? '#e2e8f0' : '#1e293b'} fontSize="14" textAnchor="middle">{comp.icon}</text>
                        <text x="40" y="36" fill={darkMode ? '#e2e8f0' : '#1e293b'} fontSize="9" textAnchor="middle" fontWeight="500">
                          {comp.name.length > 10 ? comp.name.slice(0, 10) + '…' : comp.name}
                        </text>
                        <text x="40" y="46" fill="#64748b" fontSize="7" textAnchor="middle">
                          {comp.metadata.version || comp.layer}

                            <circle r="8" fill="#ef4444" />
                            <text y="3" fill="white" fontSize="9" fontWeight="bold" textAnchor="middle">{compThreatCount}</text>
                          </g>
                        )}
                      </g>
                    );
                  })}
                </svg>

                {Object.values(TLCTC_CLUSTERS).map(c => (
                  <button key={c.id} onClick={() => setFilterCluster(filterCluster === c.id ? null : c.id)}

                  </button>
                ))}
              </div>
            </main>

            {/* Right Panel */}
            {selectedElement && (
              <aside className={`w-72 ${darkMode ? 'bg-slate-800 border-slate-700' : 'bg-white border-slate-200'} border-l flex flex-col overflow-hidden flex-shrink-0`}>
                <div className={`p-3 border-b ${darkMode ? 'border-slate-700' : 'border-slate-200'} flex items-center justify-between`}>
                  <h3 className="font-medium capitalize">{selectedElement.type}</h3>
                  <button onClick={() => deleteElement(selectedElement.data.id, selectedElement.type)} className={`p-1 ${darkMode ? 'hover:bg-red-900/50 text-red-400' : 'hover:bg-red-100 text-red-500'} rounded`}>
                    <Icons.Trash />
                  </button>
                </div>
                <div className="flex-1 overflow-y-auto p-3 space-y-3">
                  {/* Group properties */}
                  {selectedElement.type === 'group' && (
                    <>
                      <div>
                        <label className={`block text-xs ${darkMode ? 'text-slate-400' : 'text-slate-500'} mb-1`}>Name</label>
                        <input type="text" value={selectedElement.data.name}
                          onChange={(e) => { const u = {...selectedElement.data, name: e.target.value}; setGroups(groups.map(g => g.id === u.id ? u : g)); setSelectedElement({...selectedElement, data: u}); }}
                          className={`w-full ${darkMode ? 'bg-slate-700 border-slate-600' : 'bg-slate-100 border-slate-300'} border rounded px-2 py-1.5 text-sm`} />
                      </div>
                      <div className="grid grid-cols-2 gap-2">
                        <div>
                          <label className={`block text-xs ${darkMode ? 'text-slate-400' : 'text-slate-500'} mb-1`}>Version</label>
                          <input type="text" value={selectedElement.data.metadata.version}
                            onChange={(e) => { const u = {...selectedElement.data, metadata: {...selectedElement.data.metadata, version: e.target.value}}; setGroups(groups.map(g => g.id === u.id ? u : g)); setSelectedElement({...selectedElement, data: u}); }}
                            className={`w-full ${darkMode ? 'bg-slate-700 border-slate-600' : 'bg-slate-100 border-slate-300'} border rounded px-2 py-1.5 text-sm`} />
                        </div>
                        <div>
                          <label className={`block text-xs ${darkMode ? 'text-slate-400' : 'text-slate-500'} mb-1`}>Owner</label>
                          <select value={selectedElement.data.metadata.owner}
                            onChange={(e) => { const u = {...selectedElement.data, metadata: {...selectedElement.data.metadata, owner: e.target.value}}; setGroups(groups.map(g => g.id === u.id ? u : g)); setSelectedElement({...selectedElement, data: u}); }}
                            className={`w-full ${darkMode ? 'bg-slate-700 border-slate-600' : 'bg-slate-100 border-slate-300'} border rounded px-2 py-1.5 text-sm`}>
                            {RESPONSIBILITY_SPHERES.map(s => <option key={s} value={s}>{s}</option>)}
                          </select>
                        </div>
                      </div>
                    </>
                  )}

                  {/* Component properties */}
                  {selectedElement.type === 'component' && (
                    <>
                      <div>
                        <label className={`block text-xs ${darkMode ? 'text-slate-400' : 'text-slate-500'} mb-1`}>Name</label>
                        <input type="text" value={selectedElement.data.name}
                          onChange={(e) => { const u = {...selectedElement.data, name: e.target.value}; setComponents(components.map(c => c.id === u.id ? u : c)); setSelectedElement({...selectedElement, data: u}); }}
                          className={`w-full ${darkMode ? 'bg-slate-700 border-slate-600' : 'bg-slate-100 border-slate-300'} border rounded px-2 py-1.5 text-sm`} />
                      </div>
                      <div className="grid grid-cols-2 gap-2">
                        <div>
                          <label className={`block text-xs ${darkMode ? 'text-slate-400' : 'text-slate-500'} mb-1`}>Version</label>
                          <input type="text" value={selectedElement.data.metadata.version}
                            onChange={(e) => { const u = {...selectedElement.data, metadata: {...selectedElement.data.metadata, version: e.target.value}}; setComponents(components.map(c => c.id === u.id ? u : c)); setSelectedElement({...selectedElement, data: u}); }}
                            className={`w-full ${darkMode ? 'bg-slate-700 border-slate-600' : 'bg-slate-100 border-slate-300'} border rounded px-2 py-1.5 text-sm`} />
                        </div>
                        <div>
                          <label className={`block text-xs ${darkMode ? 'text-slate-400' : 'text-slate-500'} mb-1`}>Owner</label>
                          <select value={selectedElement.data.metadata.owner}
                            onChange={(e) => { const u = {...selectedElement.data, metadata: {...selectedElement.data.metadata, owner: e.target.value}}; setComponents(components.map(c => c.id === u.id ? u : c)); setSelectedElement({...selectedElement, data: u}); }}
                            className={`w-full ${darkMode ? 'bg-slate-700 border-slate-600' : 'bg-slate-100 border-slate-300'} border rounded px-2 py-1.5 text-sm`}>
                            {RESPONSIBILITY_SPHERES.map(s => <option key={s} value={s}>{s}</option>)}
                          </select>
                        </div>
                      </div>
                      <div className="flex items-center gap-2">
                        <input type="checkbox" id="is3p" checked={selectedElement.data.metadata.isThirdParty}
                          onChange={(e) => { const u = {...selectedElement.data, metadata: {...selectedElement.data.metadata, isThirdParty: e.target.checked}}; setComponents(components.map(c => c.id === u.id ? u : c)); setSelectedElement({...selectedElement, data: u}); }}
                          className="rounded" />
                        <label htmlFor="is3p" className="text-sm">Third-Party</label>
                      </div>
                      <div>
                        <label className={`block text-xs ${darkMode ? 'text-slate-400' : 'text-slate-500'} mb-1`}>SBOM Reference</label>
                        <input type="text" value={selectedElement.data.metadata.sbom || ''}
                          onChange={(e) => { const u = {...selectedElement.data, metadata: {...selectedElement.data.metadata, sbom: e.target.value}}; setComponents(components.map(c => c.id === u.id ? u : c)); setSelectedElement({...selectedElement, data: u}); }}
                          placeholder="Link or reference" className={`w-full ${darkMode ? 'bg-slate-700 border-slate-600' : 'bg-slate-100 border-slate-300'} border rounded px-2 py-1.5 text-sm`} />
                      </div>

                      {/* Component Threats — Enhanced with examples */}
                      <div className={`border-t ${darkMode ? 'border-slate-700' : 'border-slate-200'} pt-3`}>

                  </div>
                  <div><label className={`block text-sm ${darkMode ? 'text-slate-400' : 'text-slate-500'} mb-1`}>Author</label>
                    <input value={projectMeta.author} onChange={(e) => setProjectMeta({...projectMeta, author: e.target.value})} className={`w-full ${darkMode ? 'bg-slate-700 border-slate-600' : 'bg-slate-100 border-slate-300'} border rounded px-3 py-2`} /></div>
                </div>
                <div className="flex justify-end mt-4"><button onClick={() => setShowSettings(false)} className={`px-4 py-2 ${darkMode ? 'bg-slate-700' : 'bg-slate-200'} rounded`}>Close</button></div>
              </div>
            </div>
          )}

          {/* Export Modal */}
          {showExport && (
            <div className={`fixed inset-0 ${darkMode ? 'bg-black/60' : 'bg-black/40'} flex items-center justify-center z-50`} onClick={() => setShowExport(false)}>
              <div className={`${darkMode ? 'bg-slate-800' : 'bg-white'} rounded-xl w-full max-w-md p-6 m-4 shadow-xl`} onClick={e => e.stopPropagation()}>
                <h2 className="text-lg font-bold mb-4">Export Threat Model</h2>
                <button onClick={exportJSON} className={`w-full flex items-center gap-3 p-4 ${darkMode ? 'bg-slate-700 hover:bg-slate-600' : 'bg-slate-100 hover:bg-slate-200'} rounded-lg mb-2`}>
                  <span className="text-amber-500"><Icons.FileJson /></span>
                  <div className="text-left"><div className="font-medium">TLCTC JSON</div><div className="text-sm text-slate-400">Full data for import/automation</div></div>
                </button>
                <button onClick={exportPNG} className={`w-full flex items-center gap-3 p-4 ${darkMode ? 'bg-slate-700 hover:bg-slate-600' : 'bg-slate-100 hover:bg-slate-200'} rounded-lg mb-2`}>
                  <span className="text-blue-500"><Icons.Image /></span>
                  <div className="text-left"><div className="font-medium">PNG Image (2x)</div><div className="text-sm text-slate-400">High-res raster for reports</div></div>
                </button>
                <button onClick={exportSVG} className={`w-full flex items-center gap-3 p-4 ${darkMode ? 'bg-slate-700 hover:bg-slate-600' : 'bg-slate-100 hover:bg-slate-200'} rounded-lg mb-2`}>
                  <span className="text-green-500"><Icons.Image /></span>
                  <div className="text-left"><div className="font-medium">SVG Vector</div><div className="text-sm text-slate-400">Scalable for editing/printing</div></div>
                </button>
                <div className={`p-3 ${darkMode ? 'bg-slate-700/50 text-slate-400' : 'bg-slate-100 text-slate-500'} rounded text-xs mt-2`}>
                  {groups.length} groups · {components.length} components · {interfaces.length} interfaces
                </div>
                <div className="flex justify-end mt-4"><button onClick={() => setShowExport(false)} className={`px-4 py-2 ${darkMode ? 'bg-slate-700' : 'bg-slate-200'} rounded`}>Cancel</button></div>
              </div>
            </div>
          )}

          {/* Threat Register Modal — with Attack Paths tab */}
          {showThreatRegister && (
            <div className={`fixed inset-0 ${darkMode ? 'bg-black/60' : 'bg-black/40'} flex items-center justify-center z-50 p-4`} onClick={() => setShowThreatRegister(false)}>
              <div className={`${darkMode ? 'bg-slate-800 text-slate-100' : 'bg-white text-slate-900'} rounded-xl w-full max-w-6xl max-h-[90vh] flex flex-col shadow-xl`} onClick={e => e.stopPropagation()}>
                <div className={`p-4 border-b ${darkMode ? 'border-slate-700' : 'border-slate-200'} flex items-center gap-4 flex-shrink-0`}>
                  <button onClick={() => setRegisterTab('threats')}
                    className={`text-sm font-medium px-3 py-1 rounded ${registerTab === 'threats' ? 'bg-amber-600 text-white' : (darkMode ? 'text-slate-400 hover:text-white' : 'text-slate-500 hover:text-slate-900')}`}>
                    Threat Register
                  </button>
                  <button onClick={() => setRegisterTab('paths')}
                    className={`text-sm font-medium px-3 py-1 rounded flex items-center gap-1 ${registerTab === 'paths' ? 'bg-red-600 text-white' : (darkMode ? 'text-slate-400 hover:text-white' : 'text-slate-500 hover:text-slate-900')}`}>
                    Attack Paths
                    <span className="text-xs bg-black/30 px-1.5 rounded">{detectAttackPaths(interfaces, components).length}</span>
                  </button>
                  <div className="flex-1" />
                  <button onClick={() => setShowThreatRegister(false)} className={`p-2 ${darkMode ? 'hover:bg-slate-700' : 'hover:bg-slate-200'} rounded`}><Icons.X /></button>
                </div>

                {/* Tab: Threat Register */}
                {registerTab === 'threats' && (
                  <div className="flex-1 overflow-auto p-4">
                    {generateThreatRegister().length === 0 ? (
                      <div className="text-center text-slate-400 py-12">No threats identified. Add threats to components or interfaces.</div>
                    ) : (
                      <table className="w-full text-sm">
                        <thead className={`${darkMode ? 'bg-slate-700/50' : 'bg-slate-100'} sticky top-0`}>
                          <tr>
                            <th className="text-left p-2">Element</th>
                            <th className="text-left p-2">Type</th>
                            <th className="text-left p-2">Cluster</th>
                            <th className="text-left p-2">Status</th>
                            <th className="text-left p-2">VC</th>
                            <th className="text-left p-2">Risk</th>
                            <th className="text-left p-2">Notes</th>
                            <th className="text-left p-2">Control</th>
                          </tr>
                        </thead>
                        <tbody className={`divide-y ${darkMode ? 'divide-slate-700' : 'divide-slate-200'}`}>
                          {generateThreatRegister().map((item, idx) => {
                            const cluster = TLCTC_CLUSTERS[item.cluster];
                            const isComponent = item.elementType === 'component';
                            return (
                              <tr key={idx} className={`${darkMode ? 'hover:bg-slate-700/30' : 'hover:bg-slate-50'}`}>
                                <td className="p-2">
                                  <div className="font-medium">{isComponent ? item.componentName : item.interfaceName}</div>
                                  <div className="text-xs text-slate-500">
                                    {isComponent ? (item.group || 'Ungrouped') : `${item.fromGroup || '-'} → ${item.toGroup || '-'}`}
                                  </div>
                                </td>
                                <td className="p-2">
                                  <span className={`px-1.5 py-0.5 rounded text-xs ${isComponent ? (darkMode ? 'bg-purple-900/50 text-purple-300' : 'bg-purple-100 text-purple-700') : item.isNetworkInterface ? (darkMode ? 'bg-blue-900/50 text-blue-300' : 'bg-blue-100 text-blue-700') : (darkMode ? 'bg-slate-700' : 'bg-slate-200')}`}>
                                    {isComponent ? 'Component' : item.interfaceType}
                                  </span>
                                </td>
                                <td className="p-2"><span className="font-mono font-bold" style={{ color: cluster?.color }}>{item.cluster}</span> <span className="text-xs text-slate-400">{cluster?.shortName}</span></td>
                                <td className="p-2"><span className={`px-1.5 py-0.5 rounded text-xs ${item.status === 'Mitigated' ? (darkMode ? 'bg-green-900/50 text-green-300' : 'bg-green-100 text-green-700') : item.status === 'Accepted' ? (darkMode ? 'bg-blue-900/50 text-blue-300' : 'bg-blue-100 text-blue-700') : (darkMode ? 'bg-amber-900/50 text-amber-300' : 'bg-amber-100 text-amber-700')}`}>{item.status}</span></td>
                                <td className="p-2" style={{ color: VELOCITY_CLASSES[item.velocityClass]?.color }}>{item.velocityClass}</td>
                                <td className="p-2"><span className={`px-1.5 py-0.5 rounded text-xs ${item.residualRisk === 'Critical' ? (darkMode ? 'bg-red-900/50 text-red-300' : 'bg-red-100 text-red-700') : item.residualRisk === 'High' ? (darkMode ? 'bg-orange-900/50 text-orange-300' : 'bg-orange-100 text-orange-700') : item.residualRisk === 'Medium' ? (darkMode ? 'bg-yellow-900/50 text-yellow-300' : 'bg-yellow-100 text-yellow-700') : (darkMode ? 'bg-green-900/50 text-green-300' : 'bg-green-100 text-green-700')}`}>{item.residualRisk}</span></td>
                                <td className="p-2 text-xs text-slate-400 max-w-xs truncate">{item.notes || '-'}</td>
                                <td className="p-2 text-xs">
                                  {item.controlRef ? (
                                    <a href={item.controlRef} target="_blank" rel="noopener noreferrer" className="text-green-400 hover:text-green-300 underline flex items-center gap-1">
                                      <Icons.Link /> Doc
                                    </a>
                                  ) : item.status === 'Mitigated' ? <span className="text-slate-500">Missing</span> : '-'}
                                </td>
                              </tr>
                            );
                          })}
                        </tbody>
                      </table>
                    )}
                  </div>
                )}

                {/* Tab: Attack Paths */}
                {registerTab === 'paths' && (
                  <div className="flex-1 overflow-auto p-4">
                    {(() => {
                      const allPaths = detectAttackPaths(interfaces, components);
                      if (allPaths.length === 0) return (
                        <div className="text-center text-slate-400 py-12">No attack paths detected. Connect components via interfaces to see attack chain analysis.</div>
                      );
                      return (
                        <div className="grid gap-3 md:grid-cols-2">
                          {allPaths.map((path, idx) => (
                            <div key={idx} className={`p-4 rounded-lg border ${darkMode ? 'border-red-800/30 bg-red-900/10 hover:bg-red-900/15' : 'border-red-200 bg-red-50 hover:bg-red-100'} transition-colors`}>
                              <div className="font-medium text-red-300 text-sm">{path.name}</div>
                              <div className="text-xs text-slate-500 mt-0.5">{path.fromName} → {path.toName}</div>
                              <div className="flex items-center gap-1.5 mt-2 flex-wrap">
                                {path.chain.map((step, j) => (
                                  <React.Fragment key={j}>
                                    <span className="px-2 py-0.5 rounded text-xs font-mono font-bold"
                                      style={{ backgroundColor: `${TLCTC_CLUSTERS[step]?.color}25`, color: TLCTC_CLUSTERS[step]?.color, border: `1px solid ${TLCTC_CLUSTERS[step]?.color}40` }}>
                                      {step} {TLCTC_CLUSTERS[step]?.shortName}
                                    </span>
                                    {j < path.chain.length - 1 && <span className="text-slate-600">→</span>}
                                  </React.Fragment>
                                ))}
                              </div>
                              <p className="text-xs text-slate-400 mt-2 leading-relaxed">{path.desc}</p>
                              <p className="text-xs text-slate-500 mt-1 italic leading-relaxed">{path.example}</p>
                            </div>
                          ))}
                        </div>
                      );
                    })()}
                  </div>
                )}

                <div className={`p-4 border-t ${darkMode ? 'border-slate-700' : 'border-slate-200'} flex justify-between items-center flex-shrink-0`}>
                  <div className="text-sm text-slate-400">
                    {registerTab === 'threats' ? `${generateThreatRegister().length} threats` : `${detectAttackPaths(interfaces, components).length} attack paths detected`}
                  </div>
                  <button onClick={exportJSON} className="flex items-center gap-2 px-4 py-2 bg-amber-600 hover:bg-amber-500 rounded text-sm font-medium">
                    <Icons.Download /> Export JSON
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    // Render
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<TLCTCThreatIdentificationTool />);
  </script>
</body>
</html>
