// QUICK ASSESS MODAL
// ═══════════════════════════════════════════════════════════════════

function QuickAssessModal({ onClose, environments, activeEnvId, sharedControls, onBulkMaturity, onLinkShared }) {
    const [tab, setTab] = useState('maturity'); // maturity, shared
    const [scope, setScope] = useState('cluster'); // cluster, function, all
    const [clusterId, setClusterId] = useState(1);
    const [funcId, setFuncId] = useState('GV');
    const [controlType, setControlType] = useState('both');
    const [maturity, setMaturity] = useState(0);
    const [selectedShared, setSelectedShared] = useState('');

    const env = environments.find(e => e.id === activeEnvId);
    if (!env) return null;

    const getTargetCells = () => {
        const clusters = scope === 'cluster' ? [clusterId] : CLUSTERS.map(c => c.id);
        const funcs = scope === 'function' ? [funcId] : CSF_FUNCTIONS.map(f => f.id);
        const cells = [];
        clusters.forEach(cid => funcs.forEach(fid => cells.push(cellKey(cid, fid))));
        return cells;
    };

    const handleMaturityApply = () => {
        const cells = getTargetCells();
        const types = controlType === 'both' ? ['local', 'umbrella'] : [controlType];
        const updates = [];
        cells.forEach(ck => {
            types.forEach(type => {
                const cell = env.cells[ck];
                const controls = cell ? (cell[type] || []) : [];
                if (controls.length > 0) {
                    updates.push({ ck, type, action: 'update', maturity });
                }
            });
        });
        if (updates.length === 0) {
            alert('No existing controls found in the selected scope. Add controls to cells first, then use Quick Assess to set their maturity.');
            return;
        }
        onBulkMaturity(activeEnvId, updates);
        onClose();
    };

    const handleSharedApply = () => {
        if (!selectedShared) return;
        const cells = getTargetCells();
        cells.forEach(ck => onLinkShared(activeEnvId, ck, selectedShared));
        onClose();
    };

    const cellCount = getTargetCells().length;

    return (
        <div className="modal-overlay" onClick={onClose}>
            <div className="modal-content" onClick={e => e.stopPropagation()}>
                <div className="flex items-center justify-between mb-4">
                    <h2 className="font-display font-bold text-lg">Quick Assess</h2>
                    <button onClick={onClose} className="p-1 hover:bg-accent rounded"><Icon name="x" size={18} /></button>
                </div>

                <div className="flex gap-1 mb-4 bg-muted rounded-lg p-1">
                    <button onClick={() => setTab('maturity')} className={`flex-1 app-btn app-btn-sm ${tab === 'maturity' ? 'app-btn-primary' : ''}`}>
                        <Icon name="bar-chart-3" size={13} /> Set Maturity
                    </button>
                    <button onClick={() => setTab('shared')} className={`flex-1 app-btn app-btn-sm ${tab === 'shared' ? 'app-btn-primary' : ''}`}>
                        <Icon name="link" size={13} /> Link Shared Control
                    </button>
                </div>

                <div className="space-y-3">
                    <div>
                        <label className="text-xs font-medium text-muted-foreground block mb-1">Scope</label>
                        <div className="flex gap-2">
                            {[{v:'cluster',l:'Cluster Row'},{v:'function',l:'CSF Column'},{v:'all',l:'All Cells'}].map(o => (
                                <button key={o.v} onClick={() => setScope(o.v)}
                                        className={`app-btn app-btn-sm ${scope === o.v ? 'app-btn-primary' : 'app-btn-outline'}`}>{o.l}</button>
                            ))}
                        </div>
                    </div>
                    {scope === 'cluster' && (
                        <div>
                            <label className="text-xs font-medium text-muted-foreground block mb-1">Cluster</label>
                            <select value={clusterId} onChange={e => setClusterId(Number(e.target.value))} className="input-ctrl text-sm">
                                {CLUSTERS.map(c => <option key={c.id} value={c.id}>#{c.id} {c.name}</option>)}
                            </select>
                        </div>
                    )}
                    {scope === 'function' && (
                        <div>
                            <label className="text-xs font-medium text-muted-foreground block mb-1">CSF Function</label>
                            <select value={funcId} onChange={e => setFuncId(e.target.value)} className="input-ctrl text-sm">
                                {CSF_FUNCTIONS.map(f => <option key={f.id} value={f.id}>{f.name} ({f.id})</option>)}
                            </select>
                        </div>
                    )}

                    {tab === 'maturity' ? (<>
                        <p className="text-xs text-muted-foreground">Update maturity on all existing controls in the selected scope. Does not create new controls.</p>
                        <div className="grid grid-cols-2 gap-3">
                            <div>
                                <label className="text-xs font-medium text-muted-foreground block mb-1">Control Type</label>
                                <select value={controlType} onChange={e => setControlType(e.target.value)} className="input-ctrl text-sm">
                                    <option value="both">Both (Local & Umbrella)</option>
                                    <option value="local">Local Only</option>
                                    <option value="umbrella">Umbrella Only</option>
                                </select>
                            </div>
                            <div>
                                <label className="text-xs font-medium text-muted-foreground block mb-1">Set Maturity To</label>
                                <select value={maturity} onChange={e => setMaturity(Number(e.target.value))} className="input-ctrl text-sm">
                                    {MATURITY_LEVELS.map(ml => <option key={ml.value} value={ml.value}>{ml.value} — {ml.label}</option>)}
                                </select>
                            </div>
                        </div>
                    </>) : (<>
                        <p className="text-xs text-muted-foreground">Link a shared control to {cellCount} umbrella cell{cellCount !== 1 ? 's' : ''} at once. Already linked cells are skipped.</p>
                        <div>
                            <label className="text-xs font-medium text-muted-foreground block mb-1">Shared Control</label>
                            {sharedControls.length === 0 ? (
                                <div className="text-xs text-muted-foreground italic py-2">No shared controls defined yet. Create one in the Shared Controls Library first.</div>
                            ) : (
                                <select value={selectedShared} onChange={e => setSelectedShared(e.target.value)} className="input-ctrl text-sm">
                                    <option value="">— select shared control —</option>
                                    {sharedControls.map(sc => (
                                        <option key={sc.id} value={sc.id}>{sc.name}{sc.scope ? ' (' + (SHARED_SCOPES.find(s=>s.id===sc.scope)?.label || sc.scope) + ')' : ''}</option>
                                    ))}
                                </select>
                            )}
                        </div>
                    </>)}
                </div>
                <div className="flex justify-end gap-2 mt-6">
                    <button onClick={onClose} className="app-btn app-btn-outline">Cancel</button>
                    {tab === 'maturity' ? (
                        <button onClick={handleMaturityApply} className="app-btn app-btn-primary">
                            <Icon name="zap" size={14} /> Set Maturity ({cellCount} cells)
                        </button>
                    ) : (
                        <button onClick={handleSharedApply} disabled={!selectedShared} className="app-btn app-btn-primary">
                            <Icon name="link" size={14} /> Link to {cellCount} cells
                        </button>
                    )}
                </div>
            </div>
        </div>
    );
}

function App() {
    const [state, setState] = useState(() => loadState());
    const [activeEnvId, setActiveEnvId] = useState(() => state.environments[0]?.id || 'aggregated');
    const [selectedCell, setSelectedCell] = useState(null);
    const [darkMode, setDarkMode] = useState(() => {
        const saved = localStorage.getItem('tlctc-cm-dark');
        if (saved !== null) return saved === 'true';
        return window.matchMedia?.('(prefers-color-scheme: dark)').matches || false;
    });
    const [showImport, setShowImport] = useState(false);
    const [showSchema, setShowSchema] = useState(false);
    const [showQuickAssess, setShowQuickAssess] = useState(false);
    const [showSharedLibrary, setShowSharedLibrary] = useState(false);
    const matrixRef = useRef(null);

    // Persist state
    useEffect(() => { saveState(state); }, [state]);

    // Dark mode class
    useEffect(() => {
        document.documentElement.classList.toggle('dark', darkMode);
        localStorage.setItem('tlctc-cm-dark', darkMode);
    }, [darkMode]);

    // Keyboard shortcuts
    useEffect(() => {
        const handler = (e) => {
            if (e.key === 'Escape') setSelectedCell(null);
        };
        window.addEventListener('keydown', handler);
        return () => window.removeEventListener('keydown', handler);
    }, []);

    // Ensure activeEnvId is valid
    useEffect(() => {
        if (activeEnvId !== 'aggregated' && !state.environments.find(e => e.id === activeEnvId)) {
            setActiveEnvId(state.environments[0]?.id || 'aggregated');
        }
    }, [state.environments, activeEnvId]);

    // State updaters
    const updateState = (updates) => setState(prev => ({ ...prev, ...updates, lastModified: new Date().toISOString().split('T')[0] }));

    const updateEnvironment = (envId, updater) => {
        setState(prev => ({
            ...prev,
            lastModified: new Date().toISOString().split('T')[0],
            environments: prev.environments.map(env => env.id === envId ? updater(env) : env),
        }));
    };

    const addEnvironment = () => {
        const name = prompt('Environment name:', `Environment ${state.environments.length + 1}`);
        if (!name?.trim()) return;
        const newEnv = createEmptyEnvironment(name.trim());
        setState(prev => ({ ...prev, environments: [...prev.environments, newEnv] }));
        setActiveEnvId(newEnv.id);
    };

    const renameEnvironment = (envId, name) => {
        updateEnvironment(envId, env => ({ ...env, name }));
    };

    const duplicateEnvironment = (envId) => {
        const source = state.environments.find(e => e.id === envId);
        if (!source) return;
        const newEnv = { ...JSON.parse(JSON.stringify(source)), id: genId(), name: source.name + ' (Copy)' };
        setState(prev => ({ ...prev, environments: [...prev.environments, newEnv] }));
        setActiveEnvId(newEnv.id);
    };

    const removeEnvironment = (envId) => {
        setState(prev => {
            const remaining = prev.environments.filter(e => e.id !== envId);
            return { ...prev, environments: remaining };
        });
        if (activeEnvId === envId) {
            const remaining = state.environments.filter(e => e.id !== envId);
            setActiveEnvId(remaining.length > 0 ? remaining[0].id : 'aggregated');
        }
        setSelectedCell(null);
    };

    // Shared controls CRUD
    const addSharedControl = (sc) => setState(prev => ({ ...prev, sharedControls: [...(prev.sharedControls || []), sc] }));
    const updateSharedControl = (sc) => setState(prev => ({ ...prev, sharedControls: (prev.sharedControls || []).map(s => s.id === sc.id ? sc : s) }));
    const deleteSharedControl = (scId) => {
        setState(prev => {
            // Remove from library and purge all references from umbrella arrays
            const environments = prev.environments.map(env => ({
                ...env,
                cells: Object.fromEntries(Object.entries(env.cells).map(([ck, cell]) => [ck, {
                    ...cell,
                    umbrella: (cell.umbrella || []).filter(c => c.sharedControlId !== scId),
                }]))
            }));
            return { ...prev, sharedControls: (prev.sharedControls || []).filter(s => s.id !== scId), environments };
        });
    };

    const linkSharedToCell = (envId, ck, scId) => {
        updateEnvironment(envId, env => {
            const cell = env.cells[ck] || { local: [], umbrella: [] };
            const already = (cell.umbrella || []).some(c => c.sharedControlId === scId);
            if (already) return env;
            return { ...env, cells: { ...env.cells, [ck]: { ...cell, umbrella: [...(cell.umbrella || []), { id: genId(), sharedControlId: scId, maturity: 0 }] } } };
        });
    };
    const unlinkSharedFromCell = (envId, ck, scId) => {
        updateEnvironment(envId, env => {
            const cell = env.cells[ck] || { local: [], umbrella: [] };
            return { ...env, cells: { ...env.cells, [ck]: { ...cell, umbrella: (cell.umbrella || []).filter(c => c.sharedControlId !== scId) } } };
        });
    };

    const handleCellUpdate = (envId, ck, type, updater) => {
        updateEnvironment(envId, env => {
            const cell = env.cells[ck] || { local: [], umbrella: [] };
            return {
                ...env,
                cells: { ...env.cells, [ck]: { ...cell, [type]: updater(cell[type] || []) } },
            };
        });
    };

    const handleCellMeta = (envId, ck, meta) => {
        updateEnvironment(envId, env => {
            const cell = env.cells[ck] || { local: [], umbrella: [] };
            return {
                ...env,
                cells: { ...env.cells, [ck]: { ...cell, ...meta } },
            };
        });
    };

    const handleBulkMaturity = (envId, updates) => {
        updateEnvironment(envId, env => {
            const cells = { ...env.cells };
            updates.forEach(({ ck, type, maturity }) => {
                const cell = cells[ck] || { local: [], umbrella: [] };
                cells[ck] = { ...cell, [type]: (cell[type] || []).map(c => ({ ...c, maturity })) };
            });
            return { ...env, cells };
        });
    };

    // Export JSON
    const exportJSON = () => {
        const exportData = {
            version: '1.0.0',
            tool: 'TLCTC Control Matrix Manager',
            exportDate: new Date().toISOString(),
            ...state,
        };
        const blob = new Blob([JSON.stringify(exportData, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `tlctc-control-matrix-${state.orgName.replace(/\s+/g, '-').toLowerCase()}-${new Date().toISOString().split('T')[0]}.json`;
        a.click();
        URL.revokeObjectURL(url);
    };

    // Import JSON
    const handleImport = (data) => {
        const newState = {
            orgName: data.orgName || data.organizationName || 'Imported',
            targetMaturity: data.targetMaturity ?? 3,
            environments: data.environments || [],
            sharedControls: data.sharedControls || [],
            createdAt: data.createdAt || new Date().toISOString().split('T')[0],
        };
        setState(newState);
        setActiveEnvId(newState.environments[0]?.id || 'aggregated');
        setSelectedCell(null);
    };

    // Load Starter
    const loadStarter = async () => {
        if (!confirm('Load starter template? This will replace your current data.')) return;
        try {
            const resp = await fetch('control-matrix-starter.json');
            if (!resp.ok) throw new Error('Could not load control-matrix-starter.json');
            const data = await resp.json();
            handleImport(data);
        } catch (e) { alert('Failed to load starter data: ' + e.message); }
    };

    // Export PNG
    const exportPNG = async () => {
        if (!matrixRef.current) return;
        const table = matrixRef.current.querySelector('table');
        if (!table) return;

        // Temporarily expand for clean export: remove truncation, widen first col
        const truncated = table.querySelectorAll('.truncate');
        truncated.forEach(el => {
            el.classList.remove('truncate');
            el.dataset.pngRestore = 'truncate';
            if (el.style.maxWidth || el.className.includes('max-w-')) {
                el.dataset.pngMaxW = el.style.maxWidth;
                el.style.maxWidth = 'none';
            }
        });
        // Remove max-w-[110px] overrides (Tailwind utility baked into style)
        const maxWEls = table.querySelectorAll('[class*="max-w-"]');
        maxWEls.forEach(el => {
            el.dataset.pngClasses = el.className;
            el.className = el.className.replace(/max-w-\[\d+px\]/g, '');
        });
        // Hide tooltip spans
        const tips = table.querySelectorAll('.tip');
        tips.forEach(el => { el.dataset.pngDisplay = el.style.display; el.style.display = 'none'; });

        const origPad = table.style.padding;
        table.style.padding = '20px';

        try {
            const canvas = await html2canvas(table, {
                backgroundColor: darkMode ? '#1e293b' : '#f8fafc',
                scale: 2,
                logging: false,
            });
            const a = document.createElement('a');
            a.download = `tlctc-control-matrix-${new Date().toISOString().split('T')[0]}.png`;
            a.href = canvas.toDataURL('image/png');
            a.click();
        } catch (e) { alert('PNG export failed: ' + e.message); }

        // Restore everything
        truncated.forEach(el => { el.classList.add('truncate'); delete el.dataset.pngRestore; });
        maxWEls.forEach(el => { if (el.dataset.pngClasses) { el.className = el.dataset.pngClasses; delete el.dataset.pngClasses; } });
        tips.forEach(el => { el.style.display = el.dataset.pngDisplay || ''; delete el.dataset.pngDisplay; });
        table.style.padding = origPad;
    };

    const generateReport = (type) => {
        const date = new Date().toISOString().split('T')[0];
        const orgName = state.orgName || 'Organization';
        const envs = state.environments;
        const target = state.targetMaturity;
        // Helper: closing tags must use <\/ to avoid breaking the outer <script> parser
        const C = t => '<' + '/' + t + '>';
        const css = '<style>' +
            '* { margin: 0; padding: 0; box-sizing: border-box; } ' +
            "body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; padding: 32px; color: #1e293b; font-size: 13px; line-height: 1.5; } " +
            'h1 { font-size: 20px; margin-bottom: 4px; } h2 { font-size: 16px; margin: 24px 0 8px; border-bottom: 2px solid #e2e8f0; padding-bottom: 4px; } ' +
            'h3 { font-size: 13px; margin: 12px 0 4px; } ' +
            '.meta { color: #64748b; font-size: 12px; margin-bottom: 20px; } ' +
            'table { border-collapse: collapse; width: 100%; margin: 8px 0 16px; font-size: 12px; } ' +
            'th, td { border: 1px solid #e2e8f0; padding: 5px 8px; text-align: left; } ' +
            'th { background: #f1f5f9; font-weight: 600; } ' +
            '.status { display: inline-block; padding: 1px 8px; border-radius: 9px; font-size: 11px; font-weight: 600; } ' +
            '.status-open { background: #f1f5f9; color: #64748b; } ' +
            '.status-in-progress { background: #dbeafe; color: #2563eb; } ' +
            '.status-blocked { background: #fef2f2; color: #dc2626; } ' +
            '.status-done { background: #f0fdf4; color: #16a34a; } ' +
            '.overdue { color: #dc2626; font-weight: 600; } ' +
            '.gap { background: #fef2f2; } .ok { background: #f0fdf4; } ' +
            '.mat-0 { color: #ef4444; } .mat-1 { color: #f97316; } .mat-2 { color: #eab308; } ' +
            '.mat-3 { color: #84cc16; } .mat-4 { color: #22c55e; } .mat-5 { color: #059669; } ' +
            '.badge { font-weight: 700; } ' +
            '.summary-box { display: inline-block; padding: 8px 16px; margin: 4px 8px 4px 0; border-radius: 8px; border: 1px solid #e2e8f0; } ' +
            '.summary-box .num { font-size: 22px; font-weight: 700; } .summary-box .lbl { font-size: 11px; color: #64748b; } ' +
            '.cluster-tag { display: inline-block; padding: 1px 6px; border-radius: 4px; color: white; font-size: 11px; font-weight: 700; margin-right: 4px; } ' +
            '.cluster-internal { background: #2563eb; } .cluster-bridge { background: #d97706; } ' +
            '@media print { body { padding: 16px; } }' +
            C('style');

        const docHead = (title) => '<!DOCTYPE html><html><head><meta charset="utf-8"><title>' + title + C('title') + css + C('head') + '<body>';
        const docEnd = C('body') + C('html');

        let html = '';

        if (type === 'maturity') {
            html = docHead('Maturity Report — ' + orgName);
            html += '<h1>Maturity Report' + C('h1') + '<div class="meta">' + orgName + ' — Generated ' + date + ' — Target Maturity: ' + target + C('div');

            envs.forEach(env => {
                html += '<h2>Environment: ' + env.name + C('h2');
                let totalCells = 0, gapCells = 0, documentedCells = 0;

                html += '<table><tr><th>Cluster' + C('th');
                CSF_FUNCTIONS.forEach(fn => { html += '<th style="color:' + fn.color + '">' + fn.id + C('th'); });
                html += '<th>Row Min' + C('th') + C('tr');

                CLUSTERS.forEach(cl => {
                    html += '<tr><td><span class="cluster-tag cluster-' + cl.topology + '">#' + cl.id + C('span') + ' ' + cl.name + C('td');
                    let rowVals = [];
                    CSF_FUNCTIONS.forEach(fn => {
                        const ck = cellKey(cl.id, fn.id);
                        const cell = env.cells[ck] || { local: [], umbrella: [] };
                        const allControls = [...(cell.local || []), ...(cell.umbrella || [])];
                        if (allControls.length > 0) {
                            documentedCells++;
                            const matVals = allControls.map(c => typeof c.maturity === 'number' ? c.maturity : 0);
                            const worst = Math.min(...matVals);
                            rowVals.push(worst);
                            totalCells++;
                            const isGap = worst < target;
                            if (isGap) gapCells++;
                            html += '<td class="' + (isGap ? 'gap' : 'ok') + '"><span class="badge mat-' + worst + '">' + worst + C('span') + ' (' + allControls.length + ' ctrl)' + C('td');
                        } else {
                            totalCells++;
                            html += '<td style="color:#94a3b8">\u2014' + C('td');
                        }
                    });
                    const rowMin = rowVals.length > 0 ? Math.min(...rowVals) : null;
                    html += '<td><span class="badge' + (rowMin !== null ? ' mat-' + rowMin : '') + '">' + (rowMin !== null ? rowMin : '\u2014') + C('span') + C('td') + C('tr');
                });
                html += C('table');

                html += '<div>';
                html += '<div class="summary-box"><div class="num">' + documentedCells + C('div') + '<div class="lbl">Documented Cells' + C('div') + C('div');
                html += '<div class="summary-box"><div class="num" style="color:#ef4444">' + gapCells + C('div') + '<div class="lbl">Below Target (' + target + ')' + C('div') + C('div');
                html += '<div class="summary-box"><div class="num">' + (totalCells - documentedCells) + C('div') + '<div class="lbl">Undocumented' + C('div') + C('div');
                html += C('div');

                const gaps = [];
                CLUSTERS.forEach(cl => CSF_FUNCTIONS.forEach(fn => {
                    const ck = cellKey(cl.id, fn.id);
                    const cell = env.cells[ck] || { local: [], umbrella: [] };
                    const allControls = [...(cell.local || []), ...(cell.umbrella || [])];
                    allControls.forEach(c => {
                        if (typeof c.maturity === 'number' && c.maturity < target) {
                            const name = c.sharedControlId ? ((state.sharedControls || []).find(s => s.id === c.sharedControlId)?.name || 'Shared') : (c.name || 'Unnamed');
                            gaps.push({ cluster: '#' + cl.id + ' ' + cl.name, func: fn.id, name, maturity: c.maturity, gap: target - c.maturity });
                        }
                    });
                }));
                if (gaps.length > 0) {
                    html += '<h3>Gap Details (controls below target)' + C('h3');
                    html += '<table><tr><th>Cluster' + C('th') + '<th>Function' + C('th') + '<th>Control' + C('th') + '<th>Maturity' + C('th') + '<th>Gap' + C('th') + C('tr');
                    gaps.sort((a, b) => a.maturity - b.maturity).forEach(g => {
                        html += '<tr class="gap"><td>' + g.cluster + C('td') + '<td>' + g.func + C('td') + '<td>' + g.name + C('td') + '<td class="badge mat-' + g.maturity + '">' + g.maturity + C('td') + '<td>' + g.gap + C('td') + C('tr');
                    });
                    html += C('table');
                }
            });
            html += docEnd;

        } else if (type === 'tasks') {
            html = docHead('Task Report — ' + orgName);
            html += '<h1>Task Report' + C('h1') + '<div class="meta">' + orgName + ' — Generated ' + date + C('div');

            let allTasks = [];
            envs.forEach(env => {
                Object.entries(env.cells).forEach(([ck, cell]) => {
                    (cell.tasks || []).forEach(task => {
                        const [cid, fid] = ck.split('-');
                        const cl = CLUSTERS[Number(cid) - 1];
                        allTasks.push({ ...task, envName: env.name, cluster: cl, funcId: fid, comments: cell.comments || '' });
                    });
                });
            });

            const byStatus = {};
            TASK_STATUSES.forEach(s => { byStatus[s.id] = allTasks.filter(t => t.status === s.id).length; });
            const overdue = allTasks.filter(t => t.dueDate && t.status !== 'done' && new Date(t.dueDate) < new Date()).length;

            html += '<div>';
            html += '<div class="summary-box"><div class="num">' + allTasks.length + C('div') + '<div class="lbl">Total Tasks' + C('div') + C('div');
            TASK_STATUSES.forEach(s => {
                html += '<div class="summary-box"><div class="num" style="color:' + s.color + '">' + byStatus[s.id] + C('div') + '<div class="lbl">' + s.label + C('div') + C('div');
            });
            if (overdue > 0) html += '<div class="summary-box"><div class="num" style="color:#dc2626">' + overdue + C('div') + '<div class="lbl">Overdue' + C('div') + C('div');
            html += C('div');

            if (allTasks.length === 0) {
                html += '<p style="margin-top:16px;color:#64748b;">No tasks found across any environment.' + C('p');
            } else {
                TASK_STATUSES.forEach(st => {
                    const tasks = allTasks.filter(t => t.status === st.id);
                    if (tasks.length === 0) return;
                    html += '<h2>' + st.label + ' (' + tasks.length + ')' + C('h2');
                    html += '<table><tr><th>Task' + C('th') + '<th>Owner' + C('th') + '<th>Due Date' + C('th') + '<th>Cluster' + C('th') + '<th>Function' + C('th') + '<th>Environment' + C('th') + C('tr');
                    tasks.sort((a, b) => (a.dueDate || '9999') < (b.dueDate || '9999') ? -1 : 1).forEach(t => {
                        const od = t.dueDate && t.status !== 'done' && new Date(t.dueDate) < new Date() ? ' overdue' : '';
                        html += '<tr><td>' + (t.description || '<em>No description' + C('em')) + C('td') + '<td>' + (t.owner || '\u2014') + C('td');
                        html += '<td class="' + od + '">' + (t.dueDate || '\u2014') + C('td');
                        html += '<td><span class="cluster-tag cluster-' + t.cluster.topology + '">#' + t.cluster.id + C('span') + ' ' + t.cluster.name + C('td');
                        html += '<td>' + t.funcId + C('td') + '<td>' + t.envName + C('td') + C('tr');
                    });
                    html += C('table');
                });

                const owners = [...new Set(allTasks.map(t => t.owner || 'Unassigned'))].sort();
                html += '<h2>By Owner' + C('h2');
                owners.forEach(owner => {
                    const tasks = allTasks.filter(t => (t.owner || 'Unassigned') === owner);
                    const openCount = tasks.filter(t => t.status !== 'done').length;
                    html += '<h3>' + owner + ' \u2014 ' + openCount + ' open, ' + (tasks.length - openCount) + ' done' + C('h3');
                    html += '<table><tr><th>Task' + C('th') + '<th>Status' + C('th') + '<th>Due Date' + C('th') + '<th>Cell' + C('th') + C('tr');
                    tasks.forEach(t => {
                        const st = TASK_STATUSES.find(s => s.id === t.status) || TASK_STATUSES[0];
                        const od = t.dueDate && t.status !== 'done' && new Date(t.dueDate) < new Date() ? ' overdue' : '';
                        html += '<tr><td>' + (t.description || '<em>No description' + C('em')) + C('td');
                        html += '<td><span class="status status-' + t.status + '">' + st.label + C('span') + C('td');
                        html += '<td class="' + od + '">' + (t.dueDate || '\u2014') + C('td');
                        html += '<td>#' + t.cluster.id + ' ' + t.cluster.name + ' \u00d7 ' + t.funcId + ' (' + t.envName + ')' + C('td') + C('tr');
                    });
                    html += C('table');
                });
            }
            html += docEnd;
        }

        const w = window.open('', '_blank');
        if (w) { w.document.write(html); w.document.close(); }
        else alert('Please allow popups to view reports.');
    };

    const handleCellClick = (clusterId, funcId) => {
        if (selectedCell && selectedCell.clusterId === clusterId && selectedCell.funcId === funcId) {
            setSelectedCell(null);
        } else {
            setSelectedCell({ clusterId, funcId });
        }
    };

    return (
        <div className="flex flex-col min-h-screen">
            <Header orgName={state.orgName} onOrgNameChange={v => updateState({ orgName: v })}
                    darkMode={darkMode} onToggleDark={() => setDarkMode(d => !d)}
                    onExportJSON={exportJSON} onImportJSON={() => setShowImport(true)} onExportPNG={exportPNG}
                    onReport={generateReport}
                    onShowSharedControls={() => setShowSharedLibrary(true)}
                    sharedControlCount={(state.sharedControls || []).length}
                    onShowSchema={() => setShowSchema(true)}
                    onLoadStarter={loadStarter} />

            <SummaryBar orgName={state.orgName} onOrgNameChange={v => updateState({ orgName: v })}
                        targetMaturity={state.targetMaturity} onTargetChange={v => updateState({ targetMaturity: v })}
                        environments={state.environments} activeEnvId={activeEnvId} />

            <EnvironmentTabs environments={state.environments} activeEnvId={activeEnvId}
                            onSelect={setActiveEnvId} onAdd={addEnvironment}
                            onRename={renameEnvironment} onDuplicate={duplicateEnvironment} onRemove={removeEnvironment} />

            <div className="flex items-center justify-between px-4 sm:px-6 pt-3 no-print">
                <h2 className="font-display font-bold text-base flex items-center gap-2">
                    <Icon name="grid-3x3" size={18} />
                    {activeEnvId === 'aggregated' ? 'Aggregated View (Worst-Case)' :
                     state.environments.find(e => e.id === activeEnvId)?.name || 'Matrix'}
                </h2>
                {activeEnvId !== 'aggregated' && (
                    <button onClick={() => setShowQuickAssess(true)} className="app-btn app-btn-outline app-btn-sm gap-1">
                        <Icon name="zap" size={13} /> Quick Assess
                    </button>
                )}
            </div>

            <MaturityLegend targetMaturity={state.targetMaturity} />

            <div className="flex-1 relative">
                <ControlMatrix environments={state.environments} activeEnvId={activeEnvId}
                               targetMaturity={state.targetMaturity} selectedCell={selectedCell}
                               onCellClick={handleCellClick} darkMode={darkMode} matrixRef={matrixRef} />

                {selectedCell && (
                    <CellDetailPanel selectedCell={selectedCell} environments={state.environments}
                                     activeEnvId={activeEnvId} targetMaturity={state.targetMaturity}
                                     sharedControls={state.sharedControls || []}
                                     onUpdateCell={handleCellUpdate} onUpdateCellMeta={handleCellMeta}
                                     onAddSharedControl={addSharedControl} onUpdateSharedControl={updateSharedControl}
                                     onClose={() => setSelectedCell(null)} />
                )}
            </div>

            <footer className="px-4 sm:px-6 py-3 border-t border-border text-center text-xs text-muted-foreground no-print">
                TLCTC Control Matrix Manager — 10 Clusters × 6 CSF Functions × 2 Control Types = 120 Control Areas — Data stored in browser localStorage
            </footer>

            {showSchema && <SchemaHelpModal onClose={() => setShowSchema(false)} />}
            {showImport && <ImportModal onClose={() => setShowImport(false)} onImport={handleImport} />}
            {showQuickAssess && <QuickAssessModal onClose={() => setShowQuickAssess(false)} environments={state.environments} activeEnvId={activeEnvId}
                                                    sharedControls={state.sharedControls || []} onBulkMaturity={handleBulkMaturity} onLinkShared={linkSharedToCell} />}
            {showSharedLibrary && <SharedControlsLibrary sharedControls={state.sharedControls || []} environments={state.environments}
                                                          onAdd={addSharedControl} onUpdate={updateSharedControl} onDelete={deleteSharedControl}
                                                          onLink={linkSharedToCell} onUnlink={unlinkSharedFromCell}
                                                          onClose={() => setShowSharedLibrary(false)} />}
        </div>
    );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
