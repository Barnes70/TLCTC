    <script type="text/babel">
const { useState, useEffect, useRef, useCallback, useMemo } = React;

// ═══════════════════════════════════════════════════════════════════
// CONSTANTS
// ═══════════════════════════════════════════════════════════════════

const CLUSTERS = [
    { id: 1,  opId: 'TLCTC-01.00', name: 'Abuse of Functions',  abbr: 'AoF', topology: 'internal', genericVuln: 'The inherent trust, scope, and complexity designed into software functionality and configuration' },
    { id: 2,  opId: 'TLCTC-02.00', name: 'Exploiting Server',   abbr: 'ExS', topology: 'internal', genericVuln: 'Server-side implementation flaws enable unintended behavior' },
    { id: 3,  opId: 'TLCTC-03.00', name: 'Exploiting Client',   abbr: 'ExC', topology: 'internal', genericVuln: 'Client-side implementation flaws enable unintended behavior' },
    { id: 4,  opId: 'TLCTC-04.00', name: 'Identity Theft',      abbr: 'IdT', topology: 'internal', genericVuln: 'Weak identity management processes and credential protection mechanisms' },
    { id: 5,  opId: 'TLCTC-05.00', name: 'Man in the Middle',   abbr: 'MitM', topology: 'internal', genericVuln: 'The lack of sufficient control, integrity protection, or confidentiality over the communication channel' },
    { id: 6,  opId: 'TLCTC-06.00', name: 'Flooding Attack',     abbr: 'Fld', topology: 'internal', genericVuln: 'Finite capacity limitations inherent in any system component' },
    { id: 7,  opId: 'TLCTC-07.00', name: 'Malware',             abbr: 'Mlw', topology: 'internal', genericVuln: "The software environment's designed capability to execute potentially untrusted foreign code" },
    { id: 8,  opId: 'TLCTC-08.00', name: 'Physical Attack',     abbr: 'Phy', topology: 'bridge',   genericVuln: 'Physical accessibility of infrastructure and exploitability of physical-layer properties' },
    { id: 9,  opId: 'TLCTC-09.00', name: 'Social Engineering',  abbr: 'SE',  topology: 'bridge',   genericVuln: 'Humans can be influenced into unsafe actions or decisions' },
    { id: 10, opId: 'TLCTC-10.00', name: 'Supply Chain Attack', abbr: 'SCA', topology: 'bridge',   genericVuln: 'Trust in third-party components and update channels can be subverted' },
];

const CSF_FUNCTIONS = [
    { id: 'GV', name: 'GOVERN',   color: '#8b5cf6', desc: 'Set direction, accountability, ownership, risk appetite, assurance' },
    { id: 'ID', name: 'IDENTIFY', color: '#3b82f6', desc: 'Find weaknesses and exposure enabling the threat' },
    { id: 'PR', name: 'PROTECT',  color: '#22c55e', desc: 'Prevent or reduce likelihood of the threat step' },
    { id: 'DE', name: 'DETECT',   color: '#eab308', desc: 'Detect the threat step or loss-of-control condition early' },
    { id: 'RS', name: 'RESPOND',  color: '#f97316', desc: 'Contain and eradicate the realized threat step' },
    { id: 'RC', name: 'RECOVER',  color: '#06b6d4', desc: 'Restore capability and reduce recurrence' },
];

const CONTROL_TYPES = [
    { id: 'local', name: 'Local', abbr: 'L', desc: 'Asset-specific or system-specific controls' },
    { id: 'umbrella', name: 'Umbrella', abbr: 'U', desc: 'Enterprise-wide, shared capabilities' },
];

const MATURITY_LEVELS = [
    { value: 0, label: 'Not Implemented', abbr: 'N/I', color: '#ef4444', bg: '#fef2f2', darkBg: '#450a0a' },
    { value: 1, label: 'Initial',         abbr: 'Ini', color: '#f97316', bg: '#fff7ed', darkBg: '#431407' },
    { value: 2, label: 'Developing',      abbr: 'Dev', color: '#eab308', bg: '#fefce8', darkBg: '#422006' },
    { value: 3, label: 'Defined',         abbr: 'Def', color: '#84cc16', bg: '#f7fee7', darkBg: '#1a2e05' },
    { value: 4, label: 'Managed',         abbr: 'Mgd', color: '#22c55e', bg: '#f0fdf4', darkBg: '#052e16' },
    { value: 5, label: 'Optimizing',      abbr: 'Opt', color: '#059669', bg: '#ecfdf5', darkBg: '#022c22' },
];

const CONTROL_KINDS = [
    { id: 'tech', label: 'Technical', color: '#3b82f6' },
    { id: 'org',  label: 'Organizational', color: '#8b5cf6' },
];

const SHARED_SCOPES = [
    { id: 'all',            label: 'All' },
    { id: 'applications',   label: 'Applications' },
    { id: 'platform',       label: 'Platform' },
    { id: 'infra-sw',       label: 'Infrastructure (SW)' },
    { id: 'infra-hw',       label: 'Infrastructure (HW)' },
];

const TASK_STATUSES = [
    { id: 'open',        label: 'Open',        color: '#64748b', icon: 'circle' },
    { id: 'in-progress', label: 'In Progress', color: '#3b82f6', icon: 'loader' },
    { id: 'blocked',     label: 'Blocked',     color: '#ef4444', icon: 'alert-circle' },
    { id: 'done',        label: 'Done',        color: '#22c55e', icon: 'check-circle' },
];

const STORAGE_KEY = 'tlctc-control-matrix-v1';

// ═══════════════════════════════════════════════════════════════════
// UTILITIES
// ═══════════════════════════════════════════════════════════════════

const genId = () => 'c' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const cellKey = (clusterId, funcId) => `${clusterId}-${funcId}`;

function getMaturityColor(value) {
    if (value === null || value === undefined) return '#94a3b8';
    return MATURITY_LEVELS[value]?.color || '#94a3b8';
}

function getMaturityBg(value, dark) {
    if (value === null || value === undefined) return dark ? '#1e293b' : '#f1f5f9';
    const ml = MATURITY_LEVELS[value];
    return dark ? (ml?.darkBg || '#1e293b') : (ml?.bg || '#f1f5f9');
}

function computeTypeMaturity(controls) {
    if (!controls || controls.length === 0) return null;
    const vals = controls.map(c => c.maturity).filter(m => m !== null && m !== undefined);
    return vals.length === 0 ? null : Math.min(...vals);
}

function computeCellMaturity(cell) {
    if (!cell) return { local: null, umbrella: null, overall: null };
    const lm = computeTypeMaturity(cell.local);
    const um = computeTypeMaturity(cell.umbrella);
    const all = [lm, um].filter(v => v !== null);
    return { local: lm, umbrella: um, overall: all.length > 0 ? Math.min(...all) : null };
}

function computeAggregated(environments, ck, type) {
    const vals = environments.map(env => {
        const cell = env.cells[ck];
        if (!cell) return null;
        return type ? computeTypeMaturity(cell[type]) : computeCellMaturity(cell).overall;
    }).filter(v => v !== null);
    return vals.length > 0 ? Math.min(...vals) : null;
}

function createEmptyEnvironment(name) {
    return { id: genId(), name, cells: {} };
}

function createDefaultState() {
    return {
        orgName: 'My Organization',
        targetMaturity: 3,
        environments: [createEmptyEnvironment('Default')],
        sharedControls: [],
        createdAt: new Date().toISOString().split('T')[0],
    };
}

function loadState() {
    try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) return JSON.parse(raw);
    } catch(e) { console.warn('Failed to load state', e); }
    return createDefaultState();
}

function saveState(state) {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch(e) { console.warn('Failed to save', e); }
}

function countControls(env) {
    let local = 0, umbrella = 0;
    Object.values(env.cells).forEach(cell => {
        local += (cell.local || []).length;
        umbrella += (cell.umbrella || []).length;
    });
    return { local, umbrella, total: local + umbrella };
}

function countDocumentedCells(env) {
    let count = 0;
    CLUSTERS.forEach(cl => {
        CSF_FUNCTIONS.forEach(fn => {
            CONTROL_TYPES.forEach(ct => {
                const cell = env.cells[cellKey(cl.id, fn.id)];
                if (cell && cell[ct.id] && cell[ct.id].length > 0) count++;
            });
        });
    });
    return count;
}

// ═══════════════════════════════════════════════════════════════════
// ICON HELPER
// ═══════════════════════════════════════════════════════════════════

function Icon({ name, size = 16, className = '' }) {
    const ref = useRef(null);
    useEffect(() => {
        if (ref.current && lucide?.icons?.[name]) {
            const [tag, attrs, children] = lucide.icons[name];
            const svg = document.createElementNS('http://www.w3.org/2000/svg', tag);
            Object.entries({ ...attrs, width: size, height: size, class: className }).forEach(([k, v]) => svg.setAttribute(k, v));
            children.forEach(([cTag, cAttrs]) => {
                const el = document.createElementNS('http://www.w3.org/2000/svg', cTag);
                Object.entries(cAttrs).forEach(([k, v]) => el.setAttribute(k, v));
                svg.appendChild(el);
            });
            ref.current.innerHTML = '';
            ref.current.appendChild(svg);
        }
    }, [name, size, className]);
    return <span ref={ref} className="inline-flex items-center justify-center" />;
}

// ═══════════════════════════════════════════════════════════════════
// MATURITY BADGE
// ═══════════════════════════════════════════════════════════════════

function MaturityBadge({ value, size = 'md' }) {
    const ml = value !== null && value !== undefined ? MATURITY_LEVELS[value] : null;
    const sizeClasses = size === 'sm' ? 'text-[10px] px-1.5 py-0.5' : size === 'lg' ? 'text-sm px-3 py-1' : 'text-xs px-2 py-0.5';
    return (
        <span className={`inline-flex items-center font-bold rounded-full ${sizeClasses}`}
              style={{ backgroundColor: ml ? ml.color + '22' : '#94a3b822', color: ml ? ml.color : '#94a3b8', border: `1px solid ${ml ? ml.color + '44' : '#94a3b844'}` }}>
            {ml ? ml.value : '—'}
        </span>
    );
}

// ═══════════════════════════════════════════════════════════════════
// HEADER DROPDOWN
// ═══════════════════════════════════════════════════════════════════

function HeaderDropdown({ label, icon, items }) {
    const [open, setOpen] = useState(false);
    const ref = useRef(null);
    useEffect(() => {
        if (!open) return;
        const handler = (e) => { if (ref.current && !ref.current.contains(e.target)) setOpen(false); };
        document.addEventListener('mousedown', handler);
        return () => document.removeEventListener('mousedown', handler);
    }, [open]);
    return (
        <div className="relative" ref={ref}>
            <button onClick={() => setOpen(o => !o)} className="app-btn app-btn-outline app-btn-sm gap-1">
                <Icon name={icon} size={14} /> <span className="hidden sm:inline">{label}</span>
                <Icon name="chevron-down" size={12} />
            </button>
            {open && (
                <div className="absolute right-0 top-full mt-1 bg-card border border-border rounded-lg shadow-xl z-50 py-1 min-w-[180px]">
                    {items.map((item, i) => item.divider ? (
                        <div key={i} className="border-t border-border my-1" />
                    ) : (
                        <button key={i} onClick={() => { item.action(); setOpen(false); }}
                                className="w-full text-left px-3 py-1.5 text-xs hover:bg-accent flex items-center gap-2">
                            <Icon name={item.icon} size={13} /> {item.label}
                        </button>
                    ))}
                </div>
            )}
        </div>
    );
}

// ═══════════════════════════════════════════════════════════════════
// HEADER
// ═══════════════════════════════════════════════════════════════════

function Header({ orgName, onOrgNameChange, darkMode, onToggleDark, onExportJSON, onImportJSON, onExportPNG, onShowSharedControls, sharedControlCount, onReport, onShowSchema, onLoadStarter }) {

                        <span style={{display:'none'}}><Icon name="shield" size={20} /></span>

// ═══════════════════════════════════════════════════════════════════
// SUMMARY BAR
// ═══════════════════════════════════════════════════════════════════

function SummaryBar({ orgName, onOrgNameChange, targetMaturity, onTargetChange, environments, activeEnvId }) {
    const totalCells = CLUSTERS.length * CSF_FUNCTIONS.length * CONTROL_TYPES.length; // 120
    const isAgg = activeEnvId === 'aggregated';

    const stats = useMemo(() => {
        if (isAgg) {
            let documented = 0, belowTarget = 0, maturities = [];
            CLUSTERS.forEach(cl => CSF_FUNCTIONS.forEach(fn => CONTROL_TYPES.forEach(ct => {
                const m = computeAggregated(environments, cellKey(cl.id, fn.id), ct.id);
                if (m !== null) {
                    documented++;
                    maturities.push(m);
                    if (m < targetMaturity) belowTarget++;
                }
            })));
            const avg = maturities.length > 0 ? (maturities.reduce((a,b) => a+b, 0) / maturities.length).toFixed(1) : '—';
            const worst = maturities.length > 0 ? Math.min(...maturities) : null;
            return { documented, belowTarget, avg, worst, totalControls: '—' };
        }
        const env = environments.find(e => e.id === activeEnvId);
        if (!env) return { documented: 0, belowTarget: 0, avg: '—', worst: null, totalControls: 0 };
        const dc = countDocumentedCells(env);
        const cc = countControls(env);
        let belowTarget = 0, maturities = [];
        CLUSTERS.forEach(cl => CSF_FUNCTIONS.forEach(fn => CONTROL_TYPES.forEach(ct => {
            const cell = env.cells[cellKey(cl.id, fn.id)];
            const m = cell ? computeTypeMaturity(cell[ct.id]) : null;
            if (m !== null) {
                maturities.push(m);
                if (m < targetMaturity) belowTarget++;
            }
        })));
        const avg = maturities.length > 0 ? (maturities.reduce((a,b) => a+b, 0) / maturities.length).toFixed(1) : '—';
        const worst = maturities.length > 0 ? Math.min(...maturities) : null;
        return { documented: dc, belowTarget, avg, worst, totalControls: cc.total };
    }, [environments, activeEnvId, targetMaturity, isAgg]);

    const coverage = ((stats.documented / totalCells) * 100).toFixed(0);

    return (
        <div className="px-4 sm:px-6 py-3 border-b border-border flex flex-wrap items-center gap-x-6 gap-y-2 text-sm no-print">
            <div className="flex items-center gap-2">
                <label className="text-muted-foreground font-medium">Organization:</label>
                <input type="text" value={orgName} onChange={e => onOrgNameChange(e.target.value)}
                       className="input-ctrl py-1 px-2 w-48 font-semibold" />
            </div>
            <div className="flex items-center gap-2">
                <label className="text-muted-foreground font-medium">Target Maturity:</label>
                <select value={targetMaturity} onChange={e => onTargetChange(Number(e.target.value))}
                        className="input-ctrl py-1 px-2 w-auto">
                    {MATURITY_LEVELS.map(ml => <option key={ml.value} value={ml.value}>{ml.value} — {ml.label}</option>)}
                </select>
            </div>
            <div className="flex items-center gap-4 ml-auto text-xs">
                <div className="tooltip-wrap">
                    <span className="font-semibold" style={{ color: coverage >= 80 ? '#22c55e' : coverage >= 40 ? '#eab308' : '#ef4444' }}>
                        {stats.documented}/{totalCells}
                    </span>
                    <span className="text-muted-foreground ml-1">coverage ({coverage}%)</span>
                    <span className="tip">Control areas with at least one documented control</span>
                </div>
                {stats.totalControls !== '—' && (
                    <div><span className="font-semibold">{stats.totalControls}</span> <span className="text-muted-foreground">controls</span></div>
                )}
                <div className="tooltip-wrap">
                    <span className="font-semibold">{stats.avg}</span>
                    <span className="text-muted-foreground ml-1">avg maturity</span>
                    <span className="tip">Average across all documented control areas</span>
                </div>
                {stats.belowTarget > 0 && (
                    <div className="tooltip-wrap">
                        <span className="font-semibold text-destructive gap-highlight">{stats.belowTarget}</span>
                        <span className="text-muted-foreground ml-1">gaps</span>
                        <span className="tip">Control areas below target maturity of {targetMaturity}</span>
                    </div>

    );
}

// ═══════════════════════════════════════════════════════════════════
// ENVIRONMENT TABS
// ═══════════════════════════════════════════════════════════════════

function EnvironmentTabs({ environments, activeEnvId, onSelect, onAdd, onRename, onDuplicate, onRemove }) {
    const [editingId, setEditingId] = useState(null);
    const [editName, setEditName] = useState('');
    const [menuId, setMenuId] = useState(null);

    const startRename = (env) => { setEditingId(env.id); setEditName(env.name); setMenuId(null); };
    const commitRename = () => { if (editName.trim()) onRename(editingId, editName.trim()); setEditingId(null); };

    const menuRef = useRef(null);
    useEffect(() => {
        if (!menuId) return;
        const handleClick = (e) => { if (menuRef.current && !menuRef.current.contains(e.target)) setMenuId(null); };
        document.addEventListener('mousedown', handleClick);
        return () => document.removeEventListener('mousedown', handleClick);
    }, [menuId]);

    return (
        <div className="px-4 sm:px-6 py-2 border-b border-border flex flex-wrap items-center gap-1 no-print" style={{ position: 'relative' }}>
            <button onClick={() => onSelect('aggregated')}
                    className={`app-btn app-btn-sm rounded-full ${activeEnvId === 'aggregated' ? 'app-btn-primary' : 'app-btn-outline'}`}>
                <Icon name="layers" size={13} /> Aggregated
            </button>
            <div className="w-px h-6 bg-border mx-1" />
            {environments.map(env => (
                <div key={env.id} className="relative flex items-center">
                    {editingId === env.id ? (
                        <input autoFocus value={editName} onChange={e => setEditName(e.target.value)}
                               onBlur={commitRename} onKeyDown={e => e.key === 'Enter' && commitRename()}
                               className="input-ctrl py-1 px-2 text-xs w-32" />
                    ) : (
                        <button onClick={() => onSelect(env.id)}
                                className={`app-btn app-btn-sm rounded-full ${activeEnvId === env.id ? 'app-btn-primary' : 'app-btn-outline'}`}>
                            {env.name}
                        </button>
                    )}
                    {activeEnvId === env.id && editingId !== env.id && (
                        <button onClick={() => setMenuId(menuId === env.id ? null : env.id)}
                                className="ml-1 px-1.5 py-0.5 rounded border border-border hover:bg-accent text-muted-foreground text-xs font-bold leading-none">
                            &#8942;
                        </button>
                    )}
                    {menuId === env.id && (
                        <div ref={menuRef} className="absolute top-full left-0 mt-1 bg-card border border-border rounded-lg shadow-xl z-50 py-1 min-w-[140px]">
                            <button onClick={() => startRename(env)} className="w-full text-left px-3 py-1.5 text-xs hover:bg-accent flex items-center gap-2">
                                <Icon name="pencil" size={12} /> Rename
                            </button>
                            <button onClick={() => { onDuplicate(env.id); setMenuId(null); }} className="w-full text-left px-3 py-1.5 text-xs hover:bg-accent flex items-center gap-2">
                                <Icon name="copy" size={12} /> Duplicate
                            </button>
                            {environments.length > 1 && (
                                <button onClick={() => { if (confirm(`Delete environment "${env.name}"?`)) { onRemove(env.id); setMenuId(null); } }}
                                        className="w-full text-left px-3 py-1.5 text-xs hover:bg-accent text-destructive flex items-center gap-2">
                                    <Icon name="trash-2" size={12} /> Delete
                                </button>
                            )}
                        </div>
                    )}
                </div>
            ))}
            <button onClick={onAdd} className="app-btn app-btn-sm app-btn-outline rounded-full gap-1 ml-1">
                <Icon name="plus" size={13} /> Environment
            </button>
        </div>
    );
}

// ═══════════════════════════════════════════════════════════════════
// MATRIX CELL (split L/U)
// ═══════════════════════════════════════════════════════════════════

function MatrixCell({ clusterId, funcId, localMat, umbrellaMat, manualOverride, targetMaturity, isAgg, isSelected, onClick, darkMode }) {
    const isGapL = localMat !== null && localMat < targetMaturity;
    const isGapU = umbrellaMat !== null && umbrellaMat < targetMaturity;
    const active = isSelected ? ' active-cell' : '';

    const renderHalf = (mat, type, isGap) => {
        const ml = mat !== null ? MATURITY_LEVELS[mat] : null;
        const bg = ml ? ml.color : (darkMode ? '#334155' : '#e2e8f0');
        const textColor = ml ? (mat <= 1 ? '#fff' : (mat <= 2 ? '#422006' : '#fff')) : (darkMode ? '#64748b' : '#94a3b8');
        return (
            <div className={`flex-1 flex flex-col items-center justify-center ${isGap ? 'gap-highlight' : ''}`}
                 style={{ backgroundColor: bg + (ml ? 'cc' : ''), minHeight: 40 }}
                 title={`#${clusterId} ${CLUSTERS[clusterId-1].name} × ${funcId} ${type}\nMaturity: ${mat !== null ? mat + ' — ' + MATURITY_LEVELS[mat].label : 'No controls'}${manualOverride ? ' (manual override)' : ''}`}>
                <span className="text-[9px] font-bold opacity-70" style={{ color: textColor }}>{type[0]}</span>
                <span className="text-sm font-bold" style={{ color: textColor }}>{mat !== null ? mat : '—'}</span>
            </div>
        );
    };

    return (
        <div className={`matrix-cell rounded-md overflow-hidden flex border ${manualOverride ? 'border-purple-500 border-2 ring-1 ring-purple-500/30' : 'border-border/50'}${active}`}
             onClick={onClick} role="button" tabIndex={0} onKeyDown={e => e.key === 'Enter' && onClick()}>
            {renderHalf(localMat, 'Local', isGapL)}
            <div className="w-px" style={{ backgroundColor: darkMode ? '#475569' : '#cbd5e1' }} />
            {renderHalf(umbrellaMat, 'Umbrella', isGapU)}
        </div>
    );
}

// ═══════════════════════════════════════════════════════════════════
// CONTROL MATRIX GRID
// ═══════════════════════════════════════════════════════════════════

function ControlMatrix({ environments, activeEnvId, targetMaturity, selectedCell, onCellClick, darkMode, matrixRef }) {
    const isAgg = activeEnvId === 'aggregated';
    const env = isAgg ? null : environments.find(e => e.id === activeEnvId);

    const getEffective = (cell) => {
        if (!cell) return { local: null, umbrella: null, manual: null };
        const mm = cell.manualMaturity != null ? cell.manualMaturity : null;
        return {
            local: mm != null ? mm : computeTypeMaturity(cell.local),
            umbrella: mm != null ? mm : computeTypeMaturity(cell.umbrella),
            manual: mm,
        };
    };

    const getMaturities = (clusterId, funcId) => {
        const ck = cellKey(clusterId, funcId);
        if (isAgg) {
            // For aggregated: use effective (manual or calculated) per environment, take worst
            const localVals = [], umbrellaVals = [];
            environments.forEach(e => {
                const eff = getEffective(e.cells[ck]);
                if (eff.local !== null) localVals.push(eff.local);
                if (eff.umbrella !== null) umbrellaVals.push(eff.umbrella);
            });
            return {
                local: localVals.length > 0 ? Math.min(...localVals) : null,
                umbrella: umbrellaVals.length > 0 ? Math.min(...umbrellaVals) : null,
                manual: null,
            };
        }
        if (!env) return { local: null, umbrella: null, manual: null };
        return getEffective(env.cells[ck]);
    };

    // Row aggregates (worst across all CSF functions)
    const getRowMin = (clusterId) => {
        const vals = CSF_FUNCTIONS.flatMap(fn => {
            const m = getMaturities(clusterId, fn.id);
            return [m.local, m.umbrella].filter(v => v !== null);
        });
        return vals.length > 0 ? Math.min(...vals) : null;
    };

    // Column aggregates (worst across all clusters)
    const getColMin = (funcId) => {
        const vals = CLUSTERS.flatMap(cl => {
            const m = getMaturities(cl.id, funcId);
            return [m.local, m.umbrella].filter(v => v !== null);
        });
        return vals.length > 0 ? Math.min(...vals) : null;
    };

    // Overall
    const overallMin = (() => {
        const vals = CLUSTERS.flatMap(cl => CSF_FUNCTIONS.flatMap(fn => {
            const m = getMaturities(cl.id, fn.id);
            return [m.local, m.umbrella].filter(v => v !== null);
        }));
        return vals.length > 0 ? Math.min(...vals) : null;
    })();

    return (
        <div ref={matrixRef} className="p-4 sm:p-6 overflow-x-auto">
            <div className="inline-block min-w-full">
                <table className="border-separate" style={{ borderSpacing: '3px' }}>
                    <thead>
                        <tr>
                            <th className="w-36 min-w-[144px]" />
                            {CSF_FUNCTIONS.map(fn => (
                                <th key={fn.id} className="text-center px-1 pb-2 min-w-[100px]">
                                    <div className="tooltip-wrap">
                                        <div className="text-xs font-bold" style={{ color: fn.color }}>{fn.name}</div>
                                        <div className="text-[10px] text-muted-foreground">{fn.id}</div>
                                        <div className="flex justify-center gap-0.5 mt-0.5">
                                            <span className="text-[8px] px-1 rounded bg-muted text-muted-foreground">L</span>
                                            <span className="text-[8px] px-1 rounded bg-muted text-muted-foreground">U</span>
                                        </div>
                                        <span className="tip">{fn.desc}</span>
                                    </div>
                                </th>
                            ))}
                            <th className="text-center px-2 min-w-[50px]">
                                <div className="text-[10px] text-muted-foreground font-semibold">MIN</div>
                            </th>
                        </tr>
                    </thead>
                    <tbody>
                        {CLUSTERS.map(cl => {
                            const rowMin = getRowMin(cl.id);
                            return (
                                <tr key={cl.id}>
                                    <td className="pr-2 py-0.5">
                                        <div className="tooltip-wrap">
                                            <div className="flex items-center gap-1.5">
                                                <span className={`inline-flex items-center justify-center w-6 h-6 rounded text-[10px] font-bold text-white ${cl.topology === 'bridge' ? 'bg-amber-600' : 'bg-blue-600'}`}>
                                                    {cl.id}
                                                </span>
                                                <div className="flex flex-col">
                                                    <span className="text-xs font-semibold leading-tight truncate max-w-[110px]">{cl.name}</span>
                                                    <span className="text-[9px] text-muted-foreground">{cl.topology}</span>
                                                </div>
                                            </div>
                                            <span className="tip" style={{ whiteSpace: 'normal', maxWidth: 280, left: '100%', bottom: 'auto', transform: 'none', marginLeft: 8, marginBottom: 0 }}>
                                                {cl.genericVuln}
                                            </span>
                                        </div>
                                    </td>
                                    {CSF_FUNCTIONS.map(fn => {
                                        const m = getMaturities(cl.id, fn.id);
                                        const isSel = selectedCell && selectedCell.clusterId === cl.id && selectedCell.funcId === fn.id;
                                        return (
                                            <td key={fn.id} className="p-0">
                                                <MatrixCell
                                                    clusterId={cl.id} funcId={fn.id}
                                                    localMat={m.local} umbrellaMat={m.umbrella}
                                                    manualOverride={m.manual != null}
                                                    targetMaturity={targetMaturity}
                                                    isAgg={isAgg} isSelected={isSel}
                                                    onClick={() => onCellClick(cl.id, fn.id)}
                                                    darkMode={darkMode}
                                                />
                                            </td>
                                        );
                                    })}
                                    <td className="text-center">
                                        <MaturityBadge value={rowMin} size="sm" />
                                    </td>
                                </tr>
                            );
                        })}
                        <tr>
                            <td className="text-right pr-2 text-[10px] text-muted-foreground font-semibold">COL MIN</td>
                            {CSF_FUNCTIONS.map(fn => (
                                <td key={fn.id} className="text-center py-1">
                                    <MaturityBadge value={getColMin(fn.id)} size="sm" />
                                </td>
                            ))}
                            <td className="text-center py-1">
                                <MaturityBadge value={overallMin} size="lg" />
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    );
}

}

// ═══════════════════════════════════════════════════════════════════
// SHARED CONTROLS LIBRARY MODAL
// ═══════════════════════════════════════════════════════════════════

function SharedControlsLibrary({ sharedControls, environments, onAdd, onUpdate, onDelete, onLink, onUnlink, onClose }) {
    const [editId, setEditId] = useState(null);
    const [form, setForm] = useState({});
    const [quickLinkId, setQuickLinkId] = useState(null);

    const startEdit = (sc) => { setEditId(sc ? sc.id : 'new'); setForm(sc ? { ...sc } : { id: genId(), name: '', description: '', linkMore: '', ownerName: '', ownerOrgChart: '', kind: '', scope: '', linkJira: '' }); };
    const saveForm = () => {
        if (!form.name?.trim()) return;
        if (editId === 'new') onAdd(form);
        else onUpdate(form);
        setEditId(null);
    };

    // Count references across all environments
    const countRefs = (scId) => {
        let count = 0;
        environments.forEach(env => {
            Object.values(env.cells).forEach(cell => {
                (cell.umbrella || []).forEach(c => { if (c.sharedControlId === scId) count++; });
            });
        });
        return count;
    };

    // Check if a shared control is linked to a specific env+cell
    const isLinked = (scId, envId, ck) => {
        const env = environments.find(e => e.id === envId);
        if (!env) return false;
        const cell = env.cells[ck];
        if (!cell) return false;
        return (cell.umbrella || []).some(c => c.sharedControlId === scId);
    };

    // Collect all cell keys where a shared control is referenced
    const getRefs = (scId) => {
        const refs = [];
        environments.forEach(env => {
            Object.entries(env.cells).forEach(([ck, cell]) => {
                (cell.umbrella || []).forEach(c => {
                    if (c.sharedControlId === scId) {
                        const [cid, fid] = ck.split('-');
                        refs.push({ envName: env.name, cluster: CLUSTERS[Number(cid)-1], func: CSF_FUNCTIONS.find(f=>f.id===fid), type: 'umbrella', maturity: c.maturity });
                    }
                });
            });
        });
        return refs;
    };

    return (
        <div className="modal-overlay" onClick={onClose}>
            <div className="modal-content" style={{ maxWidth: 720 }} onClick={e => e.stopPropagation()}>
                <div className="flex items-center justify-between mb-4">
                    <div>
                        <h2 className="font-display font-bold text-lg flex items-center gap-2">
                            <Icon name="link" size={20} /> Shared Controls Library
                        </h2>
                        <p className="text-xs text-muted-foreground mt-1">Define controls once, link to many cells. Each link has its own maturity rating.</p>
                    </div>
                    <button onClick={onClose} className="p-1 hover:bg-accent rounded"><Icon name="x" size={18} /></button>
                </div>

                {editId ? (
                    <div className="space-y-3 bg-muted/50 rounded-lg border border-border p-4">
                        <div className="text-xs font-bold text-muted-foreground uppercase tracking-wider">{editId === 'new' ? 'New Shared Control' : 'Edit Shared Control'}</div>
                        <div>
                            <label className="text-[11px] font-medium text-muted-foreground block mb-1">Name *</label>
                            <input type="text" value={form.name || ''} onChange={e => setForm({...form, name: e.target.value})}
                                   className="input-ctrl py-1 text-sm" placeholder="e.g. SIEM (Splunk), EDR (CrowdStrike), WAF (Cloudflare)" autoFocus />
                        </div>
                        <div>
                            <label className="text-[11px] font-medium text-muted-foreground block mb-1">Description</label>
                            <textarea value={form.description || ''} onChange={e => setForm({...form, description: e.target.value})}
                                      className="input-ctrl py-1 text-sm resize-none" rows={2} />
                        </div>
                        <div>
                            <label className="text-[11px] font-medium text-muted-foreground block mb-1">Link to More</label>
                            <input type="url" value={form.linkMore || ''} onChange={e => setForm({...form, linkMore: e.target.value})} className="input-ctrl py-1 text-sm" />
                        </div>
                        <div className="grid grid-cols-2 gap-2">
                            <div>
                                <label className="text-[11px] font-medium text-muted-foreground block mb-1">Owner Name</label>
                                <input type="text" value={form.ownerName || ''} onChange={e => setForm({...form, ownerName: e.target.value})} className="input-ctrl py-1 text-sm" />
                            </div>
                            <div>
                                <label className="text-[11px] font-medium text-muted-foreground block mb-1">Owner Org-Chart Name</label>
                                <input type="text" value={form.ownerOrgChart || ''} onChange={e => setForm({...form, ownerOrgChart: e.target.value})} className="input-ctrl py-1 text-sm" />
                            </div>
                        </div>
                        <div className="grid grid-cols-3 gap-2">
                            <div>
                                <label className="text-[11px] font-medium text-muted-foreground block mb-1">Type</label>
                                <select value={form.kind || ''} onChange={e => setForm({...form, kind: e.target.value})} className="input-ctrl py-1 text-sm">
                                    <option value="">— not set —</option>
                                    {CONTROL_KINDS.map(k => <option key={k.id} value={k.id}>{k.label}</option>)}
                                </select>
                            </div>
                            <div>
                                <label className="text-[11px] font-medium text-muted-foreground block mb-1">Scope</label>
                                <select value={form.scope || ''} onChange={e => setForm({...form, scope: e.target.value})} className="input-ctrl py-1 text-sm">
                                    <option value="">— not set —</option>
                                    {SHARED_SCOPES.map(s => <option key={s.id} value={s.id}>{s.label}</option>)}
                                </select>
                            </div>
                            <div>
                                <label className="text-[11px] font-medium text-muted-foreground block mb-1">Link to Jira</label>
                                <input type="url" value={form.linkJira || ''} onChange={e => setForm({...form, linkJira: e.target.value})} className="input-ctrl py-1 text-sm" />
                            </div>
                        </div>
                        <div className="flex justify-end gap-2 pt-2">
                            <button onClick={() => setEditId(null)} className="app-btn app-btn-outline app-btn-sm">Cancel</button>
                            <button onClick={saveForm} disabled={!form.name?.trim()} className="app-btn app-btn-primary app-btn-sm">
                                <Icon name="check" size={13} /> Save
                            </button>
                        </div>
                    </div>
                ) : (
                    <>
                        <div className="space-y-3 max-h-[55vh] overflow-y-auto">
                            {sharedControls.length === 0 ? (
                                <div className="text-center py-8 text-muted-foreground">
                                    <Icon name="link" size={32} />
                                    <p className="mt-2 text-sm">No shared controls yet.</p>
                                    <p className="text-xs">Create shared controls for tools that span multiple clusters (SIEM, EDR, WAF, IAM, etc.)</p>
                                </div>
                            ) : sharedControls.map(sc => {
                                const refCount = countRefs(sc.id);
                                const refs = getRefs(sc.id);
                                const kind = CONTROL_KINDS.find(k => k.id === sc.kind);
                                return (
                                    <div key={sc.id} className="bg-muted/50 rounded-lg border border-border p-3">
                                        <div className="flex items-start gap-2">
                                            <span className="text-amber-500 mt-0.5"><Icon name="link" size={15} /></span>
                                            <div className="flex-1 min-w-0">
                                                <div className="flex items-center gap-2 flex-wrap">
                                                    <span className="text-sm font-semibold">{sc.name}</span>
                                                    {kind && <span className="text-[10px] px-1.5 py-0.5 rounded-full font-medium" style={{ backgroundColor: kind.color + '22', color: kind.color }}>{kind.label}</span>}
                                                    {sc.scope && <span className="text-[9px] px-1.5 py-0.5 rounded-full bg-slate-500/15 text-slate-600">{SHARED_SCOPES.find(s=>s.id===sc.scope)?.label || sc.scope}</span>}
                                                    <span className="text-[10px] text-muted-foreground">{refCount} link{refCount !== 1 ? 's' : ''}</span>
                                                </div>
                                                {sc.ownerName && <div className="text-[11px] text-muted-foreground">Owner: {sc.ownerName}{sc.ownerOrgChart ? ` (${sc.ownerOrgChart})` : ''}</div>}
                                                {sc.description && <div className="text-[11px] text-muted-foreground mt-0.5">{sc.description}</div>}
                                                {refs.length > 0 && (
                                                    <div className="mt-2 flex flex-wrap gap-1">
                                                        {refs.map((r, i) => (
                                                            <span key={i} className="inline-flex items-center gap-1 text-[9px] px-1.5 py-0.5 rounded bg-background border border-border">
                                                                <span className="font-bold">#{r.cluster.id}</span>
                                                                <span style={{color: r.func.color}}>{r.func.id}</span>
                                                                <span className="text-muted-foreground">{r.type[0].toUpperCase()}</span>
                                                                <MaturityBadge value={r.maturity} size="sm" />
                                                                {environments.length > 1 && <span className="text-muted-foreground">{r.envName}</span>}
                                                            </span>
                                                        ))}
                                                    </div>
                                                )}
                                            </div>
                                            <div className="flex items-center gap-1 flex-shrink-0">
                                                <button onClick={() => setQuickLinkId(quickLinkId === sc.id ? null : sc.id)}
                                                        className={`p-1 hover:bg-accent rounded ${quickLinkId === sc.id ? 'bg-amber-500/20 text-amber-600' : 'text-amber-500'}`} title="Quick Link to cells">
                                                    <Icon name="grid" size={13} /></button>
                                                <button onClick={() => startEdit(sc)} className="p-1 hover:bg-accent rounded" title="Edit"><Icon name="pencil" size={13} /></button>
                                                <button onClick={() => { if (confirm(`Delete "${sc.name}"?${refCount > 0 ? ` This will also remove ${refCount} link(s) from cells.` : ''}`)) onDelete(sc.id); }}
                                                        className="p-1 hover:bg-accent rounded text-destructive" title="Delete"><Icon name="trash-2" size={13} /></button>
                                            </div>
                                        </div>
                                        {quickLinkId === sc.id && (
                                            <div className="mt-3 pt-3 border-t border-border">
                                                <div className="text-[10px] font-bold text-amber-600 uppercase tracking-wider mb-2">Quick Link — click cells to toggle</div>
                                                {environments.map(env => (
                                                    <div key={env.id} className="mb-2">
                                                        {environments.length > 1 && <div className="text-[10px] font-semibold text-muted-foreground mb-1">{env.name}</div>}
                                                        <div className="grid gap-0.5" style={{ gridTemplateColumns: 'auto repeat(6, 1fr)' }}>
                                                            <div />
                                                            {CSF_FUNCTIONS.map(fn => (
                                                                <div key={fn.id} className="text-center text-[8px] font-bold" style={{color: fn.color}}>{fn.id}</div>
                                                            ))}
                                                            {CLUSTERS.map(cl => (
                                                                <React.Fragment key={cl.id}>
                                                                    <div className="text-[9px] font-semibold pr-1 truncate" title={cl.name}>#{cl.id}</div>
                                                                    {CSF_FUNCTIONS.map(fn => {
                                                                        const ck = cellKey(cl.id, fn.id);
                                                                        const linked = isLinked(sc.id, env.id, ck);
                                                                        return (
                                                                            <button key={fn.id} onClick={() => linked ? onUnlink(env.id, ck, sc.id) : onLink(env.id, ck, sc.id)}
                                                                                    className={`h-5 rounded-sm text-[9px] font-bold transition-colors ${linked ? 'bg-amber-500 text-white hover:bg-amber-600' : 'bg-muted hover:bg-accent border border-border/50'}`}>
                                                                                {linked ? '\u2713' : ''}
                                                                            </button>
                                                                        );
                                                                    })}
                                                                </React.Fragment>
                                                            ))}
                                                        </div>
                                                    </div>
                                                ))}
                                            </div>
                                        )}
                                    </div>
                                );
                            })}
                        </div>
                        <div className="mt-4 flex justify-end">
                            <button onClick={() => startEdit(null)} className="app-btn app-btn-primary app-btn-sm gap-1">
                                <Icon name="plus" size={13} /> New Shared Control
                            </button>
                        </div>
                    </>
                )}
            </div>
        </div>
    );
}

// ═══════════════════════════════════════════════════════════════════
// CELL DETAIL PANEL
// ═══════════════════════════════════════════════════════════════════

function CellDetailPanel({ selectedCell, environments, activeEnvId, targetMaturity, sharedControls, onUpdateCell, onUpdateCellMeta, onAddSharedControl, onUpdateSharedControl, onClose }) {
    if (!selectedCell) return null;
    const { clusterId, funcId } = selectedCell;
    const cluster = CLUSTERS[clusterId - 1];
    const func = CSF_FUNCTIONS.find(f => f.id === funcId);
    const ck = cellKey(clusterId, funcId);
    const isAgg = activeEnvId === 'aggregated';

    const addControl = (envId, type) => {
        const newCtrl = { id: genId(), name: '', description: '', linkMore: '', ownerName: '', ownerOrgChart: '', kind: '', maturity: 0, linkJira: '' };
        onUpdateCell(envId, ck, type, (controls) => [...controls, newCtrl]);
    };

    const linkShared = (envId, type, scId) => {
        onUpdateCell(envId, ck, type, (controls) => [...controls, { id: genId(), sharedControlId: scId, maturity: 0 }]);
    };

    const updateControl = (envId, type, updated) => {
        onUpdateCell(envId, ck, type, (controls) => controls.map(c => c.id === updated.id ? updated : c));
    };

    const deleteControl = (envId, type, ctrlId) => {
        onUpdateCell(envId, ck, type, (controls) => controls.filter(c => c.id !== ctrlId));
    };

    const [linkMenuOpen, setLinkMenuOpen] = useState(null); // "envId"
    const [inlineSharedForm, setInlineSharedForm] = useState(null); // { envId, form }

    const startInlineShared = (envId) => {
        setInlineSharedForm({ envId, form: { id: genId(), name: '', description: '', linkMore: '', ownerName: '', ownerOrgChart: '', kind: '', scope: '', linkJira: '' } });
        setLinkMenuOpen(null);
    };
    const saveInlineShared = () => {
        if (!inlineSharedForm?.form.name?.trim()) return;
        onAddSharedControl(inlineSharedForm.form);
        linkShared(inlineSharedForm.envId, 'umbrella', inlineSharedForm.form.id);
        setInlineSharedForm(null);
    };

    const renderEnvSection = (env) => {
        const cell = env.cells[ck] || { local: [], umbrella: [] };
        const menuKey = env.id;
        return (
            <div key={env.id} className="mb-4">
                {isAgg && <div className="text-xs font-bold text-muted-foreground mb-2 uppercase tracking-wider">{env.name}</div>}
                {CONTROL_TYPES.map(ct => {
                    const controls = cell[ct.id] || [];
                    const directControls = controls.filter(c => !c.sharedControlId);
                    const sharedRefs = controls.filter(c => c.sharedControlId);
                    const typeMat = computeTypeMaturity(controls);
                    const isUmbrella = ct.id === 'umbrella';
                    const linkedScIds = new Set(sharedRefs.map(r => r.sharedControlId));
                    const availableShared = sharedControls.filter(sc => !linkedScIds.has(sc.id));

                    return (
                        <div key={ct.id} className="mb-4">
                            <div className="flex items-center justify-between mb-2">
                                <div className="flex items-center gap-2">
                                    <span className={`text-xs font-bold px-2 py-0.5 rounded ${isUmbrella ? 'bg-purple-500/15 text-purple-600' : 'bg-blue-500/15 text-blue-600'}`}>
                                        {ct.name} Controls
                                    </span>
                                    <MaturityBadge value={typeMat} size="sm" />
                                    <span className="text-[10px] text-muted-foreground">({controls.length})</span>
                                </div>
                                {!isAgg && (
                                    <div className="flex items-center gap-1">
                                        {isUmbrella && (
                                            <div className="relative">
                                                <button onClick={() => setLinkMenuOpen(linkMenuOpen === menuKey ? null : menuKey)}
                                                        className="app-btn app-btn-outline app-btn-xs gap-1 text-amber-600"
                                                        title="Link an existing shared control or create a new one">
                                                    <Icon name="link" size={11} /> Link Shared
                                                </button>
                                                {linkMenuOpen === menuKey && (
                                                    <div className="absolute right-0 top-full mt-1 bg-card border border-border rounded-lg shadow-xl z-40 py-1 min-w-[250px] max-h-56 overflow-y-auto">
                                                        {availableShared.length > 0 && (
                                                            <div className="px-3 py-1 text-[9px] font-bold text-muted-foreground uppercase tracking-wider">Existing shared controls</div>
                                                        )}
                                                        {availableShared.map(sc => (
                                                            <button key={sc.id} onClick={() => { linkShared(env.id, 'umbrella', sc.id); setLinkMenuOpen(null); }}
                                                                    className="w-full text-left px-3 py-1.5 text-xs hover:bg-accent flex items-center gap-2">
                                                                <Icon name="link" size={11} className="text-amber-500" />
                                                                <span className="truncate font-medium">{sc.name}</span>
                                                                {sc.scope && <span className="text-[9px] text-muted-foreground">({SHARED_SCOPES.find(s=>s.id===sc.scope)?.label || sc.scope})</span>}
                                                            </button>
                                                        ))}
                                                        {availableShared.length > 0 && sharedControls.length > 0 && availableShared.length < sharedControls.length && (
                                                            <div className="px-3 py-1 text-[9px] text-muted-foreground italic">({sharedControls.length - availableShared.length} already linked)</div>
                                                        )}
                                                        <div className="border-t border-border mt-1 pt-1">
                                                            <button onClick={() => startInlineShared(env.id)}
                                                                    className="w-full text-left px-3 py-1.5 text-xs hover:bg-accent flex items-center gap-2 font-medium text-primary">
                                                                <Icon name="plus" size={11} /> Create new shared control…
                                                            </button>
                                                        </div>
                                                    </div>
                                                )}
                                            </div>
                                        )}
                                        <button onClick={() => addControl(env.id, ct.id)} className="app-btn app-btn-outline app-btn-xs gap-1">
                                            <Icon name="plus" size={11} /> New
                                        </button>
                                    </div>
                                )}
                            </div>

                            {/* Inline shared control creation form */}
                            {isUmbrella && inlineSharedForm?.envId === env.id && (
                                <div className="mb-3 space-y-2 bg-amber-500/5 border-2 border-amber-500/30 rounded-lg p-3">
                                    <div className="text-[10px] font-bold text-amber-600 uppercase tracking-wider flex items-center gap-1">
                                        <Icon name="plus" size={11} /> New Shared Control
                                    </div>
                                    <input type="text" value={inlineSharedForm.form.name} autoFocus
                                           onChange={e => setInlineSharedForm(prev => ({...prev, form: {...prev.form, name: e.target.value}}))}
                                           className="input-ctrl py-1 text-sm" placeholder="Name (e.g. SIEM, EDR, WAF) *" />
                                    <textarea value={inlineSharedForm.form.description}
                                              onChange={e => setInlineSharedForm(prev => ({...prev, form: {...prev.form, description: e.target.value}}))}
                                              className="input-ctrl py-1 text-sm resize-none" rows={2} placeholder="Description (optional)" />
                                    <div className="grid grid-cols-2 gap-2">
                                        <div>
                                            <label className="text-[10px] text-muted-foreground">Type</label>
                                            <select value={inlineSharedForm.form.kind}
                                                    onChange={e => setInlineSharedForm(prev => ({...prev, form: {...prev.form, kind: e.target.value}}))}
                                                    className="input-ctrl py-1 text-sm">
                                                <option value="">— not set —</option>
                                                {CONTROL_KINDS.map(k => <option key={k.id} value={k.id}>{k.label}</option>)}
                                            </select>
                                        </div>
                                        <div>
                                            <label className="text-[10px] text-muted-foreground">Scope</label>
                                            <select value={inlineSharedForm.form.scope}
                                                    onChange={e => setInlineSharedForm(prev => ({...prev, form: {...prev.form, scope: e.target.value}}))}
                                                    className="input-ctrl py-1 text-sm">
                                                <option value="">— not set —</option>
                                                {SHARED_SCOPES.map(s => <option key={s.id} value={s.id}>{s.label}</option>)}
                                            </select>
                                        </div>
                                    </div>
                                    <div className="grid grid-cols-2 gap-2">
                                        <input type="text" value={inlineSharedForm.form.ownerName}
                                               onChange={e => setInlineSharedForm(prev => ({...prev, form: {...prev.form, ownerName: e.target.value}}))}
                                               className="input-ctrl py-1 text-sm" placeholder="Owner Name" />
                                        <input type="text" value={inlineSharedForm.form.ownerOrgChart}
                                               onChange={e => setInlineSharedForm(prev => ({...prev, form: {...prev.form, ownerOrgChart: e.target.value}}))}
                                               className="input-ctrl py-1 text-sm" placeholder="Owner Org-Chart" />
                                    </div>
                                    <div className="grid grid-cols-2 gap-2">
                                        <input type="url" value={inlineSharedForm.form.linkMore}
                                               onChange={e => setInlineSharedForm(prev => ({...prev, form: {...prev.form, linkMore: e.target.value}}))}
                                               className="input-ctrl py-1 text-sm" placeholder="Link to More (URL)" />
                                        <input type="url" value={inlineSharedForm.form.linkJira}
                                               onChange={e => setInlineSharedForm(prev => ({...prev, form: {...prev.form, linkJira: e.target.value}}))}
                                               className="input-ctrl py-1 text-sm" placeholder="Link to Jira (URL)" />
                                    </div>
                                    <div className="flex justify-end gap-2 pt-1">
                                        <button onClick={() => setInlineSharedForm(null)} className="app-btn app-btn-outline app-btn-xs">Cancel</button>
                                        <button onClick={saveInlineShared} disabled={!inlineSharedForm.form.name?.trim()}
                                                className="app-btn app-btn-primary app-btn-xs gap-1">
                                            <Icon name="check" size={11} /> Create & Link
                                        </button>
                                    </div>
                                </div>
                            )}

                            <div className="space-y-2">
                                {controls.length === 0 && !(isUmbrella && inlineSharedForm?.envId === env.id) ? (
                                    <div className="text-xs text-muted-foreground italic py-2 text-center border border-dashed border-border rounded-lg">
                                        No {ct.name.toLowerCase()} controls documented
                                    </div>
                                ) : (<>
                                    {directControls.map(ctrl => (
                                        <ControlCard key={ctrl.id} control={ctrl} targetMaturity={targetMaturity}
                                                     onUpdate={(updated) => updateControl(env.id, ct.id, updated)}
                                                     onDelete={(ctrlId) => deleteControl(env.id, ct.id, ctrlId)} />
                                    ))}
                                    {isUmbrella && sharedRefs.map(ref_ => {
                                        const sc = sharedControls.find(s => s.id === ref_.sharedControlId);
                                        return (
                                            <SharedRefCard key={ref_.id} reference={ref_} sharedControl={sc} targetMaturity={targetMaturity}
                                                           onUpdateMaturity={(m) => updateControl(env.id, 'umbrella', { ...ref_, maturity: m })}
                                                           onUpdateSharedControl={onUpdateSharedControl}
                                                           onUnlink={() => deleteControl(env.id, 'umbrella', ref_.id)} />
                                        );
                                    })}
                                </>)}
                            </div>
                        </div>
                    );
                })}
                {isAgg && <hr className="border-border my-3" />}
            </div>
        );
    };

    const envsToShow = isAgg ? environments : environments.filter(e => e.id === activeEnvId);

    return (
        <div className="detail-panel open fixed right-0 top-14 bottom-0 w-full sm:w-[460px] bg-card border-l border-border shadow-2xl z-30 flex flex-col">
            <div className="flex items-center justify-between p-4 border-b border-border flex-shrink-0">
                <div>
                    <div className="flex items-center gap-2">
                        <span className={`inline-flex items-center justify-center w-7 h-7 rounded text-xs font-bold text-white ${cluster.topology === 'bridge' ? 'bg-amber-600' : 'bg-blue-600'}`}>
                            #{clusterId}
                        </span>
                        <span className="font-display font-bold">{cluster.name}</span>
                        <span className="text-lg font-light text-muted-foreground">×</span>
                        <span className="font-bold" style={{ color: func.color }}>{func.name}</span>
                    </div>
                    <p className="text-[11px] text-muted-foreground mt-1 leading-snug">{func.desc} — for threats caused by: {cluster.genericVuln.toLowerCase()}</p>
                </div>
                <button onClick={onClose} className="p-2 hover:bg-destructive/10 hover:text-destructive rounded-lg flex-shrink-0 border border-border" title="Close panel">
                    <Icon name="x" size={20} />
                </button>
            </div>
            <div className="flex-1 overflow-y-auto p-4">
                {/* Manual Maturity Override */}
                {!isAgg && envsToShow.map(env => {
                    const cell = env.cells[ck] || {};
                    const calc = computeCellMaturity(cell);
                    const manual = cell.manualMaturity != null ? cell.manualMaturity : null;
                    const setManual = (val) => onUpdateCellMeta(env.id, ck, { manualMaturity: val });

                    return (
                        <div key={'mat-' + env.id} className="mb-4 p-3 bg-muted/50 rounded-lg border border-border">
                            <label className="text-xs font-bold text-muted-foreground uppercase tracking-wider flex items-center gap-1 mb-2">
                                <Icon name="sliders-horizontal" size={12} /> Maturity Override
                            </label>
                            <div className="flex items-center gap-4">
                                <div className="flex items-center gap-2">
                                    <span className="text-xs text-muted-foreground">Calculated:</span>
                                    <MaturityBadge value={calc.overall} size="sm" />
                                    <span className="text-[10px] text-muted-foreground">(L:{calc.local ?? '—'} U:{calc.umbrella ?? '—'})</span>
                                </div>
                                <div className="flex items-center gap-2">
                                    <span className="text-xs text-muted-foreground">Manual:</span>
                                    <select value={manual != null ? manual : ''}
                                            onChange={e => setManual(e.target.value === '' ? null : parseInt(e.target.value))}
                                            className={`input-ctrl py-0.5 text-sm w-28 ${manual != null ? 'border-purple-500 text-purple-600 font-bold' : ''}`}>
                                        <option value="">Auto</option>
                                        {MATURITY_LEVELS.map(ml => (
                                            <option key={ml.value} value={ml.value}>{ml.value} — {ml.label}</option>
                                        ))}
                                    </select>
                                    {manual != null && (
                                        <button onClick={() => setManual(null)} className="p-0.5 hover:bg-accent rounded text-muted-foreground" title="Clear override">
                                            <Icon name="x" size={14} />
                                        </button>
                                    )}
                                </div>
                            </div>
                        </div>
                    );
                })}

                {envsToShow.map(renderEnvSection)}

                {/* Notes & Tasks — per cell per environment */}
                {!isAgg && envsToShow.map(env => {
                    const cell = env.cells[ck] || {};
                    const comments = cell.comments || '';
                    const tasks = cell.tasks || [];

                    const updateComments = (val) => onUpdateCellMeta(env.id, ck, { comments: val });
                    const addTask = () => onUpdateCellMeta(env.id, ck, { tasks: [...tasks, { id: genId(), description: '', owner: '', dueDate: '', status: 'open' }] });
                    const updateTask = (taskId, field, val) => onUpdateCellMeta(env.id, ck, { tasks: tasks.map(t => t.id === taskId ? { ...t, [field]: val } : t) });
                    const deleteTask = (taskId) => onUpdateCellMeta(env.id, ck, { tasks: tasks.filter(t => t.id !== taskId) });

                    return (
                        <div key={'notes-' + env.id} className="mt-2 pt-3 border-t border-border">
                            <div className="mb-3">
                                <label className="text-xs font-bold text-muted-foreground uppercase tracking-wider flex items-center gap-1 mb-1.5">
                                    <Icon name="message-square" size={12} /> Notes
                                </label>
                                <textarea value={comments} onChange={e => updateComments(e.target.value)}
                                          className="input-ctrl py-1.5 text-sm resize-none" rows={2} placeholder="Comments, observations, decisions..." />
                            </div>
                            <div>
                                <div className="flex items-center justify-between mb-1.5">
                                    <label className="text-xs font-bold text-muted-foreground uppercase tracking-wider flex items-center gap-1">
                                        <Icon name="list-checks" size={12} /> Tasks
                                    </label>
                                    <button onClick={addTask} className="app-btn app-btn-outline app-btn-xs gap-1">
                                        <Icon name="plus" size={11} /> Add Task
                                    </button>
                                </div>
                                {tasks.length === 0 ? (
                                    <div className="text-xs text-muted-foreground italic py-2 text-center border border-dashed border-border rounded-lg">
                                        No tasks — add tasks to track gap remediation
                                    </div>
                                ) : (
                                    <div className="space-y-2">
                                        {tasks.map(task => {
                                            const st = TASK_STATUSES.find(s => s.id === task.status) || TASK_STATUSES[0];
                                            const overdue = task.dueDate && task.status !== 'done' && new Date(task.dueDate) < new Date();
                                            return (
                                                <div key={task.id} className={`bg-muted/50 rounded-lg border p-2.5 space-y-1.5 ${overdue ? 'border-destructive/50' : 'border-border'}`}>
                                                    <div className="flex items-start gap-1.5">
                                                        <span style={{color: st.color}} className="mt-0.5"><Icon name={st.icon} size={14} /></span>
                                                        <input type="text" value={task.description} onChange={e => updateTask(task.id, 'description', e.target.value)}
                                                               className="input-ctrl py-0.5 text-sm flex-1" placeholder="Task description..." />
                                                        <button onClick={() => { if (confirm('Delete this task?')) deleteTask(task.id); }}
                                                                className="p-0.5 hover:bg-accent rounded text-muted-foreground flex-shrink-0">
                                                            <Icon name="trash-2" size={12} />
                                                        </button>
                                                    </div>
                                                    <div className="grid grid-cols-3 gap-1.5">
                                                        <input type="text" value={task.owner || ''} onChange={e => updateTask(task.id, 'owner', e.target.value)}
                                                               className="input-ctrl py-0.5 text-[11px]" placeholder="Owner" />
                                                        <input type="date" value={task.dueDate || ''} onChange={e => updateTask(task.id, 'dueDate', e.target.value)}
                                                               className={`input-ctrl py-0.5 text-[11px] ${overdue ? 'text-destructive font-semibold' : ''}`} />
                                                        <select value={task.status} onChange={e => updateTask(task.id, 'status', e.target.value)}
                                                                className="input-ctrl py-0.5 text-[11px]" style={{color: st.color}}>
                                                            {TASK_STATUSES.map(s => <option key={s.id} value={s.id}>{s.label}</option>)}
                                                        </select>
                                                    </div>
                                                </div>
                                            );
                                        })}
                                    </div>
                                )}
                            </div>
                        </div>
                    );
                })}
            </div>
        </div>
    );
}

// IMPORT MODAL
// ═══════════════════════════════════════════════════════════════════

function ImportModal({ onClose, onImport }) {
    const [text, setText] = useState('');
    const [error, setError] = useState('');
    const [dragOver, setDragOver] = useState(false);
    const fileRef = useRef(null);

    const handleImport = () => {
        try {
            const data = JSON.parse(text);
            if (!data.environments || !Array.isArray(data.environments)) throw new Error('Invalid format: missing environments array');
            onImport(data);
            onClose();
        } catch (e) { setError(e.message); }
    };

    const handleFile = (file) => {
        const reader = new FileReader();
        reader.onload = (e) => { setText(e.target.result); setError(''); };
        reader.readAsText(file);
    };

    const handleDrop = (e) => { e.preventDefault(); setDragOver(false); if (e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]); };

    return (
        <div className="modal-overlay" onClick={onClose}>
            <div className="modal-content" onClick={e => e.stopPropagation()}>
                <div className="flex items-center justify-between mb-4">
                    <h2 className="font-display font-bold text-lg">Import Control Matrix</h2>
                    <button onClick={onClose} className="p-1 hover:bg-accent rounded"><Icon name="x" size={18} /></button>
                </div>
                <div className={`border-2 border-dashed rounded-lg p-6 text-center mb-3 ${dragOver ? 'border-primary bg-primary/5' : 'border-border'}`}
                     onDragOver={e => { e.preventDefault(); setDragOver(true); }} onDragLeave={() => setDragOver(false)} onDrop={handleDrop}>
                    <Icon name="upload" size={24} />
                    <p className="text-sm text-muted-foreground mt-2">Drag & drop a JSON file here, or</p>
                    <button onClick={() => fileRef.current?.click()} className="app-btn app-btn-outline app-btn-sm mt-2">Browse Files</button>
                    <input ref={fileRef} type="file" accept=".json" className="hidden" onChange={e => e.target.files[0] && handleFile(e.target.files[0])} />
                </div>
                <textarea value={text} onChange={e => { setText(e.target.value); setError(''); }}
                          className="input-ctrl font-mono text-xs h-48 resize-none mb-3" placeholder="Or paste JSON here..." />
                {error && <div className="text-destructive text-xs mb-3 bg-destructive/10 p-2 rounded">{error}</div>}
                <div className="flex justify-end gap-2">
                    <button onClick={onClose} className="app-btn app-btn-outline">Cancel</button>
                    <button onClick={handleImport} disabled={!text.trim()} className="app-btn app-btn-primary">
                        <Icon name="upload" size={14} /> Import
                    </button>
                </div>
            </div>
        </div>
    );
}
