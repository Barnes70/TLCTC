];

const COE_AGG_METHODS = [

const DCS_VERDICTS = [
    { id: 'effective',           max: 0.5,      color: '#22c55e', label: 'Effective' },
    { id: 'adequate',            max: 0.8,      color: '#84cc16', label: 'Adequate' },
    { id: 'marginal',            max: 1.0,      color: '#eab308', label: 'Marginal' },
    { id: 'ineffective',         max: 2.0,      color: '#f97316', label: 'Ineffective' },
    { id: 'structurally_failed', max: Infinity,  color: '#ef4444', label: 'Structurally Failed' },
];

const FITNESS_FACTORS = [
    { value: 1.0, label: 'Fit (1.0)',      desc: 'Acts within Δt window' },
    { value: 0.5, label: 'Marginal (0.5)', desc: 'Near boundary — ECR halved' },
    { value: 0.0, label: 'Unfit (0.0)',    desc: 'Cannot act within Δt — ECR zero' },
];

const STORAGE_KEY = 'tlctc-cbp-v1';

// ═══════════════════════════════════════════════════════════════════
// UTILITIES
// ═══════════════════════════════════════════════════════════════════

const genId = () => 'c' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const cellKey = (clusterId, funcId) => `${clusterId}-${funcId}`;

function getMaturityColor(value) {
    if (value === null || value === undefined) return '#94a3b8';
    return MATURITY_LEVELS[value]?.color || '#94a3b8';
}

function getMaturityBg(value, dark) {
    if (value === null || value === undefined) return dark ? '#1e293b' : '#f1f5f9';
    const ml = MATURITY_LEVELS[value];
    return dark ? (ml?.darkBg || '#1e293b') : (ml?.bg || '#f1f5f9');
}

function getCellMaturity(cell) {
    if (!cell || !cell.capability) return null;
    const m = cell.capability.maturity;
    return (m !== null && m !== undefined) ? m : null;
}

function computeAggregated(environments, ck) {
    const vals = environments.map(env => getCellMaturity(env.cells[ck])).filter(v => v !== null);
    return vals.length > 0 ? Math.min(...vals) : null;
}

function createEmptyCapability(name, controlObjective) {
    return {
        id: genId(),
        name: name || '',
        controlObjective: controlObjective || '',
        maturity: 0,
        components: { controls: [], workforce: [], dataLevel: [] },
        subCapabilities: [],
        notes: '',
    };
}

function createEmptyEnvironment(name) {
    return { id: genId(), name, cells: {} };
}

function createDefaultState() {
    return {
        orgName: 'My Organization',
        targetMaturity: 3,
        environments: [createEmptyEnvironment('Default')],
        sharedControls: [],
        createdAt: new Date().toISOString().split('T')[0],
    };
}

function loadState() {
    try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) return migrateState(JSON.parse(raw));
    } catch(e) { console.warn('Failed to load state', e); }
    return createDefaultState();
}

function saveState(state) {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch(e) { console.warn('Failed to save', e); }
}

function countComponents(env) {
    let controls = 0, workforce = 0, dataLevel = 0;
    Object.values(env.cells).forEach(cell => {
        if (!cell.capability) return;
        controls += (cell.capability.components.controls || []).length;
        workforce += (cell.capability.components.workforce || []).length;
        dataLevel += (cell.capability.components.dataLevel || cell.capability.components.governance || []).length;
    });
    return { controls, workforce, dataLevel, total: controls + workforce + dataLevel };
}

// ═══════════════════════════════════════════════════════════════════
// CONTROL EFFECTIVENESS — FACTORIES & CALCULATIONS
// ═══════════════════════════════════════════════════════════════════

function createEffectivenessFields() {
    return {
        role: '',
        cde_max: { value: null, rationale: '', set_by: '', last_reviewed: '', review_trigger: '' },
        cde_fitness: { target_velocity_class: '', fit: null, factor: null, rationale: '' },
        coe: { metrics: [], aggregation_method: 'weighted_mean', weights: {}, composite_coe: null },
        ecr: null,
    };
}

function createCoeMetric() {
    return { metric_id: 'm-' + genId(), name: '', type: '', value: null, target: null, unit: 'ratio', source: '', description: '', measured_at: '' };
}

function calcCompositeCoe(metrics, method, weights) {
    if (!metrics || metrics.length === 0) return null;
    const valid = metrics.filter(m => m.value != null);
    if (valid.length === 0) return null;
    if (method === 'worst_of') return Math.min(...valid.map(m => m.value));
    if (method === 'geometric_mean') {
        const product = valid.reduce((acc, m) => acc * Math.max(m.value, 0.001), 1);
        return Math.pow(product, 1 / valid.length);
    }
    let totalWeight = 0, weightedSum = 0;
    valid.forEach(m => {
        const w = (weights && weights[m.metric_id]) || (1 / valid.length);
        totalWeight += w;
        weightedSum += m.value * w;
    });
    return totalWeight > 0 ? weightedSum / totalWeight : null;
}

function calcEcr(control) {
    const coe = control.coe?.composite_coe;
    const cde = control.cde_max?.value;
    const fit = control.cde_fitness?.factor;
    if (coe == null || cde == null || fit == null) return null;
    return coe * cde * fit;
}

function calcCellEffectiveness(controls) {
    const resolved = controls.map(c => {
        const compositeCoe = calcCompositeCoe(c.coe?.metrics, c.coe?.aggregation_method, c.coe?.weights);
        const ctrl = { ...c, coe: { ...c.coe, composite_coe: compositeCoe } };
        const ecr = calcEcr(ctrl);
        const cdeEff = (c.cde_max?.value ?? 0) * (c.cde_fitness?.factor ?? 0);
        return { ...ctrl, ecr, _cdeEff: cdeEff };
    }).filter(c => c.ecr != null);

    const essential = resolved.filter(c => c.role === 'essential');
    const complementary = resolved.filter(c => c.role === 'complementary');
    if (essential.length === 0 && complementary.length === 0) return null;

    const essFloor = essential.length > 0 ? Math.min(...essential.map(c => c.ecr)) : 0;
    const compFactor = complementary.length > 0 ? 1 - complementary.reduce((a, c) => a * (1 - c.ecr), 1) : 0;
    const compRaise = (1.0 - essFloor) * compFactor;
    const cellEcr = essFloor + compRaise;

    const essCdeFloor = essential.length > 0 ? Math.min(...essential.map(c => c._cdeEff)) : 0;
    const compCdeFactor = complementary.length > 0 ? 1 - complementary.reduce((a, c) => a * (1 - c._cdeEff), 1) : 0;
    const cellCdeMax = essCdeFloor + (1.0 - essCdeFloor) * compCdeFactor;

    return {
        essential_floor: essFloor, complementary_raise: compRaise,
        cell_cde_max_composite: cellCdeMax,
        cell_ecr: cellEcr, residual_ceiling_gap: 1.0 - cellCdeMax,
    };
}

function parseDuration(iso) {
    if (!iso) return null;
    const m = iso.match(/P(?:(\d+)D)?T?(?:(\d+)H)?(?:(\d+)M)?(?:(\d+(?:\.\d+)?)S)?/);
    if (!m) return null;
    return (parseInt(m[1]||0))*86400 + (parseInt(m[2]||0))*3600 + (parseInt(m[3]||0))*60 + parseFloat(m[4]||0);
}

function calcDcs(mttdIso, deltaIso) {
    const mttd = parseDuration(mttdIso), dt = parseDuration(deltaIso);
    if (mttd == null || dt == null || dt === 0) return null;
    const score = mttd / dt;
    const verdict = DCS_VERDICTS.find(v => score <= v.max) || DCS_VERDICTS[4];
    return { score: Math.round(score * 100) / 100, verdict: verdict.id, verdictLabel: verdict.label, verdictColor: verdict.color };
}

function getEcrColor(val) {
    if (val == null) return '#94a3b8';
    if (val >= 0.8) return '#22c55e';
    if (val >= 0.5) return '#eab308';
    return '#ef4444';
}

// ═══════════════════════════════════════════════════════════════════
// STATE MIGRATION
// ═══════════════════════════════════════════════════════════════════

function migrateControlItem(item) {
    if (!item) return item;
    return {
        ...item,
        role: item.role || '',
        cde_max: item.cde_max || { value: null, rationale: '', set_by: '', last_reviewed: '', review_trigger: '' },
        cde_fitness: item.cde_fitness || { target_velocity_class: '', fit: null, factor: null, rationale: '' },
        coe: item.coe || { metrics: [], aggregation_method: 'weighted_mean', weights: {}, composite_coe: null },
        ecr: item.ecr ?? null,
    };
}

function migrateCapability(cap) {
    if (!cap) return cap;
    const comps = cap.components || { controls: [], workforce: [], dataLevel: [] };
    return {
        ...cap,
        components: {
            ...comps,
            controls: (comps.controls || []).map(migrateControlItem),
        },
        velocity_context: cap.velocity_context || { primary_velocity_class: '', delta_t: '', delta_t_source: '', delta_t_confidence: '' },
        controls_meta: cap.controls_meta || { expected_count: null },
    };
}

function migrateState(st) {
    if (!st) return st;
    return {
        ...st,
        environments: (st.environments || []).map(env => ({
            ...env,
            cells: Object.fromEntries(Object.entries(env.cells || {}).map(([k, cell]) => {
                if (!cell) return [k, cell];
                return [k, {
                    ...cell,
                    capability: cell.capability ? migrateCapability(cell.capability) : cell.capability,
                }];
            })),
        })),
    };
}

// ═══════════════════════════════════════════════════════════════════
// ICON HELPER
// ═══════════════════════════════════════════════════════════════════

function Icon({ name, size = 16, className = '' }) {
    const ref = useRef(null);
    useEffect(() => {
        if (ref.current && lucide?.icons?.[name]) {
            const [tag, attrs, children] = lucide.icons[name];
            const svg = document.createElementNS('http://www.w3.org/2000/svg', tag);
            Object.entries({ ...attrs, width: size, height: size, class: className }).forEach(([k, v]) => svg.setAttribute(k, v));
            children.forEach(([cTag, cAttrs]) => {
                const el = document.createElementNS('http://www.w3.org/2000/svg', cTag);
                Object.entries(cAttrs).forEach(([k, v]) => el.setAttribute(k, v));
                svg.appendChild(el);
            });
            ref.current.innerHTML = '';
            ref.current.appendChild(svg);
        }
    }, [name, size, className]);
    return <span ref={ref} className="inline-flex items-center justify-center" />;
}

function SummaryBar({ orgName, onOrgNameChange, targetMaturity, onTargetChange, environments, activeEnvId, starterTemplates, onLoadTemplate }) {
    const totalCells = CLUSTERS.length * CSF_FUNCTIONS.length; // 60
    const isAgg = activeEnvId === 'aggregated';

    const stats = useMemo(() => {
        let documented = 0, belowTarget = 0, maturities = [];

        CLUSTERS.forEach(cl => CSF_FUNCTIONS.forEach(fn => {
            const ck = cellKey(cl.id, fn.id);
            let m;
            if (isAgg) {
                m = computeAggregated(environments, ck);
            } else {
                const env = environments.find(e => e.id === activeEnvId);
                m = env ? getCellMaturity(env.cells[ck]) : null;
            }
            if (m !== null) {
                documented++;
                maturities.push(m);
                if (m < targetMaturity) belowTarget++;
            }
        }));

        const avg = maturities.length > 0 ? (maturities.reduce((a,b) => a+b, 0) / maturities.length).toFixed(1) : '—';
        const worst = maturities.length > 0 ? Math.min(...maturities) : null;
        const totalComps = isAgg ? '—' : (() => {
            const env = environments.find(e => e.id === activeEnvId);
            return env ? countComponents(env).total : 0;
        })();

        return { documented, belowTarget, avg, worst, totalComps };
    }, [environments, activeEnvId, targetMaturity, isAgg]);

    const coverage = ((stats.documented / totalCells) * 100).toFixed(0);

    return (
        <div className="px-4 sm:px-6 py-3 border-b border-border flex flex-wrap items-center gap-x-6 gap-y-2 text-sm no-print">
            <div className="flex items-center gap-2">
                <label className="text-muted-foreground font-medium">Organization:</label>
                <input type="text" value={orgName} onChange={e => onOrgNameChange(e.target.value)}
                       className="input-ctrl py-1 px-2 w-48 font-semibold" />
            </div>
            <div className="flex items-center gap-2">
                <label className="text-muted-foreground font-medium">Target Maturity:</label>
                <select value={targetMaturity} onChange={e => onTargetChange(Number(e.target.value))}
                        className="input-ctrl py-1 px-2 w-auto">
                    {MATURITY_LEVELS.map(ml => <option key={ml.value} value={ml.value}>{ml.value} — {ml.label}</option>)}
                </select>
            </div>
            {starterTemplates && starterTemplates.length > 0 && (
                <StarterDropdown templates={starterTemplates} onLoad={onLoadTemplate} />
            )}
            <div className="flex items-center gap-4 ml-auto text-xs">
                <div className="tooltip-wrap">
                    <span className="font-semibold" style={{ color: coverage >= 80 ? '#22c55e' : coverage >= 40 ? '#eab308' : '#ef4444' }}>
                        {stats.documented}/{totalCells}
                    </span>
                    <span className="text-muted-foreground ml-1">assessed ({coverage}%)</span>
                    <span className="tip">Capabilities with maturity assessed (maturity > 0 or explicitly set)</span>
                </div>
                {stats.totalComps !== '—' && (
                    <div><span className="font-semibold">{stats.totalComps}</span> <span className="text-muted-foreground">components</span></div>
                )}
                <div className="tooltip-wrap">
                    <span className="font-semibold">{stats.avg}</span>
                    <span className="text-muted-foreground ml-1">avg maturity</span>
                    <span className="tip">Average across all assessed capabilities</span>
                </div>
                {stats.belowTarget > 0 && (
                    <div className="tooltip-wrap">
                        <span className="font-semibold text-destructive">{stats.belowTarget}</span>
                        <span className="text-muted-foreground ml-1">gaps</span>
                        <span className="tip">Capabilities below target maturity of {targetMaturity}</span>
                    </div>
                )}
                {stats.worst !== null && (
                    <div className="flex items-center gap-1">
                        <span className="text-muted-foreground">Worst:</span>
                        <MaturityBadge value={stats.worst} size="sm" />
                    </div>
                )}
            </div>
        </div>
    );
}

function CapabilityMatrix({ environments, activeEnvId, targetMaturity, selectedCell, onCellClick, darkMode, matrixRef }) {
    const isAgg = activeEnvId === 'aggregated';
    const env = isAgg ? null : environments.find(e => e.id === activeEnvId);

    const getMaturity = (clusterId, funcId) => {
        const ck = cellKey(clusterId, funcId);
        if (isAgg) return computeAggregated(environments, ck);
        if (!env) return null;
        return getCellMaturity(env.cells[ck]);
    };

    const getCapName = (clusterId, funcId) => {
        const ck = cellKey(clusterId, funcId);
        if (isAgg) {
            // Show name from first env that has it
            for (const e of environments) {
                const cap = e.cells[ck]?.capability;
                if (cap?.name) return cap.name;
            }
            return '';
        }
        return env?.cells[ck]?.capability?.name || '';
    };

    const getRowMin = (clusterId) => {
        const vals = CSF_FUNCTIONS.map(fn => getMaturity(clusterId, fn.id)).filter(v => v !== null);
        return vals.length > 0 ? Math.min(...vals) : null;
    };

    const getColMin = (funcId) => {
        const vals = CLUSTERS.map(cl => getMaturity(cl.id, funcId)).filter(v => v !== null);
        return vals.length > 0 ? Math.min(...vals) : null;
    };

    const overallMin = (() => {
        const vals = CLUSTERS.flatMap(cl => CSF_FUNCTIONS.map(fn => getMaturity(cl.id, fn.id))).filter(v => v !== null);
        return vals.length > 0 ? Math.min(...vals) : null;
    })();

    return (
        <div ref={matrixRef} className="p-4 sm:p-6 overflow-x-auto">
            <div className="inline-block min-w-full">
                <table className="border-separate" style={{ borderSpacing: '3px' }}>
                    <thead>
                        <tr>
                            <th className="w-36 min-w-[144px]" />
                            {CSF_FUNCTIONS.map(fn => (
                                <th key={fn.id} className="text-center px-1 pb-2 min-w-[110px]">
                                    <div className="tooltip-wrap">
                                        <div className="text-xs font-bold" style={{ color: fn.color }}>{fn.name}</div>
                                        <div className="text-[10px] text-muted-foreground">{fn.id}</div>
                                        <span className="tip">{fn.desc}</span>
                                    </div>
                                </th>
                            ))}
                            <th className="text-center px-2 min-w-[50px]">
                                <div className="text-[10px] text-muted-foreground font-semibold">MIN</div>
                            </th>
                        </tr>
                    </thead>
                    <tbody>
                        {CLUSTERS.map(cl => {
                            const rowMin = getRowMin(cl.id);
                            return (
                                <tr key={cl.id}>
                                    <td className="pr-2 py-0.5">
                                        <div className="tooltip-wrap">
                                            <div className="flex items-center gap-1.5">
                                                <span className={`inline-flex items-center justify-center w-6 h-6 rounded text-[10px] font-bold text-white ${cl.topology === 'bridge' ? 'bg-amber-600' : 'bg-blue-600'}`}>
                                                    {cl.id}
                                                </span>
                                                <div className="flex flex-col">
                                                    <span className="text-xs font-semibold leading-tight truncate max-w-[110px]">{cl.name}</span>
                                                    <span className="text-[9px] text-muted-foreground">{cl.topology}</span>
                                                </div>
                                            </div>
                                            <span className="tip" style={{ whiteSpace: 'normal', maxWidth: 280, left: '100%', bottom: 'auto', transform: 'none', marginLeft: 8, marginBottom: 0 }}>
                                                {cl.genericVuln}
                                            </span>
                                        </div>
                                    </td>
                                    {CSF_FUNCTIONS.map(fn => {
                                        const m = getMaturity(cl.id, fn.id);
                                        const name = getCapName(cl.id, fn.id);
                                        const isSel = selectedCell && selectedCell.clusterId === cl.id && selectedCell.funcId === fn.id;
                                        let cellEcrVal = null;
                                        if (!isAgg && env) {
                                            const c = env.cells[cellKey(cl.id, fn.id)];
                                            if (c?.capability?.components?.controls) {
                                                const eff = calcCellEffectiveness(c.capability.components.controls);
                                                if (eff) cellEcrVal = eff.cell_ecr;
                                            }
                                        }
                                        return (
                                            <td key={fn.id} className="p-0">
                                                <div onClick={() => onCellClick(cl.id, fn.id)} role="button" tabIndex={0}
                                                     onKeyDown={e => e.key === 'Enter' && onCellClick(cl.id, fn.id)}>
                                                    <MatrixCell clusterId={cl.id} funcId={fn.id} maturity={m} capName={name}
                                                                targetMaturity={targetMaturity} isSelected={isSel} darkMode={darkMode} cellEcr={cellEcrVal} />
                                                </div>
                                            </td>
                                        );
                                    })}
                                    <td className="text-center">
                                        <MaturityBadge value={rowMin} size="sm" />
                                    </td>
                                </tr>
                            );
                        })}
                        <tr>
                            <td className="text-right pr-2 text-[10px] text-muted-foreground font-semibold">COL MIN</td>
                            {CSF_FUNCTIONS.map(fn => (
                                <td key={fn.id} className="text-center py-1">
                                    <MaturityBadge value={getColMin(fn.id)} size="sm" />
                                </td>
                            ))}
                            <td className="text-center py-1">
                                <MaturityBadge value={overallMin} size="lg" />
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    );
}

function CoeMetricRowCbp({ metric, weight, aggMethod, onUpdate, onUpdateWeight, onDelete }) {
    return (
        <div className="flex items-start gap-1 bg-background/50 rounded p-2 border border-border/50">
            <div className="flex-1 space-y-1">
                <div className="grid grid-cols-3 gap-1">
                    <input type="text" value={metric.name} onChange={e => onUpdate({ ...metric, name: e.target.value })}
                           className="input-ctrl py-0.5 text-[11px]" placeholder="Metric name" />
                    <select value={metric.type || ''} onChange={e => onUpdate({ ...metric, type: e.target.value })} className="input-ctrl py-0.5 text-[11px]">
                        <option value="">Type...</option>
                        {COE_METRIC_TYPES.map(t => <option key={t.id} value={t.id}>{t.label}</option>)}
                    </select>
                    <input type="text" value={metric.source || ''} onChange={e => onUpdate({ ...metric, source: e.target.value })}
                           className="input-ctrl py-0.5 text-[11px]" placeholder="Source" />
                </div>
                <div className="grid grid-cols-3 gap-1">
                    <div className="flex items-center gap-1">
                        <label className="text-[9px] text-muted-foreground w-8">Val:</label>
                        <input type="number" min="0" max="1" step="0.01" value={metric.value ?? ''} onChange={e => onUpdate({ ...metric, value: e.target.value === '' ? null : Math.min(1, Math.max(0, Number(e.target.value))) })}
                               className="input-ctrl py-0.5 text-[11px] flex-1" />
                    </div>
                    <div className="flex items-center gap-1">
                        <label className="text-[9px] text-muted-foreground w-8">Tgt:</label>
                        <input type="number" min="0" max="1" step="0.01" value={metric.target ?? ''} onChange={e => onUpdate({ ...metric, target: e.target.value === '' ? null : Number(e.target.value) })}
                               className="input-ctrl py-0.5 text-[11px] flex-1" />
                    </div>
                    {aggMethod === 'weighted_mean' && (
                        <div className="flex items-center gap-1">
                            <label className="text-[9px] text-muted-foreground w-8">Wt:</label>
                            <input type="number" min="0" max="1" step="0.05" value={weight ?? ''} onChange={e => onUpdateWeight(metric.metric_id, e.target.value === '' ? null : Number(e.target.value))}
                                   className="input-ctrl py-0.5 text-[11px] flex-1" />
                        </div>
                    )}
                </div>
            </div>
            <button onClick={() => onDelete(metric.metric_id)} className="p-0.5 hover:bg-destructive/10 rounded text-destructive/60" title="Remove metric">
                <Icon name="x" size={12} />
            </button>
        </div>
    );
}

function EffectivenessEditorCbp({ control, onUpdate }) {
    const cde = control.cde_max || {};
    const fit = control.cde_fitness || {};
    const coe = control.coe || { metrics: [], aggregation_method: 'weighted_mean', weights: {} };
    const compositeCoe = calcCompositeCoe(coe.metrics, coe.aggregation_method, coe.weights);
    const ctrlWithCoe = { ...control, coe: { ...coe, composite_coe: compositeCoe } };
    const ecr = calcEcr(ctrlWithCoe);

    const updateCde = (field, val) => onUpdate({ ...control, cde_max: { ...cde, [field]: val } });
    const updateFit = (field, val) => onUpdate({ ...control, cde_fitness: { ...fit, [field]: val } });
    const updateCoe = (field, val) => onUpdate({ ...control, coe: { ...coe, [field]: val } });

    const addMetric = () => updateCoe('metrics', [...coe.metrics, createCoeMetric()]);
    const updateMetric = (updated) => updateCoe('metrics', coe.metrics.map(m => m.metric_id === updated.metric_id ? updated : m));
    const deleteMetric = (mid) => {
        const w = { ...coe.weights }; delete w[mid];
        onUpdate({ ...control, coe: { ...coe, metrics: coe.metrics.filter(m => m.metric_id !== mid), weights: w } });
    };
    const updateWeight = (mid, val) => updateCoe('weights', { ...coe.weights, [mid]: val });

    return (
        <div className="space-y-2 mt-2 pt-2 border-t border-border">
            <div className="text-[11px] font-bold text-muted-foreground flex items-center gap-1">
                <Icon name="shield" size={11} /> Control Effectiveness
            </div>
            {/* Role */}
            <div className="flex gap-1">
                {CONTROL_ROLES.map(r => (
                    <button key={r.id} onClick={() => onUpdate({ ...control, role: r.id })}
                            className={`flex-1 text-[11px] py-1 px-2 rounded border font-medium transition-colors ${control.role === r.id ? 'border-current' : 'border-border opacity-50 hover:opacity-80'}`}
                            style={{ color: r.color, backgroundColor: control.role === r.id ? r.color + '15' : 'transparent' }}
                            title={r.desc}>
                        {r.label}
                    </button>
                ))}
            </div>
            {/* CDE_max */}
            <div className="bg-background/50 rounded p-2 border border-border/50">
                <div className="text-[10px] font-bold text-muted-foreground mb-1">CDE_max (Design Ceiling)</div>
                <div className="grid grid-cols-2 gap-1">
                    <div>
                        <label className="text-[9px] text-muted-foreground">Value (0-0.99)</label>
                        <input type="number" min="0" max="0.99" step="0.01" value={cde.value ?? ''}
                               onChange={e => updateCde('value', e.target.value === '' ? null : Math.min(0.99, Math.max(0, Number(e.target.value))))}
                               className="input-ctrl py-0.5 text-[11px]" />
                    </div>
                    <div>
                        <label className="text-[9px] text-muted-foreground">Set by</label>
                        <input type="text" value={cde.set_by || ''} onChange={e => updateCde('set_by', e.target.value)}
                               className="input-ctrl py-0.5 text-[11px]" placeholder="CISO / TI Lead" />
                    </div>
                </div>
                <div className="mt-1">
                    <label className="text-[9px] text-muted-foreground">Rationale</label>
                    <textarea value={cde.rationale || ''} onChange={e => updateCde('rationale', e.target.value)}
                              className="input-ctrl py-0.5 text-[11px] resize-none" rows={1} placeholder="Why this ceiling?" />
                </div>
            </div>
            {/* CDE_fitness */}
            <div className="grid grid-cols-2 gap-1">
                <div>
                    <label className="text-[9px] text-muted-foreground">Velocity Class</label>
                    <select value={fit.target_velocity_class || ''} onChange={e => updateFit('target_velocity_class', e.target.value)} className="input-ctrl py-0.5 text-[11px]">
                        <option value="">— select —</option>
                        {VELOCITY_CLASSES.map(vc => <option key={vc.id} value={vc.id}>{vc.label}</option>)}
                    </select>
                </div>
                <div>
                    <label className="text-[9px] text-muted-foreground">Fitness Factor</label>
                    <select value={fit.factor != null ? fit.factor : ''} onChange={e => {
                        const v = e.target.value === '' ? null : Number(e.target.value);
                        onUpdate({ ...control, cde_fitness: { ...fit, factor: v, fit: v === 1.0 ? true : v != null ? false : null } });
                    }} className="input-ctrl py-0.5 text-[11px]">
                        <option value="">— select —</option>
                        {FITNESS_FACTORS.map(f => <option key={f.value} value={f.value}>{f.label}</option>)}
                    </select>
                </div>
            </div>
            {/* COE */}
            <div className="bg-background/50 rounded p-2 border border-border/50">
                <div className="flex items-center justify-between mb-1">
                    <span className="text-[10px] font-bold text-muted-foreground">COE Metrics</span>
                    <button onClick={addMetric} className="app-btn app-btn-outline app-btn-xs gap-0.5"><Icon name="plus" size={10} /> Metric</button>
                </div>
                {coe.metrics.length > 0 && (
                    <div className="mb-1">
                        <select value={coe.aggregation_method || 'weighted_mean'} onChange={e => updateCoe('aggregation_method', e.target.value)} className="input-ctrl py-0.5 text-[11px]">
                            {COE_AGG_METHODS.map(m => <option key={m.id} value={m.id}>{m.label}</option>)}
                        </select>
                    </div>
                )}
                <div className="space-y-1">
                    {coe.metrics.map(m => (
                        <CoeMetricRowCbp key={m.metric_id} metric={m} weight={coe.weights?.[m.metric_id]}
                                         aggMethod={coe.aggregation_method} onUpdate={updateMetric}
                                         onUpdateWeight={updateWeight} onDelete={deleteMetric} />
                    ))}
                </div>
            </div>
            {/* ECR */}
            <div className="flex items-center gap-2 text-[11px]">
                <span className="font-bold text-muted-foreground">ECR =</span>
                <EcrBadge value={ecr} />
                <span className="text-muted-foreground">
                    {compositeCoe != null && cde.value != null && fit.factor != null
                        ? `${compositeCoe.toFixed(3)} x ${cde.value.toFixed(2)} x ${fit.factor.toFixed(1)}`
                        : 'Complete fields to calculate'}
                </span>
            </div>
        </div>
    );
}

function ComponentCard({ item, compType, onUpdate, onDelete, targetMaturity }) {
    const [expanded, setExpanded] = useState(!item.name);
    const [showEffectiveness, setShowEffectiveness] = useState(false);
    const st = COMPONENT_STATUSES.find(s => s.id === item.status) || COMPONENT_STATUSES[0];
    const kind = (compType === 'controls' || compType === 'workforce') ? CONTROL_KINDS.find(k => k.id === item.kind) : null;
    const isDataLevel = compType === 'dataLevel';
    const isControl = compType === 'controls';
    const dlType = isDataLevel ? DATA_LEVEL_TYPES.find(t => t.id === item.dataType) : null;
    const dlQuality = isDataLevel ? DATA_LEVEL_QUALITY.find(q => q.id === item.dataQuality) : null;
    const hasMaturity = compType === 'controls' || compType === 'workforce';
    const isGap = hasMaturity && typeof item.maturity === 'number' && item.maturity < (targetMaturity || 0);

    const ecr = isControl ? (() => {
        const compositeCoe = calcCompositeCoe(item.coe?.metrics, item.coe?.aggregation_method, item.coe?.weights);
        return calcEcr({ ...item, coe: { ...item.coe, composite_coe: compositeCoe } });
    })() : null;

    return (
        <div className={`bg-muted/50 rounded-lg border ${isGap ? 'border-destructive/40' : 'border-border'} p-3`}>
            <div className="flex items-start gap-2 cursor-pointer select-none" onClick={() => setExpanded(e => !e)} role="button">
                {hasMaturity ? <MaturityBadge value={item.maturity} size="sm" /> : <span style={{ color: st.color }} className="mt-0.5"><Icon name={st.icon} size={14} /></span>}
                {isControl && ecr != null && <EcrBadge value={ecr} />}
                <div className="flex-1 min-w-0">
                    <div className="flex items-center gap-2 flex-wrap">
                        <span className="text-sm font-semibold truncate">{item.name || 'Unnamed'}</span>
                        {kind && <span className="text-[10px] px-1.5 py-0.5 rounded-full font-medium" style={{ backgroundColor: kind.color + '22', color: kind.color }}>{kind.label}</span>}
                        {isControl && <RoleBadge role={item.role} />}
                        {dlType && <span className="text-[10px] px-1.5 py-0.5 rounded-full font-medium" style={{ backgroundColor: dlType.color + '22', color: dlType.color }}>{dlType.label}</span>}
                        {dlQuality && <span className="text-[10px] px-1.5 py-0.5 rounded-full font-medium" style={{ backgroundColor: dlQuality.color + '22', color: dlQuality.color }}>Q: {dlQuality.label}</span>}
                        <span className="text-[10px] px-1.5 py-0.5 rounded-full font-medium" style={{ backgroundColor: st.color + '22', color: st.color }}>{st.label}</span>
                    </div>
                    {item.ownerName && <div className="text-[11px] text-muted-foreground mt-0.5">Owner: {item.ownerName}{item.ownerOrgChart ? ` (${item.ownerOrgChart})` : ''}</div>}
                </div>
                <div className="flex items-center gap-0.5 flex-shrink-0">
                    {item.linkJira && <a href={item.linkJira} target="_blank" rel="noopener noreferrer" onClick={e => e.stopPropagation()} className="p-1 hover:bg-accent rounded text-blue-500" title="Open Jira"><Icon name="ticket" size={13} /></a>}
                    {item.linkMore && <a href={item.linkMore} target="_blank" rel="noopener noreferrer" onClick={e => e.stopPropagation()} className="p-1 hover:bg-accent rounded text-blue-500" title="More info"><Icon name="external-link" size={13} /></a>}
                    <span className="p-1 hover:bg-accent rounded"><Icon name={expanded ? 'chevron-up' : 'chevron-down'} size={14} /></span>
                </div>
            </div>
            {expanded && (
                <div className="mt-3 space-y-2 text-sm">
                    <div>
                        <label className="text-[11px] font-medium text-muted-foreground block mb-1">Name *</label>
                        <input type="text" value={item.name} onChange={e => onUpdate({ ...item, name: e.target.value })}
                               className="input-ctrl py-1 text-sm" placeholder="Component name" />
                    </div>
                    <div>
                        <label className="text-[11px] font-medium text-muted-foreground block mb-1">Description</label>
                        <textarea value={item.description || ''} onChange={e => onUpdate({ ...item, description: e.target.value })}
                                  className="input-ctrl py-1 text-sm resize-none" rows={2} placeholder="Details..." />
                    </div>
                    {!isDataLevel && (
                        <div>
                            <label className="text-[11px] font-medium text-muted-foreground block mb-1">Link to More</label>
                            <input type="url" value={item.linkMore || ''} onChange={e => onUpdate({ ...item, linkMore: e.target.value })}
                                   className="input-ctrl py-1 text-sm" placeholder="https://..." />
                        </div>
                    )}
                    {!isDataLevel && (
                        <div className="grid grid-cols-2 gap-2">
                            <div>
                                <label className="text-[11px] font-medium text-muted-foreground block mb-1">Owner Name</label>
                                <input type="text" value={item.ownerName || ''} onChange={e => onUpdate({ ...item, ownerName: e.target.value })}
                                       className="input-ctrl py-1 text-sm" placeholder="Person or team" />
                            </div>
                            <div>
                                <label className="text-[11px] font-medium text-muted-foreground block mb-1">Owner Org-Chart Name</label>
                                <input type="text" value={item.ownerOrgChart || ''} onChange={e => onUpdate({ ...item, ownerOrgChart: e.target.value })}
                                       className="input-ctrl py-1 text-sm" placeholder="Department, unit, role..." />
                            </div>
                        </div>
                    )}
                    <div className="grid grid-cols-2 gap-2">
                        {(compType === 'controls' || compType === 'workforce') && (
                            <div>
                                <label className="text-[11px] font-medium text-muted-foreground block mb-1">Kind</label>
                                <select value={item.kind || ''} onChange={e => onUpdate({ ...item, kind: e.target.value || '' })} className="input-ctrl py-1 text-sm">
                                    <option value="">— not set —</option>
                                    {CONTROL_KINDS.map(k => <option key={k.id} value={k.id}>{k.label}</option>)}
                                </select>
                            </div>
                        )}
                        {isDataLevel && (
                            <div>
                                <label className="text-[11px] font-medium text-muted-foreground block mb-1">Type</label>
                                <select value={item.dataType || ''} onChange={e => onUpdate({ ...item, dataType: e.target.value || '' })} className="input-ctrl py-1 text-sm">
                                    <option value="">— not set —</option>
                                    {DATA_LEVEL_TYPES.map(t => <option key={t.id} value={t.id}>{t.label}</option>)}
                                </select>
                            </div>
                        )}
                        {isDataLevel && (
                            <div>
                                <label className="text-[11px] font-medium text-muted-foreground block mb-1">Quality</label>
                                <select value={item.dataQuality || ''} onChange={e => onUpdate({ ...item, dataQuality: e.target.value || '' })} className="input-ctrl py-1 text-sm">
                                    <option value="">— not set —</option>
                                    {DATA_LEVEL_QUALITY.map(q => <option key={q.id} value={q.id}>{q.label}</option>)}
                                </select>
                            </div>
                        )}
                        <div>
                            <label className="text-[11px] font-medium text-muted-foreground block mb-1">Status</label>
                            <select value={item.status} onChange={e => onUpdate({ ...item, status: e.target.value })} className="input-ctrl py-1 text-sm">
                                {COMPONENT_STATUSES.map(s => <option key={s.id} value={s.id}>{s.label}</option>)}
                            </select>
                        </div>
                    </div>
                    {hasMaturity && (
                        <div className="grid grid-cols-2 gap-2">
                            <div>
                                <label className="text-[11px] font-medium text-muted-foreground block mb-1">Maturity</label>
                                <select value={item.maturity ?? 0} onChange={e => onUpdate({ ...item, maturity: Number(e.target.value) })} className="input-ctrl py-1 text-sm">
                                    {MATURITY_LEVELS.map(ml => <option key={ml.value} value={ml.value}>{ml.value} — {ml.label}</option>)}
                                </select>
                            </div>
                            <div>
                                <label className="text-[11px] font-medium text-muted-foreground block mb-1">Scope</label>
                                <select value={item.scope || ''} onChange={e => onUpdate({ ...item, scope: e.target.value || '' })} className="input-ctrl py-1 text-sm">
                                    <option value="">— not set —</option>
                                    {SHARED_SCOPES.map(s => <option key={s.id} value={s.id}>{s.label}</option>)}
                                </select>
                            </div>
                        </div>
                    )}
                    {!isDataLevel && (
                        <div>
                            <label className="text-[11px] font-medium text-muted-foreground block mb-1">Link to Jira</label>
                            <input type="url" value={item.linkJira || ''} onChange={e => onUpdate({ ...item, linkJira: e.target.value })}
                                   className="input-ctrl py-1 text-sm" placeholder="https://jira.example.com/browse/..." />
                        </div>
                    )}
                    {/* Effectiveness (controls only) */}
                    {isControl && (
                        <div>
                            <button onClick={() => setShowEffectiveness(e => !e)}
                                    className="text-[11px] text-muted-foreground hover:text-foreground flex items-center gap-1 mb-1">
                                <Icon name={showEffectiveness ? 'chevron-up' : 'chevron-down'} size={11} />
                                <Icon name="shield" size={11} /> Effectiveness {ecr != null && <EcrBadge value={ecr} />}
                            </button>
                            {showEffectiveness && <EffectivenessEditorCbp control={item} onUpdate={onUpdate} />}
                        </div>
                    )}
                    <div className="flex justify-end pt-1">
                        <button onClick={() => { if (confirm('Delete this component?')) onDelete(item.id); }}
                                className="app-btn app-btn-danger app-btn-xs gap-1">
                            <Icon name="trash-2" size={11} /> Delete
                        </button>
                    </div>
                </div>
            )}
        </div>
    );
}

function SharedRefCard({ reference, sharedControl, onUpdateMaturity, onUpdateSharedControl, onUnlink, targetMaturity }) {
    if (!sharedControl) return null;
    const [expanded, setExpanded] = useState(false);
    const isGap = reference.maturity < targetMaturity;
    const kind = CONTROL_KINDS.find(k => k.id === sharedControl.kind);
    const toggle = () => setExpanded(e => !e);
    const updateField = (field, value) => onUpdateSharedControl({ ...sharedControl, [field]: value });

    return (
        <div className={`rounded-lg border-2 ${isGap ? 'border-destructive/40' : 'border-amber-500/30'} bg-amber-500/5 p-3`}>
            <div className="flex items-start gap-2 cursor-pointer select-none" onClick={toggle} role="button">
                <span className="text-amber-500 mt-0.5"><Icon name="link" size={15} /></span>
                <div className="flex-1 min-w-0">
                    <div className="flex items-center gap-2 flex-wrap">
                        <span className="text-sm font-semibold truncate">{sharedControl.name}</span>
                        <span className="text-[9px] px-1.5 py-0.5 rounded-full font-bold bg-amber-500/20 text-amber-600">SHARED</span>
                        {kind && <span className="text-[10px] px-1.5 py-0.5 rounded-full font-medium" style={{ backgroundColor: kind.color + '22', color: kind.color }}>{kind.label}</span>}
                        {sharedControl.scope && <span className="text-[9px] px-1.5 py-0.5 rounded-full bg-slate-500/15 text-slate-600">{SHARED_SCOPES.find(s => s.id === sharedControl.scope)?.label || sharedControl.scope}</span>}
                    </div>
                    {sharedControl.ownerName && <div className="text-[11px] text-muted-foreground mt-0.5">Owner: {sharedControl.ownerName}{sharedControl.ownerOrgChart ? ` (${sharedControl.ownerOrgChart})` : ''}</div>}

// SHARED CONTROLS LIBRARY MODAL
// ═══════════════════════════════════════════════════════════════════

function SharedControlsLibrary({ sharedControls, environments, onAdd, onUpdate, onDelete, onLink, onUnlink, onClose }) {
    const [editId, setEditId] = useState(null);
    const [form, setForm] = useState({});
    const [quickLinkId, setQuickLinkId] = useState(null);

    const startEdit = (sc) => { setEditId(sc ? sc.id : 'new'); setForm(sc ? { ...sc } : { id: genId(), name: '', description: '', linkMore: '', ownerName: '', ownerOrgChart: '', kind: '', scope: '', linkJira: '' }); };
    const saveForm = () => { if (!form.name?.trim()) return; if (editId === 'new') onAdd(form); else onUpdate(form); setEditId(null); };

    const countRefs = (scId) => {
        let count = 0;
        environments.forEach(env => { Object.values(env.cells).forEach(cell => { (cell.umbrella || []).forEach(c => { if (c.sharedControlId === scId) count++; }); }); });
        return count;
    };

    const isLinked = (scId, envId, ck) => {
        const env = environments.find(e => e.id === envId);
        return env ? (env.cells[ck]?.umbrella || []).some(c => c.sharedControlId === scId) : false;
    };

    const getRefs = (scId) => {
        const refs = [];
        environments.forEach(env => { Object.entries(env.cells).forEach(([ck, cell]) => {
            (cell.umbrella || []).forEach(c => { if (c.sharedControlId === scId) {
                const [cid, fid] = ck.split('-');
                refs.push({ envName: env.name, cluster: CLUSTERS[Number(cid)-1], func: CSF_FUNCTIONS.find(f=>f.id===fid), maturity: c.maturity });
            }});
        }); });
        return refs;
    };

    return (
        <div className="modal-overlay" onClick={onClose}>
            <div className="modal-content" style={{ maxWidth: 720 }} onClick={e => e.stopPropagation()}>
                <div className="flex items-center justify-between mb-4">
                    <div>
                        <h2 className="font-display font-bold text-lg flex items-center gap-2"><Icon name="link" size={20} /> Shared Controls Library</h2>
                        <p className="text-xs text-muted-foreground mt-1">Define controls once, link to many cells. Each link has its own maturity rating.</p>
                    </div>
                    <button onClick={onClose} className="p-1 hover:bg-accent rounded"><Icon name="x" size={18} /></button>
                </div>
                {editId ? (
                    <div className="space-y-3 bg-muted/50 rounded-lg border border-border p-4">
                        <div className="text-xs font-bold text-muted-foreground uppercase tracking-wider">{editId === 'new' ? 'New Shared Control' : 'Edit Shared Control'}</div>
                        <div><label className="text-[11px] font-medium text-muted-foreground block mb-1">Name *</label>
                            <input type="text" value={form.name || ''} onChange={e => setForm({...form, name: e.target.value})} className="input-ctrl py-1 text-sm" placeholder="e.g. SIEM (Splunk), EDR (CrowdStrike), WAF (Cloudflare)" autoFocus /></div>
                        <div><label className="text-[11px] font-medium text-muted-foreground block mb-1">Description</label>
                            <textarea value={form.description || ''} onChange={e => setForm({...form, description: e.target.value})} className="input-ctrl py-1 text-sm resize-none" rows={2} /></div>
                        <div><label className="text-[11px] font-medium text-muted-foreground block mb-1">Link to More</label>
                            <input type="url" value={form.linkMore || ''} onChange={e => setForm({...form, linkMore: e.target.value})} className="input-ctrl py-1 text-sm" /></div>
                        <div className="grid grid-cols-2 gap-2">
                            <div><label className="text-[11px] font-medium text-muted-foreground block mb-1">Owner Name</label>
                                <input type="text" value={form.ownerName || ''} onChange={e => setForm({...form, ownerName: e.target.value})} className="input-ctrl py-1 text-sm" /></div>
                            <div><label className="text-[11px] font-medium text-muted-foreground block mb-1">Owner Org-Chart Name</label>
                                <input type="text" value={form.ownerOrgChart || ''} onChange={e => setForm({...form, ownerOrgChart: e.target.value})} className="input-ctrl py-1 text-sm" /></div>
                        </div>
                        <div className="grid grid-cols-3 gap-2">
                            <div><label className="text-[11px] font-medium text-muted-foreground block mb-1">Type</label>
                                <select value={form.kind || ''} onChange={e => setForm({...form, kind: e.target.value})} className="input-ctrl py-1 text-sm">
                                    <option value="">— not set —</option>{CONTROL_KINDS.map(k => <option key={k.id} value={k.id}>{k.label}</option>)}</select></div>
                            <div><label className="text-[11px] font-medium text-muted-foreground block mb-1">Scope</label>
                                <select value={form.scope || ''} onChange={e => setForm({...form, scope: e.target.value})} className="input-ctrl py-1 text-sm">
                                    <option value="">— not set —</option>{SHARED_SCOPES.map(s => <option key={s.id} value={s.id}>{s.label}</option>)}</select></div>
                            <div><label className="text-[11px] font-medium text-muted-foreground block mb-1">Link to Jira</label>
                                <input type="url" value={form.linkJira || ''} onChange={e => setForm({...form, linkJira: e.target.value})} className="input-ctrl py-1 text-sm" /></div>
                        </div>
                        <div className="flex justify-end gap-2 pt-2">
                            <button onClick={() => setEditId(null)} className="app-btn app-btn-outline app-btn-sm">Cancel</button>
                            <button onClick={saveForm} disabled={!form.name?.trim()} className="app-btn app-btn-primary app-btn-sm"><Icon name="check" size={13} /> Save</button>
                        </div>
                    </div>
                ) : (
                    <>
                        <div className="space-y-3 max-h-[55vh] overflow-y-auto">
                            {sharedControls.length === 0 ? (
                                <div className="text-center py-8 text-muted-foreground">
                                    <Icon name="link" size={32} />
                                    <p className="mt-2 text-sm">No shared controls yet.</p>
                                    <p className="text-xs">Create shared controls for tools that span multiple clusters (SIEM, EDR, WAF, IAM, etc.)</p>
                                </div>
                            ) : sharedControls.map(sc => {
                                const refCount = countRefs(sc.id);
                                const refs = getRefs(sc.id);
                                const kind = CONTROL_KINDS.find(k => k.id === sc.kind);
                                return (
                                    <div key={sc.id} className="bg-muted/50 rounded-lg border border-border p-3">
                                        <div className="flex items-start gap-2">
                                            <span className="text-amber-500 mt-0.5"><Icon name="link" size={15} /></span>
                                            <div className="flex-1 min-w-0">
                                                <div className="flex items-center gap-2 flex-wrap">
                                                    <span className="text-sm font-semibold">{sc.name}</span>
                                                    {kind && <span className="text-[10px] px-1.5 py-0.5 rounded-full font-medium" style={{ backgroundColor: kind.color + '22', color: kind.color }}>{kind.label}</span>}
                                                    {sc.scope && <span className="text-[9px] px-1.5 py-0.5 rounded-full bg-slate-500/15 text-slate-600">{SHARED_SCOPES.find(s=>s.id===sc.scope)?.label || sc.scope}</span>}
                                                    <span className="text-[10px] text-muted-foreground">{refCount} link{refCount !== 1 ? 's' : ''}</span>
                                                </div>
                                                {sc.ownerName && <div className="text-[11px] text-muted-foreground">Owner: {sc.ownerName}{sc.ownerOrgChart ? ` (${sc.ownerOrgChart})` : ''}</div>}
                                                {sc.description && <div className="text-[11px] text-muted-foreground mt-0.5">{sc.description}</div>}
                                                {refs.length > 0 && (
                                                    <div className="mt-2 flex flex-wrap gap-1">
                                                        {refs.map((r, i) => (
                                                            <span key={i} className="inline-flex items-center gap-1 text-[9px] px-1.5 py-0.5 rounded bg-background border border-border">
                                                                <span className="font-bold">#{r.cluster.id}</span>
                                                                <span style={{color: r.func.color}}>{r.func.id}</span>
                                                                <MaturityBadge value={r.maturity} size="sm" />
                                                                {environments.length > 1 && <span className="text-muted-foreground">{r.envName}</span>}
                                                            </span>
                                                        ))}
                                                    </div>
                                                )}
                                            </div>
                                            <div className="flex items-center gap-1 flex-shrink-0">
                                                <button onClick={() => setQuickLinkId(quickLinkId === sc.id ? null : sc.id)}
                                                        className={`p-1 hover:bg-accent rounded ${quickLinkId === sc.id ? 'bg-amber-500/20 text-amber-600' : 'text-amber-500'}`} title="Quick Link to cells">
                                                    <Icon name="grid" size={13} /></button>
                                                <button onClick={() => startEdit(sc)} className="p-1 hover:bg-accent rounded" title="Edit"><Icon name="pencil" size={13} /></button>
                                                <button onClick={() => { if (confirm(`Delete "${sc.name}"?${refCount > 0 ? ` This will also remove ${refCount} link(s) from cells.` : ''}`)) onDelete(sc.id); }}
                                                        className="p-1 hover:bg-accent rounded text-destructive" title="Delete"><Icon name="trash-2" size={13} /></button>
                                            </div>
                                        </div>
                                        {quickLinkId === sc.id && (
                                            <div className="mt-3 pt-3 border-t border-border">
                                                <div className="text-[10px] font-bold text-amber-600 uppercase tracking-wider mb-2">Quick Link — click cells to toggle</div>
                                                {environments.map(env => (
                                                    <div key={env.id} className="mb-2">
                                                        {environments.length > 1 && <div className="text-[10px] font-semibold text-muted-foreground mb-1">{env.name}</div>}
                                                        <div className="grid gap-0.5" style={{ gridTemplateColumns: 'auto repeat(6, 1fr)' }}>
                                                            <div />
                                                            {CSF_FUNCTIONS.map(fn => <div key={fn.id} className="text-center text-[8px] font-bold" style={{color: fn.color}}>{fn.id}</div>)}
                                                            {CLUSTERS.map(cl => (
                                                                <React.Fragment key={cl.id}>
                                                                    <div className="text-[9px] font-semibold pr-1 truncate" title={cl.name}>#{cl.id}</div>
                                                                    {CSF_FUNCTIONS.map(fn => {
                                                                        const ck2 = cellKey(cl.id, fn.id);
                                                                        const linked = isLinked(sc.id, env.id, ck2);
                                                                        return (
                                                                            <button key={fn.id} onClick={() => linked ? onUnlink(env.id, ck2, sc.id) : onLink(env.id, ck2, sc.id)}
                                                                                    className={`h-5 rounded-sm text-[9px] font-bold transition-colors ${linked ? 'bg-amber-500 text-white hover:bg-amber-600' : 'bg-muted hover:bg-accent border border-border/50'}`}>
                                                                                {linked ? '\u2713' : ''}
                                                                            </button>
                                                                        );
                                                                    })}
                                                                </React.Fragment>
                                                            ))}
                                                        </div>
                                                    </div>
                                                ))}
                                            </div>
                                        )}
                                    </div>
                                );
                            })}
                        </div>
                        <div className="mt-4 flex justify-end">
                            <button onClick={() => startEdit(null)} className="app-btn app-btn-primary app-btn-sm gap-1"><Icon name="plus" size={13} /> New Shared Control</button>
                        </div>
                    </>
                )}
            </div>
        </div>
    );
}
