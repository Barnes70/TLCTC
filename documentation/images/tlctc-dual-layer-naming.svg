    <text x="480" y="360" class="head" font-size="14" fill="#92400e" text-anchor="middle">
        THE 10 TLCTC CLUSTERS — Shared Taxonomy Bridging Both Layers</text>

    <!-- Row 1: Clusters #1 – #5 -->
    <g transform="translate(80, 370)">
