        <text x="90" y="21" class="head" font-size="12" fill="#14532d" text-anchor="middle">TTPs</text>
        <text x="90" y="40" class="body" font-size="11" fill="#6b7280" text-anchor="middle">MITRE ATT&amp;CK</text>
    </g>
    <path d="M 680,546 L 710,546" stroke="#6b7280" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
    <g transform="translate(710, 520)">
        <rect width="190" height="52" rx="8" fill="#ffffff" stroke="#bbf7d0" stroke-width="1.5"/>
        <text x="95" y="21" class="head" font-size="12" fill="#14532d" text-anchor="middle">Attack Paths</text>
        <text x="95" y="40" class="mono" font-size="11" fill="#6b7280" text-anchor="middle">#9 → #4 → #7</text>
    </g>

    <!-- Row 2: Operational Notation -->
    <g transform="translate(80, 595)">
