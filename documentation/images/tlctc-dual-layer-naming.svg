        <text x="63" y="17" class="head" font-size="10" fill="#92400e" text-anchor="middle">IDENTIFY</text>
        <text x="63" y="32" class="body" font-size="9" fill="#b45309" text-anchor="middle">×10 clusters</text>
    </g>
    <g transform="translate(358, 240)">
        <rect width="125" height="38" rx="6" fill="#fef3c7" stroke="#fbbf24" stroke-width="1"/>
        <text x="63" y="17" class="head" font-size="10" fill="#92400e" text-anchor="middle">PROTECT</text>
        <text x="63" y="32" class="body" font-size="9" fill="#b45309" text-anchor="middle">×10 clusters</text>
    </g>
    <g transform="translate(497, 240)">
        <rect width="125" height="38" rx="6" fill="#fef3c7" stroke="#fbbf24" stroke-width="1"/>
        <text x="63" y="17" class="head" font-size="10" fill="#92400e" text-anchor="middle">DETECT</text>
        <text x="63" y="32" class="body" font-size="9" fill="#b45309" text-anchor="middle">×10 clusters</text>
    </g>
    <g transform="translate(636, 240)">
