        <text x="75" y="17" class="head" font-size="10" fill="#92400e" text-anchor="middle">#10 / TLCTC-10</text>
        <text x="75" y="33" class="body" font-size="9" fill="#78716c" text-anchor="middle">Supply Chain Attack</text>
