<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 780" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <style>
            .head { font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; font-weight: 700; }
            .body { font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; font-weight: 500; }
            .label { font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; font-weight: 600; }
            .mono { font-family: 'Consolas', 'Courier New', monospace; font-weight: 600; }
        </style>
        <marker id="arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#6b7280"/>
        </marker>
        <marker id="arr-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#ef4444"/>
        </marker>
    </defs>

    <!-- ===== TWO OVERLAPPING LAYER BACKGROUNDS ===== -->

    <!-- Strategic layer (blue) — extends DOWN into the overlap zone -->
    <rect x="50" y="20" width="860" height="465" rx="16"
          fill="#dbeafe" fill-opacity="0.35" stroke="#93c5fd" stroke-width="2"/>

    <!-- Operational layer (green) — extends UP into the overlap zone -->
    <rect x="50" y="335" width="860" height="420" rx="16"
          fill="#dcfce7" fill-opacity="0.35" stroke="#86efac" stroke-width="2"/>

    <!-- Overlap zone highlight (amber dashed border) -->
    <rect x="55" y="340" width="850" height="140" rx="12"
          fill="#fffbeb" fill-opacity="0.25" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="8,4"/>

    <!-- ===== SIDE LABELS WITH BRACKETS ===== -->

    <!-- Strategic bracket -->
    <path d="M 38,28 L 30,28 L 30,328 L 38,328" stroke="#3b82f6" stroke-width="1.5" fill="none"/>
    <text x="22" y="185" class="label" font-size="11" fill="#2563eb" text-anchor="middle"
          transform="rotate(-90, 22, 185)">STRATEGIC</text>

    <!-- TLCTC Bridge bracket -->
