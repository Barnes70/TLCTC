    </g>
    <path d="M 260,546 L 290,546" stroke="#6b7280" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
    <g transform="translate(290, 520)">
        <rect width="180" height="52" rx="8" fill="#ffffff" stroke="#bbf7d0" stroke-width="1.5"/>
        <text x="90" y="21" class="head" font-size="12" fill="#14532d" text-anchor="middle">CVE Instances</text>
        <text x="90" y="40" class="body" font-size="11" fill="#6b7280" text-anchor="middle">Specific vulnerabilities</text>
    </g>
    <path d="M 470,546 L 500,546" stroke="#6b7280" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
    <g transform="translate(500, 520)">
