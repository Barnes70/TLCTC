        <text x="120" y="21" class="head" font-size="12" fill="#1e3a5f" text-anchor="middle">KRI — Key Risk Indicators</text>
        <text x="120" y="40" class="body" font-size="11" fill="#6b7280" text-anchor="middle">Metrics for decision-makers</text>
