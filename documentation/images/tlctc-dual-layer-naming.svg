    <text x="22" y="625" class="label" font-size="11" fill="#16a34a" text-anchor="middle"
          transform="rotate(-90, 22, 625)">OPERATIONAL</text>

    <!-- ===== STRATEGIC LAYER CONTENT ===== -->

    <text x="480" y="52" class="head" font-size="15" fill="#1e40af" text-anchor="middle">
        STRATEGIC LAYER — Where Decisions Are Made</text>

    <!-- Row 1: Strategic concepts -->
    <g transform="translate(80, 70)">
        <rect width="240" height="52" rx="8" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.5"/>
        <text x="120" y="21" class="head" font-size="12" fill="#1e3a5f" text-anchor="middle">Board / Executive Reporting</text>
        <text x="120" y="40" class="body" font-size="11" fill="#6b7280" text-anchor="middle">Strategic governance, risk oversight</text>
    </g>
    <g transform="translate(350, 70)">
        <rect width="240" height="52" rx="8" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.5"/>
        <text x="120" y="21" class="head" font-size="12" fill="#1e3a5f" text-anchor="middle">Risk Appetite &amp; Tolerance</text>
        <text x="120" y="40" class="body" font-size="11" fill="#6b7280" text-anchor="middle">Thresholds and boundaries</text>
    </g>
    <g transform="translate(620, 70)">
