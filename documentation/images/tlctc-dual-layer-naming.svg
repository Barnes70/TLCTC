    <line x1="491" y1="462" x2="491" y2="510" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.5"/>
    <line x1="659" y1="462" x2="659" y2="510" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.5"/>
    <line x1="825" y1="462" x2="825" y2="510" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.5"/>

    <!-- ===== OPERATIONAL LAYER CONTENT ===== -->

    <text x="480" y="502" class="head" font-size="15" fill="#166534" text-anchor="middle">
