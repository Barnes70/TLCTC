        <text x="275" y="21" class="head" font-size="12" fill="#14532d" text-anchor="middle">Operational Use Cases</text>
        <text x="275" y="41" class="body" font-size="11" fill="#6b7280" text-anchor="middle">Tool integration · SIEM rules · Automation · Threat intel exchange · Sub-threat granularity</text>
    </g>

    <!-- Row 3: Controls, Failed Controls, KCI/KPI -->
    <g transform="translate(80, 670)">
        <rect width="250" height="55" rx="8" fill="#ffffff" stroke="#bbf7d0" stroke-width="1.5"/>
        <text x="125" y="22" class="head" font-size="12" fill="#14532d" text-anchor="middle">Controls &amp; Tools</text>
        <text x="125" y="42" class="body" font-size="11" fill="#6b7280" text-anchor="middle">Implementations per cluster</text>
    </g>
    <g transform="translate(360, 670)">
        <rect width="260" height="55" rx="8" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
        <text x="130" y="22" class="head" font-size="12" fill="#991b1b" text-anchor="middle">Failed / Ineffective Controls</text>
        <text x="130" y="42" class="body" font-size="11" fill="#ef4444" text-anchor="middle">→ Incidents / Loss Events</text>
    </g>
    <g transform="translate(650, 670)">
