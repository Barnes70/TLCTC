    <line x1="421" y1="278" x2="421" y2="338" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.5"/>
    <line x1="560" y1="278" x2="560" y2="338" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.5"/>
    <line x1="699" y1="278" x2="699" y2="338" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.5"/>
