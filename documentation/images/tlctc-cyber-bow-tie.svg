<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1650 900" width="100%" height="100%" style="background-color: #f8f9fa; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; min-width: 1300px;">
    <defs>
        <!-- Drop Shadow Filter for Nodes -->
        <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
            <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.2"/>
        </filter>

        <!-- Arrowheads -->
