<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 900 450" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <linearGradient id="grad-primary" x1="0%" x2="100%" y1="0%" y2="100%">
                    <stop offset="0%" style="stop-color:hsl(240, 5.9%, 10%);stop-opacity:0.1"></stop>
                    <stop offset="100%" style="stop-color:hsl(240, 5.9%, 10%);stop-opacity:0.05"></stop>
                </linearGradient>
                <linearGradient id="grad-danger" x1="0%" x2="100%" y1="0%" y2="100%">
                    <stop offset="0%" style="stop-color:hsl(0, 84.2%, 60.2%);stop-opacity:0.1"></stop>
                    <stop offset="100%" style="stop-color:hsl(0, 84.2%, 60.2%);stop-opacity:0.05"></stop>
                </linearGradient>
                <filter height="130%" id="dropShadow">
                    <feGaussianBlur in="SourceAlpha" stdDeviation="3"></feGaussianBlur> 
                    <feOffset dx="2" dy="2" result="offsetblur"></feOffset>
                    <feComponentTransfer>
                        <feFuncA slope="0.2" type="linear"></feFuncA>
                    </feComponentTransfer>
                    <feMerge> 
                        <feMergeNode></feMergeNode>
                        <feMergeNode in="SourceGraphic"></feMergeNode> 
                    </feMerge>
                </filter>
                <marker id="arrowhead" markerHeight="7" markerWidth="10" orient="auto" refX="9" refY="3.5">
                    <polygon fill="hsl(240, 3.8%, 46.1%)" points="0 0, 10 3.5, 0 7"></polygon>
                </marker>
                
                <style>
                    .txt-head { font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; font-weight: 700; }
                    .txt-body { font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; font-weight: 500; }
                    .stroke-fg { stroke: hsl(240, 10%, 3.9%); }
                    .stroke-border { stroke: hsl(240, 5.9%, 90%); }
                    .fill-card { fill: hsl(0, 0%, 100%); }
                    .fill-bg { fill: hsl(0, 0%, 100%); }
                </style>
            </defs>

            <text fill="hsl(240, 3.8%, 46.1%)" font-size="14" text-anchor="middle" x="450" y="40">
                A risk event is a deviation from a strategic goal.
            </text>
            <text fill="hsl(240, 3.8%, 46.1%)" font-size="14" font-style="italic" text-anchor="middle" x="450" y="60">
                IT Goal: "Operate securely" <tspan fill="hsl(0, 84.2%, 60.2%)">•</tspan> Risk Event: "Compromise of System"
            </text>

            <g transform="translate(50, 150)">
                <rect fill="url(#grad-primary)" height="80" rx="40" stroke="hsl(240, 5.9%, 90%)" stroke-width="2" width="200" x="0" y="0"></rect>
                <text fill="hsl(240, 10%, 3.9%)" font-size="16" text-anchor="middle" x="100" y="35">CAUSE SIDE</text>
                <text fill="hsl(240, 3.8%, 46.1%)" font-size="14" text-anchor="middle" x="100" y="55">Threat Clusters</text>
            </g>

            <line marker-end="url(#arrowhead)" stroke="hsl(240, 3.8%, 46.1%)" stroke-width="2" x1="250" x2="350" y1="190" y2="190"></line>

            <g transform="translate(350, 150)">
                <rect fill="url(#grad-danger)" filter="url(#dropShadow)" height="80" rx="40" stroke="hsl(0, 84.2%, 60.2%)" stroke-width="2" width="200" x="0" y="0"></rect>
                <text fill="hsl(0, 84.2%, 60.2%)" font-size="16" text-anchor="middle" x="100" y="35">RISK EVENT</text>
                <text fill="hsl(240, 10%, 3.9%)" font-size="14" text-anchor="middle" x="100" y="55">Asset Compromise</text>
            </g>

            <line marker-end="url(#arrowhead)" stroke="hsl(240, 3.8%, 46.1%)" stroke-width="2" x1="550" x2="650" y1="190" y2="190"></line>

            <g transform="translate(650, 150)">
                <rect fill="url(#grad-primary)" height="80" rx="40" stroke="hsl(240, 5.9%, 90%)" stroke-width="2" width="200" x="0" y="0"></rect>
                <text fill="hsl(240, 10%, 3.9%)" font-size="16" text-anchor="middle" x="100" y="45">CONSEQUENCES</text>
            </g>

            <g transform="translate(300, 280)">
                <line marker-end="url(#arrowhead)" stroke="hsl(240, 5.9%, 90%)" stroke-dasharray="4 4" stroke-width="1.5" x1="0" x2="0" y1="-25" y2="-90"></line>
                <rect fill="hsl(0, 0%, 100%)" height="50" stroke="hsl(240, 10%, 3.9%)" stroke-width="2" transform="rotate(45)" width="50" x="-25" y="-25"></rect>
                <text fill="hsl(240, 10%, 3.9%)" font-size="11" font-weight="700" text-anchor="middle" x="0" y="45">PROTECT</text>
                <text fill="hsl(240, 3.8%, 46.1%)" font-size="10" text-anchor="middle" x="0" y="60">IDENTIFY (indirectly)</text>
            </g>

            <g transform="translate(450, 280)">
                <line marker-end="url(#arrowhead)" stroke="hsl(240, 5.9%, 90%)" stroke-dasharray="4 4" stroke-width="1.5" x1="0" x2="0" y1="-25" y2="-50"></line>
                <rect fill="hsl(0, 0%, 100%)" height="50" stroke="hsl(240, 10%, 3.9%)" stroke-width="2" transform="rotate(45)" width="50" x="-25" y="-25"></rect>
                <text fill="hsl(240, 10%, 3.9%)" font-size="11" font-weight="700" text-anchor="middle" x="0" y="45">DETECT</text>
            </g>

            <g transform="translate(600, 280)">
                 <line marker-end="url(#arrowhead)" stroke="hsl(240, 5.9%, 90%)" stroke-dasharray="4 4" stroke-width="1.5" x1="0" x2="0" y1="-25" y2="-90"></line>
                <rect fill="hsl(0, 0%, 100%)" height="50" stroke="hsl(240, 10%, 3.9%)" stroke-width="2" transform="rotate(45)" width="50" x="-25" y="-25"></rect>
                <text fill="hsl(240, 10%, 3.9%)" font-size="11" font-weight="700" text-anchor="middle" x="0" y="45">RESPOND</text>
            </g>

            <g transform="translate(750, 280)">
                <line marker-end="url(#arrowhead)" stroke="hsl(240, 5.9%, 90%)" stroke-dasharray="4 4" stroke-width="1.5" x1="0" x2="0" y1="-25" y2="-50"></line>
                <rect fill="hsl(0, 0%, 100%)" height="50" stroke="hsl(240, 10%, 3.9%)" stroke-width="2" transform="rotate(45)" width="50" x="-25" y="-25"></rect>
                <text fill="hsl(240, 10%, 3.9%)" font-size="11" font-weight="700" text-anchor="middle" x="0" y="45">RECOVER</text>
            </g>

            <g transform="translate(0, 380)">
                <text fill="hsl(240, 3.8%, 46.1%)" font-size="12" text-anchor="middle" x="300" y="0">
                    <tspan dy="0" x="300">Preventive controls affect</tspan>
                    <tspan dy="16" x="300">the likelihood of an event occurring</tspan>
                </text>
                
                <text fill="hsl(240, 3.8%, 46.1%)" font-size="12" text-anchor="middle" x="675" y="0">
                    <tspan dy="0" x="675">Detective and reactive controls</tspan>
                    <tspan dy="16" x="675">influence the consequences</tspan>
                </text>
                
                <text fill="hsl(240, 5.9%, 10%)" font-size="13" font-style="italic" opacity="0.8" text-anchor="middle" x="450" y="50">
                    "A control failure is a control risk — it is a deviation from the control objective"
                </text>
            </g>

        </svg>