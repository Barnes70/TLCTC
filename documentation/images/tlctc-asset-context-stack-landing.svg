<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1000 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="acsTitle acsDesc" style="font-family: 'Inter', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;">
  <title id="acsTitle">The asset in context: context stack, actors, and the cause–event–consequence line</title>
  <desc id="acsDesc">An eight-layer context stack (region, state or nation, sector, asset owner organization, asset topology, asset type, asset product, asset instance with its version and configuration item) narrows down to the asset that is compromised in the central risk event; specific vulnerabilities such as CVEs attach at the instance layer. Actors on the left apply threats to the cause side; each step enters the asset through an interface or function, whose role decides server- versus client-side classification. The cause side, the risk event, and the consequences form one horizontal line, with the CSF functions Protect, Detect, Respond, and Recover placed beneath it as diamonds. Neither the context stack nor the actor is a classification input.</desc>

  <!-- Landing-page edition (Concept 02). Colours resolve through the tlctc.net theme tokens
       (--foreground, --muted-foreground, --background) so the figure follows light/dark mode;
       the fallbacks render the light edition when the file is opened on its own.
       Red is reserved for the risk event, as in the other concept figures. -->
  <style>
    .acs { color: hsl(var(--foreground, 240 10% 3.9%)); --acs-red: #e5484d; }
    .dark .acs { --acs-red: #ff5a5f; }
    .acs-title { font-family: 'Space Grotesk', 'Plus Jakarta Sans', sans-serif; font-weight: 700; fill: hsl(var(--foreground, 240 10% 3.9%)); }
    .acs-text { fill: hsl(var(--foreground, 240 10% 3.9%)); }
    .acs-mute { fill: hsl(var(--muted-foreground, 240 3.8% 46.1%)); }
    .acs-mono { font-family: 'JetBrains Mono', ui-monospace, monospace; fill: hsl(var(--muted-foreground, 240 3.8% 46.1%)); letter-spacing: 0.02em; }
    .acs-micro { font-family: 'JetBrains Mono', ui-monospace, monospace; fill: hsl(var(--muted-foreground, 240 3.8% 46.1%)); letter-spacing: 0.16em; font-weight: 600; }
    .acs-layer { fill: currentColor; stroke: currentColor; stroke-opacity: 0.22; stroke-width: 1; }
    .acs-asset { fill: hsl(var(--background, 0 0% 100%)); stroke: currentColor; stroke-opacity: 0.55; stroke-width: 1.6; }
    .acs-node { fill: hsl(var(--background, 0 0% 100%)); stroke: currentColor; stroke-opacity: 0.4; stroke-width: 1.6; }
    .acs-card { fill: currentColor; fill-opacity: 0.022; stroke: currentColor; stroke-opacity: 0.22; stroke-width: 1; }
    .acs-rule { stroke: currentColor; stroke-opacity: 0.14; stroke-width: 1; }
    .acs-wire { stroke: currentColor; stroke-opacity: 0.38; stroke-width: 1.4; fill: none; }
    .acs-wire-faint { stroke: currentColor; stroke-opacity: 0.22; stroke-width: 1.2; stroke-dasharray: 4 4; fill: none; }
    .acs-head { fill: currentColor; fill-opacity: 0.5; }
    .acs-node-title { font-family: 'Space Grotesk', 'Plus Jakarta Sans', sans-serif; font-weight: 700; fill: hsl(var(--foreground, 240 10% 3.9%)); letter-spacing: 0.02em; }
    .acs-event { fill: var(--acs-red); fill-opacity: 0.07; stroke: var(--acs-red); stroke-width: 1.8; }
    .acs-event-title { font-family: 'Space Grotesk', 'Plus Jakarta Sans', sans-serif; font-weight: 700; fill: var(--acs-red); letter-spacing: 0.02em; }
    .acs-diamond { fill: hsl(var(--background, 0 0% 100%)); stroke: currentColor; stroke-opacity: 0.55; stroke-width: 1.6; }
  </style>

  <g class="acs">
    <defs>
      <marker id="acsArrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
        <polygon class="acs-head" points="0 0, 10 3.5, 0 7"/>
      </marker>
    </defs>

    <!-- Title -->
    <text class="acs-title" x="500" y="28" text-anchor="middle" font-size="15">The Asset in Context</text>
    <text class="acs-mono" x="500" y="47" text-anchor="middle" font-size="10">the context stack defines the asset · actors apply threats · the cause–event–consequence line stays the same</text>

    <!-- ======================== -->
    <!-- CONTEXT STACK            -->
    <!-- ======================== -->
    <text class="acs-micro" x="262" y="78" text-anchor="end" font-size="10">CONTEXT STACK</text>
    <text class="acs-mono" x="262" y="92" text-anchor="end" font-size="9">outside in</text>

    <rect class="acs-layer" x="270" y="60"  width="580" height="28" rx="14" fill-opacity="0.13"/>
    <rect class="acs-layer" x="290" y="91"  width="540" height="28" rx="14" fill-opacity="0.115"/>
    <rect class="acs-layer" x="310" y="122" width="500" height="28" rx="14" fill-opacity="0.10"/>
    <rect class="acs-layer" x="330" y="153" width="460" height="28" rx="14" fill-opacity="0.085"/>
    <rect class="acs-layer" x="350" y="184" width="420" height="28" rx="14" fill-opacity="0.07"/>
    <rect class="acs-layer" x="370" y="215" width="380" height="28" rx="14" fill-opacity="0.055"/>
    <rect class="acs-layer" x="390" y="246" width="340" height="28" rx="14" fill-opacity="0.04"/>
    <rect class="acs-asset" x="410" y="277" width="300" height="28" rx="14"/>

    <g text-anchor="middle" font-size="11">
      <text x="560" y="78"><tspan class="acs-text" font-weight="700">Region</tspan><tspan class="acs-mute"> — e.g. EU, US, APAC</tspan></text>
      <text x="560" y="109"><tspan class="acs-text" font-weight="700">State / Nation</tspan></text>
      <text x="560" y="140"><tspan class="acs-text" font-weight="700">Sector</tspan><tspan class="acs-mute"> — to which the organization belongs</tspan></text>
      <text x="560" y="171"><tspan class="acs-text" font-weight="700">Asset Owner Organization</tspan></text>
      <text x="560" y="202"><tspan class="acs-text" font-weight="700">Asset Topology</tspan><tspan class="acs-mute"> — cloud / on-prem</tspan></text>
      <text x="560" y="233"><tspan class="acs-text" font-weight="700">Asset Type</tspan><tspan class="acs-mute"> — OT / IT, network, application</tspan></text>
      <text x="560" y="264"><tspan class="acs-text" font-weight="700">Asset Product</tspan><tspan class="acs-mute"> — e.g. SharePoint</tspan></text>
      <text x="560" y="295"><tspan class="acs-text" font-weight="700">Asset Instance</tspan><tspan class="acs-mute"> — version &amp; configuration item (CI)</tspan></text>
    </g>

    <!-- Stack → risk event -->
    <line class="acs-wire" x1="560" y1="309" x2="560" y2="354" marker-end="url(#acsArrow)"/>
    <text class="acs-mono" x="572" y="327" font-size="9">the asset that is compromised</text>
    <text class="acs-mono" x="572" y="339" font-size="9">(CVEs attach at product version / instance)</text>

    <!-- ======================== -->
    <!-- ACTORS                   -->
    <!-- ======================== -->
    <g transform="translate(30, 326)">
      <rect class="acs-card" x="0" y="0" width="200" height="214" rx="6"/>
      <text class="acs-micro" x="100" y="24" text-anchor="middle" font-size="11">ACTORS</text>
      <text class="acs-mute" x="100" y="39" text-anchor="middle" font-size="9.5">apply threats — never classify them</text>
      <line class="acs-rule" x1="16" y1="48" x2="184" y2="48"/>
      <g class="acs-text" font-size="10.5">
        <text x="16" y="68">Nation-State</text>
        <text x="16" y="86">Cybercriminal (Ransomware)</text>
        <text x="16" y="104">Cybercriminal (General)</text>
        <text x="16" y="122">Hacktivist</text>
        <text x="16" y="140">Insider (outside their grant)</text>
        <text x="16" y="158">Amateur (Script-Kiddie)</text>
      </g>
      <line class="acs-rule" x1="16" y1="170" x2="184" y2="170"/>
      <g class="acs-mute" font-size="9" font-style="italic">
        <text x="16" y="186">Any actor can use AI agents —</text>
        <text x="16" y="199">a capability, not an actor.</text>
      </g>
    </g>

    <!-- Actors → cause side -->
    <line class="acs-wire" x1="230" y1="400" x2="272" y2="400" stroke-dasharray="4 3" marker-end="url(#acsArrow)"/>

    <!-- ======================== -->
    <!-- CAUSE → EVENT → CONSEQ.  -->
    <!-- ======================== -->
    <g transform="translate(280, 365)">
      <rect class="acs-node" x="0" y="0" width="180" height="70" rx="35"/>
      <text class="acs-node-title" x="90" y="31" text-anchor="middle" font-size="14">CAUSE SIDE</text>
      <text class="acs-mute" x="90" y="50" text-anchor="middle" font-size="11">Threat Clusters #1–#10</text>
    </g>

    <line class="acs-wire" x1="460" y1="400" x2="482" y2="400" marker-end="url(#acsArrow)"/>
    <!-- where the step enters the asset: a cause-side matter, not a context layer -->
    <line class="acs-wire-faint" x1="465" y1="405" x2="481" y2="442" stroke-dasharray="2 2"/>
    <text class="acs-text" x="481" y="453" text-anchor="middle" font-size="9" font-weight="700">entry: interface / function</text>
    <text class="acs-mute" x="481" y="465" text-anchor="middle" font-size="8.5">role decides #2 vs #3 (R-ROLE)</text>

    <g transform="translate(470, 365)">
      <rect class="acs-event" x="0" y="0" width="180" height="70" rx="35"/>
      <text class="acs-event-title" x="90" y="31" text-anchor="middle" font-size="14">RISK EVENT</text>
      <text class="acs-text" x="90" y="50" text-anchor="middle" font-size="11">Asset Compromise (SRE)</text>
    </g>

    <line class="acs-wire" x1="650" y1="400" x2="682" y2="400" marker-end="url(#acsArrow)"/>

    <g transform="translate(690, 365)">
      <rect class="acs-node" x="0" y="0" width="200" height="70" rx="35"/>
      <text class="acs-node-title" x="100" y="31" text-anchor="middle" font-size="14">CONSEQUENCES</text>
      <text class="acs-mute" x="100" y="50" text-anchor="middle" font-size="10">DRE → BRE* (impact, follow-up events)</text>
    </g>

    <!-- ======================== -->
    <!-- CSF FUNCTIONS            -->
    <!-- ======================== -->
    <g transform="translate(400, 505)">
      <line class="acs-wire-faint" x1="0" y1="-25" x2="0" y2="-62" marker-end="url(#acsArrow)"/>
      <rect class="acs-diamond" x="-22" y="-22" width="44" height="44" transform="rotate(45)"/>
      <text class="acs-micro" x="0" y="44" text-anchor="middle" font-size="10.5">PROTECT</text>
      <text class="acs-mono" x="0" y="58" text-anchor="middle" font-size="9">IDENTIFY (indirectly)</text>
    </g>

    <g transform="translate(560, 505)">
      <line class="acs-wire-faint" x1="0" y1="-25" x2="0" y2="-60" marker-end="url(#acsArrow)"/>
      <rect class="acs-diamond" x="-22" y="-22" width="44" height="44" transform="rotate(45)"/>
      <text class="acs-micro" x="0" y="44" text-anchor="middle" font-size="10.5">DETECT</text>
    </g>

    <g transform="translate(730, 505)">
      <line class="acs-wire-faint" x1="0" y1="-25" x2="0" y2="-60" marker-end="url(#acsArrow)"/>
      <rect class="acs-diamond" x="-22" y="-22" width="44" height="44" transform="rotate(45)"/>
      <text class="acs-micro" x="0" y="44" text-anchor="middle" font-size="10.5">RESPOND</text>
    </g>

    <g transform="translate(850, 505)">
      <line class="acs-wire-faint" x1="0" y1="-25" x2="0" y2="-60" marker-end="url(#acsArrow)"/>
      <rect class="acs-diamond" x="-22" y="-22" width="44" height="44" transform="rotate(45)"/>
      <text class="acs-micro" x="0" y="44" text-anchor="middle" font-size="10.5">RECOVER</text>
    </g>

    <!-- ======================== -->
    <!-- Caption                  -->
    <!-- ======================== -->
    <text class="acs-mono" x="500" y="600" text-anchor="middle" font-size="10.5">A clear line from context to compromise to consequence.</text>
    <text class="acs-mute" x="500" y="618" text-anchor="middle" font-size="11" font-style="italic">The stack changes the specific vulnerabilities and controls, never the clusters (Axiom I). Actors apply threats; they never classify them (Axiom IV).</text>
  </g>
</svg>
